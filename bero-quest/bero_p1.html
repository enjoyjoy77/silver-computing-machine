<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ベロ — 物理試作 P1</title>
<style>
  :root{
    color-scheme:dark;
    --panel:rgba(20,20,28,.88);
    --accent:#ee7189;
    --accent2:#ffb3c0;
    --muted:#8f8f9b;
  }
  *{box-sizing:border-box}
  html,body{
    width:100%;height:100%;margin:0;overflow:hidden;
    background:#18181e;color:#eee;
    font-family:"Meiryo","Yu Gothic",sans-serif;
  }
  canvas{display:block;touch-action:none}
  #rev{
    position:fixed;right:12px;top:9px;z-index:20;
    color:#92929d;font-size:12px;pointer-events:none;
  }
  #panel{
    position:fixed;left:12px;top:12px;z-index:20;
    width:254px;max-height:calc(100vh - 24px);overflow:auto;
    padding:12px 14px 14px;border:1px solid rgba(255,255,255,.08);
    border-radius:13px;background:var(--panel);
    box-shadow:0 8px 32px rgba(0,0,0,.28);
    backdrop-filter:blur(7px);
  }
  #panel h1{
    margin:0 0 4px;color:var(--accent2);
    font-size:16px;font-weight:700;
  }
  #panel .sub{
    margin:0 0 10px;color:#9d9daa;font-size:11px;line-height:1.45;
  }
  .row{margin:8px 0}
  .row label{
    display:flex;justify-content:space-between;gap:8px;
    margin-bottom:2px;font-size:12px;
  }
  .val{color:var(--accent2);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .buttons{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  button{
    min-height:30px;padding:5px 9px;border:0;border-radius:8px;
    background:#3b3b48;color:#eee;font:12px inherit;cursor:pointer;
  }
  button:hover{background:#4b4b5b}
  button.on{background:#bf4e67;color:#fff}
  button.warn{background:#744752}
  .check{
    display:flex;align-items:center;gap:7px;
    margin-top:9px;color:#ccc;font-size:12px;
  }
  .check input{accent-color:var(--accent)}
  #stats{
    margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.09);
    color:#aaa;font:11px/1.55 Consolas,monospace;
  }
  #stats .good{color:#8ed9a3}
  #stats .bad{color:#ff929d}
  #hint{
    position:fixed;left:12px;bottom:9px;z-index:10;
    color:#858590;font-size:12px;pointer-events:none;
  }
  @media(max-width:620px){
    #panel{width:220px;padding:10px}
    #panel .sub{display:none}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="rev">物理試作 P1 rev1</div>

<section id="panel">
  <h1>ベロ物理シミュレータ</h1>
  <p class="sub">XPBD風の距離・体積保持と筋肉目標を使う、段階1の物理疎通版です。</p>

  <div class="row">
    <label for="s_ext">のび〜ちぢみ <span class="val" id="v_ext">0.00</span></label>
    <input id="s_ext" type="range" min="-100" max="100" value="0">
  </div>
  <div class="row">
    <label for="s_ud">上下にまげる <span class="val" id="v_ud">0.00</span></label>
    <input id="s_ud" type="range" min="-100" max="100" value="0">
  </div>
  <div class="row">
    <label for="s_lr">左右にまげる <span class="val" id="v_lr">0.00</span></label>
    <input id="s_lr" type="range" min="-100" max="100" value="0">
  </div>
  <div class="row">
    <label for="s_tw">ねじる <span class="val" id="v_tw">0.00</span></label>
    <input id="s_tw" type="range" min="-100" max="100" value="0">
  </div>
  <div class="row">
    <label for="s_cl">舌先カール <span class="val" id="v_cl">0.00</span></label>
    <input id="s_cl" type="range" min="-100" max="100" value="0">
  </div>

  <div class="buttons">
    <button id="b_pero">ぺろぺろ</button>
    <button id="b_maki">巻き舌</button>
    <button id="b_wiggle">ぷるぷる</button>
    <button id="b_reset">もどす</button>
  </div>

  <label class="check">
    <input id="gravity" type="checkbox" checked>
    重力をかける
  </label>
  <label class="check">
    <input id="wire" type="checkbox">
    骨格を表示
  </label>

  <div id="stats">
    <div>粒子: <span id="st_particles">0</span></div>
    <div>拘束: <span id="st_constraints">0</span></div>
    <div>物理: <span id="st_hz">144 Hz</span></div>
    <div>最大ひずみ: <span id="st_strain" class="good">0.0%</span></div>
    <div>状態: <span id="st_state" class="good">安定</span></div>
  </div>
</section>

<div id="hint">ドラッグ＝見る向き / ホイール＝寄る・引く / 舌先をドラッグ＝引っぱる</div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";

/* =========================================================
   描画
   ========================================================= */
const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x18181e);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.005,10);
let camYaw=.55;
let camPitch=.28;
let camDist=.275;
const lookAt=new THREE.Vector3(0,0,.065);

function updateCamera(){
  const cp=Math.cos(camPitch);
  camera.position.set(
    lookAt.x+camDist*Math.sin(camYaw)*cp,
    lookAt.y+camDist*Math.sin(camPitch),
    lookAt.z+camDist*Math.cos(camYaw)*cp
  );
  camera.lookAt(lookAt);
}
updateCamera();

scene.add(new THREE.HemisphereLight(0xfff7f8,0x503d50,1.85));
const key=new THREE.DirectionalLight(0xffffff,3.4);
key.position.set(.35,.65,.35);
scene.add(key);
const fill=new THREE.DirectionalLight(0xffccd7,1.35);
fill.position.set(-.5,.1,-.15);
scene.add(fill);
const rim=new THREE.DirectionalLight(0xff7e99,1.25);
rim.position.set(.15,-.5,-.45);
scene.add(rim);

const floor=new THREE.Mesh(
  new THREE.CircleGeometry(.28,64),
  new THREE.MeshStandardMaterial({
    color:0x24242c,
    roughness:.88,
    metalness:0,
    transparent:true,
    opacity:.52
  })
);
floor.rotation.x=-Math.PI/2;
floor.position.set(0,-.048,.075);
scene.add(floor);

/* =========================================================
   テクスチャ
   ========================================================= */
function seededRandom(seed){
  let n=seed|0;
  return ()=>{
    n=(n*1664525+1013904223)|0;
    return (n>>>0)/4294967296;
  };
}

function makeTongueTexture(){
  const random=seededRandom(271828);
  const canvas=document.createElement("canvas");
  canvas.width=1024;
  canvas.height=1024;
  const g=canvas.getContext("2d");

  const base=g.createLinearGradient(0,0,canvas.width,0);
  base.addColorStop(0,"#dd6979");
  base.addColorStop(.12,"#ee8f9b");
  base.addColorStop(.25,"#f5a0aa");
  base.addColorStop(.38,"#ee8f9b");
  base.addColorStop(.5,"#dd6979");
  base.addColorStop(.63,"#c65a70");
  base.addColorStop(.75,"#bd536a");
  base.addColorStop(.87,"#c65a70");
  base.addColorStop(1,"#dd6979");
  g.fillStyle=base;
  g.fillRect(0,0,canvas.width,canvas.height);

  const lengthShade=g.createLinearGradient(0,0,0,canvas.height);
  lengthShade.addColorStop(0,"rgba(80,15,28,.20)");
  lengthShade.addColorStop(.18,"rgba(0,0,0,0)");
  lengthShade.addColorStop(.82,"rgba(255,105,120,.05)");
  lengthShade.addColorStop(1,"rgba(255,75,95,.17)");
  g.fillStyle=lengthShade;
  g.fillRect(0,0,canvas.width,canvas.height);

  g.strokeStyle="rgba(125,28,45,.52)";
  g.lineWidth=10;
  g.lineCap="round";
  g.beginPath();
  g.moveTo(canvas.width*.25,canvas.height*.09);
  for(let y=.09;y<.95;y+=.025){
    const x=.25+(random()-.5)*.005;
    g.lineTo(canvas.width*x,canvas.height*y);
  }
  g.stroke();

  for(let i=0;i<7800;i++){
    const u=random()*.5;
    const v=random();
    const center=Math.exp(-Math.pow((u-.25)/.18,2));
    const r=.8+random()*2.2;
    const bright=random()<.58;
    g.fillStyle=bright
      ? `rgba(255,${198+(random()*38|0)},${205+(random()*35|0)},${.10+.28*center})`
      : `rgba(${135+(random()*40|0)},40,57,${.08+.18*center})`;
    g.beginPath();
    g.arc(u*canvas.width,v*canvas.height,r,0,Math.PI*2);
    g.fill();
  }

  g.lineWidth=4;
  for(let i=0;i<8;i++){
    const x=canvas.width*(.62+random()*.26);
    g.strokeStyle=`rgba(75,55,145,${.07+random()*.07})`;
    g.beginPath();
    g.moveTo(x,canvas.height*.08);
    g.bezierCurveTo(
      x+(random()-.5)*55,canvas.height*.35,
      x+(random()-.5)*70,canvas.height*.65,
      x+(random()-.5)*55,canvas.height*.94
    );
    g.stroke();
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.flipY=false;
  texture.wrapS=THREE.RepeatWrapping;
  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return texture;
}

function makeRoughnessMap(){
  const random=seededRandom(314159);
  const canvas=document.createElement("canvas");
  canvas.width=512;
  canvas.height=512;
  const g=canvas.getContext("2d");

  const gradient=g.createLinearGradient(0,0,canvas.width,0);
  gradient.addColorStop(0,"#686868");
  gradient.addColorStop(.25,"#848484");
  gradient.addColorStop(.5,"#606060");
  gradient.addColorStop(.75,"#363636");
  gradient.addColorStop(1,"#686868");
  g.fillStyle=gradient;
  g.fillRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<2600;i++){
    const value=random()<.5?145:55;
    g.fillStyle=`rgba(${value},${value},${value},.23)`;
    g.beginPath();
    g.arc(random()*.5*canvas.width,random()*canvas.height,.5+random()*1.7,0,Math.PI*2);
    g.fill();
  }

  const texture=new THREE.CanvasTexture(canvas);
  texture.flipY=false;
  texture.wrapS=THREE.RepeatWrapping;
  return texture;
}

/* =========================================================
   粒子モデル
   中心1点＋断面リング8点を13断面 = 117粒子
   ========================================================= */
const SECTIONS=13;
const RING=8;
const PER_SECTION=RING+1;
const PARTICLES=SECTIONS*PER_SECTION;
const CENTER_OFFSET=0;
const L0=.125;
const W0=.023;
const H0=.014;
const SEG_LEN=L0/(SECTIONS-1);
const FIXED_SECTIONS=2;

const pos=new Float32Array(PARTICLES*3);
const prev=new Float32Array(PARTICLES*3);
const predicted=new Float32Array(PARTICLES*3);
const invMass=new Float32Array(PARTICLES);
const restPos=new Float32Array(PARTICLES*3);

const centerIndex=s=>s*PER_SECTION+CENTER_OFFSET;
const ringIndex=(s,r)=>s*PER_SECTION+1+r;

function profile(t){
  let width=1-.28*t*t;
  let height=1-.25*t;
  if(t>.72){
    const k=(t-.72)/.28;
    const round=Math.sqrt(Math.max(.025,1-k*k));
    width*=round;
    height*=round*(1-.18*k);
  }
  width*=1+.08*Math.sin(Math.PI*t);
  return {width,height};
}

function initializeParticles(){
  for(let s=0;s<SECTIONS;s++){
    const t=s/(SECTIONS-1);
    const z=t*L0;
    const ci=centerIndex(s);
    const c3=ci*3;

    restPos[c3]=0;
    restPos[c3+1]=0;
    restPos[c3+2]=z;

    for(let r=0;r<RING;r++){
      const theta=r/RING*Math.PI*2;
      const shape=profile(t);
      let x=Math.cos(theta)*W0*shape.width;
      let y=Math.sin(theta)*H0*shape.height;

      if(Math.sin(theta)>0){
        const groove=Math.exp(-Math.pow(Math.cos(theta)/.35,2));
        y-=groove*.0023*Math.sin(theta)*(.3+.7*Math.sin(Math.PI*Math.min(1,t*1.2)));
      }
      if(y<0)y*=.84;

      const i=ringIndex(s,r)*3;
      restPos[i]=x;
      restPos[i+1]=y;
      restPos[i+2]=z;
    }
  }

  for(let i=0;i<PARTICLES;i++){
    const i3=i*3;
    pos[i3]=prev[i3]=predicted[i3]=restPos[i3];
    pos[i3+1]=prev[i3+1]=predicted[i3+1]=restPos[i3+1];
    pos[i3+2]=prev[i3+2]=predicted[i3+2]=restPos[i3+2];

    const section=Math.floor(i/PER_SECTION);
    invMass[i]=section<FIXED_SECTIONS?0:1;
  }
}
initializeParticles();

/* =========================================================
   拘束
   ========================================================= */
const constraints=[];

function distanceBetween(a,b,array=restPos){
  const a3=a*3,b3=b*3;
  const dx=array[a3]-array[b3];
  const dy=array[a3+1]-array[b3+1];
  const dz=array[a3+2]-array[b3+2];
  return Math.hypot(dx,dy,dz);
}

function addConstraint(a,b,stiffness,type){
  constraints.push({
    a,b,
    rest:distanceBetween(a,b),
    baseRest:distanceBetween(a,b),
    stiffness,
    type
  });
}

for(let s=0;s<SECTIONS;s++){
  for(let r=0;r<RING;r++){
    addConstraint(ringIndex(s,r),ringIndex(s,(r+1)%RING),.78,"ring");
    addConstraint(centerIndex(s),ringIndex(s,r),.86,"spoke");
    addConstraint(ringIndex(s,r),ringIndex(s,(r+2)%RING),.38,"diameter");
  }
}

for(let s=0;s<SECTIONS-1;s++){
  addConstraint(centerIndex(s),centerIndex(s+1),.93,"axis");
  for(let r=0;r<RING;r++){
    addConstraint(ringIndex(s,r),ringIndex(s+1,r),.82,"long");
    addConstraint(ringIndex(s,r),ringIndex(s+1,(r+1)%RING),.34,"shear");
    addConstraint(ringIndex(s,r),ringIndex(s+1,(r+RING-1)%RING),.34,"shear");
  }
}

for(let s=0;s<SECTIONS-2;s++){
  addConstraint(centerIndex(s),centerIndex(s+2),.48,"bend");
  for(let r=0;r<RING;r++){
    addConstraint(ringIndex(s,r),ringIndex(s+2,r),.22,"bend");
  }
}

function solveDistance(c){
  const a3=c.a*3,b3=c.b*3;
  let dx=predicted[b3]-predicted[a3];
  let dy=predicted[b3+1]-predicted[a3+1];
  let dz=predicted[b3+2]-predicted[a3+2];
  const len=Math.hypot(dx,dy,dz);
  if(len<1e-8)return;

  const wa=invMass[c.a];
  const wb=invMass[c.b];
  const sum=wa+wb;
  if(sum===0)return;

  const correction=(len-c.rest)/len*c.stiffness;
  dx*=correction;
  dy*=correction;
  dz*=correction;

  const ra=wa/sum;
  const rb=wb/sum;
  predicted[a3]+=dx*ra;
  predicted[a3+1]+=dy*ra;
  predicted[a3+2]+=dz*ra;
  predicted[b3]-=dx*rb;
  predicted[b3+1]-=dy*rb;
  predicted[b3+2]-=dz*rb;
}

/* =========================================================
   筋肉指令
   ========================================================= */
const command={ext:0,ud:0,lr:0,tw:0,cl:0};
const activation={ext:0,ud:0,lr:0,tw:0,cl:0};
const target=new Float32Array(PARTICLES*3);
const frameQ=new THREE.Quaternion();
const deltaQ=new THREE.Quaternion();
const euler=new THREE.Euler();
const framePos=new THREE.Vector3();
const right=new THREE.Vector3();
const up=new THREE.Vector3();
const forward=new THREE.Vector3();
const local=new THREE.Vector3();

function updateActivation(dt){
  for(const key of Object.keys(command)){
    const rising=Math.abs(command[key])>Math.abs(activation[key]);
    const tau=rising?.080:.150;
    const gain=1-Math.exp(-dt/tau);
    activation[key]+=(command[key]-activation[key])*gain;
  }
}

function updateConstraintRestLengths(){
  const stretch=.75+(activation.ext+1)*.2;
  const radiusScale=1/Math.sqrt(stretch);

  for(const c of constraints){
    if(c.type==="axis"||c.type==="long"||c.type==="bend"){
      c.rest=c.baseRest*stretch;
    }else if(c.type==="ring"||c.type==="spoke"||c.type==="diameter"){
      c.rest=c.baseRest*radiusScale;
    }else{
      c.rest=c.baseRest*Math.sqrt((stretch*stretch+radiusScale*radiusScale)*.5);
    }
  }
}

function buildMuscleTargets(){
  const stretch=.75+(activation.ext+1)*.2;
  const radiusScale=1/Math.sqrt(stretch);
  frameQ.identity();
  framePos.set(0,0,0);

  for(let s=0;s<SECTIONS;s++){
    const t=s/(SECTIONS-1);
    const env=.15+.85*t;
    const tip=t<.55?0:Math.pow((t-.55)/.45,2);

    if(s>0){
      const pitch=-(activation.ud*.095*env+activation.cl*.29*tip);
      const yaw=activation.lr*.095*env;
      const roll=activation.tw*.13*(.1+.9*t);
      euler.set(pitch,yaw,roll,"XYZ");
      deltaQ.setFromEuler(euler);
      frameQ.multiply(deltaQ).normalize();
      forward.set(0,0,1).applyQuaternion(frameQ);
      framePos.addScaledVector(forward,SEG_LEN*stretch);
    }

    right.set(1,0,0).applyQuaternion(frameQ);
    up.set(0,1,0).applyQuaternion(frameQ);

    const ci=centerIndex(s)*3;
    target[ci]=framePos.x;
    target[ci+1]=framePos.y;
    target[ci+2]=framePos.z;

    for(let r=0;r<RING;r++){
      const ri=ringIndex(s,r)*3;
      const restI=ringIndex(s,r)*3;
      local.set(
        restPos[restI]*radiusScale,
        restPos[restI+1]*radiusScale,
        0
      );
      target[ri]=framePos.x+right.x*local.x+up.x*local.y;
      target[ri+1]=framePos.y+right.y*local.x+up.y*local.y;
      target[ri+2]=framePos.z+right.z*local.x+up.z*local.y;
    }
  }
}

function solveMuscles(strength){
  for(let i=0;i<PARTICLES;i++){
    if(invMass[i]===0)continue;
    const i3=i*3;
    const section=Math.floor(i/PER_SECTION);
    const t=section/(SECTIONS-1);
    const gain=strength*(.25+.75*t);

    predicted[i3]+=(target[i3]-predicted[i3])*gain;
    predicted[i3+1]+=(target[i3+1]-predicted[i3+1])*gain;
    predicted[i3+2]+=(target[i3+2]-predicted[i3+2])*gain;
  }
}

function solveRootAttachment(){
  for(let s=0;s<FIXED_SECTIONS;s++){
    for(let k=0;k<PER_SECTION;k++){
      const i=(s*PER_SECTION+k)*3;
      predicted[i]=target[i];
      predicted[i+1]=target[i+1];
      predicted[i+2]=target[i+2];
    }
  }
}

/* =========================================================
   物理ステップ
   ========================================================= */
const FIXED_DT=1/144;
const ITERATIONS=10;
let accumulator=0;
let gravityEnabled=true;
let impulseTimer=0;
let grabbedParticle=-1;
const grabTarget=new THREE.Vector3();

function physicsStep(dt){
  updateActivation(dt);
  updateConstraintRestLengths();
  buildMuscleTargets();

  const damping=.993;
  for(let i=0;i<PARTICLES;i++){
    const i3=i*3;
    if(invMass[i]===0){
      predicted[i3]=pos[i3];
      predicted[i3+1]=pos[i3+1];
      predicted[i3+2]=pos[i3+2];
      continue;
    }

    let vx=(pos[i3]-prev[i3])*damping;
    let vy=(pos[i3+1]-prev[i3+1])*damping;
    let vz=(pos[i3+2]-prev[i3+2])*damping;

    const speed=Math.hypot(vx,vy,vz);
    const maxSpeed=.008;
    if(speed>maxSpeed){
      const scale=maxSpeed/speed;
      vx*=scale;vy*=scale;vz*=scale;
    }

    predicted[i3]=pos[i3]+vx;
    predicted[i3+1]=pos[i3+1]+vy-(gravityEnabled?2.1:0)*dt*dt;
    predicted[i3+2]=pos[i3+2]+vz;
  }

  if(impulseTimer>0){
    impulseTimer-=dt;
    for(let s=5;s<SECTIONS;s++){
      const t=s/(SECTIONS-1);
      for(let k=0;k<PER_SECTION;k++){
        const i=(s*PER_SECTION+k)*3;
        predicted[i]+=.00012*Math.sin(performance.now()*.045+s*1.8)*t;
        predicted[i+1]+=.00009*Math.cos(performance.now()*.052+s*1.3)*t;
      }
    }
  }

  for(let iteration=0;iteration<ITERATIONS;iteration++){
    solveRootAttachment();
    solveMuscles(iteration<3?.035:.012);

    for(const c of constraints)solveDistance(c);

    if(grabbedParticle>=0){
      const i=grabbedParticle*3;
      predicted[i]=grabTarget.x;
      predicted[i+1]=grabTarget.y;
      predicted[i+2]=grabTarget.z;
    }
  }

  const floorY=-.043;
  for(let i=0;i<PARTICLES;i++){
    const i3=i*3;
    if(predicted[i3+1]<floorY){
      predicted[i3+1]=floorY;
      predicted[i3]+=(pos[i3]-predicted[i3])*.08;
      predicted[i3+2]+=(pos[i3+2]-predicted[i3+2])*.08;
    }

    prev[i3]=pos[i3];
    prev[i3+1]=pos[i3+1];
    prev[i3+2]=pos[i3+2];
    pos[i3]=predicted[i3];
    pos[i3+1]=predicted[i3+1];
    pos[i3+2]=predicted[i3+2];
  }
}

/* =========================================================
   表示メッシュ
   物理リング間を補間して滑らかな外皮を作る
   ========================================================= */
const VISUAL_SEGMENTS=48;
const VISUAL_RING=24;
const visualRows=VISUAL_SEGMENTS+1;
const visualCount=visualRows*VISUAL_RING+2;
const TIP_VERTEX=visualRows*VISUAL_RING;
const ROOT_VERTEX=TIP_VERTEX+1;

const visualPositions=new Float32Array(visualCount*3);
const visualUVs=new Float32Array(visualCount*2);
const visualIndices=[];

for(let s=0;s<VISUAL_SEGMENTS;s++){
  for(let r=0;r<VISUAL_RING;r++){
    const a=s*VISUAL_RING+r;
    const b=s*VISUAL_RING+(r+1)%VISUAL_RING;
    const c=(s+1)*VISUAL_RING+r;
    const d=(s+1)*VISUAL_RING+(r+1)%VISUAL_RING;
    visualIndices.push(a,c,b,b,c,d);
  }
}
for(let r=0;r<VISUAL_RING;r++){
  visualIndices.push(
    VISUAL_SEGMENTS*VISUAL_RING+r,
    TIP_VERTEX,
    VISUAL_SEGMENTS*VISUAL_RING+(r+1)%VISUAL_RING
  );
  visualIndices.push((r+1)%VISUAL_RING,ROOT_VERTEX,r);
}
for(let s=0;s<visualRows;s++){
  for(let r=0;r<VISUAL_RING;r++){
    const i=s*VISUAL_RING+r;
    visualUVs[i*2]=1-r/VISUAL_RING;
    visualUVs[i*2+1]=s/VISUAL_SEGMENTS;
  }
}
visualUVs[TIP_VERTEX*2]=.25;
visualUVs[TIP_VERTEX*2+1]=1;
visualUVs[ROOT_VERTEX*2]=.25;
visualUVs[ROOT_VERTEX*2+1]=0;

const geometry=new THREE.BufferGeometry();
geometry.setIndex(visualIndices);
geometry.setAttribute("position",new THREE.BufferAttribute(visualPositions,3));
geometry.setAttribute("uv",new THREE.BufferAttribute(visualUVs,2));

const material=new THREE.MeshPhysicalMaterial({
  map:makeTongueTexture(),
  roughnessMap:makeRoughnessMap(),
  roughness:.95,
  clearcoat:1,
  clearcoatRoughness:.2,
  sheen:.4,
  sheenColor:new THREE.Color(0xff9cab),
  side:THREE.DoubleSide
});
const tongue=new THREE.Mesh(geometry,material);
tongue.frustumCulled=false;
scene.add(tongue);

function sampleRing(sectionFloat,ringFloat,out){
  const s0=Math.floor(sectionFloat);
  const s1=Math.min(SECTIONS-1,s0+1);
  const fs=sectionFloat-s0;

  let rf=ringFloat%RING;
  if(rf<0)rf+=RING;
  const r0=Math.floor(rf)%RING;
  const r1=(r0+1)%RING;
  const fr=rf-Math.floor(rf);

  const a=ringIndex(s0,r0)*3;
  const b=ringIndex(s0,r1)*3;
  const c=ringIndex(s1,r0)*3;
  const d=ringIndex(s1,r1)*3;

  const x0=pos[a]+(pos[b]-pos[a])*fr;
  const y0=pos[a+1]+(pos[b+1]-pos[a+1])*fr;
  const z0=pos[a+2]+(pos[b+2]-pos[a+2])*fr;
  const x1=pos[c]+(pos[d]-pos[c])*fr;
  const y1=pos[c+1]+(pos[d+1]-pos[c+1])*fr;
  const z1=pos[c+2]+(pos[d+2]-pos[c+2])*fr;

  out.set(
    x0+(x1-x0)*fs,
    y0+(y1-y0)*fs,
    z0+(z1-z0)*fs
  );
}

const sampled=new THREE.Vector3();
function updateVisualMesh(){
  for(let vs=0;vs<=VISUAL_SEGMENTS;vs++){
    const sf=vs/VISUAL_SEGMENTS*(SECTIONS-1);
    for(let vr=0;vr<VISUAL_RING;vr++){
      const rf=vr/VISUAL_RING*RING;
      sampleRing(sf,rf,sampled);
      const i=(vs*VISUAL_RING+vr)*3;
      visualPositions[i]=sampled.x;
      visualPositions[i+1]=sampled.y;
      visualPositions[i+2]=sampled.z;
    }
  }

  const lastCenter=centerIndex(SECTIONS-1)*3;
  const previousCenter=centerIndex(SECTIONS-2)*3;
  let dx=pos[lastCenter]-pos[previousCenter];
  let dy=pos[lastCenter+1]-pos[previousCenter+1];
  let dz=pos[lastCenter+2]-pos[previousCenter+2];
  const dl=Math.hypot(dx,dy,dz)||1;
  dx/=dl;dy/=dl;dz/=dl;

  visualPositions[TIP_VERTEX*3]=pos[lastCenter]+dx*.004;
  visualPositions[TIP_VERTEX*3+1]=pos[lastCenter+1]+dy*.004;
  visualPositions[TIP_VERTEX*3+2]=pos[lastCenter+2]+dz*.004;

  const root=centerIndex(0)*3;
  visualPositions[ROOT_VERTEX*3]=pos[root];
  visualPositions[ROOT_VERTEX*3+1]=pos[root+1];
  visualPositions[ROOT_VERTEX*3+2]=pos[root+2]-.008;

  geometry.attributes.position.needsUpdate=true;
  geometry.computeVertexNormals();
}

/* =========================================================
   骨格表示
   ========================================================= */
const skeletonPositions=new Float32Array(constraints.length*2*3);
const skeletonGeometry=new THREE.BufferGeometry();
skeletonGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(skeletonPositions,3)
);
const skeleton=new THREE.LineSegments(
  skeletonGeometry,
  new THREE.LineBasicMaterial({
    color:0x8be5ff,
    transparent:true,
    opacity:.42,
    depthTest:false
  })
);
skeleton.visible=false;
skeleton.renderOrder=4;
scene.add(skeleton);

const particleGeometry=new THREE.BufferGeometry();
particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(pos,3)
);
const particlesView=new THREE.Points(
  particleGeometry,
  new THREE.PointsMaterial({
    color:0xffffff,
    size:.0025,
    transparent:true,
    opacity:.7,
    depthTest:false
  })
);
particlesView.visible=false;
particlesView.renderOrder=5;
scene.add(particlesView);

function updateSkeleton(){
  if(!skeleton.visible)return;
  let n=0;
  for(const c of constraints){
    const a=c.a*3,b=c.b*3;
    skeletonPositions[n++]=pos[a];
    skeletonPositions[n++]=pos[a+1];
    skeletonPositions[n++]=pos[a+2];
    skeletonPositions[n++]=pos[b];
    skeletonPositions[n++]=pos[b+1];
    skeletonPositions[n++]=pos[b+2];
  }
  skeletonGeometry.attributes.position.needsUpdate=true;
  particleGeometry.attributes.position.needsUpdate=true;
}

/* =========================================================
   UI
   ========================================================= */
const sliderIds={
  ext:"s_ext",
  ud:"s_ud",
  lr:"s_lr",
  tw:"s_tw",
  cl:"s_cl"
};
const valueIds={
  ext:"v_ext",
  ud:"v_ud",
  lr:"v_lr",
  tw:"v_tw",
  cl:"v_cl"
};

let automatic=null;

function syncControls(){
  for(const key of Object.keys(sliderIds)){
    document.getElementById(sliderIds[key]).value=Math.round(command[key]*100);
    document.getElementById(valueIds[key]).textContent=command[key].toFixed(2);
  }
}

function stopAutomatic(){
  automatic=null;
  for(const id of ["b_pero","b_maki"]){
    document.getElementById(id).classList.remove("on");
  }
}

for(const key of Object.keys(sliderIds)){
  document.getElementById(sliderIds[key]).addEventListener("input",event=>{
    stopAutomatic();
    command[key]=Number(event.target.value)/100;
    document.getElementById(valueIds[key]).textContent=command[key].toFixed(2);
  });
}

document.getElementById("b_pero").addEventListener("click",event=>{
  const enable=automatic!=="pero";
  stopAutomatic();
  if(enable){
    automatic="pero";
    event.currentTarget.classList.add("on");
  }
});

document.getElementById("b_maki").addEventListener("click",event=>{
  const enable=automatic!=="maki";
  stopAutomatic();
  if(enable){
    automatic="maki";
    event.currentTarget.classList.add("on");
  }
});

document.getElementById("b_wiggle").addEventListener("click",()=>{
  impulseTimer=.65;
});

document.getElementById("b_reset").addEventListener("click",()=>{
  stopAutomatic();
  for(const key of Object.keys(command))command[key]=0;
  for(const key of Object.keys(activation))activation[key]=0;
  syncControls();
  initializeParticles();
  accumulator=0;
});

document.getElementById("gravity").addEventListener("change",event=>{
  gravityEnabled=event.target.checked;
});

document.getElementById("wire").addEventListener("change",event=>{
  skeleton.visible=event.target.checked;
  particlesView.visible=event.target.checked;
});

document.getElementById("st_particles").textContent=String(PARTICLES);
document.getElementById("st_constraints").textContent=String(constraints.length);

/* =========================================================
   マウス・タッチ操作
   ========================================================= */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const dragPlane=new THREE.Plane();
const planeHit=new THREE.Vector3();
let orbiting=false;
let oldX=0;
let oldY=0;

function setPointer(event){
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=(event.clientX-rect.left)/rect.width*2-1;
  pointer.y=-(event.clientY-rect.top)/rect.height*2+1;
}

function findNearestTipParticle(point){
  let best=-1;
  let bestDistance=.026;
  for(let s=SECTIONS-4;s<SECTIONS;s++){
    for(let k=0;k<PER_SECTION;k++){
      const index=s*PER_SECTION+k;
      const i=index*3;
      const distance=Math.hypot(
        pos[i]-point.x,
        pos[i+1]-point.y,
        pos[i+2]-point.z
      );
      if(distance<bestDistance){
        best=index;
        bestDistance=distance;
      }
    }
  }
  return best;
}

renderer.domElement.addEventListener("pointerdown",event=>{
  renderer.domElement.setPointerCapture(event.pointerId);
  setPointer(event);
  raycaster.setFromCamera(pointer,camera);

  const hits=raycaster.intersectObject(tongue,false);
  if(hits.length){
    const candidate=findNearestTipParticle(hits[0].point);
    if(candidate>=0){
      grabbedParticle=candidate;
      grabTarget.copy(hits[0].point);
      dragPlane.setFromNormalAndCoplanarPoint(
        camera.getWorldDirection(new THREE.Vector3()),
        hits[0].point
      );
      return;
    }
  }

  orbiting=true;
  oldX=event.clientX;
  oldY=event.clientY;
});

renderer.domElement.addEventListener("pointermove",event=>{
  if(grabbedParticle>=0){
    setPointer(event);
    raycaster.setFromCamera(pointer,camera);
    if(raycaster.ray.intersectPlane(dragPlane,planeHit)){
      grabTarget.copy(planeHit);
    }
    return;
  }

  if(!orbiting)return;
  camYaw-=(event.clientX-oldX)*.006;
  camPitch+=(event.clientY-oldY)*.006;
  camPitch=Math.max(-1.15,Math.min(1.35,camPitch));
  oldX=event.clientX;
  oldY=event.clientY;
  updateCamera();
});

function endPointer(){
  orbiting=false;
  grabbedParticle=-1;
}
renderer.domElement.addEventListener("pointerup",endPointer);
renderer.domElement.addEventListener("pointercancel",endPointer);

renderer.domElement.addEventListener("wheel",event=>{
  event.preventDefault();
  camDist=Math.max(.10,Math.min(.65,camDist+event.deltaY*.00035));
  updateCamera();
},{passive:false});

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* =========================================================
   診断
   ========================================================= */
const strainElement=document.getElementById("st_strain");
const stateElement=document.getElementById("st_state");
let statsTimer=0;

function updateStats(dt){
  statsTimer+=dt;
  if(statsTimer<.2)return;
  statsTimer=0;

  let maxStrain=0;
  let finite=true;
  for(const c of constraints){
    const length=distanceBetween(c.a,c.b,pos);
    if(!Number.isFinite(length)){
      finite=false;
      break;
    }
    maxStrain=Math.max(maxStrain,Math.abs(length-c.rest)/Math.max(c.rest,1e-6));
  }

  const percent=maxStrain*100;
  strainElement.textContent=Number.isFinite(percent)?`${percent.toFixed(1)}%`:"異常";
  const healthy=finite&&percent<45;
  strainElement.className=healthy?"good":"bad";
  stateElement.textContent=healthy?"安定":"高ひずみ";
  stateElement.className=healthy?"good":"bad";
}

/* =========================================================
   メインループ
   ========================================================= */
const clock=new THREE.Clock();

function updateAutomatic(time){
  if(automatic==="pero"){
    command.ext=.28+Math.sin(time*3.1)*.23;
    command.ud=Math.sin(time*3.1+1.0)*.56;
    command.lr=Math.sin(time*1.15)*.17;
    command.tw=Math.sin(time*1.7)*.06;
    command.cl=Math.max(0,Math.sin(time*3.1+2.15))*.42;
    syncControls();
  }else if(automatic==="maki"){
    command.ext=-.2;
    command.ud=.12;
    command.lr=Math.sin(time*4.5)*.11;
    command.tw=Math.sin(time*2.2)*.15;
    command.cl=.58+Math.sin(time*8.5)*.38;
    syncControls();
  }
}

function animate(){
  requestAnimationFrame(animate);
  const frameDt=Math.min(clock.getDelta(),1/30);
  const time=clock.elapsedTime;

  updateAutomatic(time);
  accumulator=Math.min(accumulator+frameDt,FIXED_DT*6);

  let substeps=0;
  while(accumulator>=FIXED_DT&&substeps<6){
    physicsStep(FIXED_DT);
    accumulator-=FIXED_DT;
    substeps++;
  }

  updateVisualMesh();
  updateSkeleton();
  updateStats(frameDt);
  renderer.render(scene,camera);
}

buildMuscleTargets();
updateVisualMesh();
animate();

/* =========================================================
   検証用API
   ========================================================= */
window.__dbg={
  command,
  activation,
  particles:PARTICLES,
  constraints:constraints.length,
  set(key,value){
    if(!(key in command))return false;
    stopAutomatic();
    command[key]=Math.max(-1,Math.min(1,Number(value)||0));
    syncControls();
    return true;
  },
  reset(){
    document.getElementById("b_reset").click();
  },
  impulse(){
    impulseTimer=.65;
  },
  wire(value=true){
    document.getElementById("wire").checked=Boolean(value);
    skeleton.visible=Boolean(value);
    particlesView.visible=Boolean(value);
  },
  view(yaw,pitch,distance){
    camYaw=Number(yaw);
    camPitch=Number(pitch);
    camDist=Number(distance);
    updateCamera();
  },
  step(n=1){ // 検証用: 物理を手動でn歩進める(非表示タブでrAFが止まる環境向け)
    for(let i=0;i<n;i++)physicsStep(FIXED_DT);
    updateVisualMesh();
  },
  snapshot(width=640){
    updateVisualMesh();
    renderer.render(scene,camera);
    const source=renderer.domElement;
    const canvas=document.createElement("canvas");
    canvas.width=width;
    canvas.height=Math.round(width*source.height/source.width);
    canvas.getContext("2d").drawImage(source,0,0,canvas.width,canvas.height);
    return canvas.toDataURL("image/jpeg",.78);
  }
};
</script>
