<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<title>claude</title>
<style>
  :root {
    --bg: #faf9f5;
    --panel: #ffffff;
    --text: #1f1d1a;
    --muted: #6b6862;
    --line: #e6e2d9;
    --accent: #d97757;
    --accent-soft: #f5ede8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.65;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--bg);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    /* 本物と同じ「すっと引っ込む」感じ。終わりだけゆっくり止まる曲線 */
    transition: transform .32s cubic-bezier(.32, .72, 0, 1), opacity .22s ease;
  }

  header.gone {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }

  /* バーが出ているときだけ、下に薄い影で境目を作る(線は引かない) */
  header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -12px;
    height: 12px;
    background: linear-gradient(to bottom, rgba(250,249,245,1), rgba(250,249,245,0));
    pointer-events: none;
  }

  /* バーが隠れているときに、上端に触れると出てくるための当たり判定 */
  .topzone {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;
    z-index: 15;
  }

  .logo {
    color: var(--accent);
    font-size: 20px;
    line-height: 1;
  }

  .title {
    font-family: "Times New Roman", "Georgia", "Yu Mincho", serif;
    font-size: 19px;
    letter-spacing: .01em;
  }

  .thread {
    color: var(--muted);
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .spacer { flex: 1; }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #c9c5bc;
    flex: none;
  }
  .dot.ok { background: #6aa84f; }
  .dot.busy { background: var(--accent); }
  .dot.ng { background: #cc4b37; }

  .iconbtn {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 20px;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 8px;
  }
  .iconbtn:active { background: var(--accent-soft); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    padding-top: calc(58px + env(safe-area-inset-top));
  }

  .inner { max-width: 720px; margin: 0 auto; }

  .row { margin-bottom: 24px; }

  .me {
    display: flex;
    justify-content: flex-end;
  }

  .me .bubble {
    background: #f0eee6;
    border-radius: 14px;
    padding: 10px 15px;
    max-width: 85%;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .ai { display: flex; gap: 10px; }

  .ai .mark {
    color: var(--accent);
    flex: none;
    font-size: 16px;
    line-height: 1.65;
  }

  .ai .body {
    word-break: break-word;
    flex: 1;
    min-width: 0;
  }

  /* 整形した本文 */
  .body p { margin: 0 0 14px; white-space: pre-wrap; }
  .body p:last-child { margin-bottom: 0; }
  .body h3 { font-size: 15px; margin: 20px 0 8px; }
  .body ul, .body ol { margin: 0 0 14px; padding-left: 22px; }
  .body li { margin-bottom: 5px; }
  .body code {
    background: #f0eee6;
    border-radius: 5px;
    padding: 1px 5px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 14px;
  }
  .body pre {
    background: #f0eee6;
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0 0 14px;
  }
  .body pre code { background: none; padding: 0; }
  .body hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }

  .note {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin-bottom: 18px;
  }

  .stamp {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
  }

  .thinking .body { color: var(--muted); }

  footer {
    background: var(--bg);
    padding: 6px 12px 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  .shell { max-width: 720px; margin: 0 auto; }

  .inputrow {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 7px 10px 5px;
    flex-wrap: wrap;
  }

  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font: inherit;
    line-height: 1.6;
    background: transparent;
    color: inherit;
    max-height: 30vh;
    min-height: 22px;
    padding: 2px 2px;
  }

  .send {
    border: none;
    background: var(--accent);
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 13px;
    cursor: pointer;
    flex: none;
  }
  .send:disabled { background: #d6d2c9; }

  .opts {
    display: flex;
    gap: 6px;
    align-items: center;
    width: 100%;
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
  }

  select {
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 2px 2px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  .menu {
    position: absolute;
    right: 10px;
    top: 52px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.10);
    padding: 6px;
    display: none;
    z-index: 10;
    min-width: 190px;
  }
  .menu.open { display: block; }

  .menu button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: none;
    font: inherit;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
  }
  .menu button:active { background: var(--accent-soft); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 5px 2px; }

  .setup {
    max-width: 420px;
    margin: 0 auto;
    padding: 28px 18px;
  }

  .setup h1 {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 6px;
  }

  .setup p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .setup label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }

  .setup input {
    width: 100%;
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: inherit;
    margin-bottom: 16px;
    letter-spacing: .08em;
  }

  .setup button {
    width: 100%;
    border: none;
    background: var(--accent);
    color: #fff;
    font: inherit;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .err { color: #cc4b37; font-size: 13px; margin-bottom: 12px; }
  .rev { color: #c9c5bc; font-size: 11px; }
</style>
</head>
<body>

<div id="setup" class="setup" hidden>
  <h1><span class="logo">✳</span> claude</h1>
  <p>この端末で使う合言葉を入れてください。入力した合言葉はこの端末の中だけに保存されます。</p>
  <div id="setupErr" class="err" hidden></div>
  <label for="qPhrase">質問用の合言葉</label>
  <input id="qPhrase" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <label for="aPhrase">回答用の合言葉</label>
  <input id="aPhrase" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <button id="setupGo">はじめる</button>
</div>

<header id="bar" hidden>
  <span class="logo">✳</span>
  <span class="title">Claude</span>
  <span id="threadName" class="thread"></span>
  <span class="spacer"></span>
  <span id="dot" class="dot" title="状態"></span>
  <button id="menuBtn" class="iconbtn" aria-label="メニュー">⋯</button>
</header>

<div id="menu" class="menu">
  <button id="newChatBtn">＋ 新しい会話をはじめる</button>
  <hr>
  <div id="threadList"></div>
  <button data-cmd="状態">いまの状態</button>
  <button data-cmd="一覧">会話の一覧</button>
  <button data-cmd="PC一覧 30">パソコンの会話（30件）</button>
  <button id="searchBtn">パソコンの会話を探す</button>
  <button id="switchBtn">会話を切り替える</button>
  <button id="connectBtn">パソコンの会話につなぐ</button>
  <hr>
  <button data-cmd="新規">この会話をやり直す</button>
  <button data-cmd="ping">つながっているか確認</button>
  <hr>
  <button id="clearBtn">画面の表示を消す</button>
  <button id="resetBtn">合言葉を入れ直す</button>
  <div class="rev" style="padding: 6px 12px;">rev11</div>
</div>

<div id="topzone" class="topzone" hidden></div>

<main id="log" hidden></main>

<footer id="composer" hidden>
  <div class="shell">
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="メッセージを入力"></textarea>
      <div class="opts">
        <span class="spacer"></span>
        <select id="model" title="モデル">
          <option value="">モデル(そのまま)</option>
          <option value="opus">Opus</option>
          <option value="sonnet">Sonnet</option>
          <option value="fable">Fable</option>
          <option value="haiku">Haiku</option>
        </select>
        <select id="effort" title="工数">
          <option value="">工数(そのまま)</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="xhigh">特高</option>
          <option value="max">最大</option>
        </select>
        <button id="send" class="send" aria-label="送信">↑</button>
      </div>
    </div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  // 暗号のやり方は angou.html と同じ。1文字でも変えると相手側と噛み合わなくなる。
  var CODE_ALPHABET = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  var MAGIC = "MSENC1";
  var PBKDF2_ITER = 300000;
  var FIXED_SALT = "filesync-angou-v1";
  var PHRASE_RE = /^[0-9A-HJ-NP-Z]{8,32}$/;

  var POLL_MS = 1200;
  var PHRASE_KEY = "remoteClaudePhrases";
  var LOG_KEY = "remoteClaudeLog";          // 旧: 会話を分けていなかった頃の置き場
  var LOG_PREFIX = "remoteClaudeLog::";     // 新: 会話の名前ごとに分けて保存する
  var CUR_KEY = "remoteClaudeThread";       // いま画面に出している会話の名前
  var MAX_LOG = 200;

  var el = function (id) { return document.getElementById(id); };
  var setupEl = el("setup"), barEl = el("bar"), logEl = el("log"),
      composerEl = el("composer"), menuEl = el("menu"), dotEl = el("dot"),
      inputEl = el("input"), sendEl = el("send"), threadEl = el("threadName");

  var question = null;   // {loc, key}
  var answer = null;     // {loc, key}
  var lastAnswerStamp = null;
  var waiting = false;
  var pollTimer = null;
  var history = [];
  var currentThread = "ふだん";
  try {
    var savedThread = localStorage.getItem(CUR_KEY);
    if (savedThread) currentThread = savedThread;
  } catch (error) { /* 読めなければ「ふだん」から始める */ }

  // ---- 保存まわり ------------------------------------------------------

  function loadPhrases() {
    try {
      var raw = localStorage.getItem(PHRASE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) { return null; }
  }

  function savePhrases(q, a) {
    try {
      localStorage.setItem(PHRASE_KEY, JSON.stringify({ q: q, a: a }));
    } catch (error) { /* 保存できなくても、この場では使える */ }
  }

  function logKeyOf(name) { return LOG_PREFIX + name; }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(logKeyOf(currentThread));
      history = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(history)) history = [];
    } catch (error) { history = []; }
  }

  function saveHistory() {
    try {
      localStorage.setItem(logKeyOf(currentThread), JSON.stringify(history.slice(-MAX_LOG)));
    } catch (error) { /* あふれても表示は続ける */ }
  }

  // このスマホに残っている会話の名前を、新しく使った順に並べて返す。
  function threadNames() {
    var names = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && key.indexOf(LOG_PREFIX) === 0) names.push(key.slice(LOG_PREFIX.length));
      }
    } catch (error) { /* 読めなければ空のまま */ }
    names.sort();
    return names;
  }

  // 画面に出す会話を切り替える(スマホの中だけの操作。通信はしない)。
  function setThread(name, tellPc) {
    if (!name || name === currentThread) {
      if (tellPc) send("切替 " + name);
      return;
    }
    saveHistory();                       // いまの会話を、いまの名前で保存してから移る
    currentThread = name;
    try { localStorage.setItem(CUR_KEY, name); } catch (error) { /* 覚えられなくても動く */ }
    loadHistory();
    threadEl.textContent = name;
    render();
    if (tellPc) send("切替 " + name);    // パソコン側も同じ会話に合わせる
  }

  // 旧版(会話を分けていなかった頃)のログを、いまの会話へ引き取る。
  function migrateOldLog() {
    try {
      var raw = localStorage.getItem(LOG_KEY);
      if (!raw) return;
      if (!localStorage.getItem(logKeyOf(currentThread))) {
        localStorage.setItem(logKeyOf(currentThread), raw);
      }
      localStorage.removeItem(LOG_KEY);
    } catch (error) { /* 引き取れなくても新しい会話は使える */ }
  }

  // ⋯メニューの中に、この端末に残っている会話を並べる。
  function buildThreadMenu() {
    var box = el("threadList");
    if (!box) return;
    box.innerHTML = "";
    var names = threadNames();
    if (!names.length) return;

    names.forEach(function (name) {
      var button = document.createElement("button");
      button.textContent = (name === currentThread ? "● " : "　") + name;
      button.addEventListener("click", function () {
        menuEl.classList.remove("open");
        setThread(name, true);
      });
      box.appendChild(button);
    });

    var line = document.createElement("hr");
    box.appendChild(line);
  }

  // ---- 暗号(angou.htmlと同じ) ------------------------------------------

  async function deriveFromPhrase(phrase) {
    var encoder = new TextEncoder();

    var locDigest = await crypto.subtle.digest(
      "SHA-256",
      encoder.encode("memo-locker:" + FIXED_SALT + ":" + phrase)
    );
    var locBytes = new Uint8Array(locDigest);
    var loc = "";

    for (var i = 0; i < 6; i++) {
      loc += CODE_ALPHABET.charAt(locBytes[i] % CODE_ALPHABET.length);
    }

    var baseKey = await crypto.subtle.importKey(
      "raw", encoder.encode(phrase), "PBKDF2", false, ["deriveKey"]
    );

    var key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: encoder.encode("memo-key:" + FIXED_SALT),
        iterations: PBKDF2_ITER,
        hash: "SHA-256"
      },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );

    return { loc: loc, key: key };
  }

  function bytesToBase64(bytes) {
    var chunk = 0x8000, pieces = [];
    for (var i = 0; i < bytes.length; i += chunk) {
      pieces.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)));
    }
    return btoa(pieces.join(""));
  }

  function base64ToBytes(text) {
    var binary = atob(text);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function encryptWith(channel, text) {
    var iv = new Uint8Array(12);
    crypto.getRandomValues(iv);

    var cipher = new Uint8Array(await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: iv }, channel.key, new TextEncoder().encode(text)
    ));

    var out = new Uint8Array(iv.length + cipher.length);
    out.set(iv, 0);
    out.set(cipher, iv.length);
    return MAGIC + bytesToBase64(out);
  }

  async function decryptWith(channel, payload) {
    if (payload.indexOf(MAGIC) !== 0) throw new Error("暗号化されていないデータです。");

    var bytes = base64ToBytes(payload.slice(MAGIC.length));
    if (bytes.length < 12 + 17) throw new Error("データが壊れています。");

    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes.subarray(0, 12) },
      channel.key,
      bytes.subarray(12)
    );
    return new TextDecoder().decode(plain);
  }

  // ---- 通信 ------------------------------------------------------------

  async function getChannel(channel) {
    var response = await fetch("/api/memo/" + encodeURIComponent(channel.loc), {
      headers: { "Accept": "application/json" },
      cache: "no-store"
    });
    var data = await response.json();
    if (!data || data.ok !== true) throw new Error((data && data.message) || "受け取れませんでした。");
    return data;
  }

  async function putChannel(channel, text) {
    var payload = await encryptWith(channel, text);
    var response = await fetch("/api/memo/" + encodeURIComponent(channel.loc), {
      method: "PUT",
      headers: { "Content-Type": "text/plain; charset=utf-8", "X-Memo-Ttl-Minutes": "70" },
      body: payload
    });
    var data = await response.json();
    if (!data || data.ok !== true) throw new Error((data && data.message) || "送れませんでした。");
  }

  // ---- 画面 ------------------------------------------------------------

  function nowStamp() {
    var d = new Date();
    return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function setDot(kind, title) {
    dotEl.className = "dot" + (kind ? " " + kind : "");
    dotEl.title = title || "";
  }

  // 回答の末尾に付く「― しごと / opus / 工数high / 続き」を見出しへ移す
  function splitFooter(text) {
    var lines = String(text).split("\n");
    var last = lines[lines.length - 1].trim();

    if (last.indexOf("―") === 0 && last.indexOf("/") > 0) {
      lines.pop();
      while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
      return { body: lines.join("\n"), footer: last.replace(/^―\s*/, "") };
    }
    return { body: text, footer: null };
  }

  // ---- Markdownの簡易整形 ---------------------------------------------
  // ライブラリは使わず、**太字**・箇条書き・見出し・コードだけを整える。
  // HTMLは必ず先に打ち消してから組み立てる(回答の中のタグをそのまま実行させない)。

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function inlineMarkdown(text) {
    return escapeHtml(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  }

  function renderMarkdown(text) {
    var lines = String(text).split("\n");
    var html = [];
    var list = null;      // "ul" | "ol" | null
    var paragraph = [];
    var code = null;      // コードブロックの中身

    function closeParagraph() {
      if (paragraph.length) {
        html.push("<p>" + inlineMarkdown(paragraph.join("\n")) + "</p>");
        paragraph = [];
      }
    }

    function closeList() {
      if (list) { html.push("</" + list + ">"); list = null; }
    }

    lines.forEach(function (line) {
      if (/^```/.test(line.trim())) {
        if (code === null) {
          closeParagraph();
          closeList();
          code = [];
        } else {
          html.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
          code = null;
        }
        return;
      }

      if (code !== null) { code.push(line); return; }

      if (!line.trim()) { closeParagraph(); closeList(); return; }

      var heading = line.match(/^#{1,6}\s+(.*)$/);
      if (heading) {
        closeParagraph(); closeList();
        html.push("<h3>" + inlineMarkdown(heading[1]) + "</h3>");
        return;
      }

      if (/^\s*([-*—―]{3,})\s*$/.test(line)) {
        closeParagraph(); closeList();
        html.push("<hr>");
        return;
      }

      var bullet = line.match(/^\s*[-*・]\s+(.*)$/);
      if (bullet) {
        closeParagraph();
        if (list !== "ul") { closeList(); html.push("<ul>"); list = "ul"; }
        html.push("<li>" + inlineMarkdown(bullet[1]) + "</li>");
        return;
      }

      var numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (numbered) {
        closeParagraph();
        if (list !== "ol") { closeList(); html.push("<ol>"); list = "ol"; }
        html.push("<li>" + inlineMarkdown(numbered[1]) + "</li>");
        return;
      }

      closeList();
      paragraph.push(line);
    });

    if (code !== null) {
      html.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
    }
    closeParagraph();
    closeList();

    return html.join("");
  }

  function render() {
    logEl.innerHTML = "";
    var inner = document.createElement("div");
    inner.className = "inner";
    logEl.appendChild(inner);

    history.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "row " + (item.who === "me" ? "me" : "ai");

      if (item.who === "note") {
        row.className = "note";
        row.textContent = item.text;
      } else if (item.who === "me") {
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = item.text;
        row.appendChild(bubble);
      } else {
        var mark = document.createElement("div");
        mark.className = "mark";
        mark.textContent = "✳";
        var body = document.createElement("div");
        body.className = "body";
        body.innerHTML = renderMarkdown(item.text);
        row.appendChild(mark);
        row.appendChild(body);
      }

      inner.appendChild(row);
    });

    if (waiting) {
      var row2 = document.createElement("div");
      row2.className = "row ai thinking";
      row2.innerHTML = '<div class="mark">✳</div><div class="body"><p>考えています…</p></div>';
      inner.appendChild(row2);
    }

    logEl.scrollTop = logEl.scrollHeight;
  }

  function push(who, text) {
    history.push({ who: who, text: text, at: nowStamp() });
    if (history.length > MAX_LOG) history = history.slice(-MAX_LOG);
    saveHistory();
    render();
  }

  // ---- 上のバーの出し入れ ----------------------------------------------
  // 10秒さわらなければ上へ引っ込む。スクロールしたらすぐ引っ込む。
  // 画面の上端(56px)にカーソルを持っていく・触れると、また出てくる。

  var HIDE_AFTER_MS = 10000;
  var barTimer = null;

  function showBar(keepOpen) {
    barEl.classList.remove("gone");
    if (barTimer) clearTimeout(barTimer);
    if (!keepOpen) barTimer = setTimeout(hideBar, HIDE_AFTER_MS);
  }

  function hideBar() {
    // メニューを開いている間・文字を打っている間は消さない
    if (menuEl.classList.contains("open")) { showBar(); return; }
    if (document.activeElement === inputEl) { showBar(); return; }
    barEl.classList.add("gone");
  }

  function watchBar() {
    logEl.addEventListener("scroll", function () {
      if (!barEl.classList.contains("gone")) hideBar();
    }, { passive: true });

    // パソコン: 上端にカーソルが入ったら出す
    document.addEventListener("mousemove", function (event) {
      if (event.clientY <= 56) showBar();
    });

    // スマホ: 上端に触れたら出す
    el("topzone").addEventListener("touchstart", function () { showBar(); }, { passive: true });
    el("topzone").addEventListener("click", function () { showBar(); });

    // バー自体をさわっている間は消さない
    barEl.addEventListener("mouseenter", function () { showBar(true); });
    barEl.addEventListener("mouseleave", function () { showBar(); });
    barEl.addEventListener("touchstart", function () { showBar(); }, { passive: true });

    showBar();
  }

  // ---- 送受信 ----------------------------------------------------------

  async function send(text) {
    text = String(text || "").trim();
    if (!text || waiting) return;

    push("me", text);
    waiting = true;
    setDot("busy", "送信中");
    render();

    try {
      await putChannel(question, text);
      setDot("busy", "返事を待っています");
    } catch (error) {
      waiting = false;
      setDot("ng", "送れませんでした");
      push("note", "送れませんでした（" + error.message + "）");
    }
  }

  async function poll() {
    if (!answer) return;

    try {
      var data = await getChannel(answer);

      if (lastAnswerStamp === null) {
        lastAnswerStamp = data.updatedAt || "";
        setDot("ok", "つながっています");
        return;
      }

      if ((data.updatedAt || "") !== lastAnswerStamp) {
        lastAnswerStamp = data.updatedAt || "";
        var payload = data.text || "";

        if (payload.indexOf(MAGIC) === 0) {
          var text = await decryptWith(answer, payload);
          var parts = splitFooter(text);

          waiting = false;
          if (parts.footer) {
            // footerは「名前 / モデル / 工数x / 続き」の形。先頭が会話の名前。
            var pcName = parts.footer.split("/")[0].trim();
            if (pcName) setThread(pcName, false);
            threadEl.textContent = parts.footer;
          }
          push("ai", parts.body);
          setDot("ok", "つながっています");
          showBar();  // 返事が来たら、どの会話・どの設定だったかを一度見せる
        }
      } else if (!waiting) {
        setDot("ok", "つながっています");
      }
    } catch (error) {
      setDot("ng", "通信できません");
    }
  }

  // ---- 起動 ------------------------------------------------------------

  function showChat() {
    setupEl.hidden = true;
    barEl.hidden = false;
    el("topzone").hidden = false;
    logEl.hidden = false;
    composerEl.hidden = false;
    render();
    watchBar();

    if (pollTimer) clearInterval(pollTimer);
    poll();
    pollTimer = setInterval(poll, POLL_MS);
  }

  async function start(qPhrase, aPhrase) {
    question = await deriveFromPhrase(qPhrase);
    answer = await deriveFromPhrase(aPhrase);
    lastAnswerStamp = null;
    showChat();
  }

  el("setupGo").addEventListener("click", async function () {
    var q = el("qPhrase").value.trim().toUpperCase();
    var a = el("aPhrase").value.trim().toUpperCase();
    var err = el("setupErr");

    if (!PHRASE_RE.test(q) || !PHRASE_RE.test(a)) {
      err.textContent = "合言葉は数字とアルファベット（I と O は使いません）で8〜32文字です。";
      err.hidden = false;
      return;
    }

    if (q === a) {
      err.textContent = "質問用と回答用は別の合言葉にしてください。";
      err.hidden = false;
      return;
    }

    err.hidden = true;
    savePhrases(q, a);
    await start(q, a);
  });

  sendEl.addEventListener("click", function () {
    var text = String(inputEl.value || "").trim();
    // プルダウンで選んだモデル・工数は、送信時にまとめて先頭に載せる(往復1回で済む)
    var lines = [];
    if (el("model").value) lines.push("モデル " + el("model").value);
    if (el("effort").value) lines.push("工数 " + el("effort").value);
    if (text) lines.push(text);
    if (!lines.length) return;
    inputEl.value = "";
    inputEl.style.height = "auto";
    el("model").selectedIndex = 0;
    el("effort").selectedIndex = 0;
    send(lines.join("\n"));
  });

  inputEl.addEventListener("input", function () {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, window.innerHeight * 0.3) + "px";
  });

  // パソコンのキーボードでは Enter で送信、スマホは送信ボタンだけ
  inputEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey && window.matchMedia("(pointer: fine)").matches) {
      event.preventDefault();
      sendEl.click();
    }
  });

  el("menuBtn").addEventListener("click", function (event) {
    event.stopPropagation();
    if (!menuEl.classList.contains("open")) buildThreadMenu();
    menuEl.classList.toggle("open");
    showBar(menuEl.classList.contains("open"));
  });

  document.addEventListener("click", function () {
    menuEl.classList.remove("open");
  });

  menuEl.addEventListener("click", function (event) {
    event.stopPropagation();
    var cmd = event.target.getAttribute && event.target.getAttribute("data-cmd");
    if (cmd) {
      menuEl.classList.remove("open");
      send(cmd);
    }
  });

  el("newChatBtn").addEventListener("click", function () {
    menuEl.classList.remove("open");
    var name = prompt("新しい会話の名前を決めてください（例: かいもの）\n※いまの会話はそのまま残ります");
    if (name && name.trim()) setThread(name.trim(), true);
  });

  el("switchBtn").addEventListener("click", function () {
    menuEl.classList.remove("open");
    var name = prompt("どの会話に切り替えますか（新しい名前でも作れます）");
    if (name && name.trim()) setThread(name.trim(), true);
  });

  el("searchBtn").addEventListener("click", function () {
    menuEl.classList.remove("open");
    var word = prompt("パソコンの過去の会話から、どの言葉を探しますか（例: 顔モザイク）");
    if (word && word.trim()) send("さがす " + word.trim());
  });

  el("connectBtn").addEventListener("click", function () {
    menuEl.classList.remove("open");
    var number = prompt("「パソコンの会話」の何番につなぎますか（先に一覧を出してください）");
    if (number && number.trim()) send("つなぐ " + number.trim());
  });

  el("clearBtn").addEventListener("click", function () {
    menuEl.classList.remove("open");
    history = [];
    saveHistory();
    render();
  });

  el("resetBtn").addEventListener("click", function () {
    menuEl.classList.remove("open");
    try { localStorage.removeItem(PHRASE_KEY); } catch (error) { /* 消せなくても再入力はできる */ }
    location.reload();
  });

  // モデル・工数のプルダウンは選んだだけでは送らない。
  // 次の送信ボタンで、質問と一緒に(質問が空なら指示だけ)まとめて送られる。

  // 最初の表示
  migrateOldLog();
  loadHistory();
  threadEl.textContent = currentThread;
  var saved = loadPhrases();

  if (!window.crypto || !crypto.subtle) {
    setupEl.hidden = false;
    el("setupErr").hidden = false;
    el("setupErr").textContent =
      "この端末では暗号の機能が使えません（httpsで開いてください）。";
  } else if (saved && saved.q && saved.a) {
    start(saved.q, saved.a).catch(function () {
      setupEl.hidden = false;
    });
  } else {
    setupEl.hidden = false;
  }
})();
</script>
</body>
</html>
