<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テキスト同期メモ</title>
<style>
  body {
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }

  .rev {
    position: fixed;
    top: 6px;
    right: 10px;
    font-size: 11px;
    color: #999;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 20px;
    margin: 8px 0 16px;
  }

  .panel {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  }

  .panel + .panel {
    margin-top: 14px;
  }

  .code-label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
  }

  .code-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  #codeInput {
    min-width: 0;
    flex: 1;
    box-sizing: border-box;
    border: 1px solid #bbb;
    border-radius: 8px;
    padding: 10px;
    font-family: Consolas, monospace;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.12em;
    text-align: center;
    text-transform: uppercase;
  }

  button,
  .link-button {
    border: none;
    border-radius: 8px;
    background: #2d6cdf;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 14px;
  }

  button:active,
  .link-button:active {
    background: #1e4fad;
  }

  button:disabled {
    background: #aab4c5;
    cursor: default;
  }

  .secondary {
    background: #687386;
  }

  .secondary:active {
    background: #505967;
  }

  .danger {
    background: #c0392b;
  }

  .danger:active {
    background: #922b21;
  }

  .role-choice {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .role-choice button {
    flex: 1;
    padding: 18px 10px;
    font-size: 15px;
    line-height: 1.5;
  }

  .role-choice .role-desc {
    display: block;
    font-size: 11px;
    font-weight: normal;
    margin-top: 4px;
    opacity: 0.85;
  }

  .code-info {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    color: #555;
    line-height: 1.6;
  }

  .code-info.visible {
    display: block;
  }

  .code-value {
    font-family: Consolas, monospace;
    font-weight: bold;
    letter-spacing: 0.08em;
  }

  .change-link {
    margin-left: 8px;
    padding: 0;
    border: none;
    background: transparent;
    color: #2d6cdf;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }

  .change-link:active {
    background: transparent;
    color: #1e4fad;
  }

  .hint {
    margin: 8px 0 0;
    font-size: 12px;
    color: #666;
    line-height: 1.6;
  }

  .memo-area {
    display: none;
    margin-top: 14px;
  }

  .memo-area.visible {
    display: block;
  }

  .role-badge {
    font-size: 12px;
    color: #555;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    height: 50vh;
    min-height: 240px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  textarea:disabled {
    background: #f7f7f8;
    color: #222;
  }

  textarea:focus,
  #codeInput:focus {
    border-color: #2d6cdf;
    outline: 2px solid rgba(45, 108, 223, 0.18);
  }

  .under-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 5px;
    font-size: 12px;
  }

  #status {
    color: #555;
    overflow-wrap: anywhere;
  }

  #status.error {
    color: #c0392b;
    font-weight: bold;
  }

  #status.success {
    color: #237a3b;
  }

  #charCount {
    flex: none;
    color: #666;
  }

  .button-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .button-row button {
    flex: 1;
  }

  .auto-copy-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 13px;
    color: #555;
  }

  .footer-links {
    margin-top: 14px;
    font-size: 12px;
  }

  #startupError {
    display: none;
    background: #fff;
    border: 1px solid #e2b5b0;
    border-radius: 10px;
    color: #a93226;
    padding: 14px;
    line-height: 1.7;
  }

  @media (max-width: 420px) {
    .code-row,
    .button-row {
      flex-direction: column;
    }

    #codeInput {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="rev">rev3</div>

<div class="wrap">
  <h1>テキスト同期メモ</h1>

  <div id="startupError"></div>

  <main id="app">
    <section class="panel" id="codeSetup">
      <label class="code-label" for="codeInput">合言葉（6文字）</label>
      <div class="code-row">
        <input
          id="codeInput"
          type="text"
          maxlength="6"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          inputmode="text"
          placeholder="例: 7K3M2P"
        >
        <button id="useCodeBtn" type="button">この合言葉を使う</button>
      </div>
      <button id="makeCodeBtn" class="secondary" type="button">
        合言葉を作る
      </button>
      <p class="hint">
        もう片方の端末でも同じ合言葉を入力してください。I（アイ）とO（オー）は使用しません。
      </p>
    </section>

    <section class="panel" id="roleChoice" style="display:none;">
      <label class="code-label">この端末の役割</label>
      <div class="role-choice">
        <button id="roleWriterBtn" type="button">
          書く（スマホ）
          <span class="role-desc">ここで文章を打つ</span>
        </button>
        <button id="roleReaderBtn" type="button" class="secondary">
          受け取る（PC）
          <span class="role-desc">届いた文章をコピー</span>
        </button>
      </div>
      <p class="hint">
        あとから「役割を変える」で選び直せます。
      </p>
    </section>

    <section class="panel" id="codeInfo" style="display:none;">
      合言葉:
      <span id="currentCode" class="code-value"></span>
      <button id="changeCodeBtn" class="change-link" type="button">
        合言葉を変える
      </button>
      <button id="changeRoleBtn" class="change-link" type="button">
        役割を変える
      </button>
    </section>

    <section class="memo-area" id="writerArea">
      <div class="role-badge">✏️ 書く側（この端末で入力した内容が、受け取る側へ送られます）</div>
      <textarea
        id="writerText"
        placeholder="ここに文章を入力してください"
      ></textarea>

      <div class="under-text">
        <span id="writerStatus">合言葉を設定してください。</span>
        <span id="writerCharCount">0文字</span>
      </div>

      <div class="button-row">
        <button id="writerClearBtn" class="danger" type="button">
          内容を消す
        </button>
      </div>
    </section>

    <section class="memo-area" id="readerArea">
      <div class="role-badge">📥 受け取る側（書く側の内容がここに届きます）</div>
      <textarea id="readerText" readonly placeholder="まだ届いていません"></textarea>

      <div class="under-text">
        <span id="readerStatus">合言葉を設定してください。</span>
        <span id="readerCharCount">0文字</span>
      </div>

      <div class="button-row">
        <button id="copyBtn" type="button">全文コピー</button>
      </div>

      <label class="auto-copy-row">
        <input type="checkbox" id="autoCopyToggle">
        新しい内容が届いたら自動でコピーする
      </label>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "memoSyncCode";
  var ROLE_KEY = "memoRole";
  var AUTO_COPY_KEY = "memoAutoCopy";
  var CODE_ALPHABET = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  var CODE_RE = /^[0-9A-HJ-NP-Z]{6}$/;
  var SEND_DELAY_MS = 500;
  var POLL_INTERVAL_MS = 2500;

  var appEl = document.getElementById("app");
  var startupErrorEl = document.getElementById("startupError");
  var codeSetupEl = document.getElementById("codeSetup");
  var roleChoiceEl = document.getElementById("roleChoice");
  var codeInfoEl = document.getElementById("codeInfo");
  var codeInputEl = document.getElementById("codeInput");
  var useCodeBtn = document.getElementById("useCodeBtn");
  var makeCodeBtn = document.getElementById("makeCodeBtn");
  var currentCodeEl = document.getElementById("currentCode");
  var changeCodeBtn = document.getElementById("changeCodeBtn");
  var changeRoleBtn = document.getElementById("changeRoleBtn");
  var roleWriterBtn = document.getElementById("roleWriterBtn");
  var roleReaderBtn = document.getElementById("roleReaderBtn");

  var writerAreaEl = document.getElementById("writerArea");
  var writerTextEl = document.getElementById("writerText");
  var writerStatusEl = document.getElementById("writerStatus");
  var writerCountEl = document.getElementById("writerCharCount");
  var writerClearBtn = document.getElementById("writerClearBtn");

  var readerAreaEl = document.getElementById("readerArea");
  var readerTextEl = document.getElementById("readerText");
  var readerStatusEl = document.getElementById("readerStatus");
  var readerCountEl = document.getElementById("readerCharCount");
  var copyBtn = document.getElementById("copyBtn");
  var autoCopyToggle = document.getElementById("autoCopyToggle");

  var currentCode = "";
  var currentRole = "";
  var lastUpdatedAt = null;
  var lastSentText = null;
  var sendTimer = null;
  var pollTimer = null;
  var sending = false;
  var sendAgain = false;
  var requestGeneration = 0;

  function formatTime(date) {
    function twoDigits(value) {
      return String(value).padStart(2, "0");
    }

    return (
      twoDigits(date.getHours()) +
      ":" +
      twoDigits(date.getMinutes()) +
      ":" +
      twoDigits(date.getSeconds())
    );
  }

  function setWriterStatus(message, kind) {
    writerStatusEl.textContent = message;
    writerStatusEl.className = kind || "";
  }

  function setReaderStatus(message, kind) {
    readerStatusEl.textContent = message;
    readerStatusEl.className = kind || "";
  }

  function normalizeCode(value) {
    return String(value || "").trim().toUpperCase();
  }

  function isValidCode(value) {
    return CODE_RE.test(value);
  }

  function apiUrl(code) {
    return "/api/memo/" + encodeURIComponent(code);
  }

  function loadAutoCopyPref() {
    try {
      return localStorage.getItem(AUTO_COPY_KEY) !== "false";
    } catch (error) {
      return true;
    }
  }

  function saveAutoCopyPref(enabled) {
    try {
      localStorage.setItem(AUTO_COPY_KEY, enabled ? "true" : "false");
    } catch (error) {
      // 保存できなくても、この場での切り替えは続行する。
    }
  }

  async function readJsonResponse(response) {
    var data;

    try {
      data = await response.json();
    } catch (error) {
      throw new Error("サーバーから正しい応答を受け取れませんでした。");
    }

    if (!response.ok || !data || data.ok !== true) {
      throw new Error(
        data && data.message
          ? data.message
          : "サーバーとの通信に失敗しました。",
      );
    }

    return data;
  }

  async function requestJson(url, options) {
    var response;

    try {
      response = await fetch(url, options);
    } catch (error) {
      throw new Error(
        "通信できません。この場所のネットワークで止められている可能性があります。",
      );
    }

    return readJsonResponse(response);
  }

  function saveCode(code) {
    try {
      localStorage.setItem(STORAGE_KEY, code);
    } catch (error) {
      // 保存できなくても、この場での利用は続行する。
    }
  }

  function removeSavedCode() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      // 保存領域が利用できない場合も、画面上の切り替えは続行する。
    }
  }

  function loadSavedCode() {
    try {
      return normalizeCode(localStorage.getItem(STORAGE_KEY));
    } catch (error) {
      return "";
    }
  }

  function saveRole(role) {
    try {
      localStorage.setItem(ROLE_KEY, role);
    } catch (error) {
      // 保存できなくても、この場での利用は続行する。
    }
  }

  function removeSavedRole() {
    try {
      localStorage.removeItem(ROLE_KEY);
    } catch (error) {
      // 保存領域が利用できない場合も、画面上の切り替えは続行する。
    }
  }

  function loadSavedRole() {
    try {
      var role = localStorage.getItem(ROLE_KEY);
      return role === "writer" || role === "reader" ? role : "";
    } catch (error) {
      return "";
    }
  }

  function generateCode() {
    var result = "";
    var random = new Uint8Array(1);
    var limit = Math.floor(256 / CODE_ALPHABET.length) *
      CODE_ALPHABET.length;

    while (result.length < 6) {
      crypto.getRandomValues(random);

      if (random[0] < limit) {
        result += CODE_ALPHABET.charAt(
          random[0] % CODE_ALPHABET.length,
        );
      }
    }

    return result;
  }

  function stopPolling() {
    if (pollTimer !== null) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function startPolling() {
    stopPolling();

    if (
      currentRole === "reader" &&
      document.visibilityState === "visible" &&
      currentCode
    ) {
      pollTimer = setInterval(function () {
        receiveMemo(false);
      }, POLL_INTERVAL_MS);
    }
  }

  function cancelPendingSend() {
    if (sendTimer !== null) {
      clearTimeout(sendTimer);
      sendTimer = null;
    }

    sendAgain = false;
  }

  function showCurrentCode() {
    currentCodeEl.textContent = currentCode;
    codeSetupEl.style.display = "none";
    codeInfoEl.style.display = "block";
  }

  function showCodeSetup() {
    codeInfoEl.style.display = "none";
    roleChoiceEl.style.display = "none";
    writerAreaEl.className = "memo-area";
    readerAreaEl.className = "memo-area";
    codeSetupEl.style.display = "block";
  }

  function showRoleChoice() {
    codeInfoEl.style.display = "block";
    roleChoiceEl.style.display = "block";
    writerAreaEl.className = "memo-area";
    readerAreaEl.className = "memo-area";
  }

  function showWriterUI() {
    roleChoiceEl.style.display = "none";
    writerAreaEl.className = "memo-area visible";
    readerAreaEl.className = "memo-area";
  }

  function showReaderUI() {
    roleChoiceEl.style.display = "none";
    readerAreaEl.className = "memo-area visible";
    writerAreaEl.className = "memo-area";
  }

  async function setCode(code) {
    var normalized = normalizeCode(code);

    if (!isValidCode(normalized)) {
      setWriterStatus(
        "合言葉は、IとOを除く半角英数字6文字で入力してください。",
        "error",
      );
      codeInputEl.focus();
      codeInputEl.select();
      return;
    }

    requestGeneration += 1;
    cancelPendingSend();
    stopPolling();

    currentCode = normalized;
    currentRole = "";
    lastUpdatedAt = null;
    lastSentText = null;

    codeInputEl.value = normalized;
    saveCode(normalized);
    showCurrentCode();

    var savedRole = loadSavedRole();

    if (savedRole) {
      applyRole(savedRole);
    } else {
      showRoleChoice();
    }
  }

  function applyRole(role) {
    currentRole = role;
    saveRole(role);
    lastUpdatedAt = null;
    lastSentText = null;

    if (role === "writer") {
      writerTextEl.value = "";
      writerCountEl.textContent = "0文字";
      showWriterUI();
      setWriterStatus("サーバーから読み込んでいます。");
      loadInitialForWriter();
    } else {
      readerTextEl.value = "";
      readerCountEl.textContent = "0文字";
      autoCopyToggle.checked = loadAutoCopyPref();
      showReaderUI();
      setReaderStatus("サーバーから読み込んでいます。");
      receiveMemo(true);
      startPolling();
    }
  }

  async function loadInitialForWriter() {
    var codeAtStart = currentCode;
    var generationAtStart = requestGeneration;

    try {
      var data = await requestJson(apiUrl(codeAtStart), {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept": "application/json",
        },
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      writerTextEl.value = typeof data.text === "string" ? data.text : "";
      writerCountEl.textContent = writerTextEl.value.length + "文字";
      lastUpdatedAt = data.updatedAt || null;
      lastSentText = writerTextEl.value;
      setWriterStatus("読み込みました。前回の続きから書けます。", "success");
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setWriterStatus(error.message, "error");
      }
    }
  }

  async function receiveMemo(initialLoad) {
    if (
      currentRole !== "reader" ||
      !currentCode ||
      document.visibilityState !== "visible"
    ) {
      return;
    }

    var codeAtStart = currentCode;
    var generationAtStart = requestGeneration;

    try {
      var data = await requestJson(apiUrl(codeAtStart), {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept": "application/json",
        },
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      if (data.updatedAt === lastUpdatedAt) {
        if (initialLoad) {
          setReaderStatus("読み込みました。", "success");
        }
        return;
      }

      readerTextEl.value = typeof data.text === "string" ? data.text : "";
      readerCountEl.textContent = readerTextEl.value.length + "文字";
      lastUpdatedAt = data.updatedAt || null;

      if (initialLoad) {
        setReaderStatus("読み込みました。", "success");
      } else if (autoCopyToggle.checked && readerTextEl.value) {
        copyMemo(true);
      } else {
        setReaderStatus(
          "新しい内容を受信しました " + formatTime(new Date()),
          "success",
        );
      }
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setReaderStatus(error.message, "error");
      }
    }
  }

  function scheduleSend() {
    if (currentRole !== "writer" || !currentCode) {
      return;
    }

    if (sendTimer !== null) {
      clearTimeout(sendTimer);
    }

    sendTimer = setTimeout(function () {
      sendTimer = null;
      sendMemo();
    }, SEND_DELAY_MS);
  }

  async function sendMemo() {
    if (currentRole !== "writer" || !currentCode) {
      return;
    }

    if (sending) {
      sendAgain = true;
      return;
    }

    var textToSend = writerTextEl.value;

    if (textToSend === lastSentText) {
      return;
    }

    var codeAtStart = currentCode;
    var generationAtStart = requestGeneration;

    sending = true;
    sendAgain = false;
    setWriterStatus("送信中...");

    try {
      var data = await requestJson(apiUrl(codeAtStart), {
        method: "PUT",
        headers: {
          "Accept": "application/json",
          "Content-Type": "text/plain; charset=utf-8",
        },
        body: textToSend,
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      lastSentText = textToSend;
      lastUpdatedAt = data.updatedAt || null;
      setWriterStatus(
        "保存済み " + formatTime(new Date()),
        "success",
      );
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setWriterStatus(error.message, "error");
      }
    } finally {
      sending = false;

      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode &&
        (sendAgain || writerTextEl.value !== lastSentText)
      ) {
        sendAgain = false;
        scheduleSend();
      }
    }
  }

  async function copyMemo(isAuto) {
    var text = readerTextEl.value;

    try {
      if (
        navigator.clipboard &&
        typeof navigator.clipboard.writeText === "function"
      ) {
        await navigator.clipboard.writeText(text);
      } else {
        throw new Error("Clipboard APIを利用できません。");
      }

      setReaderStatus(
        (isAuto ? "自動でコピーしました " : "コピーしました ") +
          formatTime(new Date()),
        "success",
      );
      return;
    } catch (error) {
      if (isAuto) {
        setReaderStatus(
          "自動コピーに失敗しました。「全文コピー」を押してください。",
          "error",
        );
        return;
      }

      var start = readerTextEl.selectionStart;
      var end = readerTextEl.selectionEnd;

      try {
        readerTextEl.focus();
        readerTextEl.select();

        if (!document.execCommand("copy")) {
          throw new Error("コピーに失敗しました。");
        }

        readerTextEl.setSelectionRange(start, end);
        setReaderStatus("コピーしました。", "success");
      } catch (fallbackError) {
        setReaderStatus(
          "コピーできませんでした。文章を選択してコピーしてください。",
          "error",
        );
      }
    }
  }

  async function clearMemo() {
    if (currentRole !== "writer" || !currentCode) {
      return;
    }

    if (!window.confirm(
      "この内容をすべて消します。よろしいですか？",
    )) {
      return;
    }

    requestGeneration += 1;
    cancelPendingSend();

    var generationAtStart = requestGeneration;
    var codeAtStart = currentCode;

    setWriterStatus("削除中...");

    try {
      await requestJson(apiUrl(codeAtStart), {
        method: "DELETE",
        headers: {
          "Accept": "application/json",
        },
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      writerTextEl.value = "";
      writerCountEl.textContent = "0文字";
      lastSentText = "";
      lastUpdatedAt = null;
      setWriterStatus("内容を消しました。", "success");
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setWriterStatus(error.message, "error");
      }
    }
  }

  function changeCode() {
    requestGeneration += 1;
    cancelPendingSend();
    stopPolling();
    removeSavedCode();
    removeSavedRole();

    currentCode = "";
    currentRole = "";
    lastUpdatedAt = null;
    lastSentText = null;
    showCodeSetup();

    codeInputEl.value = "";
    setWriterStatus("新しい合言葉を入力してください。");
    setReaderStatus("新しい合言葉を入力してください。");
    codeInputEl.focus();
  }

  function changeRole() {
    requestGeneration += 1;
    cancelPendingSend();
    stopPolling();
    removeSavedRole();

    currentRole = "";
    lastUpdatedAt = null;
    lastSentText = null;
    showRoleChoice();
  }

  codeInputEl.addEventListener("input", function () {
    var value = normalizeCode(codeInputEl.value);
    codeInputEl.value = value.slice(0, 6);
  });

  codeInputEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      setCode(codeInputEl.value);
    }
  });

  useCodeBtn.addEventListener("click", function () {
    setCode(codeInputEl.value);
  });

  makeCodeBtn.addEventListener("click", function () {
    var code;

    try {
      code = generateCode();
    } catch (error) {
      setWriterStatus(
        "このブラウザでは安全な合言葉を作れませんでした。",
        "error",
      );
      return;
    }

    codeInputEl.value = code;
    setCode(code);
  });

  changeCodeBtn.addEventListener("click", changeCode);
  changeRoleBtn.addEventListener("click", changeRole);

  roleWriterBtn.addEventListener("click", function () {
    applyRole("writer");
  });

  roleReaderBtn.addEventListener("click", function () {
    applyRole("reader");
  });

  writerTextEl.addEventListener("input", function () {
    writerCountEl.textContent = writerTextEl.value.length + "文字";
    scheduleSend();
  });

  writerClearBtn.addEventListener("click", clearMemo);

  copyBtn.addEventListener("click", function () {
    copyMemo(false);
  });

  autoCopyToggle.addEventListener("change", function () {
    saveAutoCopyPref(autoCopyToggle.checked);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      receiveMemo(false);
      startPolling();
    } else {
      stopPolling();
    }
  });

  window.addEventListener("beforeunload", function () {
    cancelPendingSend();
    stopPolling();
  });

  function initialize() {
    if (location.protocol !== "http:" && location.protocol !== "https:") {
      appEl.style.display = "none";
      startupErrorEl.style.display = "block";
      startupErrorEl.textContent =
        "このページは公開サイト（silver-computing-machine-7ql.pages.dev）から開いてください。";
      return;
    }

    var savedCode = loadSavedCode();

    if (isValidCode(savedCode)) {
      codeInputEl.value = savedCode;
      setCode(savedCode);
    } else {
      showCodeSetup();
      setWriterStatus("合言葉を設定してください。");
      setReaderStatus("合言葉を設定してください。");
      codeInputEl.focus();
    }
  }

  initialize();
})();
</script>
</body>
</html>
