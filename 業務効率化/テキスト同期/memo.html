<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テキスト同期メモ</title>
<style>
  body {
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }

  .rev {
    position: fixed;
    top: 6px;
    right: 10px;
    font-size: 11px;
    color: #999;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 20px;
    margin: 8px 0 16px;
  }

  .panel {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  }

  .code-label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
  }

  .code-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  #codeInput {
    min-width: 0;
    flex: 1;
    box-sizing: border-box;
    border: 1px solid #bbb;
    border-radius: 8px;
    padding: 10px;
    font-family: Consolas, monospace;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.12em;
    text-align: center;
    text-transform: uppercase;
  }

  button,
  .link-button {
    border: none;
    border-radius: 8px;
    background: #2d6cdf;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 14px;
  }

  button:active,
  .link-button:active {
    background: #1e4fad;
  }

  button:disabled {
    background: #aab4c5;
    cursor: default;
  }

  .secondary {
    background: #687386;
  }

  .secondary:active {
    background: #505967;
  }

  .danger {
    background: #c0392b;
  }

  .danger:active {
    background: #922b21;
  }

  .code-info {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    color: #555;
    line-height: 1.6;
  }

  .code-info.visible {
    display: block;
  }

  .code-value {
    font-family: Consolas, monospace;
    font-weight: bold;
    letter-spacing: 0.08em;
  }

  .change-link {
    margin-left: 8px;
    padding: 0;
    border: none;
    background: transparent;
    color: #2d6cdf;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }

  .change-link:active {
    background: transparent;
    color: #1e4fad;
  }

  .hint {
    margin: 8px 0 0;
    font-size: 12px;
    color: #666;
    line-height: 1.6;
  }

  .memo-area {
    margin-top: 14px;
  }

  textarea {
    width: 100%;
    height: 50vh;
    min-height: 240px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 10px;
    resize: vertical;
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  textarea:focus,
  #codeInput:focus {
    border-color: #2d6cdf;
    outline: 2px solid rgba(45, 108, 223, 0.18);
  }

  .under-text {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 5px;
    font-size: 12px;
  }

  #status {
    color: #555;
    overflow-wrap: anywhere;
  }

  #status.error {
    color: #c0392b;
    font-weight: bold;
  }

  #status.success {
    color: #237a3b;
  }

  #charCount {
    flex: none;
    color: #666;
  }

  .button-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .button-row button {
    flex: 1;
  }

  #startupError {
    display: none;
    background: #fff;
    border: 1px solid #e2b5b0;
    border-radius: 10px;
    color: #a93226;
    padding: 14px;
    line-height: 1.7;
  }

  @media (max-width: 420px) {
    .code-row,
    .button-row {
      flex-direction: column;
    }

    #codeInput {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="rev">rev1</div>

<div class="wrap">
  <h1>テキスト同期メモ</h1>

  <div id="startupError"></div>

  <main id="app">
    <section class="panel">
      <div id="codeSetup">
        <label class="code-label" for="codeInput">合言葉（6文字）</label>
        <div class="code-row">
          <input
            id="codeInput"
            type="text"
            maxlength="6"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
            placeholder="例: 7K3M2P"
          >
          <button id="useCodeBtn" type="button">この合言葉を使う</button>
        </div>
        <button id="makeCodeBtn" class="secondary" type="button">
          合言葉を作る
        </button>
        <p class="hint">
          もう片方の端末でも同じ合言葉を入力してください。I（アイ）とO（オー）は使用しません。
        </p>
      </div>

      <div id="codeInfo" class="code-info">
        合言葉:
        <span id="currentCode" class="code-value"></span>
        <button id="changeCodeBtn" class="change-link" type="button">
          変える
        </button>
      </div>
    </section>

    <section class="memo-area">
      <textarea
        id="memoText"
        placeholder="ここに文章を入力してください"
        disabled
      ></textarea>

      <div class="under-text">
        <span id="status">合言葉を設定してください。</span>
        <span id="charCount">0文字</span>
      </div>

      <div class="button-row">
        <button id="copyBtn" type="button" disabled>全文コピー</button>
        <button id="clearBtn" class="danger" type="button" disabled>
          内容を消す
        </button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "memoSyncCode";
  var CODE_ALPHABET = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  var CODE_RE = /^[0-9A-HJ-NP-Z]{6}$/;
  var SEND_DELAY_MS = 500;
  var POLL_INTERVAL_MS = 2500;

  var appEl = document.getElementById("app");
  var startupErrorEl = document.getElementById("startupError");
  var codeSetupEl = document.getElementById("codeSetup");
  var codeInfoEl = document.getElementById("codeInfo");
  var codeInputEl = document.getElementById("codeInput");
  var useCodeBtn = document.getElementById("useCodeBtn");
  var makeCodeBtn = document.getElementById("makeCodeBtn");
  var currentCodeEl = document.getElementById("currentCode");
  var changeCodeBtn = document.getElementById("changeCodeBtn");
  var memoEl = document.getElementById("memoText");
  var statusEl = document.getElementById("status");
  var countEl = document.getElementById("charCount");
  var copyBtn = document.getElementById("copyBtn");
  var clearBtn = document.getElementById("clearBtn");

  var currentCode = "";
  var lastUpdatedAt = null;
  var lastSentText = null;
  var sendTimer = null;
  var pollTimer = null;
  var sending = false;
  var sendAgain = false;
  var requestGeneration = 0;

  function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = kind || "";
  }

  function formatTime(date) {
    function twoDigits(value) {
      return String(value).padStart(2, "0");
    }

    return (
      twoDigits(date.getHours()) +
      ":" +
      twoDigits(date.getMinutes()) +
      ":" +
      twoDigits(date.getSeconds())
    );
  }

  function normalizeCode(value) {
    return String(value || "").trim().toUpperCase();
  }

  function isValidCode(value) {
    return CODE_RE.test(value);
  }

  function apiUrl(code) {
    return "/api/memo/" + encodeURIComponent(code);
  }

  function updateCount() {
    countEl.textContent = memoEl.value.length + "文字";
  }

  function enableMemo(enabled) {
    memoEl.disabled = !enabled;
    copyBtn.disabled = !enabled;
    clearBtn.disabled = !enabled;
  }

  async function readJsonResponse(response) {
    var data;

    try {
      data = await response.json();
    } catch (error) {
      throw new Error("サーバーから正しい応答を受け取れませんでした。");
    }

    if (!response.ok || !data || data.ok !== true) {
      throw new Error(
        data && data.message
          ? data.message
          : "サーバーとの通信に失敗しました。",
      );
    }

    return data;
  }

  async function requestJson(url, options) {
    var response;

    try {
      response = await fetch(url, options);
    } catch (error) {
      throw new Error(
        "通信できません。この場所のネットワークで止められている可能性があります。",
      );
    }

    return readJsonResponse(response);
  }

  function saveCode(code) {
    try {
      localStorage.setItem(STORAGE_KEY, code);
    } catch (error) {
      setStatus(
        "合言葉をブラウザに保存できませんでした。この画面を閉じる前に控えてください。",
        "error",
      );
    }
  }

  function removeSavedCode() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      // 保存領域が利用できない場合も、画面上の切り替えは続行する。
    }
  }

  function loadSavedCode() {
    try {
      return normalizeCode(localStorage.getItem(STORAGE_KEY));
    } catch (error) {
      return "";
    }
  }

  function generateCode() {
    var result = "";
    var random = new Uint8Array(1);
    var limit = Math.floor(256 / CODE_ALPHABET.length) *
      CODE_ALPHABET.length;

    while (result.length < 6) {
      crypto.getRandomValues(random);

      if (random[0] < limit) {
        result += CODE_ALPHABET.charAt(
          random[0] % CODE_ALPHABET.length,
        );
      }
    }

    return result;
  }

  function stopPolling() {
    if (pollTimer !== null) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function startPolling() {
    stopPolling();

    if (document.visibilityState === "visible" && currentCode) {
      pollTimer = setInterval(function () {
        receiveMemo(false);
      }, POLL_INTERVAL_MS);
    }
  }

  function cancelPendingSend() {
    if (sendTimer !== null) {
      clearTimeout(sendTimer);
      sendTimer = null;
    }

    sendAgain = false;
  }

  function showCurrentCode() {
    currentCodeEl.textContent = currentCode;
    codeSetupEl.style.display = "none";
    codeInfoEl.className = "code-info visible";
  }

  function showCodeSetup() {
    codeInfoEl.className = "code-info";
    codeSetupEl.style.display = "block";
  }

  async function setCode(code) {
    var normalized = normalizeCode(code);

    if (!isValidCode(normalized)) {
      setStatus(
        "合言葉は、IとOを除く半角英数字6文字で入力してください。",
        "error",
      );
      codeInputEl.focus();
      codeInputEl.select();
      return;
    }

    requestGeneration += 1;
    cancelPendingSend();
    stopPolling();

    currentCode = normalized;
    lastUpdatedAt = null;
    lastSentText = null;
    memoEl.value = "";
    updateCount();

    codeInputEl.value = normalized;
    saveCode(normalized);
    showCurrentCode();
    enableMemo(true);
    setStatus("サーバーから読み込んでいます。");

    await receiveMemo(true);
    startPolling();
  }

  async function receiveMemo(initialLoad) {
    if (!currentCode || document.visibilityState !== "visible") {
      return;
    }

    var codeAtStart = currentCode;
    var generationAtStart = requestGeneration;

    try {
      var data = await requestJson(apiUrl(codeAtStart), {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept": "application/json",
        },
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      if (data.updatedAt === lastUpdatedAt) {
        if (initialLoad) {
          lastSentText = memoEl.value;
          setStatus("読み込みました。", "success");
        }
        return;
      }

      if (document.activeElement === memoEl) {
        if (initialLoad) {
          setStatus(
            "編集中のため、サーバーの内容は上書きしていません。",
          );
        }
        return;
      }

      memoEl.value = typeof data.text === "string" ? data.text : "";
      lastUpdatedAt = data.updatedAt || null;
      lastSentText = memoEl.value;
      updateCount();

      if (initialLoad) {
        setStatus("読み込みました。", "success");
      } else {
        setStatus(
          "ほかの端末の内容を受信しました " + formatTime(new Date()),
          "success",
        );
      }
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setStatus(error.message, "error");
      }
    }
  }

  function scheduleSend() {
    if (!currentCode) {
      return;
    }

    if (sendTimer !== null) {
      clearTimeout(sendTimer);
    }

    sendTimer = setTimeout(function () {
      sendTimer = null;
      sendMemo();
    }, SEND_DELAY_MS);
  }

  async function sendMemo() {
    if (!currentCode) {
      return;
    }

    if (sending) {
      sendAgain = true;
      return;
    }

    var textToSend = memoEl.value;

    if (textToSend === lastSentText) {
      return;
    }

    var codeAtStart = currentCode;
    var generationAtStart = requestGeneration;

    sending = true;
    sendAgain = false;
    setStatus("送信中...");

    try {
      var data = await requestJson(apiUrl(codeAtStart), {
        method: "PUT",
        headers: {
          "Accept": "application/json",
          "Content-Type": "text/plain; charset=utf-8",
        },
        body: textToSend,
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      lastSentText = textToSend;
      lastUpdatedAt = data.updatedAt || null;
      setStatus(
        "保存済み " + formatTime(new Date()),
        "success",
      );
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setStatus(error.message, "error");
      }
    } finally {
      sending = false;

      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode &&
        (sendAgain || memoEl.value !== lastSentText)
      ) {
        sendAgain = false;
        scheduleSend();
      }
    }
  }

  async function copyMemo() {
    var text = memoEl.value;

    try {
      if (
        navigator.clipboard &&
        typeof navigator.clipboard.writeText === "function"
      ) {
        await navigator.clipboard.writeText(text);
      } else {
        throw new Error("Clipboard APIを利用できません。");
      }

      setStatus("コピーしました。", "success");
      return;
    } catch (error) {
      var start = memoEl.selectionStart;
      var end = memoEl.selectionEnd;

      try {
        memoEl.focus();
        memoEl.select();

        if (!document.execCommand("copy")) {
          throw new Error("コピーに失敗しました。");
        }

        memoEl.setSelectionRange(start, end);
        setStatus("コピーしました。", "success");
      } catch (fallbackError) {
        setStatus(
          "コピーできませんでした。文章を選択してコピーしてください。",
          "error",
        );
      }
    }
  }

  async function clearMemo() {
    if (!currentCode) {
      return;
    }

    if (!window.confirm(
      "サーバーとこの画面の内容をすべて消します。よろしいですか？",
    )) {
      return;
    }

    requestGeneration += 1;
    cancelPendingSend();

    var generationAtStart = requestGeneration;
    var codeAtStart = currentCode;

    setStatus("削除中...");

    try {
      await requestJson(apiUrl(codeAtStart), {
        method: "DELETE",
        headers: {
          "Accept": "application/json",
        },
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      memoEl.value = "";
      lastSentText = "";
      lastUpdatedAt = null;
      updateCount();
      setStatus("内容を消しました。", "success");
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setStatus(error.message, "error");
      }
    }
  }

  function changeCode() {
    requestGeneration += 1;
    cancelPendingSend();
    stopPolling();
    removeSavedCode();

    currentCode = "";
    lastUpdatedAt = null;
    lastSentText = null;
    memoEl.value = "";
    updateCount();
    enableMemo(false);
    showCodeSetup();

    codeInputEl.value = "";
    setStatus("新しい合言葉を入力してください。");
    codeInputEl.focus();
  }

  codeInputEl.addEventListener("input", function () {
    var value = normalizeCode(codeInputEl.value);
    codeInputEl.value = value.slice(0, 6);
  });

  codeInputEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      setCode(codeInputEl.value);
    }
  });

  useCodeBtn.addEventListener("click", function () {
    setCode(codeInputEl.value);
  });

  makeCodeBtn.addEventListener("click", function () {
    var code;

    try {
      code = generateCode();
    } catch (error) {
      setStatus(
        "このブラウザでは安全な合言葉を作れませんでした。",
        "error",
      );
      return;
    }

    codeInputEl.value = code;
    setCode(code);
  });

  changeCodeBtn.addEventListener("click", changeCode);

  memoEl.addEventListener("input", function () {
    updateCount();
    scheduleSend();
  });

  memoEl.addEventListener("blur", function () {
    receiveMemo(false);
  });

  copyBtn.addEventListener("click", copyMemo);
  clearBtn.addEventListener("click", clearMemo);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      receiveMemo(false);
      startPolling();
    } else {
      stopPolling();
    }
  });

  window.addEventListener("beforeunload", function () {
    cancelPendingSend();
    stopPolling();
  });

  function initialize() {
    updateCount();

    if (location.protocol !== "http:" && location.protocol !== "https:") {
      appEl.style.display = "none";
      startupErrorEl.style.display = "block";
      startupErrorEl.textContent =
        "このページは公開サイト（silver-computing-machine-7ql.pages.dev）から開いてください。";
      return;
    }

    var savedCode = loadSavedCode();

    if (isValidCode(savedCode)) {
      codeInputEl.value = savedCode;
      setCode(savedCode);
    } else {
      showCodeSetup();
      enableMemo(false);
      setStatus("合言葉を設定してください。");
      codeInputEl.focus();
    }
  }

  initialize();
})();
</script>
</body>
</html>
