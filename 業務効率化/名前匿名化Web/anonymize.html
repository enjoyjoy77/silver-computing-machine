<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名前匿名化</title>
<style>
  :root {
    --ink: #1f1d1a; --paper: #f7f4ed; --muted: #8b8275;
    --line: #d4ccbe; --card: #fff; --accent: #2a6b4a; --warn: #b04a2e;
    --hl-bg: #dcebf7; --hl-ink: #2a5a8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e4da; --paper: #181613; --muted: #97907f;
      --line: #3e382e; --card: #211e18; --accent: #6cb893; --warn: #d97a55;
      --hl-bg: #253a4e; --hl-ink: #9cc4e8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem;
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
    font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 0.2rem; }
  .sub { color: var(--muted); font-size: 0.78rem; margin: 0 0 1rem; }
  label.head { display: block; font-weight: 600; font-size: 0.85rem; margin: 0.9rem 0 0.3rem; }
  textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); padding: 0.6rem;
    font-size: 16px; line-height: 1.6; resize: vertical;
  }
  #inputText { min-height: 9rem; }
  #nameList { min-height: 3.5rem; }
  .hint { font-size: 0.72rem; color: var(--muted); margin: 0.2rem 0 0; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.7rem; }
  .fileload { display:inline-flex; align-items:center; gap:0.3rem; cursor:pointer; border:1px solid var(--line); border-radius:8px; padding:0.4rem 0.8rem; background:var(--card); font-size:0.85rem; white-space:nowrap; }
  .fileload:hover { border-color: var(--accent); }
  /* ドラッグ＆ドロップ中の見た目 */
  body.dragover::after {
    content: "ここに離すと読み込みます"; position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); color: #fff; font-size: 1.1rem; font-weight: 600;
    border: 4px dashed var(--accent); pointer-events: none;
  }
  button {
    border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--ink); padding: 0.55rem 0.9rem; font-size: 0.9rem; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; padding: 0.7rem 1.2rem; }
  button:disabled { opacity: 0.45; cursor: default; }
  .chk { font-size: 0.82rem; display: flex; align-items: center; gap: 0.35rem; }
  details { margin-top: 0.9rem; }
  summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  #patterns { margin-top: 0.5rem; display: grid; gap: 0.15rem; max-height: 14rem; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0.5rem; }
  #patterns label { font-size: 0.82rem; display: flex; gap: 0.4rem; align-items: center; }
  #patterns .tp { color: var(--muted); font-size: 0.72rem; margin-left: auto; }
  #result {
    margin-top: 0.4rem; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); padding: 0.7rem; min-height: 5rem;
    max-height: 55vh; overflow: auto; resize: vertical;
    white-space: pre-wrap; word-break: break-word; font-size: 0.92rem;
  }
  #result b.lb { background: var(--hl-bg); color: var(--hl-ink); border-radius: 4px; padding: 0 0.25em; }
  #stats { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-left: 0.4rem; }
  table { border-collapse: collapse; margin-top: 0.5rem; font-size: 0.82rem; width: 100%; max-width: 24rem; }
  th, td { border: 1px solid var(--line); padding: 0.25rem 0.6rem; text-align: left; }
  th { background: var(--card); }
  .warnnote { font-size: 0.74rem; color: var(--warn); margin-top: 0.3rem; }
  #mapArea { margin-top: 0.6rem; max-height: 40vh; overflow: auto; }
  #suspectsBox { margin-top: 0.7rem; max-height: 40vh; overflow: auto; }
  #suspectsBox .hd { font-weight:600; font-size:0.84rem; color:var(--warn); }
  #suspectsBox .note { font-size:0.72rem; color:var(--muted); margin:0.15rem 0 0.4rem; }
  .suspect { display:inline-flex; align-items:center; gap:0.3rem; margin:0.15rem; padding:0.2rem 0.5rem; border:1px solid var(--warn); border-radius:999px; font-size:0.82rem; background:var(--card); }
  .suspect .w { font-weight:700; }
  .suspect .cx { color:var(--muted); font-size:0.7rem; }
  .suspect button { border:none; background:var(--accent); color:#fff; border-radius:999px; font-size:0.7rem; padding:0.12rem 0.55rem; cursor:pointer; }
  .toast {
    position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); border-radius: 999px;
    padding: 0.5rem 1.1rem; font-size: 0.82rem; opacity: 0; transition: opacity 0.25s; pointer-events: none;
    max-width: 92vw;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🙈 名前匿名化</h1>
  <p class="sub">文章やExcel・Wordの実名を【A】【B】に置き換え。人名辞書内蔵で自動検出、すべて端末内で処理（送信されません）。<br><span style="opacity:.6">rev 2026-07-26f 現代名770語＋呼び捨て検出＋意地悪テスト通過</span></p>

  <label class="head" for="inputText">📝 テキスト（ここに貼る）</label>
  <textarea id="inputText" placeholder="匿名化したい文章を貼り付けてください（またはWord/テキストを読み込む）"></textarea>

  <div class="row" style="margin-top:0.4rem">
    <label class="fileload">📄 ファイルを読み込む（Excel .xlsx／Word .docx・.doc／.csv／.txt・複数可・この画面にドラッグ＆ドロップでもOK）
      <input type="file" id="fileInput" accept=".xlsx,.xlsm,.docx,.doc,.csv,.tsv,.txt,.text" multiple hidden>
    </label>
    <span id="fileMsg" class="hint" style="margin:0"></span>
  </div>

  <div class="row">
    <button class="primary" id="execBtn">▶ 匿名化を実行！</button>
    <label class="chk"><input type="checkbox" id="autoDetect" checked> 自動で人名を探す（辞書 約2.9万語＋現代の名前）</label>
  </div>

  <div class="row">
    <label class="chk"><input type="checkbox" id="colDetect" checked> 表の「生徒名」「記入者」などの列は、辞書に無くても丸ごと伏せる</label>
    <span id="colMsg" class="hint" style="margin:0"></span>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="strictGiven" checked> 下の名前だけの呼び捨て（「陽菜が」「さくらは」）も伏せる</label>
  </div>
  <div class="row">
    <label class="chk" style="gap:.4rem">名前の列を手で指定（表の左から何列目か。例: 1,2）
      <input type="text" id="colManual" placeholder="空欄でよい" style="width:8rem;padding:.25rem .4rem">
    </label>
  </div>

  <details id="nameBox">
    <summary>👤 自分の名前リスト（自動で見つからない名前だけ・端末に記憶されます）</summary>
    <textarea id="nameList" placeholder="1行に1人。「姓 名」または「姓」だけ"></textarea>
    <p class="hint">ここに書いた名前はこの端末のブラウザにだけ保存されます。</p>
  </details>

  <details id="patBox">
    <summary>🔤 置換パターン（名前でないものはチェックを外す → もう一度実行）</summary>
    <div id="patterns"></div>
  </details>

  <label class="head">✨ 結果 <span id="stats"></span></label>
  <div class="row">
    <button id="copyBody" disabled>📋 本文コピー（実名なし）</button>
    <button id="copyMap" disabled>🔑 対応表コピー（実名入り）</button>
    <button id="saveBtn" disabled>💾 保存</button>
  </div>
  <p class="warnnote">⚠ 対応表には実名が入ります。AIやチャットには「本文コピー」の方を貼ってください。</p>
  <div id="result"></div>

  <div id="mapArea"></div>

  <div id="suspectsBox"></div>
</div>
<div class="toast" id="toast"></div>

          for (let j = i + 1; j < cells.length; j++) {
            const v = cells[j].trim();
            if (!v) continue;
            if (isColHdr(v, COL_NAME_HDR) || isColHdr(v, COL_OTHER_HDR)) break;
            // 行ラベル型は右どなりが短い名前のときだけ。見出しの補足（例「連絡(体調不良など)」）を拾わない
            if (v.length <= 6 && !/[（()）]/.test(v)) addName(v);
            break;
          }
        }
        cols = hdrCols;                    // 以降の行は、この列を名前の列とみなす
        continue;
      }
      if (otherHdr) { cols = null; continue; }   // 別の表が始まった＝いったん解除
      const use = manual.length ? manual : cols;
      if (!use) continue;
      for (const i of use) push(cells[i] || "");
    }
    return { names: out, headers: [...usedHdr] };
  }

  // ---- 単語分割＋「漢字のかたまり」解析による自動検出（v5）----
  const normLatin = s => (s||"").replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const OLD2NEW = {"髙":"高","﨑":"崎","嵜":"崎","邊":"辺","邉":"辺","齋":"斎","齊":"斉","澤":"沢","嶋":"島","嶌":"島","檜":"桧","德":"徳","惠":"恵","冨":"富","廣":"広","濱":"浜","濵":"浜","栁":"柳","渕":"淵","曾":"曽","眞":"真","桒":"桑","龜":"亀","瀨":"瀬","雙":"双"};
  const normOld = s => (s||"").replace(/[髙﨑嵜邊邉齋齊澤嶋嶌檜德惠冨廣濱濵栁渕曾眞桒龜瀨雙]/g, c => OLD2NEW[c]||c);
  const NEW2VAR = {"高":"高髙","崎":"崎﨑嵜","辺":"辺邊邉","斎":"斎齋","斉":"斉齊","沢":"沢澤","島":"島嶋嶌","桧":"桧檜","徳":"徳德","恵":"恵惠","富":"富冨","広":"広廣","浜":"浜濱濵","柳":"柳栁","淵":"淵渕","曽":"曽曾","真":"真眞","桑":"桑桒","亀":"亀龜","瀬":"瀬瀨","双":"双雙"};
  const vesc = s => s.split("").map(c => NEW2VAR[c] ? ("["+NEW2VAR[c].split("").map(esc).join("")+"]") : esc(c)).join("");
  const SUF = ["さん","サン","さま","様","ちゃん","ちゃま","くん","君","氏","先生","先輩"];
  const NICK_SUF = ["ちゃん","くん","っち","りん","ぽん"];
  const ORG_SUF = ["技研","製薬","工業","商事","電機","製作所","運輸","銀行","産業","建設","商店","製菓","食品","化学","重工","精機","硝子","証券","保険","不動産","商会","物産","興業","印刷","電工","製鉄","自動車","社","組","会","堂","屋","院","団"];
  const PLACE_SUF = ["町","市","村","区","県","都","府","郡","駅","島"];
  const TITLE_SUF = ["副社長","取締役","理事長","部門長","支店長","准教授","部長","次長","課長","係長","主任","主査","室長","所長","局長","社長","専務","常務","会長","監事","教授","講師","校長","教頭","園長","院長","師長","監督","大臣","知事","市長","町長","村長","区長","議員","選手","先生","先輩","博士"].sort((a,b)=>b.length-a.length);
  const SEI1_EXTRA = "田 山 実 谷 池 川 島 岡 原 江 井 沖 塚 星 城 堀 辻 畑 沢 柳 桑 呉 潮 樋 郭 峰 磯 郡 服 灰 袋 轟 巴 郷 楠 栗 桐 菅 萩 巽 沼 袴 潟 鎌 樽 梶 幸 境 堺 幡 榊 樫 楢 柏 檀 椿 榎 樺 柚 藤 堤 溝 洲 恵 甲 昆 呂 賀 巨 郷 袴 郡 森 林 東 南 西 北 関 泉 堀 岩 石 内 岸 灘 港 沼 峯 岬 尾 荘 庄 郷".split(" ");
  const NAME_STOP2 = new Set("氏 様 君 殿 方 達 家 邸 側 頃 中 内 外 元 上 下 前 後 他 等 目 者 型 号 課 部 室 社 宅".split(" "));
  function detect(text){
    const found = [];
    const seen = new Set();
    const seiSet = new Set(dictSei);
    const meiSet = new Set(dictMei);
    const SEI1 = new Set([...dictSei1, ...SEI1_EXTRA]);
    const MEI1 = dictMei1;
    const HON = new Set(HONORIFIC.split("|"));
    // 下の名前だけの呼び捨て（「陽菜が」「さくらは」）。人名辞書と同じ形の一般語は伏せない
    const STRICT = $("strictGiven") ? $("strictGiven").checked : false;
    const NOUN_NG = new Set(("正義 大成 健康 元気 自然 平和 幸福 満足 記録 練習 学習 生活 昼食 朝食 夕食 掃除 洗濯 入浴 就寝 起床 体調 様子 保健 給食 部屋 準備 確認 連絡 相談 指導 支援 対応 参加 帰省 帰舎 登校 下校 外出 面談 行事 活動 作業 訓練 検査 通院 服薬 発熱 頭痛 腹痛 風邪 心配 注意 危険 安心 一緒 本人 職員 先生 生徒 児童 学年 学級 教室 食堂 浴室 玄関 廊下 階段 洗面 時間 曜日 今日 明日 昨日 今週 来週 先週 今月 来月 先月 今年 本日 午前 午後 夕方 早朝 深夜 週末 全員 各自 順番 予定 希望 説明 報告 質問 返事 電話 手紙 荷物 洗濯物 上着 上履 制服 私服 眼鏡 財布 携帯 音楽 体育 図工 家庭 理科 社会 国語 数学 英語 美術 技術 道徳 進路 就労 実習").split(/\s+/));
    // ひらがなの「〜さん」で人名でないもの
    const HIRA_NG = new Set(("みな みんな おかあ おとう おじい おばあ おにい おねえ あなた どなた ばあ じい かあ とう ねえ にい おく おきゃく こども おとな みなさま "
      + "ため とき なか つぎ やすみ こと もの ところ ほう あと まえ うち ひと これ それ あれ ここ そこ など まま いま あさ ひる よる ちから はなし").split(/\s+/));
    const isGivenAlone = w => STRICT && w.length >= 2 && w.length <= 4 && !NOUN_NG.has(w) && !STOP.has(w) && meiSet.has(w);
    // かな（ひらがな・カタカナ）の呼び捨ては、現代名リストに載っている語だけ。
    // 古い辞書のかな名（てい・きく・とみ等）は「過ごしています」の“てい”のような語尾と衝突して本文を壊す
    const isKanaGivenAlone = w => STRICT && w.length >= 2 && w.length <= 5 && !NOUN_NG.has(w) && !STOP.has(w) && meiExtraSet.has(w);
    const isSpace = s => /^[\s　]+$/.test(s);
    const isKanjiTok = s => /^[一-鿿々]+$/.test(s);
    const isKataStr  = s => /^[ァ-ヶー・]{2,}$/.test(s);
    const isInitial  = s => /^[A-Za-z]{1,2}$/.test(normLatin(s));
    const isFuseji   = s => /^[◯〇○×✕✖●]+$/.test(s);
    const add = (surname, given, kind) => {
      if (!surname || STOP.has(surname)) return;
      if (given && STOP.has(surname + given)) return;
      const key = surname + "|" + (given || "");
      if (seen.has(key)) return;
      seen.add(key); found.push({ surname, given, kind });
    };

    let toks = null;
    try { if (window.TinySegmenter) toks = window.TinySegmenter.segment(normOld(text)); } catch(e){ toks = null; }

    if (toks && toks.length) {
      const N = toks.length;
      const followCtx = (idx) => {
        // タブ・改行はセルの区切り。次のセルの敬称を拾って誤爆しないよう、ここで打ち切る
        let j=idx; if(j<N && isSpace(toks[j])){ if(/[\t\r\n]/.test(toks[j])) return 'other'; j++; }
        if(j>=N) return 'end';
        const nt=toks[j];
        if(HON.has(nt)) return 'hon';
        if(/^[ぁ-ん、。，．！？!?…・「」（）\)\(]/.test(nt)) return 'particle';
        return 'other';
      };
      const endsWithOrg   = ch => ORG_SUF.some(o => ch.length>o.length && ch.endsWith(o));
      const endsWithPlace = ch => PLACE_SUF.some(pl => ch.length>1 && ch.endsWith(pl));
      const analyzeChunk = (chunk, fctx) => {
        if(!chunk) return null;
        // 肩書き接尾がくっついていたら剥がして敬称扱い（鈴木実部長 → 鈴木実）
        for(const ts of TITLE_SUF){ if(chunk.length>ts.length && chunk.endsWith(ts)){ chunk=chunk.slice(0,-ts.length); fctx='hon'; break; } }
        if((endsWithOrg(chunk)||endsWithPlace(chunk)) && fctx!=='hon') return null;   // 会社・地名
        for(let len=Math.min(4,chunk.length); len>=1; len--){
          const pre=chunk.slice(0,len);
          const isSur=(len>=2 && seiSet.has(pre)) || (len===1 && SEI1.has(pre));
          if(!isSur) continue;
          const rest=chunk.slice(len);
          if(rest.length===0){
            if(len>=2 || fctx==='hon') return {surname:pre, given:null};
            return null;
          }
          if(rest.length<=2){
            if(len===1 && fctx!=='hon') continue;
            if(rest.length===1 && NAME_STOP2.has(rest)) return {surname:pre, given:null};
            return {surname:pre, given:rest};
          }
          if(len>=2 && fctx==='hon') return {surname:pre, given:null};
        }
        if(fctx==='hon' && isKanjiTok(chunk) && chunk.length>=2 && chunk.length<=4 && !STOP.has(chunk)) return {surname:chunk, given:null};
        return null;
      };
      const addStem = (pre) => {   // 敬称の直前（＝人名候補）を判定して追加
        if(!pre || STOP.has(pre)) return;
        if(isInitial(pre)) { add(normLatin(pre),null,"イニシャル"); return; }
        if(isKataStr(pre)) { add(pre,null,"カナ"); return; }
        // ひらがなの名前（さくらさん・ゆいちゃん）。呼びかけ語（みなさん等）は除く
        if(/^[ぁ-ん]{2,4}$/.test(pre) && !HIRA_NG.has(pre)) { add(pre,null,"かな"); return; }
        const person=analyzeChunk(pre,'hon'); if(person) add(person.surname,person.given,"敬称");
      };

      let i=0;
      while(i<N){
        const t=toks[i];
        if(isSpace(t)||STOP.has(t)){ i++; continue; }

        let done=false;
        // 愛称接尾（たっちゃん/ゆうきくん/ナベちゃん）＝仮名語幹＋ちゃん/くん
        for(const suf of NICK_SUF){
          if(t.length>suf.length && t.endsWith(suf) && /^[ぁ-んァ-ヶー]{1,}$/.test(t.slice(0,-suf.length))){ add(t,null,"愛称"); done=true; break; }
        }
        if(done){ i++; continue; }
        // 敬称がくっついた1トークン（田さん / 関さん / 田中健さん / マリさん）
        for(const suf of SUF){
          if(t.length>suf.length && t.endsWith(suf)){ addStem(t.slice(0,-suf.length)); done=true; break; }
        }
        if(done){ i++; continue; }

        // イニシャル＋敬称
        if(isInitial(t)){ if(followCtx(i+1)==='hon') add(normLatin(t),null,"イニシャル"); i++; continue; }
        // 伏せ字（◯を連結）＋敬称
        if(isFuseji(t)){
          let fu=t, j=i+1;
          while(j<N && isFuseji(toks[j])){ fu+=toks[j]; j++; }
          if(fu.length>=2 && followCtx(j)==='hon') add(fu,null,"伏せ字");
          i=j; continue;
        }
        // 漢字のかたまり（敬称漢字は境界）
        if(isKanjiTok(t) && !HON.has(t)){
          let chunk=t, j=i+1;
          while(j<N && isKanjiTok(toks[j]) && !HON.has(toks[j])){ chunk+=toks[j]; j++; }
          const person=analyzeChunk(chunk, followCtx(j));
          if(person){
            // スペース/タブ区切りの名を吸収（山本 楓 → 山本＋楓）
            if(person.given===null && person.surname.length>=2 && j<N && /^[ 　]+$/.test(toks[j]||"") && j+1<N && isKanjiTok(toks[j+1]) && toks[j+1].length<=2 && !HON.has(toks[j+1]) && !STOP.has(toks[j+1]) && (meiSet.has(toks[j+1]) || (toks[j+1].length===1 && MEI1.has(toks[j+1])))){
              add(person.surname, toks[j+1], "漢字空白"); i=j+2; continue;
            }
            add(person.surname, person.given, "漢字");
          } else if(chunk.length===1 && SEI1.has(chunk)){
            const cb = s => (s===undefined) || (s==="") || /[\t\n\r]/.test(s);
            const leftCell = cb(i>0?toks[i-1]:"");
            // 表のセル内の「1文字姓 ＋ 空白 ＋ 名前(辞書)」＝ 境　楓。
            // 前後がタブ/改行/端で囲まれたセル内のときだけ拾う（文章中の「山 道」等の誤爆を防ぐ）
            if(leftCell && /^[ 　]+$/.test(toks[j]||"") && j+1<N && isKanjiTok(toks[j+1]) && toks[j+1].length<=2 && !HON.has(toks[j+1]) && !STOP.has(toks[j+1]) && (meiSet.has(toks[j+1]) || (toks[j+1].length===1 && MEI1.has(toks[j+1]))) && cb(j+2<N?toks[j+2]:"")){
              add(chunk, toks[j+1], "単字姓空白"); i=j+2; continue;
            }
            // 表のセルに単独の1文字姓（前後がタブ/改行/端）＝名前とみなす
            if(leftCell && cb(j<N?toks[j]:"")) add(chunk,null,"セル姓");
          } else if(isGivenAlone(chunk)){
            add(chunk,null,"名前(呼び捨て)");     // 陽菜が／健太は
          }
          i=j; continue;
        }
        // カタカナ名（中黒つなぎ）＋敬称
        if(/^[ァ-ヶー・]+$/.test(t)){
          let ch=t, j=i+1;
          while(j<N && /^[ァ-ヶー・]+$/.test(toks[j])){ ch+=toks[j]; j++; }
          ch=ch.replace(/^・+|・+$/g,"");
          if(ch.length>=2 && (followCtx(j)==='hon' || isKanaGivenAlone(ch))) add(ch,null,"カナ");
          i=j; continue;
        }
        // ひらがなが続く語＋敬称（さいとうさん／さくらさん）。「お〜さん」「ご〜さま」は呼びかけなので除く
        if(/^[ぁ-ん]+$/.test(t) && !HON.has(t)){
          let hw=t, j=i+1;
          while(j<N && /^[ぁ-ん]+$/.test(toks[j]) && !HON.has(toks[j]) && hw.length<6){ hw+=toks[j]; j++; }
          if(hw.length>=2 && hw.length<=5 && !HIRA_NG.has(hw) && !/^[おご]/.test(hw) && followCtx(j)==='hon'){
            add(hw,null,"かな"); i=j; continue;
          }
          // 呼び捨て：区切られたひらがな（い＋ろ＋は）をつなぎ直し、長い方から辞書と照合
          if(j > i+1){
            let acc = "", hit = -1, word = "";
            for(let k=i; k<j; k++){ acc += toks[k]; if(!HIRA_NG.has(acc) && isKanaGivenAlone(acc)){ hit = k; word = acc; } }
            if(hit >= 0 && (i===0 || toks[i-1] !== "の")){ add(word,null,"名前(呼び捨て)"); i = hit+1; continue; }
          }
        }
        // ひらがなの名前（さくらが／ゆいは）。辞書にある名前と同じ形のときだけ
        // 直前が「の」なら「体調不良のため」型の一般語。人名として扱わない
        if(/^[ぁ-ん]{2,5}$/.test(t) && !HIRA_NG.has(t) && (i===0 || toks[i-1] !== "の") && isKanaGivenAlone(t)){
          add(t,null,"名前(呼び捨て)"); i++; continue;
        }
        i++;
      }
      return found;
    }

    // --- フォールバック ---
    const byLen = (a,b) => b.length - a.length;
    const seiInText = dictSei.filter(s => text.includes(s)).sort(byLen);
    const meiInText = dictMei.filter(g => text.includes(g)).sort(byLen);
    let masked = text;
    for (const s of seiInText) {
      if (STOP.has(s)) continue;
      for (const g of meiInText) {
        if (s.length + g.length < 3) continue;
        const re = new RegExp(esc(s) + "[　 ]?" + esc(g), "g");
        if (re.test(masked)) { add(s, g, "フル"); masked = masked.replace(re, ""); }
      }
    }
    return found;
  }

  // ---- パターン一覧の作成 ----
  function generate(text){
    // 表示中のチェック状態を記憶
    for (const cb of document.querySelectorAll("#patterns input[type=checkbox]")) {
      if (cb.checked) unchecked.delete(cb.dataset.text); else unchecked.add(cb.dataset.text);
    }
    const manual = parseNames($("nameList").value);
    const colRes = $("colDetect").checked ? detectColumns(text, $("colManual").value) : { names: [], headers: [] };
    const cols = colRes.names;
    $("colMsg").textContent = cols.length
      ? `表の列から ${cols.length} 件（${colRes.headers.join("・") || "手で指定した列"}）`
      : ($("colDetect").checked ? "表の名前の列は見つかりませんでした" : "");
    const auto = $("autoDetect").checked ? detect(text) : [];
    if (manual.length === 0 && cols.length === 0 && auto.length === 0) {
      toast("名前が見つかりませんでした");
      return false;
    }
    persons = []; patterns = [];
    const known = new Set();
    let idx = 0;
    const addPerson = (surname, given, typePrefix, cellOnly) => {
      const lb = label(idx++);
      persons.push({ surname, given, label: lb });
      // cellOnly＝1文字など巻き込みが怖い名前。セル内（表の枠）と敬称つきだけ置換する
      if (given) {
        patterns.push({ text: surname + given, label: lb, type: typePrefix + "フルネーム", surname, given, cellOnly: false });
        patterns.push({ text: surname,          label: lb, type: typePrefix + "名字のみ",  surname, given: null, cellOnly: false });
        // 1文字の名前を単独で消すと「楽しみ→しみ」「誠に→に」等を巻き込む。フルネームでは必ず消えるので、
        // 単独の「名前のみ」パターンは2文字以上のときだけ作る
        if (given.length >= 2) {
          patterns.push({ text: given,          label: lb, type: typePrefix + "名前のみ",  surname: null, given: null, cellOnly: false });
        }
        known.add(surname + given); known.add(surname); known.add(given);
      } else {
        patterns.push({ text: surname, label: lb, type: typePrefix + "名字のみ", surname, given: null, cellOnly: !!cellOnly });
        known.add(surname);
      }
    };
    for (const p of manual) addPerson(p.surname, p.given, "", false);
    for (const c of cols) {
      const key = c.given ? c.surname + c.given : c.surname;
      if (known.has(key)) continue;
      addPerson(c.surname, c.given, "列:", !!c.cellOnly);
    }
    for (const a of auto) {
      const key = a.given ? a.surname + a.given : a.surname;
      if (known.has(key)) continue;
      addPerson(a.surname, a.given, "自動:", false);
    }
    // 一覧を描画
    const box = $("patterns");
    box.innerHTML = "";
    patterns.forEach((p, i) => {
      const lb = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.dataset.text = p.text; cb.dataset.idx = i;
      cb.checked = !unchecked.has(p.text);
      lb.appendChild(cb);
      lb.appendChild(document.createTextNode(`[${p.label}] ${p.text}`));
      const tp = document.createElement("span"); tp.className = "tp"; tp.textContent = p.type;
      lb.appendChild(tp);
      box.appendChild(lb);
    });
    $("patBox").open = patterns.some(p => p.type.startsWith("自動:") || p.type.startsWith("列:"));
    persist();
    return true;
  }

  // ---- 実行 ----
  function run(){
    const text = $("inputText").value;
    if (!text.trim()) { toast("テキストを貼ってください"); return; }
    if (!generate(text)) {
      $("result").innerHTML=""; $("stats").textContent=""; $("mapArea").innerHTML="";
      $("suspectsBox").innerHTML="";
      $("copyBody").disabled=true; $("copyMap").disabled=true; $("saveBtn").disabled=true;
      return;
    }

    const active = patterns.filter(p => !unchecked.has(p.text))
                           .sort((a,b) => b.text.length - a.text.length);
    if (active.length === 0) { toast("パターンが全部オフになっています"); return; }

    const MS = "␀S␀", ME = "␀E␀";
    const counts = {};
    const TITLE = HONORIFIC;
    const KB = "[一-鿿々]";

  function csvToTab(text){

    for (let i = 0; i < text.length; i++) {

    return rows.map(r => r.map(c => c.replace(/[\r\n]+/g," ")).join("\t")).join("\n").trim();
  }

  // ---- 古い .doc (Word97-2003) : OLE複合ファイル+ピーステーブルで本文を正しく取り出す（外部ライブラリ不要） ----
  function cleanDocText(text){
    let o = "";
    for (const ch of text){
      const c = ch.codePointAt(0);
      if (ch === "\r" || c === 0x0B || c === 0x0C) o += "\n";
      else if (c === 0x07) o += "\t";
      else if (ch === "\t" || ch === "\n") o += ch;
      else if (c < 0x20) continue;
      else if (c === 0xFFFF || c === 0xFFFE) continue;
      else o += ch;
    }
    o = o.split("\n").map(l => l.replace(/[ \t]+$/,"")).join("\n").replace(/\n{3,}/g,"\n\n");
    return o.trim();
  }
  function docToText(arrayBuffer){
    const d = new Uint8Array(arrayBuffer), dv = new DataView(arrayBuffer);
    if (d.length < 512 || d[0]!==0xD0 || d[1]!==0xCF || d[2]!==0x11 || d[3]!==0xE0)
      throw new Error("古いWord形式(OLE)ではありません");
    const secSize = 1 << _u16(dv,30), miniSize = 1 << _u16(dv,32);
    const dirStart = dv.getInt32(48,true), miniCutoff = _u32(dv,56);
    const miniFatStart = dv.getInt32(60,true);
    const difatStart = dv.getInt32(68,true), nDifat = dv.getInt32(72,true);
    const eps = secSize >> 2;                       // FAT entries / sector
    const secOff = (sid) => 512 + sid*secSize;
    const concat = (parts) => { let n=0; for(const p of parts) n+=p.length; const out=new Uint8Array(n); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out; };

    // DIFAT -> FAT
    const difat = [];
    for (let i=0;i<109;i++){ const v=dv.getInt32(76+i*4,true); if(v>=0) difat.push(v); }
    let sid=difatStart, cnt=nDifat, g=0;
    while (cnt>0 && sid>=0 && g<100000){
      const base=secOff(sid);
      for (let i=0;i<eps-1;i++){ const v=dv.getInt32(base+i*4,true); if(v>=0) difat.push(v); }
      sid=dv.getInt32(base+(eps-1)*4,true); cnt--; g++;
    }
    const fat=[];
    for (const s of difat){ const base=secOff(s); if(base+secSize>d.length) continue; for(let i=0;i<eps;i++) fat.push(dv.getInt32(base+i*4,true)); }

    const chainRead=(start,size)=>{ const parts=[]; let s=start,gg=0; while(s>=0 && s<fat.length && gg<=fat.length+10){ const o=secOff(s); parts.push(d.subarray(o,Math.min(o+secSize,d.length))); s=fat[s]; gg++; } let a=concat(parts); if(size>0 && a.length>size) a=a.subarray(0,size); return a; };

    // directory
    const dirRaw=chainRead(dirStart,0), ddv=new DataView(dirRaw.buffer,dirRaw.byteOffset,dirRaw.byteLength);
    const entries=[];
    for (let o=0;o+128<=dirRaw.length;o+=128){
      const nameLen=ddv.getUint16(o+64,true);
      const name = nameLen>=2 ? new TextDecoder("utf-16le").decode(dirRaw.subarray(o,o+nameLen-2)) : "";
      entries.push({name, type:dirRaw[o+66], start:ddv.getInt32(o+116,true), size:ddv.getUint32(o+120,true)});
    }
    const root=entries.find(e=>e.type===5);

    // mini FAT + mini stream
    const minifat=[];
    if (miniFatStart>=0){ const mf=chainRead(miniFatStart,0), mdv=new DataView(mf.buffer,mf.byteOffset,mf.byteLength); for(let i=0;i+4<=mf.length;i+=4) minifat.push(mdv.getInt32(i,true)); }
    const ministream = root ? chainRead(root.start,root.size) : new Uint8Array(0);
    const miniRead=(start,size)=>{ const parts=[]; let s=start,gg=0; while(s>=0 && s<minifat.length && gg<=minifat.length+10){ const o=s*miniSize; parts.push(ministream.subarray(o,Math.min(o+miniSize,ministream.length))); s=minifat[s]; gg++; } let a=concat(parts); if(size>0 && a.length>size) a=a.subarray(0,size); return a; };
    const getStream=(nm)=>{ const e=entries.find(x=>x.name===nm && x.type===2); if(!e) return null; return e.size<miniCutoff ? miniRead(e.start,e.size) : chainRead(e.start,e.size); };

    // WordDocument stream + FIB
    const wd=getStream("WordDocument");
    if(!wd || wd.length<512) throw new Error("本文ストリームが見つかりません");
    const wdv=new DataView(wd.buffer,wd.byteOffset,wd.byteLength);
    const tblName = (wdv.getUint16(10,true) & 0x0200) ? "1Table" : "0Table";
    const table = getStream(tblName) || getStream("1Table") || getStream("0Table");

    let pos=32;
    const csw=wdv.getUint16(pos,true); pos+=2; pos+=csw*2;
    const cslw=wdv.getUint16(pos,true); pos+=2; const lwPos=pos;
    const ccpText=wdv.getInt32(lwPos+12,true);
    pos+=cslw*4; pos+=2; const blob=pos;
    if(blob+33*8+8>wd.length) throw new Error("FIBが読めません");
    const fcClx=wdv.getUint32(blob+33*8,true), lcbClx=wdv.getUint32(blob+33*8+4,true);

    let out="";
    if(table && lcbClx>0 && fcClx+lcbClx<=table.length){
      const clx=table.subarray(fcClx,fcClx+lcbClx), cdv=new DataView(clx.buffer,clx.byteOffset,clx.byteLength);
      let i=0, plc=null;
      while(i<clx.length){
        const t=clx[i];
        if(t===1){ i+=3+cdv.getUint16(i+1,true); }
        else if(t===2){ const lcb=cdv.getInt32(i+1,true), st=i+5; if(lcb>0 && st+lcb<=clx.length) plc=clx.subarray(st,st+lcb); break; }
        else break;
      }
      if(plc){
        const pdv=new DataView(plc.buffer,plc.byteOffset,plc.byteLength);
        const n=Math.floor((plc.length-4)/12), cps=[];
        for(let k=0;k<=n;k++) cps.push(pdv.getUint32(k*4,true));
        const dec16=new TextDecoder("utf-16le"), dec1252=new TextDecoder("windows-1252");
        for(let k=0;k<n;k++){
          const fc=pdv.getUint32((n+1)*4+k*8+2,true), cch=cps[k+1]-cps[k];
          if(cch<=0) continue;
          const baseFc=fc & 0x3FFFFFFF;
          if(fc & 0x40000000){ const off=baseFc>>>1; if(off>=0 && off+cch<=wd.length) out+=dec1252.decode(wd.subarray(off,off+cch)); }
          else { const off=baseFc; if(off>=0 && off+cch*2<=wd.length) out+=dec16.decode(wd.subarray(off,off+cch*2)); }
        }
      }
    }
    if(ccpText>0 && out.length>=ccpText) out=out.slice(0,ccpText);
    if(!out || !out.trim()) throw new Error("本文を取り出せませんでした");
    return cleanDocText(out);
  }
  function decodeTextBytes(arrayBuffer){
    try { return new TextDecoder("utf-8", {fatal:true}).decode(arrayBuffer); }
    catch(e){ try { return new TextDecoder("shift_jis").decode(arrayBuffer); } catch(e2){ return new TextDecoder("utf-8").decode(arrayBuffer); } }
  }
  // 1ファイルをテキストにする（対応外は日本語の理由を投げる）
  async function fileToText(f){
    const name = f.name.toLowerCase();
    if (name.endsWith(".xlsx") || name.endsWith(".xlsm")) return await xlsxToText(await f.arrayBuffer());
    if (name.endsWith(".docx")) return await docxToText(await f.arrayBuffer());
    if (name.endsWith(".csv") || name.endsWith(".tsv")) return csvToTab(decodeTextBytes(await f.arrayBuffer()));
    if (name.endsWith(".txt") || name.endsWith(".text")) return decodeTextBytes(await f.arrayBuffer());
    if (name.endsWith(".doc")) {
      try { return docToText(await f.arrayBuffer()); }
      catch (e2) { throw new Error("この .doc は読み取れませんでした（" + ((e2 && e2.message) || e2) + "）。Wordで開いて .docx で保存し直すか、File-2-Text でテキストにしてから貼ってください"); }
    }
    if (name.endsWith(".xls") || name.endsWith(".jtd") || name.endsWith(".pdf") || name.endsWith(".pptx") || name.endsWith(".xlsb"))
      throw new Error("この形式（" + f.name.replace(/^.*\./,".") + "）はブラウザ版では読めません。ツールボックスの File-2-Text でテキストにしてから貼ってください");
    throw new Error("対応していない形式です（Excel .xlsx / Word .docx・.doc / .csv / .txt に対応）");
  }
  async function handleFiles(files, quiet){
    const msg = (t) => { $("fileMsg").textContent = t; };
    if (!files.length) { msg("⚠ 読み込めるファイルがありませんでした"); return; }
    msg("読み込み中…");
    const parts = [], errs = [];
    for (const f of files) {
      try {
        const t = await fileToText(f);
        parts.push(files.length > 1 ? ("===== " + f.name + " =====\n" + t) : t);
      } catch (err) { if (!quiet) errs.push(f.name + "：" + ((err && err.message) || err)); }
    }
    if (parts.length) {
      const text = parts.join("\n\n");
      $("inputText").value = text;
      msg("✅ " + parts.length + "件を読み込みました（" + text.length + "文字）。匿名化しました↓"
          + (errs.length ? "／⚠ 読めなかったもの: " + errs.join(" / ") : ""));
      run();
    } else {
      msg("⚠ " + (errs.join(" / ") || "読み込めるファイルがありませんでした"));
    }
  }
  $("fileInput").addEventListener("change", async (e) => {
    await handleFiles(Array.from(e.target.files || []), false);
    e.target.value = "";   // 同じファイルを続けて選べるように
  });

  // ---- ドラッグ＆ドロップ（ファイルでも、選んだ文字でも受ける。フォルダごとでも可）----
  const READABLE = /\.(xlsx|xlsm|docx|doc|csv|tsv|txt|text)$/i;
  async function entryFiles(entry, out, depth){
    if (!entry || depth > 4) return;
    if (entry.isFile) {
      const f = await new Promise(res => entry.file(res, () => res(null)));
      if (f && READABLE.test(f.name) && !/^~\$/.test(f.name)) out.push(f);
      return;
    }
    if (entry.isDirectory) {
      const reader = entry.createReader();
      while (true) {
        const batch = await new Promise(res => reader.readEntries(res, () => res([])));
        if (!batch.length) break;
        for (const e of batch) await entryFiles(e, out, depth + 1);
      }
    }
  }
  let dragDepth = 0;
  document.addEventListener("dragenter", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { dragDepth++; document.body.classList.add("dragover"); } });
  document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragover"); } });
  document.addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
  document.addEventListener("drop", async (e) => {
    dragDepth = 0; document.body.classList.remove("dragover");
    const dt = e.dataTransfer; if (!dt) return;
    if (dt.files && dt.files.length) {
      e.preventDefault();
      let files = Array.from(dt.files), fromFolder = false;
      // フォルダを落とされたときは中身を集める
      if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
        const entries = Array.from(dt.items).map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
        if (entries.some(en => en.isDirectory)) {
          const out = [];
          for (const en of entries) await entryFiles(en, out, 0);
          if (out.length) { files = out; fromFolder = true; }
        }
      }
      await handleFiles(files, fromFolder);   // フォルダの中の対応外ファイルは黙って飛ばす
    }
  });
})();
</script>
