<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ファイル同期</title>
<style>
  body {
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }

  .rev {
    position: fixed;
    top: 6px;
    right: 10px;
    font-size: 11px;
    color: #999;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 20px;
    margin: 8px 0 16px;
  }

  .panel {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  }

  .code-label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
  }

  .code-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  #codeInput {
    min-width: 0;
    flex: 1;
    box-sizing: border-box;
    border: 1px solid #bbb;
    border-radius: 8px;
    padding: 10px;
    font-family: Consolas, monospace;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.12em;
    text-align: center;
    text-transform: uppercase;
  }

  button {
    border: none;
    border-radius: 8px;
    background: #2d6cdf;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 14px;
  }

  button:active {
    background: #1e4fad;
  }

  button:disabled {
    background: #aab4c5;
    cursor: default;
  }

  .secondary {
    background: #687386;
  }

  .secondary:active {
    background: #505967;
  }

  .danger {
    background: #c0392b;
  }

  .danger:active {
    background: #922b21;
  }

  .code-info {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    color: #555;
    line-height: 1.6;
  }

  .code-info.visible {
    display: block;
  }

  .code-value {
    font-family: Consolas, monospace;
    font-weight: bold;
    letter-spacing: 0.08em;
  }

  .change-link {
    margin-left: 8px;
    padding: 0;
    border: none;
    background: transparent;
    color: #2d6cdf;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }

  .change-link:active {
    background: transparent;
    color: #1e4fad;
  }

  .hint {
    margin: 8px 0 0;
    font-size: 12px;
    color: #666;
    line-height: 1.6;
  }

  .file-area {
    margin-top: 14px;
  }

  .send-panel {
    background: #fff;
    border: 2px dashed #b7c2d4;
    border-radius: 12px;
    padding: 18px 16px;
    text-align: center;
  }

  .send-panel.drag {
    border-color: #2d6cdf;
    background: #eef3fc;
  }

  .send-panel p {
    margin: 10px 0 0;
    font-size: 12px;
    color: #666;
    line-height: 1.7;
  }

  .recv-panel {
    margin-top: 14px;
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  }

  .recv-title {
    font-size: 13px;
    color: #555;
    margin: 0 0 8px;
  }

  #preview {
    display: none;
    max-width: 100%;
    max-height: 45vh;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin-bottom: 10px;
  }

  #fileInfo {
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    color: #333;
    margin: 0 0 10px;
  }

  .under-text {
    margin-top: 8px;
    font-size: 12px;
  }

  #status {
    color: #555;
    overflow-wrap: anywhere;
  }

  #status.error {
    color: #c0392b;
    font-weight: bold;
  }

  #status.success {
    color: #237a3b;
  }

  .button-row {
    display: flex;
    gap: 8px;
  }

  .button-row button {
    flex: 1;
  }

  #startupError {
    display: none;
    background: #fff;
    border: 1px solid #e2b5b0;
    border-radius: 10px;
    color: #a93226;
    padding: 14px;
    line-height: 1.7;
  }

  @media (max-width: 420px) {
    .code-row,
    .button-row {
      flex-direction: column;
    }

    #codeInput {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="rev">rev2</div>

<div class="wrap">
  <h1>ファイル同期</h1>

  <div id="startupError"></div>

  <main id="app">
    <section class="panel">
      <div id="codeSetup">
        <label class="code-label" for="codeInput">合言葉（6文字）</label>
        <div class="code-row">
          <input
            id="codeInput"
            type="text"
            maxlength="6"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
            placeholder="例: 7K3M2P"
          >
          <button id="useCodeBtn" type="button">この合言葉を使う</button>
        </div>
        <button id="makeCodeBtn" class="secondary" type="button">
          合言葉を作る
        </button>
        <p class="hint">
          もう片方の端末でも同じ合言葉を入力してください。I（アイ）とO（オー）は使用しません。
        </p>
      </div>

      <div id="codeInfo" class="code-info">
        合言葉:
        <span id="currentCode" class="code-value"></span>
        <button id="changeCodeBtn" class="change-link" type="button">
          変える
        </button>
      </div>
    </section>

    <section class="file-area">
      <div class="send-panel" id="dropZone">
        <button id="pickBtn" type="button" disabled>ファイルを選ぶ</button>
        <input id="fileInput" type="file" hidden>
        <p>
          画像でもファイルでも1件送れます（100MBまで）。<br>
          大きいファイルは送るのに時間がかかります。<br>
          パソコンでは、スクリーンショットをコピーして
          この画面で貼り付け（Ctrl+V）でも送れます。
        </p>
      </div>

      <div class="recv-panel">
        <p class="recv-title">受け取ったファイル</p>
        <img id="preview" alt="受信した画像">
        <p id="fileInfo">まだありません。</p>
        <div class="button-row">
          <button id="saveBtn" type="button" disabled>保存する</button>
          <button id="clearBtn" class="danger" type="button" disabled>
            内容を消す
          </button>
        </div>
      </div>

      <div class="under-text">
        <span id="status">合言葉を設定してください。</span>
      </div>

      <p class="hint">
        送ったファイルは5分たつと自動で消えます。
        合言葉を知っていれば誰でも受け取れる仕組みなので、
        人に見られて困るもの（個人情報など）は送らないでください。
      </p>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "fileSyncCode";
  var CODE_ALPHABET = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  var CODE_RE = /^[0-9A-HJ-NP-Z]{6}$/;
  var POLL_INTERVAL_MS = 2500;
  var MAX_FILE_BYTES = 100 * 1024 * 1024;

  var appEl = document.getElementById("app");
  var startupErrorEl = document.getElementById("startupError");
  var codeSetupEl = document.getElementById("codeSetup");
  var codeInfoEl = document.getElementById("codeInfo");
  var codeInputEl = document.getElementById("codeInput");
  var useCodeBtn = document.getElementById("useCodeBtn");
  var makeCodeBtn = document.getElementById("makeCodeBtn");
  var currentCodeEl = document.getElementById("currentCode");
  var changeCodeBtn = document.getElementById("changeCodeBtn");
  var dropZone = document.getElementById("dropZone");
  var pickBtn = document.getElementById("pickBtn");
  var fileInput = document.getElementById("fileInput");
  var previewEl = document.getElementById("preview");
  var fileInfoEl = document.getElementById("fileInfo");
  var saveBtn = document.getElementById("saveBtn");
  var clearBtn = document.getElementById("clearBtn");
  var statusEl = document.getElementById("status");

  var currentCode = "";
  var lastUpdatedAt = null;
  var pollTimer = null;
  var busy = false;
  var requestGeneration = 0;
  var receivedBlob = null;
  var receivedName = "";
  var previewUrl = null;

  function setStatus(message, kind) {
    statusEl.textContent = message;
    statusEl.className = kind || "";
  }

  function formatTime(date) {
    function twoDigits(value) {
      return String(value).padStart(2, "0");
    }

    return (
      twoDigits(date.getHours()) +
      ":" +
      twoDigits(date.getMinutes()) +
      ":" +
      twoDigits(date.getSeconds())
    );
  }

  function formatSize(bytes) {
    if (bytes < 1024) {
      return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
      return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function normalizeCode(value) {
    return String(value || "").trim().toUpperCase();
  }

  function isValidCode(value) {
    return CODE_RE.test(value);
  }

  function apiUrl(code, body) {
    return (
      "/api/file/" +
      encodeURIComponent(code) +
      (body ? "?body=1" : "")
    );
  }

  function enableControls(enabled) {
    pickBtn.disabled = !enabled;
    clearBtn.disabled = !enabled;
  }

  async function readJsonResponse(response) {
    var data;

    try {
      data = await response.json();
    } catch (error) {
      throw new Error("サーバーから正しい応答を受け取れませんでした。");
    }

    if (!response.ok || !data || data.ok !== true) {
      throw new Error(
        data && data.message
          ? data.message
          : "サーバーとの通信に失敗しました。",
      );
    }

    return data;
  }

  async function requestJson(url, options) {
    var response;

    try {
      response = await fetch(url, options);
    } catch (error) {
      throw new Error(
        "通信できません。この場所のネットワークで止められている可能性があります。",
      );
    }

    return readJsonResponse(response);
  }

  function saveCode(code) {
    try {
      localStorage.setItem(STORAGE_KEY, code);
    } catch (error) {
      setStatus(
        "合言葉をブラウザに保存できませんでした。この画面を閉じる前に控えてください。",
        "error",
      );
    }
  }

  function removeSavedCode() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      // 保存領域が使えなくても、画面の切り替えは続行する。
    }
  }

  function loadSavedCode() {
    try {
      return normalizeCode(localStorage.getItem(STORAGE_KEY));
    } catch (error) {
      return "";
    }
  }

  function generateCode() {
    var result = "";
    var random = new Uint8Array(1);
    var limit = Math.floor(256 / CODE_ALPHABET.length) *
      CODE_ALPHABET.length;

    while (result.length < 6) {
      crypto.getRandomValues(random);

      if (random[0] < limit) {
        result += CODE_ALPHABET.charAt(
          random[0] % CODE_ALPHABET.length,
        );
      }
    }

    return result;
  }

  function stopPolling() {
    if (pollTimer !== null) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function startPolling() {
    stopPolling();

    if (document.visibilityState === "visible" && currentCode) {
      pollTimer = setInterval(function () {
        checkForNewFile(false);
      }, POLL_INTERVAL_MS);
    }
  }

  function clearReceivedView() {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    previewEl.style.display = "none";
    previewEl.removeAttribute("src");
    receivedBlob = null;
    receivedName = "";
    fileInfoEl.textContent = "まだありません。";
    saveBtn.disabled = true;
  }

  function showReceived(blob, name, updatedAt) {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    receivedBlob = blob;
    receivedName = name || "received.bin";

    var isImage = (blob.type || "").indexOf("image/") === 0;

    if (isImage) {
      previewUrl = URL.createObjectURL(blob);
      previewEl.src = previewUrl;
      previewEl.style.display = "block";
    } else {
      previewEl.style.display = "none";
      previewEl.removeAttribute("src");
    }

    fileInfoEl.textContent =
      receivedName + "（" + formatSize(blob.size) + "）";
    saveBtn.disabled = false;
    lastUpdatedAt = updatedAt || null;
  }

  function showCurrentCode() {
    currentCodeEl.textContent = currentCode;
    codeSetupEl.style.display = "none";
    codeInfoEl.className = "code-info visible";
  }

  function showCodeSetup() {
    codeInfoEl.className = "code-info";
    codeSetupEl.style.display = "block";
  }

  async function setCode(code) {
    var normalized = normalizeCode(code);

    if (!isValidCode(normalized)) {
      setStatus(
        "合言葉は、IとOを除く半角英数字6文字で入力してください。",
        "error",
      );
      codeInputEl.focus();
      codeInputEl.select();
      return;
    }

    requestGeneration += 1;
    stopPolling();

    currentCode = normalized;
    lastUpdatedAt = null;
    clearReceivedView();

    codeInputEl.value = normalized;
    saveCode(normalized);
    showCurrentCode();
    enableControls(true);
    setStatus("サーバーを確認しています。");

    await checkForNewFile(true);
    startPolling();
  }

  async function fetchReceivedFile(codeAtStart, generationAtStart, meta) {
    var response;

    try {
      response = await fetch(apiUrl(codeAtStart, true), {
        method: "GET",
        cache: "no-store",
      });
    } catch (error) {
      throw new Error(
        "通信できません。この場所のネットワークで止められている可能性があります。",
      );
    }

    if (!response.ok) {
      var data = null;

      try {
        data = await response.json();
      } catch (error) {
        // JSONでない失敗応答は既定文言にする。
      }

      throw new Error(
        data && data.message
          ? data.message
          : "ファイルを受け取れませんでした。",
      );
    }

    var blob = await response.blob();

    if (
      generationAtStart !== requestGeneration ||
      codeAtStart !== currentCode
    ) {
      return;
    }

    if (blob.size < 1) {
      throw new Error("受け取ったファイルが空でした。");
    }

    showReceived(
      new Blob([blob], { type: meta.type || blob.type }),
      meta.name,
      meta.updatedAt,
    );
    setStatus(
      "ファイルを受信しました " + formatTime(new Date()),
      "success",
    );
  }

  async function checkForNewFile(initialLoad) {
    if (
      !currentCode ||
      busy ||
      document.visibilityState !== "visible"
    ) {
      return;
    }

    var codeAtStart = currentCode;
    var generationAtStart = requestGeneration;

    try {
      var meta = await requestJson(apiUrl(codeAtStart, false), {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept": "application/json",
        },
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      if (!meta.updatedAt) {
        if (lastUpdatedAt !== null) {
          clearReceivedView();
          lastUpdatedAt = null;
          setStatus("ファイルは期限切れ（5分）で消えました。");
        } else if (initialLoad) {
          setStatus("準備できました。ファイルを送るか、届くのを待ってください。", "success");
        }
        return;
      }

      if (meta.updatedAt === lastUpdatedAt) {
        if (initialLoad) {
          setStatus("準備できました。", "success");
        }
        return;
      }

      setStatus("ファイルを受信しています...");
      await fetchReceivedFile(codeAtStart, generationAtStart, meta);
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setStatus(error.message, "error");
      }
    }
  }

  async function sendFile(file) {
    if (!currentCode) {
      setStatus("先に合言葉を設定してください。", "error");
      return;
    }

    if (!file) {
      return;
    }

    if (file.size > MAX_FILE_BYTES) {
      setStatus(
        "このファイルは" + formatSize(file.size) +
          "あります。送れるのは100MBまでです。",
        "error",
      );
      return;
    }

    if (file.size < 1) {
      setStatus("中身が空のファイルは送れません。", "error");
      return;
    }

    if (busy) {
      setStatus("送信中です。終わってからもう一度お試しください。", "error");
      return;
    }

    var codeAtStart = currentCode;
    var generationAtStart = requestGeneration;
    var name = file.name || "clipboard.png";

    busy = true;
    setStatus(
      "送信中...（" + formatSize(file.size) +
        "。大きいファイルは数分かかることがあります）",
    );

    try {
      var data = await requestJson(apiUrl(codeAtStart, false), {
        method: "PUT",
        headers: {
          "Accept": "application/json",
          "Content-Type": file.type || "application/octet-stream",
          "X-File-Name": encodeURIComponent(name),
        },
        body: file,
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      lastUpdatedAt = data.updatedAt || null;
      showReceived(file, name, data.updatedAt);
      setStatus(
        "送信しました " + formatTime(new Date()) +
          "（相手の画面に数秒で届きます）",
        "success",
      );
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setStatus(error.message, "error");
      }
    } finally {
      busy = false;
    }
  }

  function saveReceived() {
    if (!receivedBlob) {
      return;
    }

    var url = URL.createObjectURL(receivedBlob);
    var link = document.createElement("a");
    link.href = url;
    link.download = receivedName || "received.bin";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 10000);

    setStatus("保存しました（ダウンロードに入ります）。", "success");
  }

  async function clearFile() {
    if (!currentCode) {
      return;
    }

    if (!window.confirm(
      "サーバーとこの画面のファイルを消します。よろしいですか？",
    )) {
      return;
    }

    requestGeneration += 1;

    var generationAtStart = requestGeneration;
    var codeAtStart = currentCode;

    setStatus("削除中...");

    try {
      await requestJson(apiUrl(codeAtStart, false), {
        method: "DELETE",
        headers: {
          "Accept": "application/json",
        },
      });

      if (
        generationAtStart !== requestGeneration ||
        codeAtStart !== currentCode
      ) {
        return;
      }

      clearReceivedView();
      lastUpdatedAt = null;
      setStatus("内容を消しました。", "success");
    } catch (error) {
      if (
        generationAtStart === requestGeneration &&
        codeAtStart === currentCode
      ) {
        setStatus(error.message, "error");
      }
    }
  }

  function changeCode() {
    requestGeneration += 1;
    stopPolling();
    removeSavedCode();

    currentCode = "";
    lastUpdatedAt = null;
    clearReceivedView();
    enableControls(false);
    showCodeSetup();

    codeInputEl.value = "";
    setStatus("新しい合言葉を入力してください。");
    codeInputEl.focus();
  }

  codeInputEl.addEventListener("input", function () {
    var value = normalizeCode(codeInputEl.value);
    codeInputEl.value = value.slice(0, 6);
  });

  codeInputEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      setCode(codeInputEl.value);
    }
  });

  useCodeBtn.addEventListener("click", function () {
    setCode(codeInputEl.value);
  });

  makeCodeBtn.addEventListener("click", function () {
    var code;

    try {
      code = generateCode();
    } catch (error) {
      setStatus(
        "このブラウザでは安全な合言葉を作れませんでした。",
        "error",
      );
      return;
    }

    codeInputEl.value = code;
    setCode(code);
  });

  changeCodeBtn.addEventListener("click", changeCode);

  pickBtn.addEventListener("click", function () {
    fileInput.click();
  });

  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files.length > 0) {
      sendFile(fileInput.files[0]);
    }

    fileInput.value = "";
  });

  document.addEventListener("paste", function (event) {
    if (!currentCode || !event.clipboardData) {
      return;
    }

    var items = event.clipboardData.items || [];

    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") {
        var file = items[i].getAsFile();

        if (file) {
          event.preventDefault();
          sendFile(file);
          return;
        }
      }
    }
  });

  dropZone.addEventListener("dragover", function (event) {
    event.preventDefault();
    dropZone.className = "send-panel drag";
  });

  dropZone.addEventListener("dragleave", function () {
    dropZone.className = "send-panel";
  });

  dropZone.addEventListener("drop", function (event) {
    event.preventDefault();
    dropZone.className = "send-panel";

    if (
      event.dataTransfer &&
      event.dataTransfer.files &&
      event.dataTransfer.files.length > 0
    ) {
      sendFile(event.dataTransfer.files[0]);
    }
  });

  saveBtn.addEventListener("click", saveReceived);
  clearBtn.addEventListener("click", clearFile);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      checkForNewFile(false);
      startPolling();
    } else {
      stopPolling();
    }
  });

  window.addEventListener("beforeunload", function () {
    stopPolling();
  });

  function initialize() {
    if (location.protocol !== "http:" && location.protocol !== "https:") {
      appEl.style.display = "none";
      startupErrorEl.style.display = "block";
      startupErrorEl.textContent =
        "このページは公開サイト（silver-computing-machine-7ql.pages.dev）から開いてください。";
      return;
    }

    var savedCode = loadSavedCode();

    if (isValidCode(savedCode)) {
      codeInputEl.value = savedCode;
      setCode(savedCode);
    } else {
      showCodeSetup();
      enableControls(false);
      setStatus("合言葉を設定してください。");
      codeInputEl.focus();
    }
  }

  initialize();
})();
</script>
</body>
</html>
