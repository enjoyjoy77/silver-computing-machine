const LS_KEY = "boardgames_pw";   // 5本のゲームで共通。1回入れれば全部開く

const dec = new TextDecoder();
const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const kb = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
              "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:bin(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    kb, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:bin(PAYLOAD.iv)}, key, bin(PAYLOAD.ct));
  return dec.decode(plain);
}

const $pw = document.getElementById("pw");
const $go = document.getElementById("go");
const $rm = document.getElementById("remember");
const $err = document.getElementById("err");
const $form = document.getElementById("loginform");

// 復号したゲームのHTMLで、このページを丸ごと置き換える(<script> も実行される)
function showGame(html){
  document.open();
  document.write(html);
  document.close();
}

async function saveCredential(pw){
  try{ if($rm.checked) localStorage.setItem(LS_KEY, pw); }catch(e){}
  try{ sessionStorage.setItem(LS_KEY, pw); }catch(e){}
  try{
    if(window.PasswordCredential){
      const cred = new PasswordCredential({id:"boardgames", password:pw, name:"ボードゲーム"});
      await navigator.credentials.store(cred);
    }
  }catch(e){}
}

async function tryOpen(pw, fromAuto){
  if(!pw){ if(!fromAuto) $err.textContent = "合言葉を入れてください"; return false; }
  $go.disabled = true;
  $err.textContent = fromAuto ? "保存した合言葉で開いています…" : "確認しています…";
  try{
    const html = await unlock(pw);
    await saveCredential(pw);
    showGame(html);
    return true;
  }catch(e){
    if(fromAuto){
      try{ localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY); }catch(_){}
      $err.textContent = "";
    }else{
      $err.textContent = "合言葉が違います";
      $pw.select();
    }
    $go.disabled = false;
    return false;
  }
}

$form.addEventListener("submit", e => { e.preventDefault(); tryOpen($pw.value, false); });

window.addEventListener("load", async ()=>{
  if(!window.crypto || !crypto.subtle){
    $err.textContent = "このブラウザでは開けません(暗号の機能がありません)。別のブラウザで試してください";
    return;
  }
  let pw = null;
  try{ pw = localStorage.getItem(LS_KEY) || sessionStorage.getItem(LS_KEY); }catch(e){}
  if(pw && await tryOpen(pw, true)) return;
  try{
    if(window.PasswordCredential && navigator.credentials && navigator.credentials.get){
      const cred = await navigator.credentials.get({password:true, mediation:"optional"});
      if(cred && cred.password && await tryOpen(cred.password, true)) return;
    }
  }catch(e){}
  $pw.focus();
});
</script>
