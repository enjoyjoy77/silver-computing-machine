<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ロボアクション</title>
<style>
  html,body{margin:0;height:100%;background:#12151c;color:#eee;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
  #gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .box{width:min(420px,100%);background:#1c2029;border:1px solid #3a4150;border-radius:14px;padding:24px 22px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9aa3b5;font-size:13px;margin:0 0 18px}
  input[type=password]{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border-radius:10px;border:1px solid #556;background:#0f1218;color:#fff}
  button.go{width:100%;margin-top:12px;font-size:17px;padding:12px;border:0;border-radius:10px;background:#4a9c5e;color:#fff;font-weight:bold;cursor:pointer}
  button.go:disabled{opacity:.6}
  .rm{display:block;margin-top:12px;font-size:13px;color:#bbb}
  #err{margin-top:10px;min-height:1.4em;color:#f88;font-size:14px}
  .back{display:block;margin-top:16px;text-align:center;font-size:13px;color:#8ab}
</style>
</head>
<body>
<div id="gate">
  <form class="box" id="loginform" autocomplete="on">
    <h1>🔒 ロボアクション</h1>
    <p class="sub">合言葉を入れると遊べます</p>
    <input id="pw" type="password" name="password" placeholder="合言葉" autocomplete="current-password">
    <button class="go" id="go" type="submit">ひらく</button>
    <label class="rm"><input id="remember" type="checkbox" checked>この端末では次から自動で開く</label>
    <div id="err"></div>
    <a class="back" href="./">← ボードゲーム一覧へ</a>
    <div style="text-align:right;font-size:10px;color:#556;margin-top:6px">rev1 (2026-09-11)</div>
  </form>
</div>

<script src="robo.part1.js"></script>
<script src="robo.part2.js"></script>
<script src="robo.part3.js"></script>
<script>
// 中身(ゲーム本体のHTML)は AES-256-GCM で暗号化してある。合言葉が無いと復号できない。
const PAYLOAD = {"salt": "YfrQy5fRCHpEXm17/dRlLQ==", "iv": "FcqAM0WYZIme7oAP", "ct": "", "iter": 600000};
const LS_KEY = "boardgames_pw";   // 5本のゲームで共通。1回入れれば全部開く

const dec = new TextDecoder();
const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// この1本は大きいので、暗号文を 3 個の部品ファイル(robo.part1.js など)に分けてある
function partsOk(){ const P = window.__PARTS || {}; for(let i = 1; i <= 3; i++){ if(typeof P[i] !== "string") return false; } return true; }
function allParts(){ const P = window.__PARTS; let s = PAYLOAD.ct; for(let i = 1; i <= 3; i++) s += P[i]; return s; }

async function unlock(pw){
  const kb = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
              "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:bin(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    kb, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:bin(PAYLOAD.iv)}, key, bin(allParts()));
  // この1本は大きいので、暗号化の前に縮めてある(deflate-raw)。ブラウザの標準機能で元に戻す
  const big = new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw")));
  return dec.decode(await big.arrayBuffer());
}

const $pw = document.getElementById("pw");
const $go = document.getElementById("go");
const $rm = document.getElementById("remember");
const $err = document.getElementById("err");
const $form = document.getElementById("loginform");

// 復号したゲームのHTMLで、このページを丸ごと置き換える(<script> も実行される)
function showGame(html){
  document.open();
  document.write(html);
  document.close();
}

async function saveCredential(pw){
  try{ if($rm.checked) localStorage.setItem(LS_KEY, pw); }catch(e){}
  try{ sessionStorage.setItem(LS_KEY, pw); }catch(e){}
  try{
    if(window.PasswordCredential){
      const cred = new PasswordCredential({id:"boardgames", password:pw, name:"ボードゲーム"});
      await navigator.credentials.store(cred);
    }
  }catch(e){}
}

async function tryOpen(pw, fromAuto){
  if(!pw){ if(!fromAuto) $err.textContent = "合言葉を入れてください"; return false; }
  $go.disabled = true;
  $err.textContent = fromAuto ? "保存した合言葉で開いています…" : "確認しています…";
  try{
    const html = await unlock(pw);
    await saveCredential(pw);
    showGame(html);
    return true;
  }catch(e){
    if(fromAuto){
      try{ localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY); }catch(_){}
      $err.textContent = "";
    }else{
      $err.textContent = "合言葉が違います";
      $pw.select();
    }
    $go.disabled = false;
    return false;
  }
}

$form.addEventListener("submit", e => { e.preventDefault(); tryOpen($pw.value, false); });

window.addEventListener("load", async ()=>{
  if(!partsOk()){
    $err.textContent = "部品のファイル(robo.part1.js など)が読めませんでした。ページと同じ場所に置いてください";
    return;
  }
  if(!window.crypto || !crypto.subtle || !window.DecompressionStream){
    $err.textContent = "このブラウザでは開けません(暗号の機能がありません)。別のブラウザで試してください";
    return;
  }
  let pw = null;
  try{ pw = localStorage.getItem(LS_KEY) || sessionStorage.getItem(LS_KEY); }catch(e){}
  if(pw && await tryOpen(pw, true)) return;
  try{
    if(window.PasswordCredential && navigator.credentials && navigator.credentials.get){
      const cred = await navigator.credentials.get({password:true, mediation:"optional"});
      if(cred && cred.password && await tryOpen(cred.password, true)) return;
    }
  }catch(e){}
  $pw.focus();
});
</script>
</body>
</html>
