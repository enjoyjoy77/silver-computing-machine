<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>てのひらピアノ</title>
<meta name="theme-color" content="#222225">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="てのひらピアノ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 濃い灰色の操作部分と、白黒の鍵盤。色は「押している鍵」「録音中」だけに使う */
:root{
  --bg:#222225; --panel:#2b2b2f; --btn:#38383d; --btn-down:#4b4b52; --ink:#ececee; --muted:#9d9da6; --line:#45454b;
  --kb-bg:#0d0d0f; --white:#f3f2ee; --white-top:#d9d8d2; --white-ink:#6a6a70;
  --black:#17171a; --black-low:#303036; --black-ink:#b7b7bd;
  --hit-white:#9cc0ff; --hit-black:#3b78dc; --rec:#ff4d43; --invert-ink:#18181b; --on-ink:#ffffff;
  --guide-white:#93dbb1; --guide-black:#2e9a5f; --partner:#e3b25b;
  --hand:#efe9e1; --hand-line:#1d1d22;
  --edge:8px;
  color-scheme:dark;
}
:root[data-edge="wide"]{--edge:18px}
:root[data-edge="wider"]{--edge:30px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--hit-white);outline-offset:2px}

/* ---- 演奏画面 ---- */
#app{
  position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;gap:8px;touch-action:none;
  padding:calc(env(safe-area-inset-top,0px) + var(--edge) * .75) calc(env(safe-area-inset-right,0px) + var(--edge))
          calc(env(safe-area-inset-bottom,0px) + var(--edge)) calc(env(safe-area-inset-left,0px) + var(--edge));
}
#bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px}
.grp{display:flex;align-items:center;gap:4px}
.btn{
  min-height:40px;min-width:36px;padding:0 9px;border:0;border-radius:9px;
  background:var(--btn);color:var(--ink);font-size:13px;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;touch-action:none;cursor:pointer;
}
.btn:active,.btn.down{background:var(--btn-down)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sq{padding:0;width:36px;font-size:17px}
.range-label{min-width:64px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot{min-width:42px;padding:0 6px;font-variant-numeric:tabular-nums}
.slot .n{font-size:10px;color:var(--muted);margin-right:2px}
.slot.cur{box-shadow:inset 0 0 0 2px var(--ink)}
#rec .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
#rec.on{color:var(--rec);box-shadow:inset 0 0 0 2px var(--rec)}
#rec.on .dot{background:var(--rec);border-radius:2px}
#rec .time{font-variant-numeric:tabular-nums}
#pedal{min-width:80px}
/* 横向きは 1 段、縦向きは「録音・道具」と「音域・登録」の 2 段に並べる */
@media (orientation:portrait){
  #g-tools{order:2} #g-range{order:3} #g-slots{order:4} #g-chord{order:4}
  .name-btn{max-width:132px}
  .btn.sq{width:34px;min-width:34px}
  .range-label{min-width:58px;font-size:12px}
  .slot{min-width:38px;padding:0 4px}
}
/* 横向きで 1 段に収まらないときは、JS が compact を付けて詰める */
#bar.compact{gap:4px}
#bar.compact #play .t,#bar.compact .slot .n{display:none}
#bar.compact .btn.sq{width:34px;min-width:34px}
#bar.compact .range-label{min-width:56px}
#bar.compact #pedal{min-width:72px}
#pedal .st{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--bg);color:var(--muted)}
#pedal[aria-pressed="true"]{background:var(--ink);color:var(--invert-ink)}
#pedal[aria-pressed="true"] .st{background:var(--invert-ink);color:var(--ink)}

#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#stage.row{flex-direction:row}
#kbwrap{position:relative;flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
#overview{display:block;flex:none;width:100%;height:26px;margin-bottom:6px;border-radius:5px}
#handLayer{position:absolute;left:0;top:0;z-index:5;pointer-events:none}
#readout{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(18px,6vw,30px);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;overflow:hidden}
#kb{position:relative;flex:none;width:100%;background:var(--kb-bg);border-radius:6px;overflow:hidden;touch-action:none}
.key{position:absolute;top:0}
.key.white{background:linear-gradient(var(--white-top),var(--white) 12px);border-radius:0 0 7px 7px}
.key.black{z-index:2;background:linear-gradient(var(--black) 0,var(--black) 88%,var(--black-low));border-radius:0 0 5px 5px;
  box-shadow:0 2px 3px rgba(0,0,0,.45)}
.key.white.on{background:var(--hit-white)}
.key.black.on{background:var(--hit-black)}
.lbl{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none;line-height:1.1;font-size:var(--lbl,14px);color:var(--white-ink)}
.lbl small{display:block;font-size:10px;opacity:.8}
.black .lbl{bottom:7px;font-size:10px;color:var(--black-ink)}
.key.white.guide{background:var(--guide-white);box-shadow:inset 0 7px 7px -5px rgba(0,0,0,.35)}
.key.black.guide{background:var(--guide-black);box-shadow:inset 0 5px 5px -3px rgba(0,0,0,.5)}
.key.white.on,.key.white.on.guide{background:var(--hit-white)}
.key.black.on,.key.black.on.guide{background:var(--hit-black)}
.edge{position:absolute;top:6px;z-index:3;padding:3px 8px;border-radius:7px;background:var(--guide-black);color:var(--on-ink);font-size:12px;pointer-events:none}
.edge.lo{left:6px} .edge.hi{right:6px}

/* 和音ボタン（伴奏して弾く）。横向きは鍵盤の左、縦向きは鍵盤の上 */
#pads{display:grid;gap:8px;min-height:0;min-width:0;touch-action:none}
#stage.row #pads{width:clamp(170px,36%,340px);flex:none}
#stage:not(.row) #pads{flex:1}
.cpad{border:0;border-radius:14px;background:var(--btn);color:var(--ink);min-height:0;min-width:0;padding:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:pointer;overflow:hidden}
.cpad b{font-size:clamp(17px,4.4vmin,30px);font-weight:700;letter-spacing:.01em;white-space:nowrap}
.cpad small{font-size:11px;color:var(--muted)}
.cpad.on{background:var(--hit-black);color:var(--on-ink)}
.cpad.on small{color:var(--on-ink)}
.cpad-empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);background:var(--panel);border-radius:14px;padding:12px;font-size:13px}

/* 画面ごとに要らない道具は隠す */
#g-chord,#g-song{display:none}
#app[data-mode="chord"] #g-chord{display:flex}
#app[data-mode="chord"] #g-slots{display:none}
#app[data-mode="song"] #g-song{display:flex}
#app[data-mode="song"] #g-rec{display:none}
.name-btn{max-width:170px;overflow:hidden;text-overflow:ellipsis;justify-content:flex-start}
.name-btn span{overflow:hidden;text-overflow:ellipsis}
#bar.compact .name-btn{max-width:120px}
#songPlay[aria-pressed="true"]{background:var(--ink);color:var(--invert-ink)}
#readout.guide-text{color:var(--guide-white)}
.mid-c::before{content:"";position:absolute;left:50%;bottom:44px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--white-ink);opacity:.6}

/* ---- 起動画面 ---- */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px)}
.start{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
.start h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em}
.start p{margin:0;color:var(--muted)}
.mini-kb{display:block;width:172px;max-width:100%;height:auto;margin:0 auto 4px}
.go{min-height:56px;border:0;border-radius:14px;background:var(--ink);color:var(--invert-ink);font-size:17px;font-weight:700;cursor:pointer}
.go:active{opacity:.85}
.go[aria-busy="true"]{opacity:.6}
.small{font-size:12px;color:var(--muted)}
.err{background:var(--panel);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.err p{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}

/* ---- 録音・設定の画面 ---- */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px)}
.sheet-head{display:flex;align-items:center;gap:8px;max-width:680px;width:100%;margin:0 auto;padding-bottom:8px}
.sheet-head .seg{flex:1}
.tabs{display:flex;max-width:680px;width:100%;margin:0 auto 8px;border-bottom:1px solid var(--line);gap:2px}
.tab{flex:1;min-height:36px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:14px;cursor:pointer;padding:0 2px}
.tab[aria-selected="true"]{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-user-select:text;user-select:text}
.sheet-body > section{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet h2{margin:8px 0 0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.item{display:flex;flex-direction:column;gap:8px}
.item-title{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.item-title output{color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:0 4px}
.seg button[aria-checked="true"]{background:var(--btn-down);color:var(--ink);font-weight:600}
input[type="range"]{width:100%;height:32px;accent-color:var(--ink);touch-action:pan-x}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rec-item{background:var(--panel);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rec-main{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.rec-name{font-size:15px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.rec-meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-actions{display:flex;gap:6px;flex-wrap:wrap}
.rec-actions .btn{flex:1;min-height:36px}
.rec-item input{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 10px}
.btn.warn{color:var(--rec)}
.chord-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.chord-row .num{color:var(--muted);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.sheet select,.sheet input[type="text"],.sheet input:not([type]){min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:0 8px;min-width:0;width:100%}
.chord-row .btns{display:flex;gap:4px}
.chord-row .btns .btn{min-width:34px;min-height:36px;padding:0 6px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;background:var(--panel);color:var(--muted);font-size:12px}
.cur-item{box-shadow:inset 0 0 0 2px var(--ink)}
.part-row{background:var(--panel);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.part-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.part-head b{font-size:14px;overflow-wrap:anywhere;min-width:0}
.part-head span{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel p{margin:0}
.panel .seg{background:var(--bg)}
.fit-ok{color:var(--guide-white)}
.range-pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range-pick select{width:auto;min-width:76px}
.empty{background:var(--panel);border-radius:12px;padding:16px;color:var(--muted)}
.probe{min-height:110px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);font-size:16px;touch-action:none;cursor:pointer}
.probe.down{background:var(--btn-down)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sheet a{color:var(--hit-white)}

#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:40;
  max-width:calc(100% - 32px);background:var(--ink);color:var(--invert-ink);padding:8px 14px;border-radius:10px;
  font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="app">
  <header id="bar">
    <div class="grp" id="g-rec">
      <button id="rec" class="btn" type="button" aria-pressed="false"><span class="dot"></span><span class="t">録音</span></button>
      <button id="play" class="btn" type="button" disabled>▶ <span class="t">再生</span></button>
    </div>
    <div class="grp" id="g-range" role="group" aria-label="音域">
      <button id="octDown" class="btn sq" type="button" aria-label="1オクターブ低く">«</button>
      <button id="down" class="btn sq" type="button" aria-label="白鍵1つ低く">‹</button>
      <div id="rangeLabel" class="range-label" aria-live="polite"></div>
      <button id="up" class="btn sq" type="button" aria-label="白鍵1つ高く">›</button>
      <button id="octUp" class="btn sq" type="button" aria-label="1オクターブ高く">»</button>
    </div>
    <div class="grp" id="g-slots" role="group" aria-label="登録した音域">
      <button class="btn slot" type="button" data-slot="0"></button>
      <button class="btn slot" type="button" data-slot="1"></button>
      <button class="btn slot" type="button" data-slot="2"></button>
    </div>
    <div class="grp" id="g-chord">
      <button id="chordSetBtn" class="btn name-btn" type="button" aria-label="和音のセットを選ぶ・直す"><span></span></button>
    </div>
    <div class="grp" id="g-song">
      <button id="songPlay" class="btn sq" type="button" aria-pressed="false" aria-label="曲を再生">▶</button>
      <button id="songBtn" class="btn name-btn" type="button" aria-label="曲と練習する範囲を選ぶ"><span></span></button>
    </div>
    <div class="grp" id="g-tools">
      <button id="pedal" class="btn" type="button" aria-pressed="false">ペダル <span class="st">切</span></button>
      <button id="panic" class="btn" type="button">全消音</button>
      <button id="menu" class="btn sq" type="button" aria-label="録音一覧と設定">≡</button>
    </div>
  </header>
  <div id="stage">
    <div id="pads" hidden></div>
    <div id="kbwrap">
      <div id="readout"></div>
      <canvas id="overview" aria-hidden="true" hidden></canvas>
      <div id="kb" aria-label="鍵盤"></div>
      <canvas id="handLayer" aria-hidden="true"></canvas>
    </div>
  </div>
</div>

<div id="start" class="overlay">
  <div class="start">
    <svg class="mini-kb" viewBox="0 0 172 64" aria-hidden="true">
      <g fill="var(--white)"><rect x="1" y="0" width="23" height="64" rx="3"/><rect x="25.5" y="0" width="23" height="64" rx="3"/><rect x="50" y="0" width="23" height="64" rx="3"/><rect x="74.5" y="0" width="23" height="64" rx="3"/><rect x="99" y="0" width="23" height="64" rx="3"/><rect x="123.5" y="0" width="23" height="64" rx="3"/><rect x="148" y="0" width="23" height="64" rx="3"/></g>
      <g fill="var(--black)" stroke="var(--bg)" stroke-width="1.5"><rect x="16" y="-2" width="15" height="40" rx="2"/><rect x="42" y="-2" width="15" height="40" rx="2"/><rect x="89" y="-2" width="15" height="40" rx="2"/><rect x="114" y="-2" width="15" height="40" rx="2"/><rect x="139" y="-2" width="15" height="40" rx="2"/></g>
    </svg>
    <h1>てのひらピアノ</h1>
    <p>押した瞬間に鳴る、広告のないピアノ。</p>
    <button id="go" class="go" type="button">音を有効にして始める</button>
    <p id="loadMsg" class="small">音源を準備しています</p>
    <div id="loadErr" class="err" hidden>
      <p id="loadErrMsg">音源を読み込めませんでした。</p>
      <div class="row">
        <button id="retry" class="btn" type="button">もう一度読み込む</button>
        <button id="simple" class="btn" type="button">簡易音で始める</button>
      </div>
    </div>
    <p class="small">横向きにすると鍵盤が大きくなります</p>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <div id="modeSeg" class="seg" role="radiogroup" aria-label="画面">
      <button type="button" role="radio" data-mode="play" aria-checked="true">ふつうに弾く</button>
      <button type="button" role="radio" data-mode="chord" aria-checked="false">伴奏して弾く</button>
      <button type="button" role="radio" data-mode="song" aria-checked="false">曲を練習する</button>
    </div>
    <button id="close" class="btn" type="button">閉じる</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" data-tab="recs" aria-selected="true">録音</button>
    <button class="tab" type="button" role="tab" data-tab="chords" aria-selected="false">和音</button>
    <button class="tab" type="button" role="tab" data-tab="songs" aria-selected="false">曲</button>
    <button class="tab" type="button" role="tab" data-tab="settings" aria-selected="false">設定</button>
    <button class="tab" type="button" role="tab" data-tab="info" aria-selected="false">情報</button>
  </div>
  <div class="sheet-body">
    <section id="tab-recs"></section>
    <section id="tab-chords" hidden></section>
    <section id="tab-songs" hidden></section>
    <section id="tab-settings" hidden></section>
    <section id="tab-info" hidden></section>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<input id="midiFile" type="file" accept=".mid,.midi,.rmi,audio/midi,audio/x-midi,audio/mid" hidden>

<script src="piano-core.js"></script>
<script src="music-core.js"></script>
<script>
(() => {
'use strict';
const C = window.PianoCore;
const $ = id => document.getElementById(id);
const VERSION = '1.2';
const FIXED_VEL = 0.8;   // 強弱「一定」のときの強さ（MIDI では 102）
const SAMPLE_CACHE = 'tenohira-piano-samples-v1';
const MAX_VOICES = 40;
const now = () => performance.now();

// ================= 保存 =================
const KEY_SET = 'tenohira-piano:settings', KEY_REC = 'tenohira-piano:recordings';
function loadJSON(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

let S = C.sanitizeSettings(loadJSON(KEY_SET));
let saveTimer = 0;
function saveSettings() { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveJSON(KEY_SET, S), 150); }
let recs = (loadJSON(KEY_REC) || []).map(C.sanitizeRecording).filter(Boolean);
function saveRecs() {
  if (!saveJSON(KEY_REC, recs)) toast('端末の保存領域がいっぱいで、録音を保存できませんでした。古い録音を消すか、バックアップを書き出してください', 5000);
}

// ================= 音 =================
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, master = null, out = null, revSend = null, revConv = null, revWet = null;
const buffers = new Map();       // 音源名 → AudioBuffer（左右を混ぜ、頭の無音を詰めたもの）
const failed = new Set();
let simpleMode = false;          // 音源が読めないときの簡易音

function makeContext() {
  try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { ctx = new AC(); }
  master = ctx.createGain();
  master.gain.value = volumeGain();
  // 和音を重ねて 1 を超えたときだけ丸める（遅れの出ない波形整形）。範囲を倍に取るため前後で 0.5 倍と 2 倍
  const pre = ctx.createGain(); pre.gain.value = 0.5;
  const shaper = ctx.createWaveShaper(); shaper.curve = softCurve();
  const post = ctx.createGain(); post.gain.value = 2;
  master.connect(pre); pre.connect(shaper); shaper.connect(post); post.connect(ctx.destination);
  out = pre;
  revConv = null; revSend = null; revWet = null;
  applyReverb();

}
function softCurve() {
  const n = 4097, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = (i / (n - 1) * 2 - 1) * 2, a = Math.abs(s);
    const y = a < 0.6 ? a : 0.6 + 0.38 * Math.tanh((a - 0.6) / 0.38);
    c[i] = Math.sign(s) * y / 2;
  }

}
function volumeGain() { return 1.4 * Math.pow(S.volume, 1.5); }

// 残響は作った響き（雑音を減衰させたもの）を畳み込む。切のときは畳み込みごと外して処理を減らす
function applyReverb() {
  if (!ctx) return;
  if (S.reverb === 'off') { if (revSend) revSend.disconnect(); return; }
  if (!revConv) {
    revConv = ctx.createConvolver(); revConv.buffer = makeIR();
    revSend = ctx.createGain(); revWet = ctx.createGain();
    master.connect(revSend); revConv.connect(revWet); revWet.connect(out);
  }
  revSend.disconnect(); revSend.connect(revConv);
  revWet.gain.value = S.reverb === 'deep' ? 0.75 : 0.4;
}
function makeIR() {
  const sr = ctx.sampleRate, len = Math.floor(sr * 2.2), b = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      lp += ((Math.random() * 2 - 1) - lp) * (0.2 + 0.7 * Math.exp(-t * 4));
      d[i] = lp * Math.exp(-t / 0.45) * (t < 0.015 ? t / 0.015 : 1);

}

// ---- 音源の読み込み ----
const loader = { queue: [], active: 0, settled: new Set() };
function sampleByName(n) { return C.SAMPLES.find(s => s.name === n); }

async function fetchSample(s) {

  let cache = null;
  try { if ('caches' in window) cache = await caches.open(SAMPLE_CACHE); } catch (e) { cache = null; }
  if (cache) {
    try { const hit = await cache.match(url); if (hit) return await hit.arrayBuffer(); } catch (e) { /* 読めなければ取り直す */ }
  }
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  if (cache) { try { await cache.put(url, res.clone()); } catch (e) { /* 容量不足などは無視して演奏を優先 */ } }

}
function decode(ab) {
  return new Promise((resolve, reject) => {
    const p = ctx.decodeAudioData(ab, resolve, reject);
    if (p && p.then) p.then(resolve, reject);
  });
}
// 左右を混ぜて 1 本に、頭の無音（MP3 の先頭の詰め物と録音の間）を詰め、8 秒を超える分は消えていくように切り、音量をならす
function prepare(dec, s) {
  const sr = dec.sampleRate, len = dec.length;
  const L = dec.getChannelData(0), R = dec.numberOfChannels > 1 ? dec.getChannelData(1) : L;
  let peak = 0;
  for (let i = 0; i < len; i++) { const v = Math.abs(L[i] + R[i]); if (v > peak) peak = v; }
  peak *= 0.5;
  const th = peak * 0.003;
  let on = 0;
  while (on < len && Math.abs((L[on] + R[on]) * 0.5) < th) on++;
  on = Math.max(0, on - Math.round(sr * 0.0005));

  const n = Math.max(1, Math.min(len - on, maxLen));

  for (let i = 0; i < n; i++) {
    let v = (L[on + i] + R[on + i]) * g;
    if (n === maxLen && i > n - fade) { const f = (n - i) / fade; v *= f * f; }
    d[i] = v;

}
async function loadOne(name) {
  const s = sampleByName(name);
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const ab = await fetchSample(s);
      const dec = await decode(ab);
      buffers.set(name, prepare(dec, s));
      failed.delete(name);
      return;
    } catch (e) {
      await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
    }
  }

}
function pump() {
  while (loader.active < 3 && loader.queue.length) {
    const name = loader.queue.shift();
    loader.active++;
    loadOne(name).finally(() => {

      onSampleSettled();
      pump();

}
function startLoading() {
  const lay = currentRange();
  loader.queue = C.loadOrder(lay.lo, lay.hi).filter(n => !buffers.has(n) && !loader.settled.has(n));

// 音域を動かしたら、まだの音源をいまの音域に近い順に並べ直す
function reprioritize() {

  const r = currentRange(), rest = new Set(loader.queue), first = new Set(neededNames());
  const order = C.loadOrder(r.lo, r.hi).filter(n => rest.has(n));
  loader.queue = order.filter(n => first.has(n)).concat(order.filter(n => !first.has(n)));
}
function retryFailed() {
  const names = [...failed];
  names.forEach(n => loader.settled.delete(n));
  failed.clear();
  loader.queue = names.concat(loader.queue.filter(n => !names.includes(n)));
  pump();
}

// ---- 声（1つの音）----
const voices = [];  // 鳴っているすべての声。古い順
let warnedSubstitute = false;

function startVoice(ch, midi, vel, when) {
  if (!ctx) return null;
  while (voices.length >= MAX_VOICES) {
    const victim = voices.find(v => v.released) || voices[0];
    killVoice(victim, ctx.currentTime);
    removeVoice(victim);
  }
  const t = Math.max(when || 0, 0);
  const level = Math.pow(vel / FIXED_VEL, 1.6);
  const rel = ctx.createGain();
  rel.gain.value = level;
  let src, head;
  const sample = simpleMode ? null : C.nearestSample(midi, buffers);
  if (sample) {
    if (!warnedSubstitute && Math.abs(sample.midi - midi) > 1) {
      warnedSubstitute = true;
      toast('一部の音源をまだ読み込めていないので、近い音の高さを変えて鳴らしています', 4000);
    }
    src = ctx.createBufferSource();
    src.buffer = buffers.get(sample.name);
    src.playbackRate.value = Math.pow(2, (midi - sample.midi) / 12);
    head = src;
    if (S.dynamics === 'position') {
      // 弱く押すほど高い倍音を削る（本物も弱打ほど丸い音になる）
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.Q.value = 0.5;
      f.frequency.value = 1200 + 17000 * Math.pow(vel, 2.2);
      src.connect(f); head = f;
    }
    head.connect(rel);
  } else {
    // 簡易音: 三角波と 2 倍音を、ピアノのように減衰させる
    const f0 = 440 * Math.pow(2, (midi - 69) / 12);
    const env = ctx.createGain();
    const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f0;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f0 * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(env); o2.connect(g2); g2.connect(env); env.connect(rel);
    const tt = Math.max(t, ctx.currentTime);
    env.gain.setValueAtTime(0, tt);
    env.gain.linearRampToValueAtTime(0.32, tt + 0.004);
    env.gain.setTargetAtTime(0.0001, tt + 0.004, 0.25 + Math.max(0, 96 - midi) / 40);
    o1.start(t); o2.start(t);
    src = { stop: w => { try { o1.stop(w); o2.stop(w); } catch (e) {} }, set onended(fn) { o1.onended = fn; } };
  }
  rel.connect(master);
  const v = { ch, midi, src, rel, level, released: false, killed: false, startAt: t, releaseAt: null };
  if (sample) src.start(t);
  else src.stop(t + 12);
  src.onended = () => { removeVoice(v); try { rel.disconnect(); } catch (e) {} };
  voices.push(v);
  ch.voices.add(v);
  return v;
}
function removeVoice(v) {
  const i = voices.indexOf(v);
  if (i >= 0) voices.splice(i, 1);
  v.ch.voices.delete(v);
  if (v.ch.sounding.get(v.midi) === v) v.ch.sounding.delete(v.midi);
}
// 離したとき。低い音ほど止音に少し時間がかかる
function releaseVoice(v, when) {
  if (v.released || v.killed) return;
  v.released = true;
  const t = Math.max(when, ctx.currentTime, v.startAt);
  const tau = v.midi < 48 ? 0.11 : v.midi < 72 ? 0.08 : 0.06;
  v.releaseAt = t;
  v.rel.gain.setValueAtTime(v.level, t);
  v.rel.gain.setTargetAtTime(0, t, tau);
  try { v.src.stop(t + tau * 8); } catch (e) {}
}
// すぐ止める（同じ鍵の打ち直し、全消音、声の上限）
function killVoice(v, when) {
  if (v.killed) return;
  const t = Math.max(when == null ? ctx.currentTime : when, ctx.currentTime);
  v.released = true; v.killed = true;
  if (t < v.startAt) {  // 再生の予約で、まだ鳴り始めていない
    try { v.rel.disconnect(); } catch (e) {}
    try { v.src.stop(t); } catch (e) {}
    return;
  }
  // 離す予約がこの先にあると、その時刻で音量が戻ってしまうので取り消す
  v.rel.gain.cancelScheduledValues(t);
  if (v.releaseAt == null || v.releaseAt > t) v.rel.gain.setValueAtTime(v.level, t);
  v.rel.gain.setTargetAtTime(0, t, 0.012);
  try { v.src.stop(t + 0.1); } catch (e) {}
}

// ---- 通り道（指で弾く音・再生の音・確認用の音を分けて持つ）----
class Channel {
  constructor() { this.voices = new Set(); this.sounding = new Map(); this.holders = new Map(); this.sustain = false; }
  noteOn(midi, vel, holder, when) {
    const old = this.sounding.get(midi);
    if (old) killVoice(old, when);
    const v = startVoice(this, midi, vel, when);
    if (v) this.sounding.set(midi, v);
    let h = this.holders.get(midi);
    if (!h) this.holders.set(midi, (h = new Set()));
    h.add(holder);
  }
  // 最後の指が離れたら true
  noteOff(midi, holder, when) {
    const h = this.holders.get(midi);
    if (!h || !h.has(holder)) return false;
    h.delete(holder);
    if (h.size) return false;
    this.holders.delete(midi);
    const v = this.sounding.get(midi);
    if (v && !this.sustain) { releaseVoice(v, when); this.sounding.delete(midi); }
    return true;
  }
  setSustain(on, when) {
    this.sustain = on;
    if (on) return;
    for (const [m, v] of [...this.sounding]) {
      if (!this.holders.has(m)) { releaseVoice(v, when); this.sounding.delete(m); }
    }
  }
  killAll() {
    for (const v of [...this.voices]) killVoice(v);
    this.sounding.clear(); this.holders.clear(); this.sustain = false;
  }
}
const live = new Channel(), replay = new Channel(), probe = new Channel(), chordCh = new Channel();

// ---- 音を起こす ----
let silentEl = null;
function setAudioSession() {
  try { if (navigator.audioSession) navigator.audioSession.type = S.mix === 'mix' ? 'ambient' : 'playback'; } catch (e) {}
}
function unlockAudio() {
  setAudioSession();
  if (!navigator.audioSession && /iPhone|iPad|iPod/.test(navigator.userAgent) && !silentEl) {
    // 古い iOS で、消音スイッチが入っていても鳴るようにする定番の手（無音の audio を流しておく）
    try { silentEl = new Audio(silentWav()); silentEl.loop = true; silentEl.play().catch(() => {}); } catch (e) {}
  }
  if (ctx.state === 'closed') rebuildContext();
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
  try {
    const b = ctx.createBuffer(1, 1, ctx.sampleRate), s = ctx.createBufferSource();
    s.buffer = b; s.connect(ctx.destination); s.start(0);
  } catch (e) {}
}
function wakeAudio() {
  if (!ctx) return;
  if (ctx.state === 'closed') rebuildContext();
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
}
function rebuildContext() {
  for (const ch of [live, replay, probe, chordCh]) { ch.voices.clear(); ch.sounding.clear(); ch.holders.clear(); ch.sustain = false; }
  if (songPlay) for (const ch of songPlay.chans) { ch.voices.clear(); ch.sounding.clear(); ch.holders.clear(); }
  voices.length = 0;
  makeContext();
}
function silentWav() {
  const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) b[o + i] = s.charCodeAt(i); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  b.fill(128, 44);
  let bin = ''; for (const x of b) bin += String.fromCharCode(x);
  return 'data:audio/wav;base64,' + btoa(bin);
}
function onCtxState() {
  if (!entered) return;
  if (ctx.state === 'running') { hideToast('stopped'); return; }
  releaseHeld();
  toast('音が止まりました。鍵盤に触れると戻ります', 0, 'stopped');
}

// ================= 鍵盤 =================
const kb = $('kb'), stage = $('stage'), readout = $('readout'), kbwrap = $('kbwrap'), padsEl = $('pads');
const overviewEl = $('overview'), handLayer = $('handLayer');
let lay = null, layVer = 0;
const keyEls = new Map();
const pressed = new Map();   // MIDI → 押している指の数
const guided = new Set();    // 曲の画面で、いま弾く音（光らせる鍵）
const guideFinger = new Map(); // その音の指番号
let edgeLo = null, edgeHi = null;

function isLandscape() { return innerWidth > innerHeight; }
function keyCount() {
  if (!isLandscape()) return S.keysPortrait;
  return S.mode === 'chord' ? S.keysChordLandscape : S.keysLandscape;
}
function currentRange() {
  const w = C.whiteKeys(C.clampStart(S.start, keyCount()), keyCount());
  return { lo: w[0], hi: w[w.length - 1] };
}

// 横向きで操作列が 2 段に折れたら、文字を減らして 1 段に戻す（鍵盤の高さを守る）
function fitBar() {
  const bar = $('bar');
  bar.classList.remove('compact');
  if (isLandscape() && bar.offsetHeight > 52) bar.classList.add('compact');
}
function buildKeyboard() {
  document.getElementById('app').dataset.mode = S.mode;
  fitBar();
  const count = keyCount();
  S.start = C.clampStart(S.start, count);
  const chordMode = S.mode === 'chord', land = isLandscape();
  padsEl.hidden = !chordMode;
  stage.classList.toggle('row', chordMode && land);
  kbwrap.style.flex = ''; kbwrap.style.height = '';
  const showOverview = S.mode === 'song' && S.overview === 'on';
  overviewEl.hidden = !showOverview;
  const ovH = showOverview ? 32 : 0;
  const stageH = stage.clientHeight - ovH;
  const W = kbwrap.clientWidth;
  if (!W || !stageH) return;
  const whiteW = W / count;
  let H;
  if (land) H = stageH;
  else if (chordMode) {
    // 縦向きの伴奏: 鍵盤の上に和音ボタンが 140px 以上入るようにする
    H = Math.min(stageH - 148, Math.max(200, whiteW * 6.2));
    kbwrap.style.flex = 'none'; kbwrap.style.height = H + 'px';
  } else H = Math.min(stageH, Math.max(200, whiteW * 6.2));
  H = Math.round(Math.max(120, H));
  lay = C.layout(S.start, count, W, H);
  layVer++;
  kb.style.height = H + 'px';
  kb.style.setProperty('--lbl', Math.max(10, Math.min(15, whiteW * 0.3)) + 'px');
  readout.hidden = chordMode || kbwrap.clientHeight - H - ovH < 48;
  const frag = document.createDocumentFragment();
  keyEls.clear();
  for (const k of lay.whites.concat(lay.blacks)) {
    const el = document.createElement('div');
    el.className = 'key ' + (k.black ? 'black' : 'white') + (k.midi === 60 ? ' mid-c' : '');
    // 白鍵どうしの境目は 1px あけて、下の黒を線として見せる
    const gap = k.black ? 0 : 1;
    el.style.left = (k.x + gap / 2) + 'px';
    el.style.width = (k.w - gap) + 'px';
    el.style.height = k.h + 'px';
    const text = keyLabel(k.midi);
    if (text) {
      const l = document.createElement('span');
      l.className = 'lbl';
      l.innerHTML = text;
      el.appendChild(l);
    }
    if (pressed.get(k.midi)) el.classList.add('on');
    if (guided.has(k.midi)) el.classList.add('guide');
    frag.appendChild(el);
    keyEls.set(k.midi, el);
  }
  // 弾く音が鍵盤の外にあるときに、端で知らせる札
  edgeLo = document.createElement('div'); edgeLo.className = 'edge lo'; edgeLo.textContent = '◀ もっと低い音'; edgeLo.hidden = true;
  edgeHi = document.createElement('div'); edgeHi.className = 'edge hi'; edgeHi.textContent = 'もっと高い音 ▶'; edgeHi.hidden = true;
  frag.appendChild(edgeLo); frag.appendChild(edgeHi);
  kb.textContent = '';
  kb.appendChild(frag);
  updateEdges();
  updateReadout();
  $('rangeLabel').textContent = C.noteLabel(lay.lowest, S.labelStyle) + '–' + C.noteLabel(lay.highest, S.labelStyle);
  updateSlots();
  sizeLayers();
  if (chordMode) renderPads();
  updateModeBar();
  saveSettings();
}
// 曲の画面: 光らせる鍵を差し替える
function setGuide(next) {
  for (const m of guided) if (!next.has(m)) { guided.delete(m); const el = keyEls.get(m); if (el) el.classList.remove('guide'); }
  for (const m of next) if (!guided.has(m)) { guided.add(m); const el = keyEls.get(m); if (el) el.classList.add('guide'); }
  updateEdges();
  updateReadout();
}
function updateEdges() {
  if (!edgeLo || !lay) return;
  let lo = false, hi = false;
  for (const m of guided) { if (m < lay.lowest) lo = true; else if (m > lay.highest) hi = true; }
  edgeLo.hidden = !lo; edgeHi.hidden = !hi;
}
function keyLabel(midi) {
  if (S.labels === 'none') return '';
  const isC = midi % 12 === 0;
  if (S.labels === 'c' && !isC) return '';
  const name = C.noteName(midi, S.labelStyle);
  if (C.isBlack(midi)) return lay && lay.whiteWidth * 0.6 < 30 ? '' : name;
  return isC ? name + '<small>' + C.octaveOf(midi) + '</small>' : name;
}
let rebuildQueued = false;
function queueRebuild() {
  if (rebuildQueued) return;
  rebuildQueued = true;
  requestAnimationFrame(() => { rebuildQueued = false; buildKeyboard(); });
}
function setPressed(midi, delta) {
  const n = Math.max(0, (pressed.get(midi) || 0) + delta);
  if (n) pressed.set(midi, n); else pressed.delete(midi);
  const el = keyEls.get(midi);
  if (el) el.classList.toggle('on', n > 0);
  updateReadout();
}
function updateReadout() {
  if (readout.hidden) return;
  const song = S.mode === 'song' && songPlay;
  const notes = [...(song ? guided : pressed.keys())].sort((a, b) => a - b);
  readout.classList.toggle('guide-text', !!song);
  const label = m => C.noteLabel(m, S.labelStyle) + (song && guideFinger.get(m) ? '（' + guideFinger.get(m) + '）' : '');
  readout.textContent = notes.length ? (song ? '弾く音　' : '') + notes.map(label).join('　') : '';
}

// ---- 指 ----
const pointers = new Map();  // pointerId → { midi, ver }

function press(id, midi, vel) {
  live.noteOn(midi, vel, id, 0);
  recOn(midi, vel);

const recBtn = $('rec'), playBtn = $('play');

const recHeld = new Map();

  recs.unshift(r);
  saveRecs();

// ---- 再生 ----
let playing = null;  // { r, startAt, idx, timer }
function playRecording(r) {
  stopReplay();
  if (!ctx) return;
  wakeAudio();
  playing = { r, startAt: ctx.currentTime + 0.12, idx: 0, timer: 0 };
  playing.timer = setInterval(schedule, 25);
  schedule();
  holdWake();
  updatePlayBtn(); renderRecs();
}
// 0.2 秒先までの出来事を、音の時計で予約していく
function schedule() {
  const p = playing;
  if (!p) return;
  const horizon = ctx.currentTime + 0.2, evs = p.r.events;
  while (p.idx < evs.length) {
    const [t, k, n, v] = evs[p.idx];
    const when = p.startAt + t / 1000;
    if (when > horizon) break;
    if (k === C.EV_ON) replay.noteOn(n, Math.max(0.05, v / 127), 'r', when);
    else if (k === C.EV_OFF) replay.noteOff(n, 'r', when);
    else replay.setSustain(!!n, when);
    p.idx++;
  }
  if (p.idx >= evs.length && ctx.currentTime > p.startAt + p.r.duration / 1000 + 0.4) stopReplay(true);
}

  clearInterval(playing.timer);

// ================= 曲（MIDI ファイル）=================
const KEY_SONGS = 'tenohira-piano:songs';
const SPEEDS = [0.5, 0.7, 0.85, 1];
function sanitizeSong(x) {
  if (!x || typeof x !== 'object' || !Array.isArray(x.versions)) return null;
  const versions = x.versions.filter(v => v && typeof v.midi === 'string' && v.midi.length < 4e6).map(v => ({
    id: typeof v.id === 'string' && v.id ? v.id.slice(0, 40) : uid('v'),
    label: M.VERSION_LABELS.includes(v.label) ? v.label : 'そのほか',
    file: typeof v.file === 'string' ? v.file.slice(0, 120) : '',
    midi: v.midi,
    roles: v.roles && typeof v.roles === 'object' ? v.roles : null,
    from: Math.max(1, v.from | 0 || 1), to: Math.max(1, v.to | 0 || 4),
    split: v.split && typeof v.split.part === 'string' && Number.isInteger(v.split.at) ? { part: v.split.part, at: v.split.at } : null,
  }));
  if (!versions.length) return null;
  return {
    id: typeof x.id === 'string' && x.id ? x.id.slice(0, 40) : uid('s'),
    name: typeof x.name === 'string' && x.name.trim() ? x.name.trim().slice(0, 60) : '曲',
    created: Number(x.created) || Date.now(),
    cur: versions.some(v => v.id === x.cur) ? x.cur : versions[0].id,
    versions,
    speed: SPEEDS.includes(x.speed) ? x.speed : 1,
    loop: x.loop !== false,
    guide: x.guide !== false,
  };
}
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
let songs = (loadJSON(KEY_SONGS) || []).map(sanitizeSong).filter(Boolean);
function saveSongs() {
  if (!saveJSON(KEY_SONGS, songs)) { toast('端末の保存領域がいっぱいで、曲を保存できませんでした。古い録音や曲を消してください', 5000); return false; }
  return true;
}
function currentSong() { return songs.find(x => x.id === S.song) || null; }
function currentVersion(song) { return song ? song.versions.find(v => v.id === song.cur) || song.versions[0] : null; }

function b64FromBytes(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function bytesFromB64(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
// 版ごとに読み取った結果を覚えておく（分け方を変えたら読み直す）
const tlCache = new Map();
function timelineFor(ver) {
  const key = ver.id + '|' + (ver.split ? ver.split.part + '@' + ver.split.at : '');
  if (tlCache.has(key)) return tlCache.get(key);
  let tl = null;
  try { tl = M.songTimeline(M.parseMidi(bytesFromB64(ver.midi)), { split: ver.split }); }
  catch (e) { tl = { error: M.MIDI_MESSAGES[e.code] || 'このファイルは読めませんでした。' }; }
  tlCache.set(key, tl);
  return tl;
}
// 版の役割を、いまのパートに合わせて整える（分け方を変えたあとなど）
function rolesFor(ver, tl) {
  const keys = tl.parts.map(p => p.key);
  if (!ver.roles || !keys.every(k => ver.roles[k])) ver.roles = M.defaultRoles(tl.parts);
  for (const k of Object.keys(ver.roles)) if (!keys.includes(k)) delete ver.roles[k];
  return ver.roles;
}

// ---- 曲を鳴らす ----
let songPlay = null;
function startSong() {
  const song = currentSong(), ver = currentVersion(song);
  if (!ver) { openSheet('songs'); return; }
  const tl = timelineFor(ver);
  if (tl.error) { toast(tl.error, 4000); return; }
  if (!ctx) return;
  stopSong();
  wakeAudio();
  const roles = rolesFor(ver, tl);
  const r = M.barRange(tl, ver.from, ver.to);
  const audible = p => roles[p.key] === 'play' || (roles[p.key] === 'self' && song.guide);
  const vis = practiceModel().vis;
  songPlay = {
    song, ver, tl, range: r, lenMs: r.endMs - r.startMs, speed: song.speed, loop: song.loop,
    evs: M.rangeEvents(tl, r.startMs, r.endMs, audible), vis,
    chans: tl.parts.map(() => new Channel()),
    t0: ctx.currentTime + 0.35, startAt: 0, idx: 0, timer: 0, raf: 0, lastBar: -1,
  };
  songPlay.startAt = songPlay.t0;
  songPlay.timer = setInterval(scheduleSong, 25);
  scheduleSong();
  songPlay.raf = requestAnimationFrame(drawSong);
  holdWake();
  updateModeBar();
}
function scheduleSong() {
  const p = songPlay;
  if (!p) return;
  const horizon = ctx.currentTime + 0.25, cycle = p.lenMs / 1000 / p.speed;
  for (;;) {
    if (p.idx >= p.evs.length) {
      const end = p.startAt + cycle;
      if (!p.loop) { if (ctx.currentTime > end + 0.3) stopSong(true); return; }
      if (end > horizon) return;          // 次の周回はまだ先
      p.startAt = end; p.idx = 0;
      if (!p.evs.length) return;
      continue;
    }
    const e = p.evs[p.idx], when = p.startAt + e[0] / 1000 / p.speed;
    if (when > horizon) return;
    const ch = p.chans[e[4]];
    if (e[1] === 1) ch.noteOn(e[2], Math.max(0.08, e[3]), 'song', when);
    else if (e[1] === 0) ch.noteOff(e[2], 'song', when);
    else ch.setSustain(!!e[2], when);
    p.idx++;
  }
}
// いま曲のどこか（範囲の頭からのミリ秒）。音が実際に耳に届く遅れの分だけ戻す
function songPos(p) {
  const lat = (ctx.outputLatency || 0) + (ctx.baseLatency || 0);
  const ms = (ctx.currentTime - lat - p.t0) * 1000 * p.speed;
  if (ms < 0) return -1;
  return p.loop ? ms % p.lenMs : ms;
}
function drawSong() {
  const p = songPlay;
  if (!p) return;
  const pos = songPos(p);
  const next = new Set();
  guideFinger.clear();
  if (pos >= 0) for (const n of p.vis) { if (n.a > pos) break; if (pos < n.b) { next.add(n.note); if (n.finger) guideFinger.set(n.note, n.finger); } }
  setGuide(next);
  drawPractice(pos);
  // 何小節目か
  if (pos >= 0) {
    const abs = p.range.startMs + pos;
    let bar = p.range.from;
    while (bar < p.range.to && p.tl.bars[bar] <= abs) bar++;
    if (bar !== p.lastBar) { p.lastBar = bar; updateModeBar(); }
  }
  p.raf = requestAnimationFrame(drawSong);
}
function stopSong(finished) {
  const p = songPlay;
  if (!p) return;
  clearInterval(p.timer);
  cancelAnimationFrame(p.raf);
  songPlay = null;
  for (const ch of p.chans) { if (finished) ch.setSustain(false, ctx.currentTime); else ch.killAll(); }
  guideFinger.clear();
  setGuide(new Set());
  drawPractice(-1);
  releaseWake();
  updateModeBar();
}
$('songPlay').addEventListener('click', () => { if (songPlay) stopSong(); else startSong(); });
$('songBtn').addEventListener('click', () => openSheet('songs'));

// ================= お手本の手・次の音・全体の鍵盤（曲の画面）=================
// 練習する範囲の「自分で弾く」音を、指使いと手の動きまで含めて用意する。曲・範囲・役割が変わったら作り直す
let pmKey = '', pm = null;
function practiceModel() {
  const song = currentSong(), ver = currentVersion(song);
  if (!ver) return null;
  const tl = timelineFor(ver);
  if (tl.error) return null;
  const roles = rolesFor(ver, tl), r = M.barRange(tl, ver.from, ver.to);
  const key = [ver.id, JSON.stringify(ver.split), JSON.stringify(roles), r.from, r.to].join('|');
  if (key === pmKey) return pm;
  const inRange = n => n.ms >= r.startMs - 0.5 && n.ms < r.endMs;
  const hands = [], acc = [];
  for (const p of tl.parts) {
    const role = roles[p.key];
    if (role === 'self') {
      const hand = M.guessHand(p);
      // 指使いは曲全体で付けてから範囲を切り出す（範囲の頭で指が不自然にならないように）
      const all = p.notes.map(n => ({ a: n.ms, b: n.end, note: n.note, finger: n.finger || 0 }));
      const given = p.notes.some(n => n.finger);
      const fingers = M.assignFingering(all, hand);
      const notes = [];
      p.notes.forEach((n, i) => { if (inRange(n)) notes.push({ a: n.ms - r.startMs, b: Math.min(n.end, r.endMs) - r.startMs, note: n.note, finger: fingers[i] }); });
      hands.push({ hand, notes, track: M.handTrack(notes, hand), given, name: p.name });
    } else if (role === 'play') {
      for (const n of p.notes) if (inRange(n)) acc.push({ a: n.ms - r.startMs, b: Math.min(n.end, r.endMs) - r.startMs, note: n.note });
    }
  }
  acc.sort((x, y) => x.a - y.a);
  pmKey = key;
  pm = { hands, acc, vis: hands.flatMap(h => h.notes).sort((x, y) => x.a - y.a) };
  return pm;
}

let layerDpr = 1, keyRects = new Map(), tokens = null;
function cssTokens() {
  if (tokens) return tokens;
  const cs = getComputedStyle(document.documentElement), v = k => cs.getPropertyValue(k).trim();
  tokens = { guide: v('--guide-black'), guideLight: v('--guide-white'), partner: v('--partner'), hit: v('--hit-black'),
    white: v('--white'), black: v('--black'), ink: v('--ink'), bg: v('--kb-bg'), hand: v('--hand'), line: v('--hand-line'), onInk: v('--on-ink') };
  return tokens;
}
// 手の層を鍵盤にぴったり重ね、全体の鍵盤の大きさを合わせる
function sizeLayers() {
  layerDpr = Math.min(3, window.devicePixelRatio || 1);
  const song = S.mode === 'song' && lay;
  handLayer.hidden = !song;
  keyRects = new Map(lay ? lay.whites.concat(lay.blacks).map(k => [k.midi, k]) : []);
  if (song) {
    handLayer.style.left = kb.offsetLeft + 'px'; handLayer.style.top = kb.offsetTop + 'px';
    handLayer.style.width = lay.width + 'px'; handLayer.style.height = lay.height + 'px';
    handLayer.width = Math.round(lay.width * layerDpr); handLayer.height = Math.round(lay.height * layerDpr);
  }
  if (!overviewEl.hidden) {
    overviewEl.width = Math.round(overviewEl.clientWidth * layerDpr);
    overviewEl.height = Math.round(overviewEl.clientHeight * layerDpr);
  }
  if (!songPlay) drawPractice(-1);
}

// pos は範囲の頭からのミリ秒（-1 なら止まっている＝最初の構えを見せる）
function drawPractice(pos) {
  if (S.mode !== 'song' || !lay) return;
  const g = handLayer.getContext('2d');
  g.setTransform(layerDpr, 0, 0, layerDpr, 0, 0);
  g.clearRect(0, 0, lay.width, lay.height);
  const model = practiceModel();
  drawOverview(model, pos);
  if (!model) return;
  // 次の音の予告は、実際の時間でおよそ 0.6 秒前から
  const lead = S.preview === 'on' ? 600 * (songPlay ? songPlay.speed : currentSong() ? currentSong().speed : 1) : 0;
  for (const h of model.hands) {
    const pose = M.handPoseAt(h.track, h.notes, pos, lead);
    if (!pose) continue;
    if (S.preview === 'on') for (const n of pose.upcoming) drawNextKey(g, n);
    if (S.showHand === 'on') drawHand(g, pose, h.hand);
    else drawKeyFingers(g, h.notes, pos);
  }
}
// 次に押す鍵: 鍵の奥の方を緑で縁取り、指番号を出す（手に隠れない所）
function drawNextKey(g, n) {
  const k = keyRects.get(n.note), T = cssTokens();
  if (!k) return;
  // 白鍵の奥は両隣の黒鍵にはさまれて細くなっているので、見えている所だけを囲む
  let left = k.x, right = k.x + k.w, h = k.h;
  if (!k.black) {
    for (const b of lay.blacks) {
      if (b.x < left + 1 && b.x + b.w > left) left = b.x + b.w;
      if (b.x < right && b.x + b.w > right - 1) right = b.x;
    }
    h = lay.blacks.length ? lay.blacks[0].h : k.h * 0.6;
  }
  g.save();
  g.strokeStyle = T.guide; g.lineWidth = 3;
  roundRect(g, left + 2.5, 2.5, right - left - 5, h - 5, 5); g.stroke();
  if (n.finger) badge(g, (left + right) / 2, 20, n.finger, T.guide, T.onInk);
  g.restore();
}
// 手を出さないときは、光っている鍵の手前に指番号を出す
function drawKeyFingers(g, notes, pos) {
  const T = cssTokens();
  for (const n of notes) {
    if (n.a > pos) break;
    if (pos >= n.b || !n.finger) continue;
    const k = keyRects.get(n.note);
    if (k) badge(g, k.x + k.w / 2, k.black ? k.h - 18 : k.h - 46, n.finger, T.onInk, T.guide);
  }
}
function badge(g, x, y, num, fill, ink) {
  const r = Math.max(8, Math.min(11, lay.whiteWidth * 0.18));
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill();
  g.fillStyle = ink; g.font = '700 ' + Math.round(r * 1.25) + 'px system-ui, -apple-system, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(num), x, y + 0.5);
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 真上から見た手。指先は鍵の上、付け根は手のひらに並び、手のひらは手前（画面の下）へ抜ける
const FINGER_W = [0.46, 0.40, 0.42, 0.39, 0.33];
function drawHand(g, pose, hand) {
  const T = cssTokens(), W = lay.whiteWidth, H = lay.height, dir = hand === 'L' ? -1 : 1;
  const x0 = M.keyPos(lay.lowest) - 0.5, toX = kp => (kp - x0) * W;
  const alpha = S.handShade === 'normal' ? 0.82 : 0.55;
  const tipWhite = H * 0.65, tipBlack = H * 0.40;
  const L = Math.max(W * 0.7, Math.min(W * 1.15, H * 0.2));       // 指の見えている長さ（手のひらが少し見えるように）
  const tips = pose.x.map((kp, i) => ({ x: toX(kp), y: tipWhite + (tipBlack - tipWhite) * pose.black[i] + (i === 0 ? H * 0.05 : 0) }));
  const baseY = tipWhite + L;
  // 付け根は、指先に引っぱられつつ手のひらの幅に収まる
  const cx = (tips[1].x + tips[2].x + tips[3].x + tips[4].x) / 4, spread = W * 0.82;
  const knuckles = [null];
  for (let f = 2; f <= 5; f++) {
    const natural = cx + dir * (f - 3.5) * spread;
    knuckles[f - 1] = { x: natural * 0.6 + tips[f - 1].x * 0.4, y: baseY + (f === 5 ? -L * 0.16 : f === 3 ? -L * 0.04 : 0) };
  }
  const thumbBase = { x: knuckles[1].x - dir * W * 0.85, y: baseY + L * 0.6 };
  knuckles[0] = thumbBase;
  g.save();
  g.globalAlpha = alpha;
  g.lineJoin = 'round'; g.lineCap = 'round';
  // 手のひら
  const k2 = knuckles[1], k5 = knuckles[4], pad = W * 0.22;
  g.beginPath();
  g.moveTo(k5.x + dir * pad, k5.y + W * 0.1);
  g.quadraticCurveTo(cx, Math.min(k2.y, k5.y) - W * 0.28, k2.x - dir * pad * 0.6, k2.y - W * 0.05);
  g.quadraticCurveTo(thumbBase.x + dir * W * 0.1, thumbBase.y - W * 0.25, thumbBase.x - dir * W * 0.05, thumbBase.y + W * 0.3);
  g.lineTo(thumbBase.x + dir * W * 0.2, H + 40);
  g.lineTo(k5.x + dir * pad * 1.2, H + 40);
  g.closePath();
  g.save(); g.globalAlpha = Math.min(1, alpha + 0.12);
  g.fillStyle = T.hand; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = T.line; g.stroke();
  g.restore();
  // 指（親指を先に描いて、くぐったときは下に見せる）
  const order = [0, 1, 2, 3, 4];
  for (const i of order) {
    const k = knuckles[i], t = tips[i], w = FINGER_W[i] * W;
    const pressed = pose.pressed[i], next = pose.next[i];
    // 指先は鍵の上で止める（丸い先の分だけ手前で線を終える）
    const ang = Math.atan2(t.y - k.y, t.x - k.x), end = { x: t.x - Math.cos(ang) * w * 0.5, y: t.y - Math.sin(ang) * w * 0.5 };
    if (pressed) {   // 押さえている指先の下に影
      g.save(); g.globalAlpha = 0.35; g.fillStyle = '#000';
      g.beginPath(); g.ellipse(t.x, t.y + w * 0.15, w * 0.55, w * 0.4, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
    g.beginPath(); g.moveTo(k.x, k.y); g.lineTo(end.x, end.y);
    g.lineWidth = w + 3; g.strokeStyle = next ? T.guide : T.line; g.stroke();
    g.lineWidth = w; g.strokeStyle = pressed ? T.guide : T.hand; g.stroke();
    // 爪
    g.save(); g.globalAlpha = alpha * 0.5;
    g.beginPath(); g.ellipse(end.x - Math.cos(ang) * w * 0.15, end.y - Math.sin(ang) * w * 0.15, w * 0.26, w * 0.32, ang - Math.PI / 2, 0, Math.PI * 2);
    g.fillStyle = pressed ? T.guideLight : '#ffffff'; g.fill(); g.restore();
  }
  g.restore();
  // 指番号は濃く出す（手を薄くしても読めるように）
  for (const i of order) {
    const k = knuckles[i], t = tips[i], ang = Math.atan2(t.y - k.y, t.x - k.x), back = FINGER_W[i] * W * 0.9;
    const pressed = pose.pressed[i];
    badge(g, t.x - Math.cos(ang) * back, t.y - Math.sin(ang) * back, i + 1, pressed ? T.guide : 'rgba(29,29,34,.78)', T.onInk);
  }
}

// 鍵盤全体（88 鍵）。いま見えている所を枠で囲み、鳴っている鍵を、自分のパートは緑、先生のパートは黄色で塗る
function drawOverview(model, pos) {
  if (overviewEl.hidden) return;
  const T = cssTokens(), g = overviewEl.getContext('2d');
  const w = overviewEl.width / layerDpr, h = overviewEl.height / layerDpr;
  g.setTransform(layerDpr, 0, 0, layerDpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const ww = w / 52, base = M.keyPos(21) - 0.5, xOf = m => (M.keyPos(m) - base) * ww;
  const own = new Set(), partner = new Set();
  if (model && pos >= 0) {
    for (const n of model.vis) { if (n.a > pos) break; if (pos < n.b) own.add(n.note); }
    for (const n of model.acc) { if (n.a > pos) break; if (pos < n.b) partner.add(n.note); }
  }
  const color = m => own.has(m) ? T.guide : partner.has(m) ? T.partner : pressed.get(m) ? T.hit : null;
  g.fillStyle = T.bg; g.fillRect(0, 0, w, h);
  for (let m = 21; m <= 108; m++) {
    if (C.isBlack(m)) continue;
    const x = xOf(m) - ww / 2;
    g.fillStyle = color(m) || T.white; g.fillRect(x + 0.5, 0, ww - 1, h);
  }
  for (let m = 22; m <= 107; m++) {
    if (!C.isBlack(m)) continue;
    const bw = ww * 0.62, x = xOf(m) - bw / 2;
    g.fillStyle = color(m) || T.black; g.fillRect(x, 0, bw, h * 0.6);
  }
  if (lay) {
    const a = xOf(lay.lowest) - ww / 2, b = xOf(lay.highest) + ww / 2;
    g.strokeStyle = T.hit; g.lineWidth = 2; g.strokeRect(a + 1, 1, b - a - 2, h - 2);
  }
}

function updateModeBar() {

// ================= 画面の切り替え =================
function setMode(m) {
  if (!['play', 'chord', 'song'].includes(m)) return;
  if (S.mode !== m) {
    releaseHeld();
    stopChord();
    stopSong();
    S.mode = m;
    saveSettings();
  }
  renderModeSeg();
  buildKeyboard();
  reprioritize();
}
function renderModeSeg() {

}
$('modeSeg').addEventListener('click', e => {

  closeSheet();
});

// ---- 画面を消さない（録音・再生の間だけ）----
let wakeLock = null, wakeWant = 0;
function holdWake() {
  wakeWant++;
  if (wakeLock || !navigator.wakeLock) return;
  navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { wakeLock = null; }); }).catch(() => {});
}
function releaseWake() {
  wakeWant = Math.max(0, wakeWant - 1);
  if (!wakeWant && wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// ---- ファイルを渡す ----
async function giveFile(blob, name) {
  const coarse = matchMedia('(pointer:coarse)').matches;
  if (coarse && navigator.canShare && window.File) {
    try {
      const f = new File([blob], name, { type: blob.type });
      if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function stamp(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

// ================= 録音・設定・情報の画面 =================
const sheet = $('sheet');
let tab = 'recs';

}
$('menu').addEventListener('click', () => openSheet());

sheet.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) showTab(b.dataset.tab); });

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---- 録音一覧 ----
let delConfirm = null, editing = null;
function renderRecs() {
  const el = $('tab-recs');
  const typing = editing && $('rename-' + editing);
  const typed = typing ? typing.value : null;
  const hadFocus = typing && document.activeElement === typing;
  let h = '<h2>録音</h2>';
  if (!recs.length) {
    h += '<div class="empty">まだ録音がありません。演奏画面の「録音」を押して弾き、もう一度押すと、ここに残ります。</div>';
  } else {
    h += '<ul class="list">';
    for (const r of recs) {
      const isPlaying = playing && playing.r === r;
      h += '<li class="rec-item" data-id="' + esc(r.id) + '">';
      if (editing === r.id) {
        h += '<div class="row"><input id="rename-' + esc(r.id) + '" value="' + esc(typed != null ? typed : r.name) + '" maxlength="60" aria-label="録音の名前">'
          + '<button class="btn" type="button" data-act="save">決定</button></div>';
      } else {
        h += '<div class="rec-main"><span class="rec-name">' + esc(r.name) + '</span><span class="rec-meta">'
          + C.formatDuration(r.duration, true) + '・' + C.countNotes(r.events) + '音</span></div>';
      }
      h += '<div class="rec-actions">'
        + '<button class="btn" type="button" data-act="play">' + (isPlaying ? '■ 停止' : '▶ 再生') + '</button>'
        + '<button class="btn" type="button" data-act="midi">MIDIで保存</button>'
        + '<button class="btn" type="button" data-act="rename">名前</button>'
        + '<button class="btn' + (delConfirm === r.id ? ' warn' : '') + '" type="button" data-act="del">' + (delConfirm === r.id ? '本当に消す' : '削除') + '</button>'
        + '</div></li>';
    }
    h += '</ul>';
  }
  h += '<h2>バックアップ</h2>'
    + '<p class="note">録音・和音のセット・曲・設定はこの端末のブラウザの中にだけあります。ブラウザのデータを消すと一緒に消えるので、ときどき書き出しておくと安心です。</p>'
    + '<div class="row"><button class="btn" type="button" data-act="export">書き出す</button>'
    + '<button class="btn" type="button" data-act="import">読み込む</button></div>';
  el.innerHTML = h;
  const inp = editing && $('rename-' + editing);
  if (inp && (!typing || hadFocus)) { inp.focus(); if (!typing) inp.select(); }
}
$('tab-recs').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'export') return exportBackup();
  if (act === 'import') return $('importFile').click();
  const li = b.closest('.rec-item');
  const r = li && recs.find(x => x.id === li.dataset.id);
  if (!r) return;
  if (act !== 'del') delConfirm = null;
  if (act === 'play') { if (playing && playing.r === r) stopReplay(); else playRecording(r); }
  else if (act === 'midi') {
    giveFile(new Blob([C.toMidi(r.events, { name: r.name })], { type: 'audio/midi' }), 'tenohira-' + stamp(r.created) + '.mid');
  } else if (act === 'rename') { editing = r.id; renderRecs(); }
  else if (act === 'save') { saveName(r); }
  else if (act === 'del') {
    if (delConfirm !== r.id) { delConfirm = r.id; renderRecs(); setTimeout(() => { if (delConfirm === r.id) { delConfirm = null; renderRecs(); } }, 4000); return; }
    if (playing && playing.r === r) stopReplay();
    recs = recs.filter(x => x !== r);
    delConfirm = null;
    saveRecs(); updatePlayBtn(); renderRecs();
  }
});
$('tab-recs').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !editing) return;
  const r = recs.find(x => x.id === editing);
  if (r) saveName(r);
});
function saveName(r) {
  const inp = $('rename-' + r.id);
  const v = inp ? inp.value.trim() : '';
  if (v) r.name = v.slice(0, 60);
  editing = null;
  saveRecs(); renderRecs();
}

function exportBackup() {
  const data = { app: 'tenohira-piano', version: 2, exportedAt: new Date().toISOString(), settings: S, recordings: recs, chordSets, songs };
  giveFile(new Blob([JSON.stringify(data)], { type: 'application/json' }), 'tenohira-backup-' + stamp(Date.now()) + '.json');
}
$('importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || data.app !== 'tenohira-piano') throw new Error('kind');
    const got = (Array.isArray(data.recordings) ? data.recordings : []).map(C.sanitizeRecording).filter(Boolean);
    const have = new Set(recs.map(r => r.id));
    const added = got.filter(r => !have.has(r.id));
    recs = recs.concat(added).sort((a, b) => b.created - a.created);
    // 和音のセットと曲は、同じ id のものを重ねない
    const gotSets = (Array.isArray(data.chordSets) ? data.chordSets : []).map(M.sanitizeChordSet).filter(Boolean);
    const haveSets = new Set(chordSets.map(x => x.id));
    const addedSets = gotSets.filter(x => !haveSets.has(x.id));
    chordSets = chordSets.concat(addedSets);
    const gotSongs = (Array.isArray(data.songs) ? data.songs : []).map(sanitizeSong).filter(Boolean);
    const haveSongs = new Set(songs.map(x => x.id));
    const addedSongs = gotSongs.filter(x => !haveSongs.has(x.id));
    songs = songs.concat(addedSongs);
    if (data.settings) {
      stopChord(); stopSong();
      S = C.sanitizeSettings(data.settings);
      applyAllSettings();
    }
    saveRecs(); saveChordSets(); saveSongs(); saveSettings(); updatePlayBtn(); renderRecs();
    const parts = ['録音 ' + added.length + ' 件'];
    if (addedSets.length) parts.push('和音のセット ' + addedSets.length + ' 個');
    if (addedSongs.length) parts.push('曲 ' + addedSongs.length + ' 曲');
    toast(parts.join('・') + (data.settings ? 'と設定' : '') + 'を読み込みました', 3000);
  } catch (err) {
    toast(err.message === 'kind' ? 'てのひらピアノのバックアップではないファイルです' : 'ファイルを読めませんでした。書き出したときの .json を選んでください', 4000);
  }
});

// ---- 和音のセット ----
let setEditing = null, setDel = null;
function chordSummary(set) { return set.chords.map(M.formatChord).join(' '); }
function renderChords() {
  const set = currentSet();

  }
  const act = b.dataset.act;

  const set = currentSet();

    if (v && v.trim()) x.name = v.trim().slice(0, 40);
    setEditing = null; chordsChanged();
  } else if (act === 'set-copy' && x) {
    const c = { id: uid('c'), name: (x.name.replace(/^例: /, '') + ' のコピー').slice(0, 40), chords: x.chords.map(ch => Object.assign({}, ch)) };
    chordSets.splice(chordSets.indexOf(x) + 1, 0, c);

  } else if (act === 'set-del' && x) {
    if (setDel !== x.id) { setDel = x.id; renderChords(); setTimeout(() => { if (setDel === x.id) { setDel = null; if (tab === 'chords') renderChords(); } }, 4000); return; }
    chordSets = chordSets.filter(s => s !== x); setDel = null;
    if (S.chordSet === x.id) S.chordSet = chordSets[0] ? chordSets[0].id : '';

  }

function addImport(asNew, label) {
  const p = pendingImport;
  if (!p) return;
  const ver = { id: uid('v'), label: M.VERSION_LABELS.includes(label) ? label : 'そのほか', file: p.file, midi: p.b64,
    roles: M.defaultRoles(p.tl.parts), from: 1, to: Math.min(4, p.tl.bars.length), split: null };
  const before = songs.map(s => ({ s, versions: s.versions.slice(), cur: s.cur }));
  let song;
  if (asNew || !currentSong()) {
    song = { id: uid('s'), name: p.name, created: Date.now(), cur: ver.id, versions: [ver], speed: 1, loop: true, guide: true };
    songs.unshift(song);
  } else {
    song = currentSong(); song.versions.push(ver); song.cur = ver.id;
  }
  const prevSong = S.song;
  S.song = song.id;
  pendingImport = null;
  if (!saveSongs()) {
    // 入りきらなかったら元に戻す
    songs = before.map(b => { b.s.versions = b.versions; b.s.cur = b.cur; return b.s; });
    S.song = prevSong;
  } else {
    toast('「' + song.name + '」を追加しました。弾くパートと範囲を確かめてください', 3000);

async function offlineStatus() {
  if (!('caches' in window)) return 'このブラウザでは保存できません。開くたびに通信します。';
  let n = 0;
  try {
    const c = await caches.open(SAMPLE_CACHE);
    for (const s of C.SAMPLES) if (await c.match(new URL(s.file, location.href).href)) n++;
  } catch (e) { return '保存の状態を確かめられませんでした。'; }
  let shell = false;
  try { shell = !!(await caches.match(new URL('index.html', location.href).href)); } catch (e) {}
  if (n === C.SAMPLES.length && shell) return '保存済み。電波がなくても開いて弾けます。';
  if (!shell && n === C.SAMPLES.length) return '音源は保存済み（' + n + '/' + C.SAMPLES.length + '）。画面の保存がまだなので、もう一度開くと完了します。';

}

// 先に要る音源: いま見えている鍵盤と、伴奏の画面なら和音ボタンの音
function neededNames() {
  const r = currentRange(), need = new Set(C.samplesFor(r.lo, r.hi));
  if (S.mode === 'chord') {
    const o = { low: -1, mid: 0, high: 1 }[S.chordRegister] * 12;
    for (const n of C.samplesFor(38 + o, 64 + o)) need.add(n);
  }
  return [...need];
}
function onSampleSettled() {
  const need = neededNames();
  const done = need.filter(n => loader.settled.has(n)).length;
  if (simpleMode && buffers.size && entered) {
    simpleMode = false;
    toast('ピアノの音を読み込めたので、簡易音から切り替えました', 3000);
  }
  if (!entered) {
    $('loadMsg').textContent = '音源を準備しています（' + buffers.size + ' / ' + C.SAMPLES.length + '）';
    if (done === need.length) {
      if (!buffers.size) showLoadError();
      else if (waiting) enter();
    }
  }
  if (!sheet.hidden && tab === 'info') renderInfo();
}
function showLoadError() {
  const offline = navigator.onLine === false;

    ? '通信ができないため、音源を読み込めませんでした。一度つながる所で開くと、次からは電波がなくても使えます。'
    : '音源を読み込めませんでした。少し待ってからもう一度試すか、簡易音で始めてください。';
  $('loadErr').hidden = false;

  goBtn.textContent = '音を有効にして始める';
  waiting = false;
}
function enter() {

  $('start').hidden = true;
  queueRebuild();
  if (!simpleMode && failed.size) toast('音源の一部（' + failed.size + ' 本）を読み込めず、近い音で代わりに鳴らしています。「≡」→「情報」で読み直せます', 5000);
}
goBtn.addEventListener('click', () => {
  unlockAudio();
  const need = neededNames();
  if (need.every(n => loader.settled.has(n))) { if (buffers.size) enter(); else showLoadError(); return; }
  waiting = true;
  goBtn.setAttribute('aria-busy', 'true');
  goBtn.textContent = '音源を準備しています…';
});
$('retry').addEventListener('click', () => {
  $('loadErr').hidden = true;
  unlockAudio();
  waiting = true;
  goBtn.setAttribute('aria-busy', 'true');
  goBtn.textContent = '音源を準備しています…';
  retryFailed();
});
$('simple').addEventListener('click', () => {
  unlockAudio();
  simpleMode = true;
  enter();
  toast('簡易音で鳴らしています。通信がつながったら「≡」→「情報」からピアノの音を読み直せます', 4000);
});

// ---- 画面を離れたら止める・戻ったら起こす ----
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (rec.on) stopRecording(); panic(); }
  else if (entered) wakeAudio();
});
window.addEventListener('pagehide', () => { if (rec.on) stopRecording(); panic(); });
window.addEventListener('blur', releaseHeld);
const portrait = matchMedia('(orientation: portrait)');
const onTurn = () => { releaseHeld(); queueRebuild(); };
if (portrait.addEventListener) portrait.addEventListener('change', onTurn); else if (portrait.addListener) portrait.addListener(onTurn);
if (window.ResizeObserver) new ResizeObserver(queueRebuild).observe(stage);
else window.addEventListener('resize', queueRebuild);

// ---- はじめ ----
document.documentElement.dataset.edge = S.edge;
renderModeSeg();
updatePlayBtn();
buildKeyboard();
if (!AC) {
  goBtn.disabled = true;
  $('loadMsg').textContent = 'このブラウザでは音を鳴らせません。Safari か Chrome の新しい版で開いてください。';
} else {
  makeContext();
  startLoading();
}

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

// 動作確認用の窓口（画面からは使わない）
window.__piano = { practiceModel, get songPlay() { return songPlay; }, chordCh, get chordSets() { return chordSets; }, get songs() { return songs; }, get ctx() { return ctx; }, get master() { return master; }, loader, get waiting() { return waiting; }, get entered() { return entered; }, voices, live, replay, buffers, failed, pointers, get lay() { return lay; }, get S() { return S; }, recs: () => recs, panic };
})();
</script>
