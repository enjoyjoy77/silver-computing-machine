<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>てのひらピアノ</title>
<meta name="theme-color" content="#222225">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="てのひらピアノ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 濃い灰色の操作部分と、白黒の鍵盤。色は「押している鍵」「録音中」だけに使う */
:root{
  --bg:#222225; --panel:#2b2b2f; --btn:#38383d; --btn-down:#4b4b52; --ink:#ececee; --muted:#9d9da6; --line:#45454b;
  --kb-bg:#0d0d0f; --white:#f3f2ee; --white-top:#d9d8d2; --white-ink:#6a6a70;
  --black:#17171a; --black-low:#303036; --black-ink:#b7b7bd;
  --hit-white:#9cc0ff; --hit-black:#3b78dc; --rec:#ff4d43; --invert-ink:#18181b;
  --edge:8px;
  color-scheme:dark;
}
:root[data-edge="wide"]{--edge:18px}
:root[data-edge="wider"]{--edge:30px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--hit-white);outline-offset:2px}

/* ---- 演奏画面 ---- */
#app{
  position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;gap:8px;touch-action:none;
  padding:calc(env(safe-area-inset-top,0px) + var(--edge) * .75) calc(env(safe-area-inset-right,0px) + var(--edge))
          calc(env(safe-area-inset-bottom,0px) + var(--edge)) calc(env(safe-area-inset-left,0px) + var(--edge));
}
#bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px}
.grp{display:flex;align-items:center;gap:4px}
.btn{
  min-height:40px;min-width:36px;padding:0 9px;border:0;border-radius:9px;
  background:var(--btn);color:var(--ink);font-size:13px;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;touch-action:none;cursor:pointer;
}
.btn:active,.btn.down{background:var(--btn-down)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sq{padding:0;width:36px;font-size:17px}
.range-label{min-width:64px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.slot{min-width:42px;padding:0 6px;font-variant-numeric:tabular-nums}
.slot .n{font-size:10px;color:var(--muted);margin-right:2px}
.slot.cur{box-shadow:inset 0 0 0 2px var(--ink)}
#rec .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
#rec.on{color:var(--rec);box-shadow:inset 0 0 0 2px var(--rec)}
#rec.on .dot{background:var(--rec);border-radius:2px}
#rec .time{font-variant-numeric:tabular-nums}
#pedal{min-width:80px}
/* 横向きは 1 段、縦向きは「録音・道具」と「音域・登録」の 2 段に並べる */
@media (orientation:portrait){
  #g-tools{order:2} #g-range{order:3} #g-slots{order:4}
  .btn.sq{width:34px;min-width:34px}
  .range-label{min-width:58px;font-size:12px}
  .slot{min-width:38px;padding:0 4px}
}
/* 横向きで 1 段に収まらないときは、JS が compact を付けて詰める */
#bar.compact{gap:4px}
#bar.compact #play .t,#bar.compact .slot .n{display:none}
#bar.compact .btn.sq{width:34px;min-width:34px}
#bar.compact .range-label{min-width:56px}
#bar.compact #pedal{min-width:72px}
#pedal .st{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--bg);color:var(--muted)}
#pedal[aria-pressed="true"]{background:var(--ink);color:var(--invert-ink)}
#pedal[aria-pressed="true"] .st{background:var(--invert-ink);color:var(--ink)}

#stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end}
#readout{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(18px,6vw,30px);color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;overflow:hidden}
#kb{position:relative;flex:none;width:100%;background:var(--kb-bg);border-radius:6px;overflow:hidden;touch-action:none}
.key{position:absolute;top:0}
.key.white{background:linear-gradient(var(--white-top),var(--white) 12px);border-radius:0 0 7px 7px}
.key.black{z-index:2;background:linear-gradient(var(--black) 0,var(--black) 88%,var(--black-low));border-radius:0 0 5px 5px;
  box-shadow:0 2px 3px rgba(0,0,0,.45)}
.key.white.on{background:var(--hit-white)}
.key.black.on{background:var(--hit-black)}
.lbl{position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none;line-height:1.1;font-size:var(--lbl,14px);color:var(--white-ink)}
.lbl small{display:block;font-size:10px;opacity:.8}
.black .lbl{bottom:7px;font-size:10px;color:var(--black-ink)}
.mid-c::before{content:"";position:absolute;left:50%;bottom:44px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--white-ink);opacity:.6}

/* ---- 起動画面 ---- */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px)}
.start{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center}
.start h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em}
.start p{margin:0;color:var(--muted)}
.mini-kb{display:block;width:172px;max-width:100%;height:auto;margin:0 auto 4px}
.go{min-height:56px;border:0;border-radius:14px;background:var(--ink);color:var(--invert-ink);font-size:17px;font-weight:700;cursor:pointer}
.go:active{opacity:.85}
.go[aria-busy="true"]{opacity:.6}
.small{font-size:12px;color:var(--muted)}
.err{background:var(--panel);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.err p{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}

/* ---- 録音・設定の画面 ---- */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 16px) 0 calc(env(safe-area-inset-left,0px) + 16px)}
.sheet-head{display:flex;align-items:center;gap:8px;max-width:680px;width:100%;margin:0 auto;padding-bottom:8px}
.tabs{display:flex;flex:1;background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.tab{flex:1;min-height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--btn-down);color:var(--ink);font-weight:600}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-user-select:text;user-select:text}
.sheet-body > section{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet h2{margin:8px 0 0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.item{display:flex;flex-direction:column;gap:8px}
.item-title{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.item-title output{color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:0 4px}
.seg button[aria-checked="true"]{background:var(--btn-down);color:var(--ink);font-weight:600}
input[type="range"]{width:100%;height:32px;accent-color:var(--ink);touch-action:pan-x}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rec-item{background:var(--panel);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rec-main{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.rec-name{font-size:15px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.rec-meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-actions{display:flex;gap:6px;flex-wrap:wrap}
.rec-actions .btn{flex:1;min-height:36px}
.rec-item input{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 10px}
.btn.warn{color:var(--rec)}
.empty{background:var(--panel);border-radius:12px;padding:16px;color:var(--muted)}
.pad{min-height:110px;border:0;border-radius:14px;background:var(--panel);color:var(--ink);font-size:16px;touch-action:none;cursor:pointer}
.pad.down{background:var(--btn-down)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sheet a{color:var(--hit-white)}

#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:40;
  max-width:calc(100% - 32px);background:var(--ink);color:var(--invert-ink);padding:8px 14px;border-radius:10px;
  font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="app">
  <header id="bar">
    <div class="grp" id="g-rec">
      <button id="rec" class="btn" type="button" aria-pressed="false"><span class="dot"></span><span class="t">録音</span></button>
      <button id="play" class="btn" type="button" disabled>▶ <span class="t">再生</span></button>
    </div>
    <div class="grp" id="g-range" role="group" aria-label="音域">
      <button id="octDown" class="btn sq" type="button" aria-label="1オクターブ低く">«</button>
      <button id="down" class="btn sq" type="button" aria-label="白鍵1つ低く">‹</button>
      <div id="rangeLabel" class="range-label" aria-live="polite"></div>
      <button id="up" class="btn sq" type="button" aria-label="白鍵1つ高く">›</button>
      <button id="octUp" class="btn sq" type="button" aria-label="1オクターブ高く">»</button>
    </div>
    <div class="grp" id="g-slots" role="group" aria-label="登録した音域">
      <button class="btn slot" type="button" data-slot="0"></button>
      <button class="btn slot" type="button" data-slot="1"></button>
      <button class="btn slot" type="button" data-slot="2"></button>
    </div>
    <div class="grp" id="g-tools">
      <button id="pedal" class="btn" type="button" aria-pressed="false">ペダル <span class="st">切</span></button>
      <button id="panic" class="btn" type="button">全消音</button>
      <button id="menu" class="btn sq" type="button" aria-label="録音一覧と設定">≡</button>
    </div>
  </header>
  <div id="stage">
    <div id="readout"></div>
    <div id="kb" aria-label="鍵盤"></div>
  </div>
</div>

<div id="start" class="overlay">
  <div class="start">
    <svg class="mini-kb" viewBox="0 0 172 64" aria-hidden="true">
      <g fill="var(--white)"><rect x="1" y="0" width="23" height="64" rx="3"/><rect x="25.5" y="0" width="23" height="64" rx="3"/><rect x="50" y="0" width="23" height="64" rx="3"/><rect x="74.5" y="0" width="23" height="64" rx="3"/><rect x="99" y="0" width="23" height="64" rx="3"/><rect x="123.5" y="0" width="23" height="64" rx="3"/><rect x="148" y="0" width="23" height="64" rx="3"/></g>
      <g fill="var(--black)" stroke="var(--bg)" stroke-width="1.5"><rect x="16" y="-2" width="15" height="40" rx="2"/><rect x="42" y="-2" width="15" height="40" rx="2"/><rect x="89" y="-2" width="15" height="40" rx="2"/><rect x="114" y="-2" width="15" height="40" rx="2"/><rect x="139" y="-2" width="15" height="40" rx="2"/></g>
    </svg>
    <h1>てのひらピアノ</h1>
    <p>押した瞬間に鳴る、広告のないピアノ。</p>
    <button id="go" class="go" type="button">音を有効にして始める</button>
    <p id="loadMsg" class="small">音源を準備しています</p>
    <div id="loadErr" class="err" hidden>
      <p id="loadErrMsg">音源を読み込めませんでした。</p>
      <div class="row">
        <button id="retry" class="btn" type="button">もう一度読み込む</button>
        <button id="simple" class="btn" type="button">簡易音で始める</button>
      </div>
    </div>
    <p class="small">横向きにすると鍵盤が大きくなります</p>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <div class="tabs" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="recs" aria-selected="true">録音</button>
      <button class="tab" type="button" role="tab" data-tab="settings" aria-selected="false">設定</button>
      <button class="tab" type="button" role="tab" data-tab="info" aria-selected="false">情報</button>
    </div>
    <button id="close" class="btn" type="button">閉じる</button>
  </div>
  <div class="sheet-body">
    <section id="tab-recs"></section>
    <section id="tab-settings" hidden></section>
    <section id="tab-info" hidden></section>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script src="piano-core.js"></script>
<script>
(() => {
'use strict';
const C = window.PianoCore;
const $ = id => document.getElementById(id);
const VERSION = '1.0';
const FIXED_VEL = 0.8;   // 強弱「一定」のときの強さ（MIDI では 102）
const SAMPLE_CACHE = 'tenohira-piano-samples-v1';
const MAX_VOICES = 40;
const now = () => performance.now();

// ================= 保存 =================
const KEY_SET = 'tenohira-piano:settings', KEY_REC = 'tenohira-piano:recordings';
function loadJSON(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
let S = C.sanitizeSettings(loadJSON(KEY_SET));
let saveTimer = 0;
function saveSettings() { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveJSON(KEY_SET, S), 150); }
let recs = (loadJSON(KEY_REC) || []).map(C.sanitizeRecording).filter(Boolean);
function saveRecs() {
  if (!saveJSON(KEY_REC, recs)) toast('端末の保存領域がいっぱいで、録音を保存できませんでした。古い録音を消すか、バックアップを書き出してください', 5000);
}

// ================= 音 =================
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, master = null, out = null, revSend = null, revConv = null, revWet = null;
const buffers = new Map();       // 音源名 → AudioBuffer（左右を混ぜ、頭の無音を詰めたもの）
const failed = new Set();
let simpleMode = false;          // 音源が読めないときの簡易音

function makeContext() {
  try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { ctx = new AC(); }
  master = ctx.createGain();
  master.gain.value = volumeGain();
  // 和音を重ねて 1 を超えたときだけ丸める（遅れの出ない波形整形）。範囲を倍に取るため前後で 0.5 倍と 2 倍
  const pre = ctx.createGain(); pre.gain.value = 0.5;
  const shaper = ctx.createWaveShaper(); shaper.curve = softCurve();
  const post = ctx.createGain(); post.gain.value = 2;
  master.connect(pre); pre.connect(shaper); shaper.connect(post); post.connect(ctx.destination);
  out = pre;
  revConv = null; revSend = null; revWet = null;
  applyReverb();
  ctx.onstatechange = onCtxState;
}
function softCurve() {
  const n = 4097, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = (i / (n - 1) * 2 - 1) * 2, a = Math.abs(s);
    const y = a < 0.6 ? a : 0.6 + 0.38 * Math.tanh((a - 0.6) / 0.38);
    c[i] = Math.sign(s) * y / 2;
  }
  return c;
}
function volumeGain() { return 1.4 * Math.pow(S.volume, 1.5); }

// 残響は作った響き（雑音を減衰させたもの）を畳み込む。切のときは畳み込みごと外して処理を減らす
function applyReverb() {
  if (!ctx) return;
  if (S.reverb === 'off') { if (revSend) revSend.disconnect(); return; }
  if (!revConv) {
    revConv = ctx.createConvolver(); revConv.buffer = makeIR();
    revSend = ctx.createGain(); revWet = ctx.createGain();
    master.connect(revSend); revConv.connect(revWet); revWet.connect(out);
  }
  revSend.disconnect(); revSend.connect(revConv);
  revWet.gain.value = S.reverb === 'deep' ? 0.75 : 0.4;
}
function makeIR() {
  const sr = ctx.sampleRate, len = Math.floor(sr * 2.2), b = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      lp += ((Math.random() * 2 - 1) - lp) * (0.2 + 0.7 * Math.exp(-t * 4));
      d[i] = lp * Math.exp(-t / 0.45) * (t < 0.015 ? t / 0.015 : 1);
    }
  }
  return b;
}

// ---- 音源の読み込み ----
const loader = { queue: [], active: 0, settled: new Set() };
function sampleByName(n) { return C.SAMPLES.find(s => s.name === n); }

async function fetchSample(s) {
  const url = new URL(s.file, location.href).href;
  let cache = null;
  try { if ('caches' in window) cache = await caches.open(SAMPLE_CACHE); } catch (e) { cache = null; }
  if (cache) {
    try { const hit = await cache.match(url); if (hit) return await hit.arrayBuffer(); } catch (e) { /* 読めなければ取り直す */ }
  }
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  if (cache) { try { await cache.put(url, res.clone()); } catch (e) { /* 容量不足などは無視して演奏を優先 */ } }
  return await res.arrayBuffer();
}
function decode(ab) {
  return new Promise((resolve, reject) => {
    const p = ctx.decodeAudioData(ab, resolve, reject);
    if (p && p.then) p.then(resolve, reject);
  });
}
// 左右を混ぜて 1 本に、頭の無音（MP3 の先頭の詰め物と録音の間）を詰め、8 秒を超える分は消えていくように切り、音量をならす
function prepare(dec, s) {
  const sr = dec.sampleRate, len = dec.length;
  const L = dec.getChannelData(0), R = dec.numberOfChannels > 1 ? dec.getChannelData(1) : L;
  let peak = 0;
  for (let i = 0; i < len; i++) { const v = Math.abs(L[i] + R[i]); if (v > peak) peak = v; }
  peak *= 0.5;
  const th = peak * 0.003;
  let on = 0;
  while (on < len && Math.abs((L[on] + R[on]) * 0.5) < th) on++;
  on = Math.max(0, on - Math.round(sr * 0.0005));
  const maxLen = Math.floor(sr * 8), fade = Math.floor(sr * 1.5);
  const n = Math.max(1, Math.min(len - on, maxLen));
  const b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0), g = (C.SAMPLE_GAIN[s.midi] || 1) * 0.5;
  for (let i = 0; i < n; i++) {
    let v = (L[on + i] + R[on + i]) * g;
    if (n === maxLen && i > n - fade) { const f = (n - i) / fade; v *= f * f; }
    d[i] = v;
  }
  return b;
}
async function loadOne(name) {
  const s = sampleByName(name);
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const ab = await fetchSample(s);
      const dec = await decode(ab);
      buffers.set(name, prepare(dec, s));
      failed.delete(name);
      return;
    } catch (e) {
      await new Promise(r => setTimeout(r, 500 * (attempt + 1)));
    }
  }
  failed.add(name);
}
function pump() {

// ---- 声（1つの音）----
const voices = [];  // 鳴っているすべての声。古い順

    const victim = voices.find(v => v.released) || voices[0];
    killVoice(victim, ctx.currentTime);
    removeVoice(victim);
  }

  const level = Math.pow(vel / FIXED_VEL, 1.6);
  const rel = ctx.createGain();
  rel.gain.value = level;

  if (sample) {
    if (!warnedSubstitute && Math.abs(sample.midi - midi) > 1) {
      warnedSubstitute = true;
      toast('一部の音源をまだ読み込めていないので、近い音の高さを変えて鳴らしています', 4000);
    }
    src = ctx.createBufferSource();
    src.buffer = buffers.get(sample.name);
    src.playbackRate.value = Math.pow(2, (midi - sample.midi) / 12);
    head = src;
    if (S.dynamics === 'position') {

    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f0 * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o1.connect(env); o2.connect(g2); g2.connect(env); env.connect(rel);
    const tt = Math.max(t, ctx.currentTime);
    env.gain.setValueAtTime(0, tt);
    env.gain.linearRampToValueAtTime(0.32, tt + 0.004);
    env.gain.setTargetAtTime(0.0001, tt + 0.004, 0.25 + Math.max(0, 96 - midi) / 40);

// ---- 通り道（指で弾く音・再生の音・確認用の音を分けて持つ）----
class Channel {
  constructor() { this.voices = new Set(); this.sounding = new Map(); this.holders = new Map(); this.sustain = false; }
  noteOn(midi, vel, holder, when) {
    const old = this.sounding.get(midi);
    if (old) killVoice(old, when);
    const v = startVoice(this, midi, vel, when);
    if (v) this.sounding.set(midi, v);
    let h = this.holders.get(midi);
    if (!h) this.holders.set(midi, (h = new Set()));
    h.add(holder);
  }
  // 最後の指が離れたら true
  noteOff(midi, holder, when) {
    const h = this.holders.get(midi);
    if (!h || !h.has(holder)) return false;
    h.delete(holder);
    if (h.size) return false;
    this.holders.delete(midi);
    const v = this.sounding.get(midi);
    if (v && !this.sustain) { releaseVoice(v, when); this.sounding.delete(midi); }
    return true;
  }
  setSustain(on, when) {
    this.sustain = on;
    if (on) return;

  }
  killAll() {

  }
}

// ---- 音を起こす ----
let silentEl = null;

  }

// ================= 鍵盤 =================
const kb = $('kb'), stage = $('stage'), readout = $('readout');

const pressed = new Map();   // MIDI → 押している指の数

}

// 横向きで操作列が 2 段に折れたら、文字を減らして 1 段に戻す（鍵盤の高さを守る）
function fitBar() {

  if (isLandscape() && bar.offsetHeight > 52) bar.classList.add('compact');
}
function buildKeyboard() {
  fitBar();

  if (!W || !stageH) return;
  const whiteW = W / count;
  const H = Math.round(isLandscape() ? stageH : Math.min(stageH, Math.max(200, whiteW * 6.2)));
  lay = C.layout(S.start, count, W, H);
  layVer++;
  kb.style.height = H + 'px';
  kb.style.setProperty('--lbl', Math.max(10, Math.min(15, whiteW * 0.3)) + 'px');
  readout.hidden = stageH - H < 48;

  keyEls.clear();
  for (const k of lay.whites.concat(lay.blacks)) {
    const el = document.createElement('div');
    el.className = 'key ' + (k.black ? 'black' : 'white') + (k.midi === 60 ? ' mid-c' : '');
    // 白鍵どうしの境目は 1px あけて、下の黒を線として見せる
    const gap = k.black ? 0 : 1;

    el.style.width = (k.w - gap) + 'px';
    el.style.height = k.h + 'px';
    const text = keyLabel(k.midi);
    if (text) {
      const l = document.createElement('span');
      l.className = 'lbl';
      l.innerHTML = text;
      el.appendChild(l);
    }
    if (pressed.get(k.midi)) el.classList.add('on');
    frag.appendChild(el);
    keyEls.set(k.midi, el);
  }
  kb.textContent = '';
  kb.appendChild(frag);
  $('rangeLabel').textContent = C.noteLabel(lay.lowest, S.labelStyle) + '–' + C.noteLabel(lay.highest, S.labelStyle);
  updateSlots();

}

  if (S.labels === 'c' && !isC) return '';

// ---- 指 ----
const pointers = new Map();  // pointerId → { midi, ver }
function kbPoint(e) { const r = kb.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

function press(id, midi, vel) {
  live.noteOn(midi, vel, id, 0);

}
function release(id, midi) {
  if (live.noteOff(midi, id, ctx ? ctx.currentTime : 0)) record(C.EV_OFF, midi, 0);

}

kb.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (!lay || !ctx) return;
  wakeAudio();
  const { x, y } = kbPoint(e);
  const k = C.hitTest(lay, x, y);
  if (!k) return;
  const old = pointers.get(e.pointerId);
  if (old) release(e.pointerId, old.midi);
  try { kb.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { midi: k.midi, ver: layVer });
  press(e.pointerId, k.midi, velAt(k, y));

  if (!p || p.ver !== layVer) return;
  const { x, y } = kbPoint(e);
  const k = C.hitTest(lay, x, y);
  if (!k || k.midi === p.midi) return;

// ================= ペダル =================
const pedalBtn = $('pedal');

// ================= 録音 =================

recBtn.addEventListener('click', () => { if (rec.on) stopRecording(); else startRecording(); });

// ---- 再生 ----
let playing = null;  // { r, startAt, idx, timer }

  stopReplay();

  wakeAudio();
  playing = { r, startAt: ctx.currentTime + 0.12, idx: 0, timer: 0 };
  playing.timer = setInterval(schedule, 25);
  schedule();
  holdWake();
  updatePlayBtn(); renderRecs();
}
// 0.2 秒先までの出来事を、音の時計で予約していく

  const p = playing;
  if (!p) return;
  const horizon = ctx.currentTime + 0.2, evs = p.r.events;
  while (p.idx < evs.length) {
    const [t, k, n, v] = evs[p.idx];
    const when = p.startAt + t / 1000;
    if (when > horizon) break;
    if (k === C.EV_ON) replay.noteOn(n, Math.max(0.05, v / 127), 'r', when);
    else if (k === C.EV_OFF) replay.noteOff(n, 'r', when);
    else replay.setSustain(!!n, when);
    p.idx++;
  }
  if (p.idx >= evs.length && ctx.currentTime > p.startAt + p.r.duration / 1000 + 0.4) stopReplay(true);
}

  releaseWake();
  updatePlayBtn(); renderRecs();
}

}

// ---- 画面を消さない（録音・再生の間だけ）----
let wakeLock = null, wakeWant = 0;

}
function releaseWake() {
  wakeWant = Math.max(0, wakeWant - 1);
  if (!wakeWant && wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// ---- ファイルを渡す ----

$('tab-recs').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');

  const act = b.dataset.act;
  if (act === 'export') return exportBackup();
  if (act === 'import') return $('importFile').click();

  const r = li && recs.find(x => x.id === li.dataset.id);
  if (!r) return;

  else if (act === 'midi') {
    giveFile(new Blob([C.toMidi(r.events, { name: r.name })], { type: 'audio/midi' }), 'tenohira-' + stamp(r.created) + '.mid');
  } else if (act === 'rename') { editing = r.id; renderRecs(); }
  else if (act === 'save') { saveName(r); }

    if (delConfirm !== r.id) { delConfirm = r.id; renderRecs(); setTimeout(() => { if (delConfirm === r.id) { delConfirm = null; renderRecs(); } }, 4000); return; }

    const have = new Set(recs.map(r => r.id));

function bindProbe() {

async function offlineStatus() {
  if (!('caches' in window)) return 'このブラウザでは保存できません。開くたびに通信します。';
  let n = 0;
  try {
    const c = await caches.open(SAMPLE_CACHE);
    for (const s of C.SAMPLES) if (await c.match(new URL(s.file, location.href).href)) n++;
  } catch (e) { return '保存の状態を確かめられませんでした。'; }
  let shell = false;
  try { shell = !!(await caches.match(new URL('index.html', location.href).href)); } catch (e) {}
  if (n === C.SAMPLES.length && shell) return '保存済み。電波がなくても開いて弾けます。';
  if (!shell && n === C.SAMPLES.length) return '音源は保存済み（' + n + '/' + C.SAMPLES.length + '）。画面の保存がまだなので、もう一度開くと完了します。';
  return '保存中（音源 ' + n + '/' + C.SAMPLES.length + '）。終わるまでは、開くのに通信が要ります。';
}

function onSampleSettled() {

  if (simpleMode && buffers.size && entered) {
    simpleMode = false;

  if (!entered) {
    $('loadMsg').textContent = '音源を準備しています（' + buffers.size + ' / ' + C.SAMPLES.length + '）';
    if (done === need.length) {

}

}
