<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おもちゃ箱</title><link rel="stylesheet" href="style.css?v=3"><body>
<canvas id="view"></canvas><header><div><small>あなたのコレクション</small><h1>おもちゃ箱<span>rev 3</span></h1></div><button id="vr" disabled>VRを確認中</button></header>
<aside><h2>今日は、どれで遊ぶ？</h2><p>箱を選んで、おもちゃを取り出そう。</p><nav id="categories"></nav><div id="list"></div></aside>
<section id="cameraPanel" aria-label="視点操作"><strong>視点を変える</strong><div class="controls"><button id="cameraOrbit" aria-pressed="false">視点：回転</button><button id="cameraPan" aria-pressed="false">視点：パン</button><button id="cameraZoom" aria-pressed="false">視点：ズーム</button><button id="cameraNear">近づく</button><button id="cameraFar">離れる</button><button id="cameraReset">視点リセット</button></div></section><footer><strong id="selection">おもちゃを選んでください</strong><div class="controls"><button id="moveMode" aria-pressed="true">つかんで移動</button><button id="rotateMode" aria-pressed="false">ドラッグで回転</button><button id="smaller">− 小さく</button><button id="larger">＋ 大きく</button><button id="rotate">↻ 回す</button><button id="home">箱へ戻す</button><button id="reset">全部しまう</button></div><p id="help">模型操作中：ドラッグで移動／回転。ホイールは模型の大きさ。空白ドラッグは見回す。</p><output id="status" aria-live="polite">準備中…</output></footer><script type="module" src="app.js?v=3"></script></body></html>
