<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おもちゃ箱</title><link rel="stylesheet" href="style.css"><body>
<canvas id="view"></canvas><header><div><small>あなたのコレクション</small><h1>おもちゃ箱<span>rev 2</span></h1></div><button id="vr" disabled>VRを確認中</button></header>
<aside><h2>今日は、どれで遊ぶ？</h2><p>箱を選んで、おもちゃを取り出そう。</p><nav id="categories"></nav><div id="list"></div></aside>
<footer><strong id="selection">おもちゃを選んでください</strong><div class="controls"><button id="moveMode" aria-pressed="true">つかんで移動</button><button id="rotateMode" aria-pressed="false">ドラッグで回転</button><button id="smaller">− 小さく</button><button id="larger">＋ 大きく</button><button id="rotate">↻ 回す</button><button id="home">箱へ戻す</button><button id="reset">全部しまう</button></div><p>ドラッグ：移動 ／ 右ドラッグ / Shift＋ドラッグ：回転 ／ ホイール：大きさ<br>空いている場所をドラッグ：見回す</p><output id="status" aria-live="polite">準備中…</output></footer><script type="module" src="app.js"></script></body></html>
