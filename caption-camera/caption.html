<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>キャプション採集</title>
<meta name="theme-color" content="#000000">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; color:#fff; font-family:-apple-system,"Hiragino Sans",sans-serif; overflow:hidden; overscroll-behavior:none; }
  button { font-family:inherit; }
  #stage { position:fixed; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#000; }
  #view { width:100%; height:100%; object-fit:cover; }
  #rev { position:fixed; top:calc(env(safe-area-inset-top) + 6px); right:8px; font-size:11px; color:#888; z-index:30; }
  /* 中央の横長ガイド枠(キャプション・名札合わせ用。切り抜きはしない) */
  #guide { position:fixed; left:7%; width:86%; top:50%; transform:translateY(-50%); aspect-ratio:3.2/1; border:2px solid rgba(255,214,10,.9); border-radius:8px; z-index:15; pointer-events:none; box-shadow:0 0 0 2000px rgba(0,0,0,.12); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:20; transition:none; }
  #count { position:fixed; top:calc(env(safe-area-inset-top) + 6px); left:10px; font-size:14px; color:#9f9; z-index:25; }
  #msg { position:fixed; left:12px; right:12px; top:34%; background:rgba(0,0,0,.85); border:1px solid #555; border-radius:12px; padding:14px; font-size:15px; line-height:1.6; z-index:60; display:none; white-space:pre-wrap; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:140px; padding-bottom:env(safe-area-inset-bottom); background:rgba(0,0,0,.35); z-index:25; display:flex; align-items:center; justify-content:center; gap:36px; }
  #shutter { width:88px; height:88px; border-radius:50%; border:5px solid #fff; background:rgba(255,255,255,.92); padding:0; flex:none; position:relative; }
  #shutter::before { content:""; position:absolute; inset:-22px; border-radius:50%; }
  #shutter:active { transform:scale(.92); }
  #mgrBtn { width:58px; height:58px; border-radius:50%; border:none; background:rgba(30,30,30,.5); color:#fff; font-size:24px; flex:none; position:relative; }
  #mgrBtn::before { content:""; position:absolute; inset:-10px; border-radius:50%; }
  #spacer { width:58px; height:58px; visibility:hidden; }
  /* 管理画面 */
  #mgr { position:fixed; inset:0; background:#111; z-index:50; display:none; flex-direction:column; }
  #mgr.on { display:flex; }
  #mgrHead { padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; display:flex; align-items:center; gap:10px; background:#1a1a1a; }
  #mgrHead h2 { font-size:16px; flex:1; font-weight:normal; }
  #mgrHead button { padding:8px 14px; border-radius:10px; border:none; background:#333; color:#fff; font-size:14px; }
  #storInfo { font-size:12px; color:#aaa; padding:6px 14px; white-space:pre-wrap; }
  #storInfo.warn { color:#fb5; }
  #mgrBody { flex:1; overflow-y:auto; padding:10px 14px calc(env(safe-area-inset-bottom) + 20px); -webkit-overflow-scrolling:touch; }
  .sess { background:#1e1e1e; border-radius:12px; padding:12px; margin-bottom:10px; }
  .sess .row1 { display:flex; align-items:center; gap:8px; }
  .sess .nm { flex:1; font-size:15px; }
  .sess .ct { font-size:13px; color:#9f9; }
  .sess .exd { font-size:12px; color:#8cf; }
  .sess .btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .sess button { padding:9px 12px; border-radius:10px; border:none; font-size:13px; background:#333; color:#fff; }
  .sess button.exp { background:#ffd60a; color:#000; font-weight:bold; }
  .sess button:disabled { opacity:.4; }
  #imgGrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:10px; }
  .thumb { position:relative; }
  .thumb img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; display:block; }
  .thumb .del { position:absolute; top:4px; right:4px; width:28px; height:28px; border-radius:50%; border:none; background:rgba(200,30,30,.9); color:#fff; font-size:14px; }
  .thumb .exmark { position:absolute; left:4px; bottom:4px; font-size:11px; background:rgba(0,0,0,.6); border-radius:6px; padding:1px 5px; color:#8cf; }
  #mgrFoot { padding:10px 14px calc(env(safe-area-inset-bottom) + 10px); background:#1a1a1a; display:flex; gap:8px; }
  #mgrFoot button { flex:1; padding:12px; border-radius:12px; border:none; font-size:14px; }
  #newSess { background:#0a84ff; color:#fff; }
  #delExp { background:#511; color:#faa; }
  #mgrFoot button:disabled { opacity:.4; }
</style>
</head>
<body>
<div id="stage"><video id="view" autoplay playsinline muted></video></div>
<div id="guide"></div>
<div id="flash"></div>
<div id="rev">rev 1</div>
<div id="count"></div>
<div id="msg"></div>
<div id="bar">
  <div id="spacer"></div>
  <button id="shutter" aria-label="撮影"></button>
  <button id="mgrBtn" aria-label="管理">📁</button>
</div>
<div id="mgr">
  <div id="mgrHead"><h2>保存した写真(セッション別)</h2><button id="mgrClose">撮影にもどる</button></div>
  <div id="storInfo"></div>
  <div id="mgrBody"></div>
  <div id="mgrFoot">
    <button id="newSess">新しいセッションを開始</button>
    <button id="delExp">エクスポート済みデータを削除</button>
  </div>
</div>
<script>
"use strict";
var video = document.getElementById("view");
var msgEl = document.getElementById("msg");
var countEl = document.getElementById("count");
var flashEl = document.getElementById("flash");
var db = null;
var stream = null;
var busy = false;
var flashTimer = null;
var activeSession = null;   // {id, createdAt, name}

function showMsg(t, sticky) {
  msgEl.textContent = t;
  msgEl.style.display = "block";
  if (!sticky) setTimeout(function(){ msgEl.style.display = "none"; }, 4000);
}
function pad(n, len){ n = String(n); while (n.length < (len||2)) n = "0" + n; return n; }
function isoJST(ms) {   // 2026-08-08T14:32:14+09:00 形式(端末のローカル時刻)
  var d = new Date(ms);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) +
         "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "+09:00";
}
function sessDefaultName(ms) {
  var d = new Date(ms);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

// ---- IndexedDB ----
function openDB() {
  return new Promise(function(resolve, reject){
    var req = indexedDB.open("capcam", 1);
    req.onupgradeneeded = function(){
      var d = req.result;
      var im = d.createObjectStore("images", { keyPath: "id", autoIncrement: true });
      im.createIndex("sessionId", "sessionId");
      d.createObjectStore("sessions", { keyPath: "id", autoIncrement: true });
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function tx(store, mode, fn) {
  return new Promise(function(resolve, reject){
    var t = db.transaction(store, mode);
    var out = fn(t.objectStore(store));
    t.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : undefined); };
    t.onerror = function(){ reject(t.error); };
    t.onabort = function(){ reject(t.error || new Error("abort")); };
  });
}
function getAll(store) { var r; return tx(store, "readonly", function(st){ r = st.getAll(); return r; }).then(function(){ return r.result || []; }); }

// ---- セッション ----
function ensureSession() {
  return getAll("sessions").then(function(list){
    var wantId = Number(localStorage.getItem("capcam_active") || 0);
    var found = list.filter(function(s){ return s.id === wantId; })[0];
    if (found) { activeSession = found; return found; }
    if (list.length) { activeSession = list[list.length-1]; return activeSession; }
    return newSession();
  });
}
function newSession() {
  var now = Date.now();
  var s = { createdAt: now, name: sessDefaultName(now), exported: 0 };
  return tx("sessions", "readwrite", function(st){ return st.add(s); }).then(function(id){
    s.id = id;
    activeSession = s;
    localStorage.setItem("capcam_active", String(id));
    return s;
  });
}

// ---- 件数表示(現在セッションの保存済み件数。保存完了で初めて加算) ----
function refreshCount() {
  if (!activeSession) return Promise.resolve();
  var r;
  return tx("images", "readonly", function(st){ r = st.index("sessionId").count(activeSession.id); return r; })
    .then(function(){ countEl.textContent = "✓ " + r.result + "件(" + activeSession.name + ")"; });
}

// ---- カメラ ----
function startCamera() {
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  return navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: "environment", width: { ideal: 4032 }, height: { ideal: 3024 } }
  }).then(function(s){
    stream = s;
    video.srcObject = s;
  }).catch(function(err){
    var name = (err && err.name) || "";
    showMsg(name === "NotAllowedError"
      ? "カメラの許可がありません。アドレスバー左の「ぁあ」→ Webサイトの設定 → カメラを「許可」にして再読み込みしてください。"
      : "カメラを起動できませんでした(" + name + ")。再読み込みしてみてください。", true);
    throw err;
  });
}

// ---- ガイド枠の座標(将来「枠内だけ切り出し」に使う。今は切り抜かない) ----
function guideRectInVideo() {
  // 画面上のガイド枠を、video実解像度(object-fit:cover)のピクセル座標に変換して返す
  var g = document.getElementById("guide").getBoundingClientRect();
  var vw = video.videoWidth, vh = video.videoHeight;
  var sw = window.innerWidth, shh = window.innerHeight;
  if (!vw || !vh) return null;
  var scale = Math.max(sw / vw, shh / vh);       // cover の拡大率
  var offX = (vw * scale - sw) / 2, offY = (vh * scale - shh) / 2;
  return {
    x: Math.round((g.left + offX) / scale),
    y: Math.round((g.top + offY) / scale),
    w: Math.round(g.width / scale),
    h: Math.round(g.height / scale)
  };
}

// ---- 撮影(全体を保存。トリミングしない) ----
function successFlash() {
  clearTimeout(flashTimer);
  flashEl.style.transition = "none";
  flashEl.style.opacity = "0.3";
  flashTimer = setTimeout(function(){
    flashEl.style.transition = "opacity 0.1s ease-out";
    flashEl.style.opacity = "0";
  }, 60);
}
document.getElementById("shutter").addEventListener("click", function(){
  if (busy || !stream) return;
  busy = true;
  var w = video.videoWidth, h = video.videoHeight;   // 実際に取れた解像度を基準にする
  if (!w || !h) { busy = false; showMsg("映像の準備中です。1秒待ってからもう一度押してください。"); return; }
  var canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(video, 0, 0, w, h);
  canvas.toBlob(function(blob){
    if (!blob) { busy = false; showMsg("写真の作成に失敗しました。もう一度押してください。"); return; }
    var now = Date.now();
    var rec = {
      sessionId: activeSession.id,
      capturedAt: now,
      blob: blob,
      fileSize: blob.size,
      exported: 0,
      guide: guideRectInVideo()   // 将来の枠内切り出し用に座標も残す
    };
    tx("images", "readwrite", function(st){ st.add(rec); }).then(function(){
      busy = false;
      successFlash();             // 書き込み完了で初めて成功扱い
      refreshCount();
    }).catch(function(err){
      busy = false;
      showMsg("保存に失敗しました(" + (err && err.name || err) + ")。空き容量を確認してください。");
    });
  }, "image/jpeg", 0.95);         // OCR用: 文字を潰さないよう高品質
});

// ---- 管理画面 ----
var mgr = document.getElementById("mgr");
document.getElementById("mgrBtn").addEventListener("click", function(){ openMgr(); });
document.getElementById("mgrClose").addEventListener("click", function(){
  mgr.classList.remove("on");
  revokeThumbs();
  refreshCount();
});
var thumbUrls = [];
function revokeThumbs(){ thumbUrls.forEach(function(u){ URL.revokeObjectURL(u); }); thumbUrls = []; }

function openMgr() {
  mgr.classList.add("on");
  renderStorage();
  renderSessions();
}
function renderStorage() {
  var el = document.getElementById("storInfo");
  if (!(navigator.storage && navigator.storage.estimate)) { el.textContent = ""; return; }
  navigator.storage.estimate().then(function(e){
    if (!e || e.usage == null) { el.textContent = ""; return; }
    var t = "保存庫の使用量 " + (e.usage/1048576).toFixed(0) + " MB / 空き 約" + ((e.quota - e.usage)/1073741824).toFixed(1) + " GB";
    var heavy = e.usage > e.quota * 0.7;
    if (heavy) t += "\n⚠ 容量が残り少なくなっています。エクスポートして「エクスポート済みデータを削除」を実行してください。";
    el.textContent = t;
    el.className = heavy ? "warn" : "";
  }).catch(function(){ el.textContent = ""; });
}
function renderSessions() {
  revokeThumbs();
  var body = document.getElementById("mgrBody");
  body.innerHTML = "";
  Promise.all([getAll("sessions"), getAll("images")]).then(function(rs){
    var sessions = rs[0].sort(function(a,b){ return b.createdAt - a.createdAt; });
    var images = rs[1];
    var anyExported = images.some(function(im){ return im.exported; });
    document.getElementById("delExp").disabled = !anyExported;
    if (!sessions.length) { body.textContent = "まだ何もありません。"; return; }
    sessions.forEach(function(s){
      var imgs = images.filter(function(im){ return im.sessionId === s.id; }).sort(function(a,b){ return a.capturedAt - b.capturedAt; });
      var box = document.createElement("div");
      box.className = "sess";
      var row = document.createElement("div"); row.className = "row1";
      var nm = document.createElement("div"); nm.className = "nm";
      nm.textContent = s.name + (s.id === activeSession.id ? "(撮影中)" : "");
      var ct = document.createElement("div"); ct.className = "ct"; ct.textContent = imgs.length + "枚";
      row.appendChild(nm); row.appendChild(ct);
      if (imgs.length && imgs.every(function(im){ return im.exported; })) {
        var ex = document.createElement("div"); ex.className = "exd"; ex.textContent = "書き出し済み";
        row.appendChild(ex);
      }
      box.appendChild(row);
      var btns = document.createElement("div"); btns.className = "btns";
      var bShow = document.createElement("button"); bShow.textContent = "画像を見る";
      var bExp = document.createElement("button"); bExp.className = "exp"; bExp.textContent = "ZIPで書き出す";
      bExp.disabled = !imgs.length;
      var bUse = document.createElement("button"); bUse.textContent = "このセッションで撮る";
      bUse.disabled = (s.id === activeSession.id);
      btns.appendChild(bShow); btns.appendChild(bExp); btns.appendChild(bUse);
      box.appendChild(btns);
      var grid = document.createElement("div"); grid.className = "imgGridHolder";
      box.appendChild(grid);
      var shown = false;
      bShow.addEventListener("click", function(){
        if (shown) { grid.innerHTML = ""; shown = false; bShow.textContent = "画像を見る"; return; }
        shown = true; bShow.textContent = "画像をとじる";
        var gridEl = document.createElement("div");
        gridEl.id = "imgGrid";
        imgs.forEach(function(im){
          var t = document.createElement("div"); t.className = "thumb";
          var img = document.createElement("img");
          var u = URL.createObjectURL(im.blob); thumbUrls.push(u);
          img.src = u; img.loading = "lazy";
          var del = document.createElement("button"); del.className = "del"; del.textContent = "✕";
          del.addEventListener("click", function(){
            if (!confirm("この1枚を削除します。よろしいですか?")) return;
            tx("images", "readwrite", function(st){ st.delete(im.id); }).then(renderSessions).then(refreshCount);
          });
          t.appendChild(img); t.appendChild(del);
          if (im.exported) { var m = document.createElement("div"); m.className = "exmark"; m.textContent = "済"; t.appendChild(m); }
          gridEl.appendChild(t);
        });
        grid.innerHTML = "";
        grid.appendChild(gridEl);
      });
      bExp.addEventListener("click", function(){ exportSession(s, imgs); });
      bUse.addEventListener("click", function(){
        activeSession = s;
        localStorage.setItem("capcam_active", String(s.id));
        renderSessions();
        refreshCount();
      });
      body.appendChild(box);
    });
  });
}
document.getElementById("newSess").addEventListener("click", function(){
  newSession().then(renderSessions).then(refreshCount);
});
document.getElementById("delExp").addEventListener("click", function(){
  if (!confirm("エクスポート済みの画像を保存庫から削除します。よろしいですか?\n(書き出したZIPは消えません)")) return;
  getAll("images").then(function(images){
    var ids = images.filter(function(im){ return im.exported; }).map(function(im){ return im.id; });
    return tx("images", "readwrite", function(st){ ids.forEach(function(id){ st.delete(id); }); });
  }).then(renderSessions).then(refreshCount).then(renderStorage)
    .catch(function(){ showMsg("削除に失敗しました。もう一度試してください。"); });
});

// ---- ZIP生成(無圧縮ZIP。JPEGは圧縮済みなのでサイズはほぼ同じ。ライブラリ不要) ----
var crcTable = (function(){
  var t = [], c;
  for (var n = 0; n < 256; n++) {
    c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < buf.length; i++) c = crcTable[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosDateTime(ms) {
  var d = new Date(ms);
  return {
    time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
  };
}
function makeZip(entries) {   // entries: [{name, data(Uint8Array), ms}]
  var parts = [], central = [], offset = 0;
  var enc = new TextEncoder();
  entries.forEach(function(e){
    var nameB = enc.encode(e.name);
    var crc = crc32(e.data);
    var dt = dosDateTime(e.ms);
    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);       // version
    lh.setUint16(6, 0x0800, true);   // UTF-8フラグ
    lh.setUint16(8, 0, true);        // 無圧縮
    lh.setUint16(10, dt.time, true);
    lh.setUint16(12, dt.date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, e.data.length, true);
    lh.setUint32(22, e.data.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameB, e.data);
    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dt.time, true); ch.setUint16(14, dt.date, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, e.data.length, true);
    ch.setUint32(24, e.data.length, true);
    ch.setUint16(28, nameB.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + e.data.length;
  });
  var centralSize = central.reduce(function(a,u){ return a + u.length; }, 0);
  var end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: "application/zip" });
}

// ---- セッションのエクスポート(images/0001.jpg… + manifest.json) ----
function exportSession(s, imgs) {
  if (!imgs.length) return;
  showMsg("ZIPを作っています(" + imgs.length + "枚)…");
  var d = new Date(s.createdAt);
  var zipName = "session_" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + ".zip";
  Promise.all(imgs.map(function(im){ return im.blob.arrayBuffer(); })).then(function(bufs){
    var entries = [], manifest = [];
    bufs.forEach(function(buf, i){
      var fn = pad(i+1, 4) + ".jpg";
      entries.push({ name: "images/" + fn, data: new Uint8Array(buf), ms: imgs[i].capturedAt });
      manifest.push({ id: "cap_" + pad(i+1, 4), filename: fn, capturedAt: isoJST(imgs[i].capturedAt), order: i+1 });
    });
    entries.push({ name: "manifest.json", data: new TextEncoder().encode(JSON.stringify(manifest, null, 2)), ms: Date.now() });
    var zip = makeZip(entries);
    var file = new File([zip], zipName, { type: "application/zip" });
    var markDone = function(){
      return tx("images", "readwrite", function(st){
        imgs.forEach(function(im){ im.exported = 1; st.put(im); });
      }).then(function(){
        return tx("sessions", "readwrite", function(st){ s.exported = 1; st.put(s); });
      }).then(function(){
        renderSessions(); renderStorage();
        showMsg("書き出しました(" + imgs.length + "枚 + manifest.json)。");
      });
    };
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(markDone).catch(function(err){
        if (err && err.name === "AbortError") { showMsg("共有をキャンセルしました。"); return; }
        // 共有シートが使えない/失敗 → ダウンロードに切り替え
        downloadZip(zip, zipName); markDone();
      });
    } else {
      downloadZip(zip, zipName); markDone();
    }
  }).catch(function(err){
    showMsg("ZIPの作成に失敗しました(" + (err && err.name || err) + ")。枚数が多い場合はセッションを分けてください。", true);
  });
}
function downloadZip(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
}

// ---- 復帰対策・起動 ----
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && stream && stream.getVideoTracks().every(function(t){ return t.readyState === "ended"; })) {
    startCamera().catch(function(){});
  }
});
if (!window.indexedDB || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  showMsg("このブラウザでは動きません。iPhoneのSafariで、httpsのアドレスから開いてください。", true);
} else {
  openDB().then(function(d){
    db = d;
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
    return ensureSession();
  }).then(refreshCount).catch(function(){
    showMsg("保存庫を開けませんでした。プライベートブラウズをオフにして開き直してください。", true);
  });
  startCamera().catch(function(){});
}
</script>
