<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>すーはー劇場</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#F4F1EA;font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#rev{position:fixed;top:6px;right:10px;font-size:11px;color:rgba(0,0,0,.35);z-index:5}
.scr{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F4F1EA;z-index:3;text-align:center;padding:20px;box-sizing:border-box}
.scr h1{font-size:clamp(34px,9vw,72px);margin:0;font-weight:900;letter-spacing:.05em;color:#222}
.scr p{margin:0;color:#555;font-size:15px;line-height:1.8}
button.big{font:inherit;font-size:22px;font-weight:800;padding:14px 44px;border:0;border-radius:999px;background:#222;color:#fff;cursor:pointer}
button.sub{font:inherit;font-size:15px;padding:8px 22px;border:2px solid #222;border-radius:999px;background:transparent;cursor:pointer;color:#222}
label{font-size:15px;color:#333}
#stop{position:fixed;right:14px;bottom:14px;z-index:4;font-size:22px;line-height:1;background:rgba(255,255,255,.25);border:0;border-radius:12px;padding:8px 10px;cursor:pointer;opacity:.5;transition:opacity .4s}
#stop.hide{opacity:0;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="rev">rev2</div>

<div id="title" class="scr">
  <h1>すーはー劇場</h1>
  <p>画面の「すって」「ふーっ」に合わせて、息をするだけ。<br>さわらなくていい。点数もない。<br>1場面10秒くらい。16場面から毎回10場面(約2分)。</p>
  <label><input type="checkbox" id="snd" checked> 音を出す</label>
  <button class="big" id="go">はじめる</button>
</div>

<div id="fin" class="scr hidden">
  <h1>おしまい</h1>
  <p id="finMsg">10場面、息をしました。</p>
  <button class="big" id="again">もういちど</button>
  <button class="sub" id="back">もどる</button>
</div>

<button id="stop" class="hidden" title="やめる">⏹️</button>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cv = $("cv"), cx = cv.getContext("2d"), W = 0, H = 0, DPR = 1;
  function resize(){ DPR = window.devicePixelRatio || 1; W = window.innerWidth; H = window.innerHeight; cv.width = W*DPR; cv.height = H*DPR; }
  window.addEventListener("resize", resize); resize();

  function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(p){ return 0.5 - 0.5*Math.cos(Math.PI*clamp01(p)); }
  function circ(c,x,y,r,col){ c.fillStyle = col; c.beginPath(); c.arc(x,y,Math.max(0,r),0,Math.PI*2); c.fill(); }
  function ell(c,x,y,rx,ry,rot,col){ c.fillStyle = col; c.beginPath(); c.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,Math.PI*2); c.fill(); }
  function seedRand(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rnd = seedRand(7);

  var PICK = 10, CARD = 1.2, ENDT = 1.5, STD = [["in",3.5],["out",5]];

  // ---------------- 場面 ----------------
  var SC = [];

  // たんぽぽ
  function seedDraw(c,x,y,a,L){
    var tx = x + Math.cos(a)*L, ty = y + Math.sin(a)*L;
    c.strokeStyle = "rgba(255,255,255,.7)"; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x,y); c.lineTo(tx,ty);
    for (var j = -3; j <= 3; j++){ var b = a + j*0.36; c.moveTo(tx,ty); c.lineTo(tx + Math.cos(b)*26, ty + Math.sin(b)*26); }
    c.stroke();
    ell(c, x, y, 6, 3, a, "#6B5A30");
  }
  SC.push({ id:"tanpopo", cmd:"とばせ!", endWord:"とんだ!", bg:"#3F7F63", fg:"#FFFFFF",
    zoom:0.12,
    init:function(){ var a = []; for (var i = 0; i < 70; i++) a.push({ ang:rnd()*Math.PI*2, len:85+rnd()*40, ord:rnd(), wob:rnd()*6, sp:0.7+rnd()*0.6, up:rnd() }); this.seeds = a; },
    draw:function(c,S){
      var T = S.t, hy = 400;
      var sway = Math.sin(T*1.2)*6 + (S.ph === "out" ? 18*Math.sin(Math.PI*S.p) : 0), hx = 500 + sway;
      c.fillStyle = "#2F6B50"; c.fillRect(-2000, 830, 5000, 2000);
      ell(c, 450, 820, 90, 22, -0.3, "#5FA36B"); ell(c, 555, 822, 80, 20, 0.35, "#5FA36B");
      c.strokeStyle = "#9BC79A"; c.lineWidth = 10; c.lineCap = "round";
      c.beginPath(); c.moveTo(500, 830); c.quadraticCurveTo(505, 620, hx, hy); c.stroke();
      for (var i = 0; i < this.seeds.length; i++){
        var s = this.seeds[i], dx = Math.cos(s.ang), dy = Math.sin(s.ang);
        var bx = hx + dx*20, by = hy + dy*20, rot = s.ang, tl = s.ord*S.outDur*0.85;
        if (S.tOut >= tl){
          var k = S.tOut - tl, m = Math.min(1, k);
          bx += k*k*30 + k*160*s.sp; by += -k*(50 + 70*s.up) + Math.sin(k*2.5 + s.wob)*18*m;
          rot = s.ang + Math.sin(k*1.7 + s.wob)*0.4*m;
        } else if (S.ph === "out"){ rot += 0.05*Math.sin(T*8 + s.wob); }
        seedDraw(c, bx, by, rot, (s.len - 20)*(S.tOut >= tl ? 1 : 1 + 0.15*S.inP));
      }
      circ(c, hx, hy, 20, "#8C7B45");
    }});

  // ろうそく
  function flame(c,x,y,lean,s){
    c.save(); c.translate(x,y); c.transform(1,0,-lean,1,0,0); c.scale(s,s);
    c.fillStyle = "#FFB23F"; c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-20,-6,-15,-38,0,-64); c.bezierCurveTo(15,-38,20,-6,0,0); c.fill();
    c.fillStyle = "#FFF3B0"; c.beginPath(); c.moveTo(0,-4); c.bezierCurveTo(-9,-8,-7,-26,0,-40); c.bezierCurveTo(7,-26,9,-8,0,-4); c.fill();
    c.restore();
  }
  SC.push({ id:"rousoku", cmd:"けせ!", endWord:"きえた!", bg:"#3A2E4A", fg:"#FFE9B0",
    draw:function(c,S){
      var T = S.t, cols = ["#5BA4E6","#F2B632","#7BC67E","#E9573F","#B48EDB"], lit = 0;
      for (var i = 0; i < 5; i++){ if (!(S.tOut >= S.outDur*(0.18 + 0.16*i))) lit++; }
      if (lit > 0){
        var g = c.createRadialGradient(500,430,10,500,430,420);
        g.addColorStop(0, "rgba(255,190,90," + (0.08*lit*(1 + 0.6*S.inP)) + ")"); g.addColorStop(1, "rgba(255,190,90,0)");
        c.fillStyle = g; c.fillRect(0,0,1000,1000);
      }
      c.fillStyle = "#6B4A34"; c.fillRect(-2000, 780, 5000, 60);
      c.fillStyle = "#F29CB0"; c.fillRect(280, 610, 440, 170);
      c.fillStyle = "#FFF4E6"; c.fillRect(270, 585, 460, 45);
      for (var d = 0; d < 12; d++) circ(c, 290 + d*38, 632, 17, "#FFF4E6");
      for (var j = 0; j < 4; j++) circ(c, 330 + j*113, 700, 12, "#E25C7E");
      for (i = 0; i < 5; i++){
        var x = 340 + i*80;
        c.fillStyle = cols[i]; c.fillRect(x-12, 470, 24, 118);
        c.strokeStyle = "#2A2030"; c.lineWidth = 3; c.beginPath(); c.moveTo(x,470); c.lineTo(x,456); c.stroke();
        var outAt = S.outDur*(0.18 + 0.16*i);
        if (!(S.tOut >= outAt)){
          var lean = S.ph === "out" ? 0.5 + 0.25*Math.sin(T*9 + i) : 0.06*Math.sin(T*3 + i);
          flame(c, x, 456, lean, 1 + 0.4*S.inP + (0.07 + 0.08*S.inP)*Math.sin(T*13 + i*2));
        } else {
          var k = S.tOut - outAt;
          if (k < 2.6){
            c.strokeStyle = "rgba(210,210,220," + (0.7*(1 - k/2.6)) + ")"; c.lineWidth = 5;
            c.beginPath(); c.moveTo(x, 455);
            var top = 160*Math.min(1, k*1.5);
            for (var y = 0; y <= top; y += 8) c.lineTo(x + Math.sin(y/22 + k*3)*12*(y/160), 455 - y);
            c.stroke();
          }
        }
      }
    }});

  // ふうせん
  SC.push({ id:"fuusen", cmd:"ふくらませ!", endWord:"ぷか〜", bg:"#F7D046", fg:"#6B4200",
    draw:function(c,S){
      var T = S.t, r;
      if (S.ph === "out") r = 34 + 226*S.outE; else if (S.ph === "end") r = 260; else r = 34;
      var lift = S.tEnd > 0 ? S.tEnd*S.tEnd*300 + S.tEnd*60 : 0;
      var ky = 760 - lift, ry = r*1.15*(1 + 0.9*S.inP*(S.ph === "in" ? 1 : 0)), wob = Math.sin(T*2.2)*3;
      if (S.ph === "in") r = r*(1 - 0.2*S.inP);
      c.strokeStyle = "#7A5200"; c.lineWidth = 3; c.beginPath(); c.moveTo(500, ky);
      for (var y = 0; y <= 220; y += 10) c.lineTo(500 + Math.sin(y/30 + T*3)*8*(lift > 0 ? 1 : 0.2), ky + y);
      c.stroke();
      ell(c, 500 + wob, ky - ry, r, ry, 0, "#E2483D");
      ell(c, 500 + wob - r*0.38, ky - ry*1.45, r*0.16, ry*0.28, -0.5, "rgba(255,255,255,.45)");
      c.fillStyle = "#C23A30"; c.beginPath(); c.moveTo(500, ky - 4); c.lineTo(488, ky + 12); c.lineTo(512, ky + 12); c.fill();
      if (S.ph === "out"){
        c.strokeStyle = "rgba(255,255,255,.8)"; c.lineWidth = 6; c.lineCap = "round";
        for (var j = 0; j < 3; j++){
          var u = (T*1.5 + j/3) % 1, yy = 900 - u*110;
          c.globalAlpha = Math.sin(Math.PI*u);
          c.beginPath(); c.moveTo(470 + j*30, yy); c.lineTo(470 + j*30, yy - 30); c.stroke();
        }
        c.globalAlpha = 1;
      }
    }});

  // しゃぼんだま
  SC.push({ id:"shabon", cmd:"ふけ!", endWord:"きらきら", bg:"#2F6FB5", fg:"#FFFFFF",
    init:function(){ var a = []; for (var i = 0; i < 16; i++) a.push({ v:rnd(), ph:rnd(), sz:rnd() }); this.b = a; },
    draw:function(c,S){
      var dip = S.ph === "in" ? Math.sin(Math.PI*S.p) : 0, wy = 500 + 250*dip;
      c.fillStyle = "#E9F2FF"; c.fillRect(170, 740, 160, 90); c.fillStyle = "#9CC6F0"; c.fillRect(178, 770, 144, 52);
      c.strokeStyle = "#F2B632"; c.lineCap = "round"; c.lineWidth = 14;
      c.beginPath(); c.moveTo(225, wy + 60); c.lineTo(170, wy + 350); c.stroke();
      c.lineWidth = 12; c.beginPath(); c.arc(250, wy, 60, 0, Math.PI*2); c.stroke();
      var film = S.ph === "in" ? (S.p > 0.5 ? 1 : 0) : 1;
      if (film){ circ(c, 250, wy, 54, "rgba(255,255,255,.18)"); c.strokeStyle = "rgba(255,214,245,.8)"; c.lineWidth = 4; c.beginPath(); c.arc(250, wy, 40, -2.5, -1.7); c.stroke(); }
      c.fillStyle = "#E9F2FF"; c.fillRect(170, 790, 160, 40);
      var N = this.b.length;
      for (var i = 0; i < N; i++){
        var b = this.b[i], si = (i + 0.5)/N*S.outDur*0.95;
        if (!(S.tOut >= si)) continue;
        var k = S.tOut - si, x = 310 + k*(150 + 120*b.v), y = 500 - k*(30 + 70*b.ph) + Math.sin(k*2 + b.ph*6)*22;
        var r = (20 + 45*b.sz)*Math.min(1, k*3);
        if (x > 1300) continue;
        circ(c, x, y, r, "rgba(255,255,255,.08)");
        c.lineWidth = 2; c.strokeStyle = "rgba(255,255,255,.75)"; c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.stroke();
        c.lineWidth = 4; c.strokeStyle = "rgba(255,214,245,.9)"; c.beginPath(); c.arc(x, y, r*0.75, -2.5, -1.7); c.stroke();
        c.strokeStyle = "rgba(181,245,255,.8)"; c.beginPath(); c.arc(x, y, r*0.8, 0.3, 1.0); c.stroke();
      }
    }});

  // かざぐるま
  SC.push({ id:"kazaguruma", cmd:"まわせ!", endWord:"くるくる", bg:"#E9573F", fg:"#FFFFFF",
    draw:function(c,S){
      var T = S.t, cols = ["#F2B632","#3B7DD8","#FFFFFF","#4CAF7A"];
      var ang = 0.4*T - 1.6*S.inC + 24*ease(S.outP) + (S.tEnd > 0 ? 3*(1 - Math.exp(-1.2*S.tEnd)) : 0);
      c.strokeStyle = "#F4E1C1"; c.lineWidth = 16; c.lineCap = "round";
      c.beginPath(); c.moveTo(500, 430); c.lineTo(500, 880); c.stroke();
      if (S.ph === "out" && Math.sin(Math.PI*S.p) > 0.4){
        c.strokeStyle = "rgba(255,255,255,.18)"; c.lineWidth = 60; c.beginPath(); c.arc(500, 430, 180, 0, Math.PI*2); c.stroke();
      }
      c.save(); c.translate(500, 430); c.rotate(ang);
      for (var q = 0; q < 4; q++){
        c.fillStyle = cols[q];
        c.beginPath(); c.moveTo(0,0); c.lineTo(0,-215); c.quadraticCurveTo(140,-190,160,-40); c.closePath(); c.fill();
        c.fillStyle = "rgba(0,0,0,.13)"; c.beginPath(); c.moveTo(0,0); c.lineTo(0,-215); c.lineTo(70,-95); c.closePath(); c.fill();
        c.rotate(Math.PI/2);
      }
      c.restore();
      circ(c, 500, 430, 16, "#FFFFFF"); circ(c, 500, 430, 7, "#C23A30");
    }});

  // ヨット
  SC.push({ id:"yotto", cmd:"すすめ!", endWord:"とうちゃく!", bg:"#8FD3F4", fg:"#FFFFFF",
    draw:function(c,S){
      var T = S.t;
      circ(c, 830, 170, 60, "#FFE27A");
      circ(c, 250, 190, 40, "#FFFFFF"); circ(c, 300, 175, 52, "#FFFFFF"); circ(c, 355, 195, 38, "#FFFFFF");
      c.fillStyle = "#2C7BB6"; c.fillRect(-2000, 640, 5000, 2000);
      c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = 4; c.beginPath();
      for (var x = -600; x <= 1600; x += 20){ var y = 640 + Math.sin(x/40 + T*2)*6; if (x === -600) c.moveTo(x,y); else c.lineTo(x,y); }
      c.stroke();
      c.strokeStyle = "#333"; c.lineWidth = 4; c.beginPath(); c.moveTo(880, 640); c.lineTo(880, 540); c.stroke();
      c.fillStyle = "#E9573F"; c.beginPath(); c.moveTo(882, 540); c.lineTo(940, 560); c.lineTo(882, 580); c.fill();
      ell(c, 880, 645, 26, 14, 0, "#FFFFFF");
      var bx = S.ph === "out" ? 150 + 600*S.outE : (S.ph === "end" ? 750 : 150 - 40*Math.sin(Math.PI*(S.ph === "in" ? S.p : 0))), by = 632 + Math.sin(T*2)*5;
      c.fillStyle = "#E9573F"; c.beginPath(); c.moveTo(bx-115, by); c.lineTo(bx+115, by); c.lineTo(bx+80, by+48); c.lineTo(bx-80, by+48); c.fill();
      c.strokeStyle = "#5A3A1A"; c.lineWidth = 8; c.beginPath(); c.moveTo(bx, by); c.lineTo(bx, by-300); c.stroke();
      var bulge = S.ph === "out" ? 20 + 70*Math.sin(Math.PI*S.p) : (S.ph === "in" ? 8 - 70*Math.sin(Math.PI*S.p) : 8);
      c.fillStyle = "#FFFFFF"; c.beginPath(); c.moveTo(bx+8, by-290); c.lineTo(bx+8, by-22); c.lineTo(bx+175, by-22);
      c.quadraticCurveTo(bx+110+bulge, by-170+bulge*0.3, bx+8, by-290); c.fill();
      if (S.ph === "out"){
        c.strokeStyle = "rgba(255,255,255," + (0.7*Math.sin(Math.PI*S.p)) + ")"; c.lineWidth = 6; c.lineCap = "round";
        for (var j = 0; j < 6; j++){ var yy = 260 + j*55, xx = ((T*600 + j*170) % 1100) - 100; c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx + 120, yy); c.stroke(); }
      }
    }});

  // ラーメン
  SC.push({ id:"ramen", cmd:"さませ!", endWord:"いただきます", bg:"#F3E3C3", fg:"#6B3A1E",
    draw:function(c,S){
      var T = S.t, h = S.ph === "out" ? 1 - 0.85*S.outE : (S.ph === "end" ? 0.15 : 1);
      var bend = S.ph === "out" ? Math.sin(Math.PI*Math.min(1, S.p*1.2)) : 0;
      c.fillStyle = "#C99A6B"; c.fillRect(-2000, 770, 5000, 2000);
      c.lineCap = "round"; c.lineWidth = 12;
      for (var j = 0; j < 3; j++){
        var x0 = 400 + j*100;
        c.strokeStyle = "rgba(255,255,255," + (0.75*h) + ")";
        c.beginPath();
        for (var y = 520; y >= 200; y -= 10){
          var up = (520 - y)/320, xo = Math.sin(y/40 - T*3 + j*2)*16 + bend*up*up*260 + (500 - x0)*0.8*up*S.inP*(S.ph === "in" ? 1 : 0);
          if (y === 520) c.moveTo(x0 + xo, y); else c.lineTo(x0 + xo, y);
        }
        c.stroke();
      }
      c.fillStyle = "#A83525"; c.fillRect(440, 770, 120, 18);
      c.fillStyle = "#C8432F"; c.beginPath(); c.moveTo(245, 560); c.quadraticCurveTo(265, 785, 500, 790); c.quadraticCurveTo(735, 785, 755, 560); c.closePath(); c.fill();
      c.strokeStyle = "#FFFFFF"; c.lineWidth = 6; c.lineCap = "butt"; c.beginPath();
      for (var x = 285; x <= 715; x += 30){ var yz = 650 + ((x - 285)/30 % 2 ? 18 : 0); if (x === 285) c.moveTo(x, yz); else c.lineTo(x, yz); }
      c.stroke();
      c.fillStyle = "#24402A"; c.save(); c.translate(660, 500); c.rotate(0.2); c.fillRect(-40, -70, 80, 110); c.restore();
      ell(c, 500, 560, 255, 55, 0, "#E9B24A");
      c.strokeStyle = "#F7E08A"; c.lineWidth = 7; c.lineCap = "round";
      for (var n = 0; n < 5; n++){ c.beginPath(); for (x = 300; x <= 700; x += 20){ var yn = 545 + n*8 + Math.sin(x/18 + n)*6; if (x === 300) c.moveTo(x, yn); else c.lineTo(x, yn); } c.stroke(); }
      circ(c, 415, 552, 32, "#FFFFFF"); c.strokeStyle = "#F27BA0"; c.lineWidth = 5; c.beginPath(); c.arc(415, 552, 18, 0, 5); c.stroke();
      ell(c, 585, 550, 48, 34, 0, "#B5764A"); ell(c, 585, 550, 30, 20, 0, "#D49A6A");
      c.strokeStyle = "rgba(226,72,61," + h + ")"; c.lineWidth = 6;
      for (var s = -1; s <= 1; s += 2){ for (var m = 0; m < 2; m++){ var bx = 500 + s*(300 + m*30), by = 470 - m*20; c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(bx + s*15, by - 20, bx, by - 40); c.stroke(); } }
    }});

  // はなのにおい
  function heart(c,x,y,s,col){ c.fillStyle = col; c.beginPath(); c.moveTo(x, y + s*0.35); c.bezierCurveTo(x - s, y - s*0.4, x - s*0.4, y - s, x, y - s*0.45); c.bezierCurveTo(x + s*0.4, y - s, x + s, y - s*0.4, x, y + s*0.35); c.fill(); }
  SC.push({ id:"hana", noAir:true, cmd:"かげ!", inWord:"すーっ", outWord:"はぁ〜", endWord:"いいにおい", bg:"#F6D6E0", fg:"#8A2C4F",
    draw:function(c,S){
      var T = S.t;
      c.strokeStyle = "#4CAF7A"; c.lineWidth = 10; c.lineCap = "round"; c.beginPath(); c.moveTo(740, 860); c.quadraticCurveTo(760, 650, 710, 500); c.stroke();
      ell(c, 770, 720, 50, 18, -0.6, "#4CAF7A");
      for (var i = 0; i < 6; i++){ var a = i*Math.PI/3 + Math.sin(T)*0.05; ell(c, 710 + Math.cos(a)*55, 470 + Math.sin(a)*55, 48, 30, a, "#FF7FA8"); }
      circ(c, 710, 470, 34, "#FFD84A");
      circ(c, 270, 480, 170, "#F8D5B5");
      c.fillStyle = "#3A2A20"; c.beginPath(); c.arc(270, 450, 175, Math.PI*1.05, Math.PI*1.95); c.lineTo(270, 330); c.fill();
      c.strokeStyle = "#3A2A20"; c.lineWidth = 7; c.lineCap = "round";
      c.beginPath(); c.arc(215, 455, 22, 0.15*Math.PI, 0.85*Math.PI); c.stroke();
      c.beginPath(); c.arc(325, 455, 22, 0.15*Math.PI, 0.85*Math.PI); c.stroke();
      var blush = S.ph === "out" || S.ph === "end" ? 0.55 : 0.2;
      circ(c, 190, 530, 26, "rgba(255,110,140," + blush + ")"); circ(c, 350, 530, 26, "rgba(255,110,140," + blush + ")");
      c.lineWidth = 6; c.beginPath(); c.moveTo(270, 490); c.quadraticCurveTo(285, 515, 265, 522); c.stroke();
      if (S.ph === "out"){ ell(c, 270, 580, 22, 26*(0.6 + 0.4*Math.sin(Math.PI*S.p)), 0, "#9B3A45"); }
      else { c.beginPath(); c.arc(270, 565, 30, 0.2*Math.PI, 0.8*Math.PI); c.stroke(); }
      if (S.ph === "in"){

    var steps = sc.steps || STD, br = 0; steps.forEach(function(s){ br += s[1]; });

    return { sc:sc, n:n, start:start, steps:steps, len:CARD + br + ENDT };
  }
  function buildPlan(){
    var order = shuffle(SC.map(function(_, i){ return i; })).slice(0, PICK), t = 0; plan = [];
    order.forEach(function(i, n){ var o = makeEntry(SC[i], n, t); plan.push(o); t += o.len; });
    total = t;
  }
  function stateAt(o, lt){
    var S = { t:lt - CARD, ph:"card", p:clamp01(lt/CARD), tPh:lt, inP:0, outP:0, outE:0, tOut:-1, tEnd:-1, outDur:0, rem:0 };
    var acc = 0, outStart = -1, inStart = -1, inDur = 1;
    S.inC = 0;
    o.steps.forEach(function(s){ if (s[0] === "out" && outStart < 0){ outStart = acc; S.outDur = s[1]; } if (s[0] === "in" && inStart < 0){ inStart = acc; inDur = s[1]; } acc += s[1]; });
    if (lt < CARD) return S;
    var u = lt - CARD; acc = 0; S.ph = "end";
    for (var i = 0; i < o.steps.length; i++){
      var d = o.steps[i][1];
      if (u < acc + d){ S.ph = o.steps[i][0]; S.p = (u - acc)/d; S.tPh = u - acc; S.rem = acc + d - u; break; }
      acc += d;
    }
    if (S.ph === "end"){ S.tPh = u - acc; S.p = clamp01(S.tPh/ENDT); S.tEnd = S.tPh; }
    S.inP = S.ph === "in" ? ease(S.p) : S.ph === "hold" ? 1 : S.ph === "out" ? 1 - ease(S.p) : 0;
    if (inStart >= 0 && u >= inStart) S.inC = ease((u - inStart)/inDur);
    if (outStart >= 0 && u >= outStart){ S.tOut = u - outStart; S.outP = clamp01(S.tOut/S.outDur); S.outE = ease(S.outP); }
    return S;
  }

  var CARD_COLS = [["#222222","#FFFFFF"],["#E9573F","#FFFFFF"],["#3B7DD8","#FFFFFF"],["#F2B632","#222222"]];
  function drawCard(o, S){
    var col = CARD_COLS[o.n % CARD_COLS.length], p = S.p;
    var off = p > 0.8 ? -H*ease((p - 0.8)/0.2) : 0;
    cx.setTransform(DPR,0,0,DPR,0,off*DPR);
    cx.fillStyle = col[0]; cx.fillRect(0, 0, W, H);
    var k = Math.min(W, H)/1000;
    cx.translate(W/2, H/2); cx.scale(k, k);
    cx.fillStyle = col[1]; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.font = "700 44px " + FONT; cx.globalAlpha = 0.7; cx.fillText((o.n + 1) + " / " + plan.length, 0, -230); cx.globalAlpha = 1;
    var pop = p < 0.15 ? 0.4 + 0.6*ease(p/0.15)*1.1 : 1 + 0.02*Math.sin(p*20);
    cx.save(); cx.scale(pop, pop); cx.font = "900 170px " + FONT;
    var tw = cx.measureText(o.sc.cmd).width; if (tw > 900) { cx.scale(900/tw, 900/tw); }
    cx.fillText(o.sc.cmd, 0, 10); cx.restore();
  }
  var FONT = '"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif';
  function drawGuide(sc, S){
    var c = cx; c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = sc.fg;
    if (S.ph === "end"){
      var pop = S.p < 0.12 ? ease(S.p/0.12)*1.15 : 1;
      c.save(); c.translate(500, 910); c.scale(pop, pop); c.font = "900 80px " + FONT; c.fillText(sc.endWord, 0, 0); c.restore();
      return;
    }
    if (S.ph === "card") return;
    var word = S.ph === "in" ? (sc.inWord || "すって") : S.ph === "hold" ? "とめて " + Math.ceil(S.rem) : (sc.outWord || "ふーっ");
    c.font = "900 68px " + FONT; c.fillText(word, 500, 895);
    var custom = (S.ph === "in" && sc.inWord) || (S.ph === "out" && sc.outWord);
    if (custom){ c.font = "700 30px " + FONT; c.globalAlpha = 0.75; c.fillText(S.ph === "in" ? "すう" : "はく", 500, 818); c.globalAlpha = 1; }
    c.globalAlpha = 0.25; c.fillRect(320, 950, 360, 10); c.globalAlpha = 1;
    c.fillRect(320, 950, 360*clamp01(S.p), 10);
  }
  // 吸っているあいだ、画面の外から真ん中下(=自分)へ空気の線が流れこむ
  function drawAir(sc, S){
    var c = cx, N = 16, a0 = Math.min(1, S.inP*3)*0.45;
    c.strokeStyle = sc.fg; c.lineCap = "round"; c.lineWidth = 5;
    for (var j = 0; j < N; j++){
      var ang = -Math.PI*0.95 + j/(N - 1)*Math.PI*0.9 + Math.sin(j*7.3)*0.05;
      var u = (S.t*0.7 + (j*0.37) % 1) % 1, R0 = 620*(1 - u) + 120, R1 = R0 - 70;
      c.globalAlpha = a0*Math.sin(Math.PI*u);
      c.beginPath(); c.moveTo(500 + Math.cos(ang)*R0, 760 + Math.sin(ang)*R0*0.9); c.lineTo(500 + Math.cos(ang)*R1, 760 + Math.sin(ang)*R1*0.9); c.stroke();
    }
    c.globalAlpha = 1;
  }
  function drawScene(o, S){
    cx.setTransform(DPR,0,0,DPR,0,0); cx.globalAlpha = 1;
    cx.fillStyle = o.sc.bg; cx.fillRect(0, 0, W, H);
    var k = Math.min(W, H)/1000, ox = (W - 1000*k)/2, oy = (H - 1000*k)/2;
    cx.setTransform(DPR*k, 0, 0, DPR*k, DPR*ox, DPR*oy);
    cx.lineCap = "round"; cx.lineJoin = "round";
    var z = 1 + (o.sc.zoom || 0.05)*S.inP;
    cx.save(); cx.translate(500, 450); cx.scale(z, z); cx.translate(-500, -450);
    o.sc.draw(cx, S);
    cx.restore();
    cx.globalAlpha = 1;
    if (S.ph === "in" && !o.sc.noAir) drawAir(o.sc, S);
    drawGuide(o.sc, S);
    if (S.ph === "card") drawCard(o, S);
    cx.setTransform(DPR,0,0,DPR,0,0);
  }

  // ---------------- 音 ----------------
  var AC = null, NB = null;
  function ensureAC(){
    if (!AC){
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; return; }
      var len = AC.sampleRate*2; NB = AC.createBuffer(1, len, AC.sampleRate); var d = NB.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    }
    if (AC.state === "suspended") AC.resume();
  }
  function tone(f, at, dur, vol, type){
    var o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(vol, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at + dur + 0.05);
  }
  function breath(dur, inhale){
    var s = AC.createBufferSource(); s.buffer = NB; s.loop = true;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 0.8;
    var g = AC.createGain(), t0 = AC.currentTime;
    f.frequency.setValueAtTime(inhale ? 500 : 1100, t0); f.frequency.linearRampToValueAtTime(inhale ? 1100 : 450, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.05, t0 + dur*0.3); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t0); s.stop(t0 + dur + 0.1);
  }
  function sound(o, S){
    var key = o.n + ":" + S.ph; if (key === lastKey) return; lastKey = key;
    if (!AC || !$("snd").checked) return;
    var t = AC.currentTime, dur = 0;
    o.steps.forEach(function(s){ if (s[0] === S.ph) dur = s[1]; });
    if (S.ph === "card"){ tone(660, t, 0.12, 0.12, "square"); tone(880, t + 0.16, 0.18, 0.12, "square"); }
    else if (S.ph === "in") breath(dur, true);
    else if (S.ph === "out") breath(dur, false);
    else if (S.ph === "hold") tone(440, t, 0.25, 0.05);
    else if (S.ph === "end"){ tone(784, t, 0.3, 0.1); tone(1175, t + 0.12, 0.45, 0.08); }
  }

  // ---------------- 画面の切り替え ----------------
  function render(t){
    for (var i = 0; i < plan.length; i++){
      var o = plan[i];
      if (t < o.start + o.len){ var S = stateAt(o, t - o.start); sound(o, S); drawScene(o, S); return true; }
    }
    return false;
  }
  function frame(now){
    if (!running) return;
    if (!render((now - T0)/1000)) { finish(true); return; }
    requestAnimationFrame(frame);
  }
  function start(){
    if ($("snd").checked) ensureAC();
    buildPlan(); lastKey = "";
    $("title").classList.add("hidden"); $("fin").classList.add("hidden"); $("stop").classList.remove("hidden");
    running = true; T0 = performance.now(); poke(); requestAnimationFrame(frame);
  }
  function finish(done){
    running = false; $("stop").classList.add("hidden");
    cx.setTransform(DPR,0,0,DPR,0,0); cx.clearRect(0, 0, W, H);
    if (done){ $("finMsg").textContent = plan.length + "場面、息をしました。"; $("fin").classList.remove("hidden"); }
    else $("title").classList.remove("hidden");
  }
  var hideTimer = 0;
  function poke(){ $("stop").classList.remove("hide"); clearTimeout(hideTimer); hideTimer = setTimeout(function(){ $("stop").classList.add("hide"); }, 2500); }
  ["mousemove","touchstart","keydown"].forEach(function(ev){ window.addEventListener(ev, function(){ if (running) poke(); }, { passive:true }); });
  $("go").onclick = start; $("again").onclick = start;
  $("back").onclick = function(){ $("fin").classList.add("hidden"); $("title").classList.remove("hidden"); };
  $("stop").onclick = function(){ finish(false); };

  // 確認用: __dbg.show("tanpopo", 6) で、その場面の6秒目を描く
  window.__dbg = { show:function(id, lt){ var sc = SC.filter(function(s){ return s.id === id; })[0]; plan = [makeEntry(sc, 0, 0)]; var S = stateAt(plan[0], lt); drawScene(plan[0], S); return S.ph; },
                   ids:SC.map(function(s){ return s.id; }) };
})();
</script>
</body>
</html>
