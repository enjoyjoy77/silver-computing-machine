<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>擬似立体ビューア v1 — Pseudo 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0a0b0f; --panel:#14161d; --panel2:#1d202a; --line:#2a2e3a;
    --ink:#e8eaf0; --dim:#878c9c; --cy:#36d6e7; --cy2:#7eebf5; --mag:#c8f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'SF Mono',ui-monospace,'Roboto Mono',Menlo,Consolas,monospace;overflow:hidden;}
  canvas#view{position:fixed;inset:0;display:block;touch-action:none;}

  #top{position:fixed;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;
    gap:10px;padding:0 14px;background:linear-gradient(180deg,rgba(10,11,15,.9),transparent);pointer-events:none;}
  #top h1{margin:0;font-size:13px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;}
  #top h1 b{color:var(--cy);}
  #rev{font-size:10px;color:var(--dim);letter-spacing:.1em;}

  #drop{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:20px;background:var(--bg);padding:24px;}
  #drop .mark{font-size:12px;letter-spacing:.4em;color:var(--cy);text-transform:uppercase;}
  #drop h2{margin:0;font-size:25px;font-weight:800;text-align:center;line-height:1.35;}
  #drop p{margin:0;color:var(--dim);font-size:12.5px;text-align:center;max-width:460px;line-height:1.7;}
  .zone{width:min(92vw,440px);border:1.5px dashed var(--line);border-radius:16px;padding:22px;
    display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;background:var(--panel);
    transition:border-color .2s,background .2s;}
  .zone.over{border-color:var(--cy);background:var(--panel2);}
  .zone.set{border-style:solid;border-color:var(--cy);}
  .zone .ico{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .zone.z1 .ico{background:linear-gradient(135deg,#2575fc,#36d6e7);}
  .zone.z2 .ico{background:linear-gradient(135deg,#7a3,#cf6);}
  .zone .t{font-size:14px;font-weight:700;}
  .zone .s{font-size:11px;color:var(--dim);text-align:center;}
  .zones{display:flex;flex-direction:column;gap:12px;width:min(92vw,440px);}
  #goBtn{margin-top:4px;border:none;border-radius:12px;padding:13px 26px;font:inherit;font-size:14px;
    font-weight:800;cursor:pointer;background:linear-gradient(135deg,#2575fc,#36d6e7);color:#04121a;
    opacity:.4;pointer-events:none;transition:opacity .2s;}
  #goBtn.ready{opacity:1;pointer-events:auto;}
  .miniNote{font-size:11px;color:var(--dim);text-align:center;line-height:1.6;}
  .miniNote a{color:var(--cy2);}

  #ui{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;flex-direction:column;gap:9px;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(10,11,15,.96),transparent);}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow-x:auto;max-width:96vw;}
  .seg button{border:none;background:transparent;color:var(--dim);padding:10px 13px;white-space:nowrap;
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .seg button.on{background:var(--panel2);color:var(--cy);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;
    display:flex;align-items:center;gap:9px;}
  label.k{font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--line);outline:none;width:128px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--cy);cursor:pointer;border:2px solid var(--bg);}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--cy);cursor:pointer;border:2px solid var(--bg);}
  .val{font-size:12px;font-weight:700;color:var(--cy2);min-width:38px;text-align:right;}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:10px 14px;
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s;}
  .btn:hover{border-color:var(--cy);}
  .btn.on{background:var(--cy);color:#04121a;border-color:transparent;}
  .hint{font-size:10.5px;color:var(--dim);text-align:center;letter-spacing:.03em;min-height:14px;}

  #toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:11px;font-size:12px;
    z-index:50;display:none;white-space:nowrap;max-width:92vw;}
  #err{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:#3a1414;border:1px solid #7a2a2a;
    color:#ffd9d9;padding:11px 16px;border-radius:11px;font-size:12px;z-index:50;display:none;max-width:92vw;text-align:center;}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="top"><h1>擬似<b>立体</b>ビューア</h1><span id="rev">v1 rev1</span></div>

<div id="drop">
  <div class="mark">Pseudo 3D · depth driven</div>
  <h2>深度マップで、軽く立体を楽しむ</h2>
  <div class="zones">
    <div class="zone z1" id="zoneImg">
      <div class="ico">🖼️</div>
      <div class="t" id="imgT">元画像をドロップ / タップ</div>
      <div class="s">立体に見せたい写真・イラスト</div>
    </div>
    <div class="zone z2" id="zoneDepth">
      <div class="ico">🗺️</div>
      <div class="t" id="depthT">深度マップをドロップ / タップ</div>
      <div class="s">明るいほど手前。深度レリーフ工房で作れます</div>
    </div>
  </div>
  <button id="goBtn">立体で見る →</button>
  <p class="miniNote">メッシュを起こさず、深度に応じて画素をずらす・陰影を流す方式。3D化より軽く、深度が多少粗くても破綻しにくい。すべて端末内で処理し、画像は外に出ません。</p>
  <input type="file" id="imgIn" accept="image/*" style="display:none">
  <input type="file" id="depthIn" accept="image/*" style="display:none">
</div>

<div id="ui">
  <div class="row">
    <div class="seg" id="modeSeg">
      <button data-m="parallax" class="on">傾けパララックス</button>
      <button data-m="wiggle">ゆらゆら</button>
      <button data-m="light">ライティング</button>
      <button data-m="layers">多層</button>
    </div>
  </div>
  <div class="row" id="ctlRow">
    <div class="card">
      <label class="k" id="amtLbl">立体量</label>
      <input type="range" id="amtRange" min="0" max="100" value="45">
      <span class="val" id="amtVal">45</span>
    </div>
    <div class="card" id="speedCard">
      <label class="k" id="spdLbl">速さ</label>
      <input type="range" id="spdRange" min="0" max="100" value="45">
      <span class="val" id="spdVal">45</span>
    </div>
    <button class="btn" id="gyroBtn" style="display:none">📱 ジャイロ</button>
  </div>
  <div class="row">
    <button class="btn" id="newBtn">📂 別の画像</button>
  </div>
  <div class="hint" id="hint">指でドラッグすると視点が動きます</div>
</div>

<div id="toast"></div>
<div id="err"></div>

<script>
"use strict";
const APP_REV='rev1';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3000);}
function showErr(m){const e=$('err');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',4500);}

/* ============ 入力（画像＋深度） ============ */
let imgEl=null, depthEl=null;
function fileToImage(file){
  return new Promise((res,rej)=>{
    if(!file){rej(new Error('画像ファイルを選んでください'));return;}
    if(file.type && !file.type.startsWith('image/')){rej(new Error('画像ファイルを選んでください'));return;}
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>res({img:im,url});im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読めませんでした'));};
    im.src=url;
  });
}
function refreshGo(){ $('goBtn').classList.toggle('ready', !!(imgEl&&depthEl)); }
async function pickImg(file){
  try{const {img,url}=await fileToImage(file);imgEl=img;const ic=$('zoneImg').querySelector('.ico');ic.style.background='url("'+url+'") center/cover';ic.textContent='';$('zoneImg').classList.add('set');$('imgT').textContent='元画像 ✓ 変更はタップ';refreshGo();}
  catch(e){showErr(e.message);}
}
async function pickDepth(file){
  try{const {img,url}=await fileToImage(file);depthEl=img;const ic=$('zoneDepth').querySelector('.ico');ic.style.background='url("'+url+'") center/cover';ic.textContent='';$('zoneDepth').classList.add('set');$('depthT').textContent='深度マップ ✓ 変更はタップ';refreshGo();}
  catch(e){showErr(e.message);}
}
$('imgIn').addEventListener('change',e=>{if(e.target.files[0])pickImg(e.target.files[0]);e.target.value='';});
$('depthIn').addEventListener('change',e=>{if(e.target.files[0])pickDepth(e.target.files[0]);e.target.value='';});
$('zoneImg').onclick=()=>$('imgIn').click();
$('zoneDepth').onclick=()=>$('depthIn').click();
function dz(zone,cb){
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');if(e.dataTransfer.files[0])cb(e.dataTransfer.files[0]);});
}
dz($('zoneImg'),pickImg);dz($('zoneDepth'),pickDepth);
document.body.addEventListener('dragover',e=>e.preventDefault());
$('goBtn').onclick=()=>{ if(!(imgEl&&depthEl))return; start(); };
$('newBtn').onclick=()=>{ $('ui').style.display='none';$('drop').style.display='flex'; };

/* ============ three 基本 ============ */
const canvas=$('view');
// WebGLレンダラは「立体で見る」を押すまで作らない（iOSが写真ピッカー中にページを破棄するのを防ぐ）
let renderer=null;
function init3D(){
  if(renderer)return;
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setAnimationLoop(renderLoop);
}
const scene=new THREE.Scene();
// 正射投影のフルスクリーンquad（パララックス/ライティング/wiggle用）
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,10);ortho.position.z=1;
// 透視投影（多層モード用）
const persp=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,50);persp.position.set(0,0,3);

let imgTex=null, depthTex=null, aspect=1;

/* ---- シェーダーquad（mode: parallax/wiggle/light） ---- */
const quadUniforms={
  uImage:{value:null}, uDepth:{value:null},
  uShift:{value:new THREE.Vector2(0,0)},  // 視差シフト量（-1..1の視点 × 強さ）
  uAmt:{value:0.45},                       // 立体量
  uMode:{value:0},                         // 0=parallax/wiggle, 1=light
  uLightDir:{value:new THREE.Vector2(0.5,0.5)},
  uAspect:{value:1}, uViewAspect:{value:1},
};
const quadMat=new THREE.ShaderMaterial({
  uniforms:quadUniforms,
  vertexShader:`
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uImage, uDepth;
    uniform vec2 uShift, uLightDir;
    uniform float uAmt, uAspect, uViewAspect;
    uniform int uMode;

    // 画像のアスペクトを保ったまま画面にfitさせるUV（contain）
    vec2 fitUv(vec2 uv){
      float s = uAspect / uViewAspect;
      vec2 c = uv - 0.5;
      if(s > 1.0){ c.y *= s; }      // 画像が横長：縦に余白
      else { c.x /= s; }            // 画像が縦長：横に余白
      return c + 0.5;
    }
    float depthAt(vec2 uv){ return texture2D(uDepth, uv).r; }

    void main(){
      vec2 uv = fitUv(vUv);
      if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0){ gl_FragColor=vec4(0.0); return; }

      if(uMode==1){
        // ライティング：深度から法線を計算して光源を当てる（変形しない）
        vec2 px = vec2(1.0/512.0);
        float dl=depthAt(uv-vec2(px.x,0.0)), dr=depthAt(uv+vec2(px.x,0.0));
        float dd=depthAt(uv-vec2(0.0,px.y)), du=depthAt(uv+vec2(0.0,px.y));
        vec3 n = normalize(vec3((dl-dr)*uAmt*6.0, (dd-du)*uAmt*6.0, 1.0));
        vec3 L = normalize(vec3(uLightDir, 0.8));
        float diff = clamp(dot(n,L),0.0,1.0);
        float amb = 0.55;
        vec4 col = texture2D(uImage, uv);
        gl_FragColor = vec4(col.rgb*(amb+diff*0.9), col.a);
      } else {
        // パララックス/wiggle：深度に応じてサンプル位置をずらす
        float d = depthAt(uv);
        // 近い(明るい)ほど大きくずれる。0.5を基準にして前後で逆方向に。
        vec2 off = uShift * uAmt * (d - 0.5);
        vec4 col = texture2D(uImage, uv + off);
        gl_FragColor = col;
      }
    }
  `,
  transparent:true,
});
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),quadMat);
quad.frustumCulled=false;

/* ---- 多層パララックス（layers）：深度を層に分けて板を重ねる ---- */
const layerGroup=new THREE.Group();
let layerMeshes=[];
function buildLayers(){
  layerMeshes.forEach(m=>{layerGroup.remove(m);m.geometry.dispose();m.material.dispose();});
  layerMeshes=[];
  if(!imgTex||!depthTex)return;
  const N=6;                                  // 層数
  const w = aspect>=1 ? 2.0 : 2.0*aspect;
  const h = aspect>=1 ? 2.0/aspect : 2.0;
  for(let i=0;i<N;i++){
    const lo=i/N, hi=(i+1)/N;
    const mat=new THREE.ShaderMaterial({
      transparent:true,
      uniforms:{ uImage:{value:imgTex}, uDepth:{value:depthTex}, uLo:{value:lo}, uHi:{value:hi} },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader:`
        precision highp float; varying vec2 vUv;
        uniform sampler2D uImage,uDepth; uniform float uLo,uHi;
        void main(){
          float d=texture2D(uDepth,vUv).r;
          if(d<uLo||d>=uHi){ discard; }       // この層の深度帯だけ描く
          vec4 c=texture2D(uImage,vUv);
          if(c.a<0.05) discard;
          gl_FragColor=c;
        }`,
    });
    const plane=new THREE.Mesh(new THREE.PlaneGeometry(w,h,1,1),mat);
    // 近い層(iが大きい=明るい=手前)ほどカメラ側へ
    plane.position.z = (i-(N-1)/2) * 0.16;
    plane.userData.baseZ=plane.position.z;
    layerGroup.add(plane);layerMeshes.push(plane);
  }
}

/* ============ テクスチャ生成 ============ */
function makeTex(img){const t=new THREE.Texture(img);t.needsUpdate=true;t.minFilter=THREE.LinearFilter;t.magFilter=THREE.LinearFilter;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;}

/* ============ モード管理 ============ */
let mode='parallax';
function setMode(m){
  mode=m;
  [...$('modeSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  // シーン構成切替
  scene.remove(quad);scene.remove(layerGroup);
  if(m==='layers'){ scene.add(layerGroup); }
  else{ scene.add(quad); quadUniforms.uMode.value=(m==='light')?1:0; }
  // UIラベル
  const showSpeed=(m==='wiggle'||m==='light');
  $('speedCard').style.display=showSpeed?'flex':'none';
  $('amtLbl').textContent=(m==='light')?'凹凸の強さ':'立体量';
  $('spdLbl').textContent=(m==='light')?'光の速さ':'速さ';
  $('gyroBtn').style.display=(m==='parallax'&&hasGyro)?'flex':'none';
  // ヒント
  const hints={parallax:'指でドラッグ／ジャイロで視点が動きます',
    wiggle:'自動で左右に揺れます。速さと立体量を調整',
    light:'光源が回って陰影が流れます',
    layers:'指でドラッグすると層がジオラマのようにズレます'};
  $('hint').textContent=hints[m];
  resetView();
}
$('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);});

/* ============ 視点入力（ドラッグ／ジャイロ） ============ */
let view={x:0,y:0,tx:0,ty:0};   // -1..1
let dragging=false,lastX=0,lastY=0;
function resetView(){view.x=view.y=view.tx=view.ty=0;}
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=(e.clientX-lastX)/innerWidth, dy=(e.clientY-lastY)/innerHeight;
  lastX=e.clientX;lastY=e.clientY;
  view.tx=clamp(view.tx+dx*2.2,-1,1); view.ty=clamp(view.ty+dy*2.2,-1,1);
});
function endDrag(){dragging=false; if(mode==='parallax'||mode==='layers'){view.tx*=0.0;view.ty*=0.0;}}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);

let hasGyro=false, gyroOn=false;
if(typeof DeviceOrientationEvent!=='undefined'){ hasGyro=true; }
$('gyroBtn').onclick=async()=>{
  try{
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=='granted'){showErr('ジャイロの許可が必要です');return;}
    }
    gyroOn=!gyroOn;$('gyroBtn').classList.toggle('on',gyroOn);
    toast(gyroOn?'ジャイロ：端末を傾けて視点移動':'ジャイロ解除');
  }catch(e){showErr('ジャイロを利用できません');}
};
addEventListener('deviceorientation',e=>{
  if(!gyroOn||mode!=='parallax')return;
  // beta(前後 -180..180), gamma(左右 -90..90) を -1..1 に
  view.tx=clamp((e.gamma||0)/35,-1,1);
  view.ty=clamp(((e.beta||0)-45)/35,-1,1);
});

/* ============ コントロール ============ */
let amt=0.45, speed=0.45;
$('amtRange').addEventListener('input',()=>{amt=parseInt($('amtRange').value)/100;$('amtVal').textContent=$('amtRange').value;});
$('spdRange').addEventListener('input',()=>{speed=parseInt($('spdRange').value)/100;$('spdVal').textContent=$('spdRange').value;});

/* ============ 開始 ============ */
function start(){
  init3D();
  imgTex=makeTex(imgEl); depthTex=makeTex(depthEl);
  aspect=imgEl.naturalWidth/imgEl.naturalHeight;
  quadUniforms.uImage.value=imgTex; quadUniforms.uDepth.value=depthTex;
  quadUniforms.uAspect.value=aspect; quadUniforms.uViewAspect.value=innerWidth/innerHeight;
  buildLayers();
  $('drop').style.display='none'; $('ui').style.display='flex';
  setMode(mode);
  toast('モードを切り替えて試してください');
}

/* ============ ループ ============ */
let t0=performance.now();
function renderLoop(){
  const now=performance.now(), t=(now-t0)/1000;
  // 視点の慣性追従
  if(mode==='wiggle'){
    const f=0.3+speed*1.2;                       // 周波数
    view.x=Math.sin(t*f*Math.PI*2);              // 自動往復
    view.y=0;
  }else{
    view.x += (view.tx-view.x)*0.12;
    view.y += (view.ty-view.y)*0.12;
  }

  if(mode==='layers'){
    persp.aspect=innerWidth/innerHeight;persp.updateProjectionMatrix();
    // 視点に応じてカメラを少し動かす（パララックス）
    persp.position.x = view.x*0.6;
    persp.position.y = -view.y*0.6;
    persp.position.z = 3.0;
    persp.lookAt(0,0,0);
    renderer.render(scene,persp);
  }else{
    if(mode==='light'){
      // 光源を回す
      const a=t*(0.3+speed*2.0);
      quadUniforms.uLightDir.value.set(Math.cos(a),Math.sin(a));
      quadUniforms.uAmt.value=amt;
    }else{
      // parallax / wiggle
      quadUniforms.uShift.value.set(-view.x*0.12, view.y*0.12);
      quadUniforms.uAmt.value=amt;
    }
    quadUniforms.uViewAspect.value=innerWidth/innerHeight;
    renderer.render(scene,ortho);
  }
}
addEventListener('resize',()=>{
  if(renderer)renderer.setSize(innerWidth,innerHeight);
  quadUniforms.uViewAspect.value=innerWidth/innerHeight;
});

$('rev').textContent='v1 '+APP_REV;
</script>
