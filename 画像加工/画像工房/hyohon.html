<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>覗ける標本 | 画像工房</title>
<style>
  :root{
    --bg:#0d120f;
    --panel:rgba(19,27,22,.92);
    --line:#354139;
    --ink:#eef1ec;
    --dim:#9aa79f;
    --accent:#8bd7ad;
    --wood:#7b5837;
    --wood-light:#aa7c4e;
    --danger:#ffd7d7;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }
  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  }
  #view{
    position:fixed;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:grab;
  }
  #view.dragging{cursor:grabbing}
  #top{
    position:fixed;
    z-index:20;
    top:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:48px;
    padding:8px 13px;
    background:linear-gradient(180deg,rgba(8,12,10,.92),rgba(8,12,10,0));
    pointer-events:none;
  }
  #top h1{
    margin:0;
    font-size:13px;
    font-weight:900;
    letter-spacing:.07em;
  }
  #top h1 b{color:var(--accent)}
  #top a{
    color:var(--dim);
    text-decoration:none;
    font-size:11px;
    font-weight:700;
    pointer-events:auto;
  }
  #rev{
    margin-left:auto;
    color:var(--dim);
    font-size:10px;
    letter-spacing:.1em;
  }
  #notice,
  #error{
    position:fixed;
    z-index:40;
    left:50%;
    top:58px;
    width:min(92vw,560px);
    transform:translateX(-50%);
    padding:11px 15px;
    border-radius:11px;
    font-size:12px;
    line-height:1.65;
    text-align:center;
    background:var(--panel);
    border:1px solid var(--line);
  }
  #notice{display:none;color:var(--ink)}
  #error{
    display:none;
    color:var(--danger);
    background:rgba(58,20,20,.96);
    border-color:#7a3434;
  }
  #fallback{
    position:fixed;
    z-index:30;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:rgba(10,15,12,.96);
    overflow:auto;
  }
  #fallback.show{display:flex}
  .fallback-card{
    width:min(94vw,520px);
    padding:22px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 18px 60px rgba(0,0,0,.4);
  }
  .fallback-card h2{
    margin:0 0 10px;
    font-size:19px;
  }
  .fallback-card p{
    margin:0 0 16px;
    color:var(--dim);
    font-size:12px;
    line-height:1.8;
  }
  .pick{
    display:block;
    margin-top:10px;
    padding:13px;
    border:1px dashed var(--line);
    border-radius:12px;
    background:#202a24;
    cursor:pointer;
  }
  .pick b{
    display:block;
    margin-bottom:4px;
    font-size:13px;
  }
  .pick span{
    color:var(--dim);
    font-size:11px;
  }
  .pick.set{
    border-style:solid;
    border-color:var(--accent);
  }
  .pick input{display:none}
  #openFiles{
    width:100%;
    margin-top:16px;
    padding:13px 18px;
    border:0;
    border-radius:11px;
    background:var(--accent);
    color:#0b1410;
    font:900 14px/1.2 inherit;
    cursor:pointer;
  }
  #openFiles:disabled{
    opacity:.35;
    cursor:default;
  }
  #permission{
    position:fixed;
    z-index:60;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(5,9,7,.84);
  }
  #permission.show{display:flex}
  .permission-card{
    width:min(90vw,390px);
    padding:24px;
    border:1px solid var(--line);
    border-radius:20px;
    background:#18211c;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.48);
  }
  .permission-card .mark{
    font-size:42px;
    line-height:1;
  }
  .permission-card h2{
    margin:14px 0 8px;
    font-size:22px;
  }
  .permission-card p{
    margin:0 0 18px;
    color:var(--dim);
    font-size:12px;
    line-height:1.8;
  }
  #startLook{
    width:100%;
    padding:15px 20px;
    border:0;
    border-radius:13px;
    background:var(--accent);
    color:#0b1410;
    font:900 16px/1.2 inherit;
    cursor:pointer;
  }
  #shelfNav{
    display:none;
    padding:6px 11px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel);
    color:var(--ink);
    font:800 11px/1.2 inherit;
    pointer-events:auto;
    cursor:pointer;
  }
  #saveShelf{
    position:fixed;
    z-index:25;
    left:50%;
    bottom:max(18px,env(safe-area-inset-bottom));
    display:none;
    transform:translateX(-50%);
    padding:11px 18px;
    border:1px solid var(--accent);
    border-radius:999px;
    background:var(--accent);
    color:#0b1410;
    font:900 12px/1.2 inherit;
    cursor:pointer;
  }
  #saveShelf:disabled{
    opacity:.55;
    cursor:default;
  }
  #shelfView{
    position:fixed;
    z-index:35;
    inset:0;
    display:none;
    overflow:auto;
    padding:
      calc(68px + env(safe-area-inset-top))
      16px
      calc(30px + env(safe-area-inset-bottom));
    background:var(--bg);
  }
  #shelfView.show{display:block}
  .shelf-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    width:min(100%,1100px);
    margin:0 auto 18px;
  }
  .shelf-head h2{
    margin:0;
    font-size:20px;
  }
  #shelfAdd{
    padding:10px 14px;
    border:1px solid var(--accent);
    border-radius:999px;
    background:transparent;
    color:var(--accent);
    font:800 12px/1.2 inherit;
    cursor:pointer;
  }
  #shelfGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
    width:min(100%,1100px);
    margin:0 auto;
  }
  .shelf-card{
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    box-shadow:0 8px 26px rgba(0,0,0,.22);
  }
  .shelf-open{
    display:block;
    width:100%;
    padding:0;
    border:0;
    background:transparent;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
  }
  .shelf-open img{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:#151d18;
  }
  .shelf-name{
    display:block;
    overflow:hidden;
    padding:10px 42px 11px 11px;
    font-size:12px;
    font-weight:800;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .shelf-delete{
    position:absolute;
    right:7px;
    bottom:7px;
    width:31px;
    height:31px;
    padding:0;
    border:1px solid var(--line);
    border-radius:50%;
    background:#202a24;
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
  }
  #shelfEmpty{
    display:none;
    width:min(100%,560px);
    margin:80px auto 0;
    color:var(--dim);
    font-size:13px;
    line-height:1.8;
    text-align:center;
  }
  @media (max-width:520px){
    #shelfView{
      padding-left:10px;
      padding-right:10px;
    }
    #shelfGrid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .shelf-name{
      padding-left:9px;
      font-size:11px;
    }
  }
  #faceBtn{
    position:fixed;
    z-index:25;
    right:12px;
    bottom:max(18px,env(safe-area-inset-bottom));
    display:none;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel);
    color:var(--ink);
    font:700 12px/1.2 inherit;
    cursor:pointer;
  }
  #faceBtn.on{
    background:var(--accent);
    color:#0b1410;
    border-color:var(--accent);
  }
  #hint{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:max-content;
    max-width:90vw;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:999px;
    background:rgba(10,15,12,.72);
    color:var(--dim);
    font-size:10.5px;
    text-align:center;
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="top">
  <h1>覗ける<b>標本</b></h1>
  <a href="index.html">← トップ</a>
  <a href="depth.html">深度ページ</a>
  <button id="shelfNav" type="button">← 棚</button>
  <span id="rev">rev1</span>
</div>

<div id="notice"></div>
<div id="error"></div>

<div id="fallback">
  <div class="fallback-card">
    <h2>標本にする画像を選んでください</h2>
    <p>
      「深度ページから標本にする」で送ると自動で開きます。
      自動で受け取れなかった場合は、元画像と深度画像の2つを選んでください。
    </p>
    <label class="pick" id="sourcePick">
      <b>元画像</b>
      <span id="sourceName">画像ファイルを選択</span>
      <input id="sourceInput" type="file" accept="image/*">
    </label>
    <label class="pick" id="depthPick">
      <b>深度画像</b>
      <span id="depthName">白いほど手前の深度画像を選択</span>
      <input id="depthInput" type="file" accept="image/*">
    </label>
    <button id="openFiles" type="button" disabled>標本を開く</button>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="mark">👁</div>
    <h2>覗きはじめる</h2>
    <p>
      端末を傾けると窓の中の視点が動き、標本が立体に見えます。
      ジャイロの利用を求められた場合は許可してください。
    </p>
    <button id="startLook" type="button">覗きはじめる</button>
  </div>
</div>

<button id="saveShelf" type="button">棚にしまう</button>

<section id="shelfView" aria-label="標本の棚">
  <div class="shelf-head">
    <h2>標本の棚</h2>
    <button id="shelfAdd" type="button">画像から追加</button>
  </div>
  <div id="shelfGrid"></div>
  <p id="shelfEmpty">
    まだ標本がありません。深度ページから送るか、画像から追加してください。
  </p>
</section>

<button id="faceBtn" type="button">🎥 顔で覗く</button>
<div id="hint">端末を傾ける／マウスを動かすと、窓の中を覗けます</div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";

const REV = "rev3-shelf";
const DB_NAME = "kobo-handoff";
const DB_VERSION = 2;
const STORE = "slots";
const MAX_SEGMENTS = 256;
const SMOOTHING = 0.15;

const SHELF_DB_NAME = "hyohon-shelf";
const SHELF_DB_VERSION = 1;
const SHELF_STORE = "items";

let currentSourceBlob = null;
let currentDepthBlob = null;
let currentSpecimenName = "";
let pendingShelfName = "";
let shelfSaving = false;
let shelfSaved = 0;
let currentView = "look";

const $ = id => document.getElementById(id);
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const canvas = $("view");
const notice = $("notice");
const errorBox = $("error");
const fallback = $("fallback");
const permission = $("permission");
const isTouchDevice =
  navigator.maxTouchPoints > 0 ||
  matchMedia("(pointer:coarse)").matches;

$("rev").textContent = REV;

let renderer = null;
let scene = null;
let camera = null;
let specimen = null;
let reliefGeometry = null;
let sourceTexture = null;
let animationId = 0;
let loaded = false;
let errorText = "";
let sourceFile = null;
let depthFile = null;
let meshVerts = 0;

let targetX = 0;
let targetY = 0;
let smoothX = 0;
let smoothY = 0;
let debugOverride = false;
let orientationEnabled = false;
let orientationBase = null;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let dragOriginX = 0;
let dragOriginY = 0;

function openShelfDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(
      SHELF_DB_NAME,
      SHELF_DB_VERSION
    );

    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(SHELF_STORE)) {
        db.createObjectStore(SHELF_STORE, {
          keyPath:"id",
          autoIncrement:true
        });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(
      request.error ||
      new Error("標本の棚を開けませんでした")
    );
  });
}

async function shelfRequest(mode, operation) {
  const db = await openShelfDb();

  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction(SHELF_STORE, mode);
      const store = transaction.objectStore(SHELF_STORE);
      let result;

      try {
        const request = operation(store);
        if (request) {
          request.onsuccess = () => {
            result = request.result;
          };
          request.onerror = () => reject(request.error);
        }
      } catch (error) {
        reject(error);
        return;
      }

      transaction.oncomplete = () => resolve(result);
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(
        transaction.error ||
        new Error("標本の棚を更新できませんでした")
      );
    });
  } finally {
    db.close();
  }
}

function shelfGetAll() {
  return shelfRequest(
    "readonly",
    store => store.getAll()
  );
}

function shelfGet(id) {
  return shelfRequest(
    "readonly",
    store => store.get(Number(id))
  );
}

function shelfRemove(id) {
  return shelfRequest(
    "readwrite",
    store => store.delete(Number(id))
  );
}

function shelfPut(item) {
  return shelfRequest(
    "readwrite",
    store => store.add(item)
  );
}

async function makeShelfThumb(sourceBlob) {
  const image = await blobToImage(sourceBlob, "元画像");
  const longest = Math.max(
    image.naturalWidth,
    image.naturalHeight
  );
  const scale = Math.min(1, 256 / Math.max(longest, 1));
  const width = Math.max(
    1,
    Math.round(image.naturalWidth * scale)
  );
  const height = Math.max(
    1,
    Math.round(image.naturalHeight * scale)
  );
  const work = document.createElement("canvas");
  work.width = width;
  work.height = height;

  const context = work.getContext("2d");
  context.drawImage(image, 0, 0, width, height);

  return await new Promise((resolve, reject) => {
    work.toBlob(
      blob => blob
        ? resolve(blob)
        : reject(new Error("サムネイルを作成できませんでした")),
      "image/jpeg",
      0.82
    );
  });
}

function defaultSpecimenName(blob) {
  const fileName =
    typeof blob?.name === "string" ? blob.name.trim() : "";
  return fileName || (
    "標本 " + new Date().toLocaleString("ja-JP")
  );
}

function setLookControlsVisible(visible) {
  $("shelfNav").style.display = visible ? "inline-block" : "none";
  $("saveShelf").style.display =
    visible && loaded ? "block" : "none";
  $("faceBtn").style.display =
    visible && loaded ? "block" : "none";
  $("hint").style.display = visible ? "block" : "none";
}

function showLookView() {
  currentView = "look";
  $("shelfView").classList.remove("show");
  canvas.style.display = "block";
  setLookControlsVisible(true);
  renderFrame();
}

async function showShelfView() {
  currentView = "shelf";
  stopFaceLook();
  permission.classList.remove("show");
  fallback.classList.remove("show");
  hideNotice();
  clearError();
  canvas.style.display = "none";
  setLookControlsVisible(false);
  $("shelfView").classList.add("show");
  await renderShelf();
}

function showManualPicker() {
  currentView = "look";
  $("shelfView").classList.remove("show");
  canvas.style.display = "block";
  setLookControlsVisible(false);
  fallback.classList.add("show");
}

async function renderShelf() {
  const grid = $("shelfGrid");
  const empty = $("shelfEmpty");
  const items = (await shelfGetAll())
    .sort((a, b) => b.ts - a.ts);

  shelfSaved = items.length;
  grid.replaceChildren();
  empty.style.display = items.length ? "none" : "block";

  for (const item of items) {
    const card = document.createElement("article");
    card.className = "shelf-card";

    const openButton = document.createElement("button");
    openButton.type = "button";
    openButton.className = "shelf-open";
    openButton.dataset.id = item.id;

    const image = document.createElement("img");
    image.alt = item.name || "保存した標本";
    const thumbUrl = URL.createObjectURL(item.thumb);
    image.src = thumbUrl;
    image.addEventListener(
      "load",
      () => URL.revokeObjectURL(thumbUrl),
      {once:true}
    );
    image.addEventListener(
      "error",
      () => URL.revokeObjectURL(thumbUrl),
      {once:true}
    );

    const name = document.createElement("span");
    name.className = "shelf-name";
    name.textContent = item.name || "名前のない標本";

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "shelf-delete";
    deleteButton.dataset.id = item.id;
    deleteButton.setAttribute(
      "aria-label",
      (item.name || "この標本") + "を削除"
    );
    deleteButton.textContent = "🗑";

    openButton.append(image, name);
    card.append(openButton, deleteButton);
    grid.append(card);
  }
}

async function saveToShelf() {
  if (
    shelfSaving ||
    !loaded ||
    !currentSourceBlob ||
    !currentDepthBlob
  ) {
    return null;
  }

  shelfSaving = true;
  const button = $("saveShelf");
  const normalLabel = "棚にしまう";
  button.disabled = true;
  button.textContent = "保存中…";
  clearError();

  try {
    const thumb = await makeShelfThumb(currentSourceBlob);
    const id = await shelfPut({
      source:currentSourceBlob,
      depth:currentDepthBlob,
      thumb,
      name:currentSpecimenName ||
        defaultSpecimenName(currentSourceBlob),
      ts:Date.now()
    });

    shelfSaved += 1;
    button.textContent = "しまった";
    window.setTimeout(() => {
      button.textContent = normalLabel;
      button.disabled = false;
      shelfSaving = false;
    }, 1600);
    return id;
  } catch (error) {
    const quota =
      error?.name === "QuotaExceededError" ||
      error?.message?.includes("Quota");

    showError(
      quota
        ? "ブラウザの保存領域がいっぱいです。棚の標本をいくつか削除してください。"
        : "標本を棚に保存できませんでした: " +
          (error?.message || error)
    );
    button.textContent = normalLabel;
    button.disabled = false;
    shelfSaving = false;
    throw error;
  }
}

async function openFromShelf(id) {
  clearError();
  const item = await shelfGet(id);

  if (!item?.source || !item?.depth) {
    throw new Error("棚から標本を読み込めませんでした");
  }

  pendingShelfName = item.name || "名前のない標本";
  await loadPair(item.source, item.depth, false);
  return item.id;
}

async function deleteFromShelf(id) {
  const item = await shelfGet(id);
  if (!item) return false;

  const name = item.name || "この標本";
  if (!confirm("「" + name + "」を棚から削除しますか？")) {
    return false;
  }

  await shelfRemove(id);
  await renderShelf();
  return true;
}

async function startStage2() {
  showNotice(
    "深度ページから画像を受け取っています…"
  );

  const [sourceItem, depthItem] = await Promise.all([
    handoffTake("source"),
    handoffTake("depth")
  ]);

  if (sourceItem?.blob && depthItem?.blob) {
    await loadPair(
      sourceItem.blob,
      depthItem.blob,
      true
    );
    return;
  }

  hideNotice();

  try {
    const items = await shelfGetAll();
    shelfSaved = items.length;

    if (items.length) {
      await showShelfView();
    } else {
      showManualPicker();
    }
  } catch (error) {
    showManualPicker();
    showError(
      "標本の棚を確認できませんでした: " +
      (error?.message || error)
    );
  }
}

function showNotice(message) {
  notice.textContent = message;
  notice.style.display = "block";
}

function hideNotice() {
  notice.style.display = "none";
}

function showError(message) {
  errorText = String(message || "不明なエラー");
  errorBox.textContent = "エラー: " + errorText;
  errorBox.style.display = "block";
}

function clearError() {
  errorText = "";
  errorBox.style.display = "none";
}

function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE);
      }
      if (!db.objectStoreNames.contains("figures")) {
        db.createObjectStore("figures", {
          keyPath: "id",
          autoIncrement: true
        });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(
      request.error || new Error("ブラウザの保存領域を開けませんでした")
    );
  });
}

async function handoffTake(slot) {
  try {
    const db = await openDb();
    try {
      return await new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE, "readonly");
        const request = transaction.objectStore(STORE).get(slot);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    } finally {
      db.close();
    }
  } catch {
    return null;
  }
}

async function handoffClear(slot) {
  try {
    const db = await openDb();
    try {
      await new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE, "readwrite");
        transaction.objectStore(STORE).delete(slot);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(
          transaction.error || new Error("受け取りデータを消去できませんでした")
        );
      });
    } finally {
      db.close();
    }
  } catch {
    // 消去失敗は表示を妨げない。
  }
}

function blobToImage(blob, label) {
  return new Promise((resolve, reject) => {
    if (!blob || (blob.type && !blob.type.startsWith("image/"))) {
      reject(new Error(label + "が画像ファイルではありません"));
      return;
    }

    const url = URL.createObjectURL(blob);
    const image = new Image();

    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error(label + "を読み込めませんでした"));
    };
    image.src = url;
  });
}

function imageToDepthMap(image, width, height) {
  const work = document.createElement("canvas");
  work.width = width;
  work.height = height;

  const context = work.getContext("2d", {
    willReadFrequently: true
  });
  context.drawImage(image, 0, 0, width, height);

  const pixels = context.getImageData(0, 0, width, height).data;
  const depth = new Float32Array(width * height);

  for (let index = 0; index < depth.length; index++) {
    const offset = index * 4;
    depth[index] =
      (
        pixels[offset] * 0.2126 +
        pixels[offset + 1] * 0.7152 +
        pixels[offset + 2] * 0.0722
      ) / 255;
  }

  return depth;
}

function makeSourceTexture(image) {
  const texture = new THREE.Texture(image);
  texture.needsUpdate = true;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  return texture;
}

function disposeSpecimen() {
  if (specimen && scene) {
    scene.remove(specimen);
  }
  if (reliefGeometry) {
    reliefGeometry.dispose();
    reliefGeometry = null;
  }
  if (sourceTexture) {
    sourceTexture.dispose();
    sourceTexture = null;
  }
  if (specimen) {
    specimen.traverse(object => {
      if (!object.material) return;
      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];
      for (const material of materials) {
        material.dispose?.();
      }
      if (object.geometry && object.geometry !== reliefGeometry) {
        object.geometry.dispose?.();
      }
    });
  }
  specimen = null;
  meshVerts = 0;
}

function createBox(width, height, depth, color, x, y, z, roughness = 0.8) {
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  return mesh;
}

function createSpecimen(sourceImage, depthImage) {
  disposeSpecimen();

  const aspect = sourceImage.naturalWidth / sourceImage.naturalHeight;
  const innerHeight = 1.42;
  const innerWidth = innerHeight * aspect;
  const maxDimension = Math.max(
    sourceImage.naturalWidth,
    sourceImage.naturalHeight
  );

  let segmentsX = Math.round(
    sourceImage.naturalWidth / maxDimension * MAX_SEGMENTS
  );
  let segmentsY = Math.round(
    sourceImage.naturalHeight / maxDimension * MAX_SEGMENTS
  );
  segmentsX = clamp(segmentsX, 8, MAX_SEGMENTS);
  segmentsY = clamp(segmentsY, 8, MAX_SEGMENTS);

  reliefGeometry = new THREE.PlaneGeometry(
    innerWidth,
    innerHeight,
    segmentsX,
    segmentsY
  );

  const depthMap = imageToDepthMap(
    depthImage,
    segmentsX + 1,
    segmentsY + 1
  );
  const positions = reliefGeometry.attributes.position;
  const reliefStrength = Math.min(innerWidth, innerHeight) * 0.24;

  for (let y = 0; y <= segmentsY; y++) {
    for (let x = 0; x <= segmentsX; x++) {
      const vertex = y * (segmentsX + 1) + x;
      const depth = depthMap[vertex];
      const edgeX = Math.min(x / segmentsX, 1 - x / segmentsX);
      const edgeY = Math.min(y / segmentsY, 1 - y / segmentsY);
      const edgeFade = THREE.MathUtils.smoothstep(
        Math.min(edgeX, edgeY),
        0,
        0.075
      );
      positions.setZ(vertex, depth * reliefStrength * edgeFade);
    }
  }

  positions.needsUpdate = true;
  reliefGeometry.computeVertexNormals();
  reliefGeometry.computeBoundingSphere();
  meshVerts = positions.count;

  sourceTexture = makeSourceTexture(sourceImage);

  const reliefMaterial = new THREE.MeshStandardMaterial({
    map: sourceTexture,
    transparent: true,
    alphaTest: 0.04,
    side: THREE.DoubleSide,
    roughness: 0.78,
    metalness: 0,
    emissive: 0xffffff,
    emissiveMap: sourceTexture,
    emissiveIntensity: 0.12
  });

  const group = new THREE.Group();
  const relief = new THREE.Mesh(reliefGeometry, reliefMaterial);
  relief.position.z = 0.04;
  group.add(relief);

  const frameWidth = Math.max(
    0.075,
    Math.min(innerWidth, innerHeight) * 0.075
  );
  const frameDepth = 0.22;
  const outerWidth = innerWidth + frameWidth * 2;
  const outerHeight = innerHeight + frameWidth * 2;
  const wood = 0x795334;
  const woodLight = 0xa87949;

  const backing = createBox(
    innerWidth + 0.025,
    innerHeight + 0.025,
    0.055,
    0x131a16,
    0,
    0,
    -0.075,
    0.95
  );
  group.add(backing);

  const topFrame = createBox(
    outerWidth,
    frameWidth,
    frameDepth,
    woodLight,
    0,
    innerHeight / 2 + frameWidth / 2,
    -0.015
  );
  const bottomFrame = createBox(
    outerWidth,
    frameWidth,
    frameDepth,
    wood,
    0,
    -innerHeight / 2 - frameWidth / 2,
    -0.015
  );
  const leftFrame = createBox(
    frameWidth,
    innerHeight,
    frameDepth,
    wood,
    -innerWidth / 2 - frameWidth / 2,
    0,
    -0.015
  );
  const rightFrame = createBox(
    frameWidth,
    innerHeight,
    frameDepth,
    woodLight,
    innerWidth / 2 + frameWidth / 2,
    0,
    -0.015
  );

  group.add(topFrame, bottomFrame, leftFrame, rightFrame);

  const innerShadowMaterial = new THREE.MeshBasicMaterial({
    color:0x050806,
    transparent:true,
    opacity:0.72,
    depthWrite:false
  });
  const shadowThickness = frameWidth * 0.2;

  const shadowTop = new THREE.Mesh(
    new THREE.BoxGeometry(innerWidth, shadowThickness, 0.025),
    innerShadowMaterial
  );
  shadowTop.position.set(
    0,
    innerHeight / 2 - shadowThickness / 2,
    0.115
  );

  const shadowLeft = new THREE.Mesh(
    new THREE.BoxGeometry(shadowThickness, innerHeight, 0.025),
    innerShadowMaterial.clone()
  );
  shadowLeft.position.set(
    -innerWidth / 2 + shadowThickness / 2,
    0,
    0.115
  );

  group.add(shadowTop, shadowLeft);

  specimen = group;
  scene.add(specimen);
  frameCamera(innerWidth, innerHeight, frameWidth);
}

function frameCamera(width, height, frameWidth) {
  const framedHeight = height + frameWidth * 2;
  const framedWidth = width + frameWidth * 2;
  const verticalFov = THREE.MathUtils.degToRad(camera.fov);
  const distanceForHeight =
    framedHeight / (2 * Math.tan(verticalFov / 2));
  const horizontalFov =
    2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
  const distanceForWidth =
    framedWidth / (2 * Math.tan(horizontalFov / 2));

  camera.userData.baseDistance =
    Math.max(distanceForHeight, distanceForWidth) * 1.16;
  camera.userData.parallaxScale =
    Math.min(width, height) * 0.22;
  updateCamera(true);
}

function initThree() {
  if (renderer) return;

  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    preserveDrawingBuffer:true
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d120f);

  camera = new THREE.PerspectiveCamera(
    42,
    innerWidth / innerHeight,
    0.01,
    100
  );

  scene.add(new THREE.HemisphereLight(
    0xfff5e8,
    0x243029,
    1.35
  ));

  const key = new THREE.DirectionalLight(0xfff4df, 2.0);
  key.position.set(-2.5, 3.2, 4);
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xbbe8d0, 0.8);
  fill.position.set(3, -1, 2);
  scene.add(fill);
}

function updateCamera(immediate = false) {
  if (!camera) return;

  if (immediate) {
    smoothX = targetX;
    smoothY = targetY;
  } else {
    smoothX += (targetX - smoothX) * SMOOTHING;
    smoothY += (targetY - smoothY) * SMOOTHING;
  }

  const distance = camera.userData.baseDistance || 2.8;
  const scale = camera.userData.parallaxScale || 0.28;

  camera.position.set(
    smoothX * scale,
    -smoothY * scale,
    distance
  );
  camera.lookAt(0, 0, 0);
}

function renderFrame() {
  updateCamera(false);
  renderer?.render(scene, camera);
}

function animate() {
  renderFrame();
  animationId = requestAnimationFrame(animate);
}

async function loadPair(sourceBlob, depthBlob, consumeHandoff = false) {
  clearError();
  hideNotice();
  fallback.classList.remove("show");
  showNotice("標本を組み立てています…");

  try {
    const [sourceImage, depthImage] = await Promise.all([
      blobToImage(sourceBlob, "元画像"),
      blobToImage(depthBlob, "深度画像")
    ]);

    initThree();
    createSpecimen(sourceImage, depthImage);
    loaded = true;
    currentSourceBlob = sourceBlob;
    currentDepthBlob = depthBlob;
    currentSpecimenName =
      pendingShelfName || defaultSpecimenName(sourceBlob);
    pendingShelfName = "";
    showLookView();

    if (consumeHandoff) {
      await Promise.all([
        handoffClear("source"),
        handoffClear("depth")
      ]);
    }

    hideNotice();

    if (isTouchDevice) {
      permission.classList.add("show");
    } else {
      permission.classList.remove("show");
    }

    $("faceBtn").style.display = "block";
    renderFrame();
  } catch (error) {
    loaded = false;
    fallback.classList.add("show");
    hideNotice();
    showError(
      error?.message ||
      "画像から標本を作れませんでした"
    );
  }
}

async function tryHandoff() {
  showNotice("深度ページから画像を受け取っています…");

  const [sourceItem, depthItem] = await Promise.all([
    handoffTake("source"),
    handoffTake("depth")
  ]);

  if (sourceItem?.blob && depthItem?.blob) {
    await loadPair(sourceItem.blob, depthItem.blob, true);
    return;
  }

  hideNotice();
  fallback.classList.add("show");
}

function setParallax(x, y) {
  targetX = clamp(Number(x) || 0, -1, 1);
  targetY = clamp(Number(y) || 0, -1, 1);
}

function enableOrientation() {
  if (orientationEnabled) return;
  orientationEnabled = true;
  orientationBase = null;
  window.addEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );
}

function handleOrientation(event) {
  if (debugOverride || faceActive) return;

  const gamma = Number(event.gamma);
  const beta = Number(event.beta);
  if (!Number.isFinite(gamma) || !Number.isFinite(beta)) return;

  if (!orientationBase) {
    orientationBase = {gamma, beta};
  }

  const dx = gamma - orientationBase.gamma;
  const dy = beta - orientationBase.beta;
  setParallax(dx / 28, dy / 28);
}

$("startLook").addEventListener("click", async () => {
  clearError();

  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const result =
        await DeviceOrientationEvent.requestPermission();

      if (result !== "granted") {
        showError(
          "ジャイロの利用が許可されませんでした。指でドラッグして覗けます。"
        );
      } else {
        enableOrientation();
      }
    } else if (typeof DeviceOrientationEvent !== "undefined") {
      enableOrientation();
    }

    permission.classList.remove("show");
  } catch (error) {
    permission.classList.remove("show");
    showError(
      "ジャイロを開始できませんでした。指でドラッグして覗けます。"
    );
  }
});

window.addEventListener("pointermove", event => {
  if (!loaded || dragging || debugOverride || faceActive) return;
  if (event.pointerType === "touch") return;

  const x = event.clientX / Math.max(innerWidth, 1) * 2 - 1;
  const y = event.clientY / Math.max(innerHeight, 1) * 2 - 1;
  setParallax(x, y);
});

canvas.addEventListener("pointerdown", event => {
  if (!loaded) return;

  dragging = true;
  debugOverride = false;
  canvas.classList.add("dragging");
  canvas.setPointerCapture?.(event.pointerId);

  dragStartX = event.clientX;
  dragStartY = event.clientY;
  dragOriginX = targetX;
  dragOriginY = targetY;
});

canvas.addEventListener("pointermove", event => {
  if (!dragging || !loaded) return;

  const dx =
    (event.clientX - dragStartX) / Math.max(innerWidth, 1) * 2;
  const dy =
    (event.clientY - dragStartY) / Math.max(innerHeight, 1) * 2;

  setParallax(
    dragOriginX + dx,
    dragOriginY + dy
  );
});

function endDrag(event) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove("dragging");
  canvas.releasePointerCapture?.(event.pointerId);
}

canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

window.addEventListener("resize", () => {
  if (!renderer || !camera) return;

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);

  if (specimen) {
    const box = new THREE.Box3().setFromObject(specimen);
    const size = box.getSize(new THREE.Vector3());
    frameCamera(size.x, size.y, 0);
  }

  renderFrame();
});

// ---- 顔で覗く(ウェブカメラ+MediaPipe顔検出。PC向け、フィッシュタンクVR本来の形) ----
let faceActive = false;
let faceStream = null;
let faceDetector = null;
let faceVideo = null;
let faceRafId = 0;
const FACE_GAIN = 2.4;          // 顔の動き→視差の倍率(強すぎたらここを下げる)

async function startFaceLook() {
  const btn = $("faceBtn");
  btn.disabled = true;
  btn.textContent = "🎥 準備中…";
  clearError();

  try {
    faceStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: 640, height: 480 },
      audio: false
    });
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "🎥 顔で覗く";
    showError("カメラを使えませんでした。ブラウザのカメラ許可を確認してください。");
    return;
  }

  try {
    if (!faceDetector) {
      const vision = await import("./lib/mediapipe/vision_bundle.mjs");
      const fileset = await vision.FilesetResolver.forVisionTasks("./lib/mediapipe/wasm");
      faceDetector = await vision.FaceDetector.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: "./lib/mediapipe/blaze_face_short_range.tflite" },
        runningMode: "VIDEO"
      });
    }

    faceVideo = document.createElement("video");
    faceVideo.playsInline = true;
    faceVideo.muted = true;
    faceVideo.srcObject = faceStream;
    await faceVideo.play();

    faceActive = true;
    orientationBase = null;      // 戻ったときの傾き基準を取り直す
    btn.disabled = false;
    btn.classList.add("on");
    btn.textContent = "🎥 顔で覗くのをやめる";
    $("hint").textContent = "顔を左右に動かすと、窓の中を覗けます";
    faceLoop();
  } catch (e) {
    stopFaceLook();
    showError("顔検出の準備に失敗しました: " + (e?.message || e));
  }
}

function faceLoop() {
  if (!faceActive) return;
  faceRafId = requestAnimationFrame(faceLoop);
  if (!faceVideo || faceVideo.readyState < 2) return;

  const result = faceDetector.detectForVideo(faceVideo, performance.now());
  const det = result?.detections?.[0];
  if (!det) return;              // 顔が見えない間は直前の視点を保つ

  const box = det.boundingBox;
  const cx = (box.originX + box.width / 2) / faceVideo.videoWidth;
  const cy = (box.originY + box.height / 2) / faceVideo.videoHeight;
  // ウェブカメラは鏡像でないため、頭を右へ動かすと画像上では左(cxが減る)
  const fx = (0.5 - cx) * 2 * FACE_GAIN;
  const fy = (cy - 0.5) * 2 * FACE_GAIN;
  targetX = clamp(fx, -1, 1);
  targetY = clamp(fy, -1, 1);
}

function stopFaceLook() {
  faceActive = false;
  if (faceRafId) { cancelAnimationFrame(faceRafId); faceRafId = 0; }
  if (faceStream) {
    for (const t of faceStream.getTracks()) t.stop();
    faceStream = null;
  }
  if (faceVideo) { faceVideo.srcObject = null; faceVideo = null; }
  const btn = $("faceBtn");
  btn.disabled = false;
  btn.classList.remove("on");
  btn.textContent = "🎥 顔で覗く";
  $("hint").textContent = "端末を傾ける／マウスを動かすと、窓の中を覗けます";
  targetX = 0; targetY = 0;
}

window.__dbg = {
  setParallax(x, y) {
    debugOverride = true;
    setParallax(x, y);
    smoothX = targetX;
    smoothY = targetY;
    renderFrame();
  },

  state() {

    };
  },

  snap() {
    if (!renderer) return "";
    renderFrame();
    return canvas.toDataURL("image/jpeg", 0.8);
  },

  step() {
    renderFrame();
    return this.state();

  saveToShelf,

  async shelfList() {
    const items = await shelfGetAll();
    return items
      .sort((a, b) => b.ts - a.ts)

      }));

  openFromShelf,

};
