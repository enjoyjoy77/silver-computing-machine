<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>覗ける標本 | 画像工房</title>
<style>
  :root{
    --bg:#0d120f;
    --panel:rgba(19,27,22,.92);
    --line:#354139;
    --ink:#eef1ec;
    --dim:#9aa79f;
    --accent:#8bd7ad;
    --wood:#7b5837;
    --wood-light:#aa7c4e;
    --danger:#ffd7d7;
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }
  html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  }
  #view{
    position:fixed;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:grab;
  }
  #view.dragging{cursor:grabbing}
  #top{
    position:fixed;
    z-index:20;
    top:0;
    left:0;
    right:0;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:48px;
    padding:8px 13px;
    background:linear-gradient(180deg,rgba(8,12,10,.92),rgba(8,12,10,0));
    pointer-events:none;
  }
  #top h1{
    margin:0;
    font-size:13px;
    font-weight:900;
    letter-spacing:.07em;
  }
  #top h1 b{color:var(--accent)}
  #top a{
    color:var(--dim);
    text-decoration:none;
    font-size:11px;
    font-weight:700;
    pointer-events:auto;
  }
  #rev{
    margin-left:auto;
    color:var(--dim);
    font-size:10px;
    letter-spacing:.1em;
  }
  #notice,
  #error{
    position:fixed;
    z-index:40;
    left:50%;
    top:58px;
    width:min(92vw,560px);
    transform:translateX(-50%);
    padding:11px 15px;
    border-radius:11px;
    font-size:12px;
    line-height:1.65;
    text-align:center;
    background:var(--panel);
    border:1px solid var(--line);
  }
  #notice{display:none;color:var(--ink)}
  #error{
    display:none;
    color:var(--danger);
    background:rgba(58,20,20,.96);
    border-color:#7a3434;
  }
  #fallback{
    position:fixed;
    z-index:30;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:rgba(10,15,12,.96);
    overflow:auto;
  }
  #fallback.show{display:flex}
  .fallback-card{
    width:min(94vw,520px);
    padding:22px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 18px 60px rgba(0,0,0,.4);
  }
  .fallback-card h2{
    margin:0 0 10px;
    font-size:19px;
  }
  .fallback-card p{
    margin:0 0 16px;
    color:var(--dim);
    font-size:12px;
    line-height:1.8;
  }
  .pick{
    display:block;
    margin-top:10px;
    padding:13px;
    border:1px dashed var(--line);
    border-radius:12px;
    background:#202a24;
    cursor:pointer;
  }
  .pick b{
    display:block;
    margin-bottom:4px;
    font-size:13px;
  }
  .pick span{
    color:var(--dim);
    font-size:11px;
  }
  .pick.set{
    border-style:solid;
    border-color:var(--accent);
  }
  .pick input{display:none}
  #openFiles{
    width:100%;
    margin-top:16px;
    padding:13px 18px;
    border:0;
    border-radius:11px;
    background:var(--accent);
    color:#0b1410;
    font:900 14px/1.2 inherit;
    cursor:pointer;
  }
  #openFiles:disabled{
    opacity:.35;
    cursor:default;
  }
  #permission{
    position:fixed;
    z-index:60;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(5,9,7,.84);
  }
  #permission.show{display:flex}
  .permission-card{
    width:min(90vw,390px);
    padding:24px;
    border:1px solid var(--line);
    border-radius:20px;
    background:#18211c;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.48);
  }
  .permission-card .mark{
    font-size:42px;
    line-height:1;
  }
  .permission-card h2{
    margin:14px 0 8px;
    font-size:22px;
  }
  .permission-card p{
    margin:0 0 18px;
    color:var(--dim);
    font-size:12px;
    line-height:1.8;
  }
  #startLook{
    width:100%;
    padding:15px 20px;
    border:0;
    border-radius:13px;
    background:var(--accent);
    color:#0b1410;
    font:900 16px/1.2 inherit;
    cursor:pointer;
  }
  #shelfNav,#toMitate{
    display:none;
    padding:6px 11px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel);
    color:var(--ink);
    font:800 11px/1.2 inherit;
    pointer-events:auto;
    cursor:pointer;
  }
  #saveShelf{
    position:fixed;
    z-index:25;
    left:50%;
    bottom:max(18px,env(safe-area-inset-bottom));
    display:none;
    transform:translateX(-50%);
    padding:11px 18px;
    border:1px solid var(--accent);
    border-radius:999px;
    background:var(--accent);
    color:#0b1410;
    font:900 12px/1.2 inherit;
    cursor:pointer;
  }
  #saveShelf:disabled{
    opacity:.55;
    cursor:default;
  }
  #shelfView{
    position:fixed;
    z-index:35;
    inset:0;
    display:none;
    overflow:auto;
    padding:
      calc(68px + env(safe-area-inset-top))
      16px
      calc(30px + env(safe-area-inset-bottom));
    background:var(--bg);
  }
  #shelfView.show{display:block}
  .shelf-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    width:min(100%,1100px);
    margin:0 auto 18px;
  }
  .shelf-head h2{
    margin:0;
    font-size:20px;
  }
  #shelfAdd{
    padding:10px 14px;
    border:1px solid var(--accent);
    border-radius:999px;
    background:transparent;
    color:var(--accent);
    font:800 12px/1.2 inherit;
    cursor:pointer;
  }
  #shelfGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
    width:min(100%,1100px);
    margin:0 auto;
  }
  .shelf-card{
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--panel);
    box-shadow:0 8px 26px rgba(0,0,0,.22);
  }
  .shelf-open{
    display:block;
    width:100%;
    padding:0;
    border:0;
    background:transparent;
    color:var(--ink);
    text-align:left;
    cursor:pointer;
  }
  .shelf-open img{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:#151d18;
  }
  .shelf-name{
    display:block;
    overflow:hidden;
    padding:10px 42px 11px 11px;
    font-size:12px;
    font-weight:800;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .shelf-delete{
    position:absolute;
    right:7px;
    bottom:7px;
    width:31px;
    height:31px;
    padding:0;
    border:1px solid var(--line);
    border-radius:50%;
    background:#202a24;
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
  }
  #shelfEmpty{
    display:none;
    width:min(100%,560px);
    margin:80px auto 0;
    color:var(--dim);
    font-size:13px;
    line-height:1.8;
    text-align:center;
  }
  @media (max-width:520px){
    #shelfView{
      padding-left:10px;
      padding-right:10px;
    }
    #shelfGrid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .shelf-name{
      padding-left:9px;
      font-size:11px;
    }
  }
  #faceBtn{
    position:fixed;
    z-index:25;
    right:12px;
    bottom:max(18px,env(safe-area-inset-bottom));
    display:none;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel);
    color:var(--ink);
    font:700 12px/1.2 inherit;
    cursor:pointer;
  }
  #faceBtn.on{
    background:var(--accent);
    color:#0b1410;
    border-color:var(--accent);
  }
  #hint{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:max(68px,calc(env(safe-area-inset-bottom) + 56px));
    transform:translateX(-50%);
    width:max-content;
    max-width:90vw;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:999px;
    background:rgba(10,15,12,.72);
    color:var(--dim);
    font-size:10.5px;
    text-align:center;
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="top">
  <h1>覗ける<b>標本</b></h1>
  <a href="index.html">← トップ</a>
  <a href="depth.html">深度ページ</a>
  <button id="shelfNav" type="button">← 3Dラック</button>
  <button id="toMitate" type="button">🧊 ミタテで調整</button>
  <span id="rev">rev1</span>
</div>

<div id="notice"></div>
<div id="error"></div>

<div id="fallback">
  <div class="fallback-card">
    <h2>標本にする画像を選んでください</h2>
    <p>
      「深度ページから標本にする」で送ると自動で開きます。
      自動で受け取れなかった場合は、元画像と深度画像の2つを選んでください。
    </p>
    <label class="pick" id="sourcePick">
      <b>元画像</b>
      <span id="sourceName">画像ファイルを選択</span>
      <input id="sourceInput" type="file" accept="image/*">
    </label>
    <label class="pick" id="depthPick">
      <b>深度画像</b>
      <span id="depthName">白いほど手前の深度画像を選択</span>
      <input id="depthInput" type="file" accept="image/*">
    </label>
    <button id="openFiles" type="button" disabled>標本を開く</button>
  </div>
</div>

<div id="permission">
  <div class="permission-card">
    <div class="mark">👁</div>
    <h2>覗きはじめる</h2>
    <p>
      端末を傾けると窓の中の視点が動き、標本が立体に見えます。
      ジャイロの利用を求められた場合は許可してください。
    </p>
    <button id="startLook" type="button">覗きはじめる</button>
  </div>
</div>

<button id="saveShelf" type="button">3Dラックにしまう</button>

<section id="shelfView" aria-label="3Dラック">
  <div class="shelf-head">
    <h2>3Dラック</h2>
    <button id="shelfAdd" type="button">画像から追加</button>
  </div>
  <div id="shelfGrid"></div>
  <p id="shelfEmpty">
    まだ何もありません。深度づくりの「📥 3Dラックへ」で送るか、画像から追加してください。
    ミタテの棚と同じラックなので、ミタテに入れた子もここに並びます。
  </p>
</section>

<button id="faceBtn" type="button">🎥 顔で覗く</button>
<div id="hint">端末を傾ける／マウスを動かすと、窓の中を覗けます</div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";
import { figuresAll, figuresAdd, figuresRemove } from "./assets/common.js";

const REV = "rev10-fit";
const DB_NAME = "kobo-handoff";
const DB_VERSION = 2;
const STORE = "slots";
const MAX_SEGMENTS = 256;
const SMOOTHING = 0.15;

const SHELF_DB_NAME = "hyohon-shelf";
const SHELF_DB_VERSION = 1;
const SHELF_STORE = "items";

let currentSourceBlob = null;
let currentDepthBlob = null;
let currentSpecimenName = "";
let pendingShelfName = "";
let shelfSaving = false;
let shelfSaved = 0;
let currentView = "look";

const $ = id => document.getElementById(id);
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const canvas = $("view");
const notice = $("notice");
const errorBox = $("error");
const fallback = $("fallback");
const permission = $("permission");
const isTouchDevice =
  navigator.maxTouchPoints > 0 ||
  matchMedia("(pointer:coarse)").matches;

$("rev").textContent = REV;

// ---- 環境チェックと無言failure防止 ----
// アプリ内ブラウザ等ではIndexedDB(3Dラックの保存先)自体が無いことがある
const storageOk = (typeof indexedDB !== "undefined");
window.addEventListener("error", e => {
  showError("画面の処理でエラーが起きました: " + (e?.message || "不明"));
});
window.addEventListener("unhandledrejection", e => {
  showError("処理が途中で失敗しました: " + (e?.reason?.message || e?.reason || "不明"));
});

let renderer = null;
let scene = null;
let camera = null;
let specimen = null;
let reliefGeometry = null;
let sourceTexture = null;
let animationId = 0;
let loaded = false;
let errorText = "";
let sourceFile = null;
let depthFile = null;
let meshVerts = 0;

let targetX = 0;
let targetY = 0;
let smoothX = 0;
let smoothY = 0;
let zoomTarget = 1;    // 顔が近づくと1未満(=窓に近づく)。顔で覗く時のみ変動
let zoomSmooth = 1;
let debugOverride = false;
let orientationEnabled = false;
let orientationBase = null;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let dragOriginX = 0;
let dragOriginY = 0;

function openShelfDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(
      SHELF_DB_NAME,
      SHELF_DB_VERSION
    );

    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(SHELF_STORE)) {
        db.createObjectStore(SHELF_STORE, {
          keyPath:"id",
          autoIncrement:true
        });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(
      request.error ||
      new Error("標本の棚を開けませんでした")
    );
  });
}

async function shelfRequest(mode, operation) {
  const db = await openShelfDb();

  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction(SHELF_STORE, mode);
      const store = transaction.objectStore(SHELF_STORE);
      let result;

      try {
        const request = operation(store);
        if (request) {
          request.onsuccess = () => {
            result = request.result;
          };
          request.onerror = () => reject(request.error);
        }
      } catch (error) {
        reject(error);
        return;
      }

      transaction.oncomplete = () => resolve(result);
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(
        transaction.error ||
        new Error("標本の棚を更新できませんでした")
      );
    });
  } finally {
    db.close();
  }
}

// 棚の実体はミタテと共通の「3Dラック」(kobo-handoff DBのfiguresストア)。
// hyohon用の形({source,depth,thumb,name,ts})に読み替えて既存コードを最小変更で流用する。
async function shelfGetAll() {
  const figures = await figuresAll();
  return figures.map(f => ({
    id: f.id,
    source: f.image,
    depth: f.depth,
    thumb: f.image,      // サムネ専用データは持たない(画像をそのまま縮小表示)
    name: f.name,
    ts: f.ts
  }));
}

async function shelfGet(id) {
  const items = await shelfGetAll();
  return items.find(item => item.id === Number(id)) || null;
}

function shelfRemove(id) {
  return figuresRemove(Number(id));
}

function shelfPut(item) {
  return figuresAdd({
    name: item.name,
    image: item.source,
    depth: item.depth
  });
}

// 旧・hyohon専用棚(hyohon-shelf)からの一回きり引っ越し(rev4以前に保存した標本を3Dラックへ)
async function migrateOldShelf() {
  let oldItems = [];
  try {
    const db = await openShelfDb();
    try {
      oldItems = await new Promise((resolve, reject) => {
        const tx = db.transaction(SHELF_STORE, "readonly");
        const rq = tx.objectStore(SHELF_STORE).getAll();
        rq.onsuccess = () => resolve(rq.result || []);
        rq.onerror = () => reject(rq.error);
      });
    } finally { db.close(); }
  } catch { return; }
  if (!oldItems.length) return;

  for (const item of oldItems) {
    if (item?.source && item?.depth) {
      await figuresAdd({
        name: item.name || "標本",
        image: item.source,
        depth: item.depth
      });
    }
  }
  try {
    const db = await openShelfDb();
    try {
      await new Promise((resolve, reject) => {
        const tx = db.transaction(SHELF_STORE, "readwrite");
        tx.objectStore(SHELF_STORE).clear();
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } finally { db.close(); }
  } catch {}
}

async function makeShelfThumb(sourceBlob) {
  const image = await blobToImage(sourceBlob, "元画像");
  const longest = Math.max(
    image.naturalWidth,
    image.naturalHeight
  );
  const scale = Math.min(1, 256 / Math.max(longest, 1));
  const width = Math.max(
    1,
    Math.round(image.naturalWidth * scale)
  );
  const height = Math.max(
    1,
    Math.round(image.naturalHeight * scale)
  );
  const work = document.createElement("canvas");
  work.width = width;
  work.height = height;

  const context = work.getContext("2d");
  context.drawImage(image, 0, 0, width, height);

  return await new Promise((resolve, reject) => {
    work.toBlob(
      blob => blob
        ? resolve(blob)
        : reject(new Error("サムネイルを作成できませんでした")),
      "image/jpeg",
      0.82
    );
  });
}

function defaultSpecimenName(blob) {
  const fileName =
    typeof blob?.name === "string" ? blob.name.trim() : "";
  return fileName || (
    "標本 " + new Date().toLocaleString("ja-JP")
  );
}

function setLookControlsVisible(visible) {
  $("shelfNav").style.display = visible ? "inline-block" : "none";
  $("toMitate").style.display = visible ? "inline-block" : "none";
  $("saveShelf").style.display =
    visible && loaded && storageOk ? "block" : "none";
  $("faceBtn").style.display =
    visible && loaded ? "block" : "none";
  $("hint").style.display = visible ? "block" : "none";
}

function showLookView() {
  currentView = "look";
  $("shelfView").classList.remove("show");
  canvas.style.display = "block";
  setLookControlsVisible(true);
  renderFrame();
}

async function showShelfView() {
  currentView = "shelf";
  stopFaceLook();
  permission.classList.remove("show");
  fallback.classList.remove("show");
  hideNotice();
  clearError();
  canvas.style.display = "none";
  setLookControlsVisible(false);
  $("shelfView").classList.add("show");
  await renderShelf();
}

function showManualPicker() {
  currentView = "look";
  $("shelfView").classList.remove("show");
  canvas.style.display = "block";
  setLookControlsVisible(false);
  fallback.classList.add("show");
}

async function renderShelf() {
  const grid = $("shelfGrid");
  const empty = $("shelfEmpty");
  const items = (await shelfGetAll())
    .sort((a, b) => b.ts - a.ts);

  shelfSaved = items.length;
  grid.replaceChildren();
  empty.style.display = items.length ? "none" : "block";

  for (const item of items) {
    const card = document.createElement("article");
    card.className = "shelf-card";

    const openButton = document.createElement("button");
    openButton.type = "button";
    openButton.className = "shelf-open";
    openButton.dataset.id = item.id;

    const image = document.createElement("img");
    image.alt = item.name || "保存した標本";
    const thumbUrl = URL.createObjectURL(item.thumb);
    image.src = thumbUrl;
    image.addEventListener(
      "load",
      () => URL.revokeObjectURL(thumbUrl),
      {once:true}
    );
    image.addEventListener(
      "error",
      () => URL.revokeObjectURL(thumbUrl),
      {once:true}
    );

    const name = document.createElement("span");
    name.className = "shelf-name";
    name.textContent = item.name || "名前のない標本";

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "shelf-delete";
    deleteButton.dataset.id = item.id;
    deleteButton.setAttribute(
      "aria-label",
      (item.name || "この標本") + "を削除"
    );
    deleteButton.textContent = "🗑";

    openButton.append(image, name);
    card.append(openButton, deleteButton);
    grid.append(card);
  }
}

async function saveToShelf() {
  if (
    shelfSaving ||
    !loaded ||
    !currentSourceBlob ||
    !currentDepthBlob
  ) {
    return null;
  }

  shelfSaving = true;
  const button = $("saveShelf");
  const normalLabel = "3Dラックにしまう";
  button.disabled = true;
  button.textContent = "保存中…";
  clearError();

  try {
    const id = await shelfPut({
      source:currentSourceBlob,
      depth:currentDepthBlob,
      name:currentSpecimenName ||
        defaultSpecimenName(currentSourceBlob),
      ts:Date.now()
    });

    shelfSaved += 1;
    button.textContent = "しまった";
    window.setTimeout(() => {
      button.textContent = normalLabel;
      button.disabled = false;
      shelfSaving = false;
    }, 1600);
    return id;
  } catch (error) {
    const quota =
      error?.name === "QuotaExceededError" ||
      error?.message?.includes("Quota");

    showError(
      quota
        ? "ブラウザの保存領域がいっぱいです。棚の標本をいくつか削除してください。"
        : "標本を棚に保存できませんでした: " +
          (error?.message || error)
    );
    button.textContent = normalLabel;
    button.disabled = false;
    shelfSaving = false;
    throw error;
  }
}

async function openFromShelf(id) {
  clearError();
  const item = await shelfGet(id);

  if (!item?.source || !item?.depth) {
    throw new Error("棚から標本を読み込めませんでした");
  }

  pendingShelfName = item.name || "名前のない標本";
  await loadPair(item.source, item.depth, false);
  return item.id;
}

async function deleteFromShelf(id) {
  const item = await shelfGet(id);
  if (!item) return false;

  const name = item.name || "この標本";
  if (!confirm("「" + name + "」を3Dラックから削除しますか？(ミタテの棚からも消えます)")) {
    return false;
  }

  await shelfRemove(id);
  await renderShelf();
  return true;
}

async function startStage2() {
  if (!storageOk) {
    // 3Dラック(保存)が使えない環境。覗くだけ(手動2ファイル)は使えるので案内して開放する
    hideNotice();
    showManualPicker();
    showError(
      "このブラウザでは3Dラック(保存)が使えません。他のアプリの中のブラウザで開いている場合は、" +
      "SafariやChromeなどのブラウザ本体でこのページを開き直してください。" +
      "下の画像選択からなら、保存なしでそのまま覗けます。"
    );
    return;
  }

  showNotice(
    "深度ページから画像を受け取っています…"
  );

  try { await migrateOldShelf(); } catch {}

  const [sourceItem, depthItem] = await Promise.all([
    handoffTake("source"),
    handoffTake("depth")
  ]);

  if (sourceItem?.blob && depthItem?.blob) {
    // 深度づくり→棚→標本 の流れ: 受け取った標本は自動で棚にしまい、棚から覗く
    pendingShelfName = (sourceItem.name || "").trim();
    await loadPair(
      sourceItem.blob,
      depthItem.blob,
      true
    );
    if (!loaded) return;   // 読み込み失敗時はloadPairが案内済み。偽の「しまいました」を出さない
    try {
      await saveToShelf();
      await showShelfView();
      showNotice("3Dラックにしまいました。タップすると覗けます");
      window.setTimeout(hideNotice, 4500);
    } catch {
      // 保存できなかったときはそのまま覗き画面(エラーはsaveToShelfが表示済み)
    }
    return;
  }

  hideNotice();

  const params = new URLSearchParams(location.search);

  // ?open=<id> で3Dラックの特定の体を直接覗く(ミタテの「👁 標本で覗く」用)
  const openId = params.get("open");
  if (openId) {
    try {
      await openFromShelf(Number(openId));
      return;
    } catch {
      showError("その体が見つからなかったため、3Dラックを開きます");
      await showShelfView();
      return;
    }
  }

  // ?view=shelf で棚に直行(入口ページの「3Dラック」ボタン用。0件でも棚の案内を出す)
  if (params.get("view") === "shelf") {
    await showShelfView();
    return;
  }

  try {
    const items = await shelfGetAll();
    shelfSaved = items.length;

    if (items.length) {
      await showShelfView();
    } else {
      showManualPicker();
    }
  } catch (error) {
    showManualPicker();
    showError(
      "標本の棚を確認できませんでした: " +
      (error?.message || error)
    );
  }
}

function showNotice(message) {
  notice.textContent = message;
  notice.style.display = "block";
}

function hideNotice() {
  notice.style.display = "none";
}

function showError(message) {
  errorText = String(message || "不明なエラー");
  errorBox.textContent = "エラー: " + errorText;
  errorBox.style.display = "block";
}

function clearError() {
  errorText = "";

}

function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE);
      }
      if (!db.objectStoreNames.contains("figures")) {
        db.createObjectStore("figures", {
          keyPath: "id",
          autoIncrement: true
        });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(
      request.error || new Error("ブラウザの保存領域を開けませんでした")
    );
  });
}

async function handoffTake(slot) {
  try {
    const db = await openDb();
    try {
      return await new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE, "readonly");
        const request = transaction.objectStore(STORE).get(slot);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    } finally {
      db.close();
    }
  } catch {
    return null;
  }
}

async function handoffClear(slot) {
  try {
    const db = await openDb();
    try {
      await new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE, "readwrite");
        transaction.objectStore(STORE).delete(slot);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(
          transaction.error || new Error("受け取りデータを消去できませんでした")
        );
      });
    } finally {
      db.close();
    }
  } catch {
    // 消去失敗は表示を妨げない。
  }
}

function blobToImage(blob, label) {
  return new Promise((resolve, reject) => {
    if (!blob || (blob.type && !blob.type.startsWith("image/"))) {
      reject(new Error(label + "が画像ファイルではありません"));
      return;
    }

    const url = URL.createObjectURL(blob);
    const image = new Image();

    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error(label + "を読み込めませんでした"));
    };
    image.src = url;
  });
}

function imageToDepthMap(image, width, height) {
  const work = document.createElement("canvas");
  work.width = width;
  work.height = height;

  const context = work.getContext("2d", {
    willReadFrequently: true
  });
  context.drawImage(image, 0, 0, width, height);

  const pixels = context.getImageData(0, 0, width, height).data;
  const depth = new Float32Array(width * height);

  for (let index = 0; index < depth.length; index++) {
    const offset = index * 4;
    depth[index] =
      (
        pixels[offset] * 0.2126 +
        pixels[offset + 1] * 0.7152 +
        pixels[offset + 2] * 0.0722
      ) / 255;
  }

  return depth;
}

function makeSourceTexture(image) {
  const texture = new THREE.Texture(image);
  texture.needsUpdate = true;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;
  return texture;
}

function disposeSpecimen() {
  if (specimen && scene) {
    scene.remove(specimen);
  }
  if (reliefGeometry) {
    reliefGeometry.dispose();
    reliefGeometry = null;
  }
  if (sourceTexture) {
    sourceTexture.dispose();
    sourceTexture = null;
  }
  if (specimen) {
    specimen.traverse(object => {
      if (!object.material) return;
      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];
      for (const material of materials) {
        material.dispose?.();
      }
      if (object.geometry && object.geometry !== reliefGeometry) {
        object.geometry.dispose?.();
      }
    });
  }
  specimen = null;
  meshVerts = 0;
}

function createBox(width, height, depth, color, x, y, z, roughness = 0.8) {
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  return mesh;
}

function createSpecimen(sourceImage, depthImage) {
  disposeSpecimen();

  const aspect = sourceImage.naturalWidth / sourceImage.naturalHeight;
  const innerHeight = 1.42;
  const innerWidth = innerHeight * aspect;
  const maxDimension = Math.max(
    sourceImage.naturalWidth,
    sourceImage.naturalHeight
  );

  let segmentsX = Math.round(
    sourceImage.naturalWidth / maxDimension * MAX_SEGMENTS
  );
  let segmentsY = Math.round(
    sourceImage.naturalHeight / maxDimension * MAX_SEGMENTS
  );
  segmentsX = clamp(segmentsX, 8, MAX_SEGMENTS);
  segmentsY = clamp(segmentsY, 8, MAX_SEGMENTS);

  reliefGeometry = new THREE.PlaneGeometry(
    innerWidth,
    innerHeight,
    segmentsX,
    segmentsY
  );

  const depthMap = imageToDepthMap(
    depthImage,
    segmentsX + 1,
    segmentsY + 1
  );
  const positions = reliefGeometry.attributes.position;
  const reliefStrength = Math.min(innerWidth, innerHeight) * 0.24;

  for (let y = 0; y <= segmentsY; y++) {
    for (let x = 0; x <= segmentsX; x++) {
      const vertex = y * (segmentsX + 1) + x;
      const depth = depthMap[vertex];
      const edgeX = Math.min(x / segmentsX, 1 - x / segmentsX);
      const edgeY = Math.min(y / segmentsY, 1 - y / segmentsY);
      const edgeFade = THREE.MathUtils.smoothstep(
        Math.min(edgeX, edgeY),
        0,
        0.075
      );
      positions.setZ(vertex, depth * reliefStrength * edgeFade);
    }
  }

  positions.needsUpdate = true;
  reliefGeometry.computeVertexNormals();
  reliefGeometry.computeBoundingSphere();
  meshVerts = positions.count;

  sourceTexture = makeSourceTexture(sourceImage);

  const reliefMaterial = new THREE.MeshStandardMaterial({
    map: sourceTexture,
    transparent: true,
    alphaTest: 0.04,
    side: THREE.DoubleSide,
    roughness: 0.78,
    metalness: 0,
    emissive: 0xffffff,
    emissiveMap: sourceTexture,
    emissiveIntensity: 0.12
  });

  // 「画面そのものが窓」構成(VRChatのモニタ窓と同じ考え方):
  // 額縁や箱は描かない。絵は窓(=画面)の奥に置き、視点が最大まで動いても
  // 絵の端が画面に入らないよう大きめに拡大する(端が見えるとジャギつき+興ざめ)。
  const BOX_DEPTH = Math.min(innerWidth, innerHeight) * 0.6;

  const group = new THREE.Group();
  const relief = new THREE.Mesh(reliefGeometry, reliefMaterial);
  relief.position.z = -BOX_DEPTH;
  group.userData.relief = relief;
  group.userData.reliefW = innerWidth;
  group.userData.reliefH = innerHeight;
  group.userData.boxDepth = BOX_DEPTH;
  group.userData.reliefStrength = reliefStrength;
  group.add(relief);

  // 背景: 同じ写真のぼかし拡大版(縦長写真を横長画面で見ても、余白がぼかしで埋まる)
  const blurCanvas = document.createElement("canvas");
  blurCanvas.width = 48;
  blurCanvas.height = 48;
  const bg = blurCanvas.getContext("2d");
  const cover = Math.max(48 / sourceImage.naturalWidth, 48 / sourceImage.naturalHeight);
  const bw = sourceImage.naturalWidth * cover, bh = sourceImage.naturalHeight * cover;
  bg.drawImage(sourceImage, (48 - bw) / 2, (48 - bh) / 2, bw, bh);
  bg.fillStyle = "rgba(0,0,0,0.42)";           // 主役より暗くして奥に沈める
  bg.fillRect(0, 0, 48, 48);
  const blurTexture = new THREE.CanvasTexture(blurCanvas);
  blurTexture.colorSpace = THREE.SRGBColorSpace;
  const backdrop = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: blurTexture })
  );
  backdrop.position.z = -BOX_DEPTH - 0.12;
  group.userData.backdrop = backdrop;
  group.add(backdrop);

  // 奥行きの手がかり: 箱の中を漂う小さな光の粒
  const moteMat = new THREE.MeshBasicMaterial({ color:0x8bd7ad, transparent:true, opacity:0.32, depthWrite:false });
  for (let i = 0; i < 6; i++) {
    const mote = new THREE.Mesh(
      new THREE.SphereGeometry(0.006 + Math.random() * 0.007, 6, 6),
      moteMat
    );
    mote.position.set(
      (Math.random() - 0.5) * innerWidth * 0.8,
      (Math.random() - 0.5) * innerHeight * 0.8,
      -0.06 - Math.random() * BOX_DEPTH * 0.75
    );
    group.add(mote);
  }

  specimen = group;
  scene.add(specimen);
  frameCamera();
}

function frameCamera() {
  // 画面そのものを「窓」として扱う軸外投影の準備。
  // 窓サイズは画面比から決め、絵は視点が最大まで動いても端が見えない大きさに拡大する。
  const ud = camera.userData;
  // 画面比はcanvasの実サイズから取る(裏タブ等でwindowが0x0でも壊さない)
  const cw = canvas.width || innerWidth || 1;
  const ch = canvas.height || innerHeight || 1;
  const aspect = (cw > 0 && ch > 0) ? cw / ch : 1;

  const winH = 1.3;
  const winW = winH * aspect;
  ud.winW = winW;
  ud.winH = winH;
  ud.baseDistance = winH * 1.05;
  ud.parallaxScale = winH * 0.3;

  if (specimen?.userData?.relief) {
    const D = specimen.userData.boxDepth;
    const d0 = ud.baseDistance;
    const dMin = d0 * 0.55;   // 顔を最接近させた時の距離
    const xMax = ud.parallaxScale;

    // 主役の写真: 窓に「収まる」大きさ(縦長でも切れない。少しだけ余裕を持たせる)
    const worldW = winW * (d0 + D) / d0;
    const worldH = winH * (d0 + D) / d0;
    const s = Math.min(
      worldW / specimen.userData.reliefW,
      worldH / specimen.userData.reliefH
    ) * 1.08;
    // 奥行き方向は「盛り上がりが窓から飛び出さない」上限に別途スケール
    const sz = (BOXZ => Math.max(0.5, Math.min(BOXZ, 4)))(
      (D * 0.6) / Math.max(specimen.userData.reliefStrength, 0.001)
    );
    specimen.userData.relief.scale.set(s, s, sz);

    // 背景のぼかし版: 最接近+最大視差でも画面を覆い切る大きさ
    if (specimen.userData.backdrop) {
      const Db = D + 0.12;
      const needW = winW * (dMin + Db) / dMin + 2 * xMax * Db / dMin;
      const needH = winH * (dMin + Db) / dMin + 2 * xMax * Db / dMin;
      specimen.userData.backdrop.scale.set(needW * 1.05, needH * 1.05, 1);
    }
  }
  updateCamera(true);
}

function initThree() {
  if (renderer) return;

  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    preserveDrawingBuffer:true
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d120f);

  camera = new THREE.PerspectiveCamera(
    42,
    innerWidth / innerHeight,
    0.01,
    100
  );

  scene.add(new THREE.HemisphereLight(
    0xfff5e8,
    0x243029,
    1.35
  ));

  const key = new THREE.DirectionalLight(0xfff4df, 2.0);
  key.position.set(-2.5, 3.2, 4);
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xbbe8d0, 0.8);
  fill.position.set(3, -1, 2);
  scene.add(fill);
}

function updateCamera(immediate = false) {
  if (!camera) return;

  if (immediate) {
    smoothX = targetX;
    smoothY = targetY;
    zoomSmooth = zoomTarget;
  } else {
    smoothX += (targetX - smoothX) * SMOOTHING;
    smoothY += (targetY - smoothY) * SMOOTHING;
    zoomSmooth += (zoomTarget - zoomSmooth) * 0.08;
  }

  const ud = camera.userData;
  const w = ud.winW || 1.8;
  const h = ud.winH || 1.8;
  const d = (ud.baseDistance || 2.6) * zoomSmooth;
  const scale = ud.parallaxScale || 0.3;
  const x = smoothX * scale;
  const y = -smoothY * scale;

  // 軸外投影(off-axis projection): 窓は空間に固定したまま視点だけ動かす。
  // lookAtで首を振る方式だと「絵が回る」だけで窓にならない(フィッシュタンクVRの心臓部)。
  camera.position.set(x, y, d);
  camera.rotation.set(0, 0, 0);
  const n = 0.01;
  camera.projectionMatrix.makePerspective(
    n * (-w / 2 - x) / d,
    n * ( w / 2 - x) / d,
    n * ( h / 2 - y) / d,
    n * (-h / 2 - y) / d,
    n, 100
  );
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}

function renderFrame() {
  updateCamera(false);
  renderer?.render(scene, camera);
}

function animate() {
  renderFrame();
  animationId = requestAnimationFrame(animate);
}

async function loadPair(sourceBlob, depthBlob, consumeHandoff = false) {
  clearError();
  hideNotice();
  fallback.classList.remove("show");
  showNotice("標本を組み立てています…");

  try {
    const [sourceImage, depthImage] = await Promise.all([
      blobToImage(sourceBlob, "元画像"),
      blobToImage(depthBlob, "深度画像")
    ]);

    initThree();
    createSpecimen(sourceImage, depthImage);
    loaded = true;
    currentSourceBlob = sourceBlob;
    currentDepthBlob = depthBlob;
    currentSpecimenName =
      pendingShelfName || defaultSpecimenName(sourceBlob);
    pendingShelfName = "";
    showLookView();

    if (consumeHandoff) {
      await Promise.all([
        handoffClear("source"),
        handoffClear("depth")
      ]);
    }

    hideNotice();

    if (isTouchDevice) {
      permission.classList.add("show");
    } else {
      permission.classList.remove("show");
    }

    $("faceBtn").style.display = "block";
    renderFrame();
  } catch (error) {
    loaded = false;
    fallback.classList.add("show");
    hideNotice();
    showError(
      error?.message ||
      "画像から標本を作れませんでした"
    );
  }
}

async function tryHandoff() {
  showNotice("深度ページから画像を受け取っています…");

  const [sourceItem, depthItem] = await Promise.all([
    handoffTake("source"),
    handoffTake("depth")
  ]);

  if (sourceItem?.blob && depthItem?.blob) {
    await loadPair(sourceItem.blob, depthItem.blob, true);
    return;
  }

  hideNotice();
  fallback.classList.add("show");
}

function updateFileButton() {

function setParallax(x, y) {
  targetX = clamp(Number(x) || 0, -1, 1);
  targetY = clamp(Number(y) || 0, -1, 1);
}

function enableOrientation() {
  if (orientationEnabled) return;
  orientationEnabled = true;
  orientationBase = null;
  window.addEventListener(
    "deviceorientation",
    handleOrientation,
    true
  );
}

function handleOrientation(event) {
  // 顔で覗くと併用可: スマホでは傾き=視差、顔=距離の分担(faceActiveでも止めない)
  if (debugOverride) return;

  const gamma = Number(event.gamma);
  const beta = Number(event.beta);
  if (!Number.isFinite(gamma) || !Number.isFinite(beta)) return;

  if (!orientationBase) {
    orientationBase = {gamma, beta};
  }

  const dx = gamma - orientationBase.gamma;
  const dy = beta - orientationBase.beta;
  setParallax(dx / 28, dy / 28);
}

$("startLook").addEventListener("click", async () => {
  clearError();

  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const result =
        await DeviceOrientationEvent.requestPermission();

      if (result !== "granted") {
        showError(
          "ジャイロの利用が許可されませんでした。指でドラッグして覗けます。"
        );
      } else {
        enableOrientation();
      }
    } else if (typeof DeviceOrientationEvent !== "undefined") {
      enableOrientation();
    }

    permission.classList.remove("show");
  } catch (error) {
    permission.classList.remove("show");
    showError(
      "ジャイロを開始できませんでした。指でドラッグして覗けます。"
    );
  }
});

window.addEventListener("pointermove", event => {
  if (!loaded || dragging || debugOverride || faceActive) return;
  if (event.pointerType === "touch") return;

  const x = event.clientX / Math.max(innerWidth, 1) * 2 - 1;
  const y = event.clientY / Math.max(innerHeight, 1) * 2 - 1;
  setParallax(x, y);
});

canvas.addEventListener("pointerdown", event => {
  if (!loaded) return;

  dragging = true;
  debugOverride = false;
  canvas.classList.add("dragging");
  canvas.setPointerCapture?.(event.pointerId);

  dragStartX = event.clientX;
  dragStartY = event.clientY;
  dragOriginX = targetX;
  dragOriginY = targetY;
});

canvas.addEventListener("pointermove", event => {
  if (!dragging || !loaded) return;

  const dx =
    (event.clientX - dragStartX) / Math.max(innerWidth, 1) * 2;
  const dy =
    (event.clientY - dragStartY) / Math.max(innerHeight, 1) * 2;

  setParallax(
    dragOriginX + dx,
    dragOriginY + dy
  );
});

function endDrag(event) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove("dragging");
  canvas.releasePointerCapture?.(event.pointerId);
}

canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

window.addEventListener("resize", () => {
  if (!renderer || !camera) return;

  renderer.setSize(innerWidth, innerHeight, false);
  frameCamera();
  renderFrame();
});

// ---- 顔で覗く(ウェブカメラ+MediaPipe顔検出。PC向け、フィッシュタンクVR本来の形) ----
let faceActive = false;
let faceStream = null;
let faceDetector = null;
let faceVideo = null;
let faceRafId = 0;
let faceBaseW = null;           // 開始時の顔の大きさ(距離の基準)
const FACE_GAIN = 2.4;          // 顔の動き→視差の倍率(強すぎたらここを下げる)

async function startFaceLook() {
  const btn = $("faceBtn");
  btn.disabled = true;
  btn.textContent = "🎥 準備中…";
  clearError();

  try {
    faceStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: 640, height: 480 },
      audio: false
    });
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "🎥 顔で覗く";
    showError("カメラを使えませんでした。ブラウザのカメラ許可を確認してください。");
    return;
  }

  try {
    if (!faceDetector) {
      const vision = await import("./lib/mediapipe/vision_bundle.mjs");
      const fileset = await vision.FilesetResolver.forVisionTasks("./lib/mediapipe/wasm");
      faceDetector = await vision.FaceDetector.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: "./lib/mediapipe/blaze_face_short_range.tflite" },
        runningMode: "VIDEO"
      });
    }

    faceVideo = document.createElement("video");
    faceVideo.playsInline = true;
    faceVideo.muted = true;
    faceVideo.srcObject = faceStream;
    await faceVideo.play();

    faceActive = true;
    orientationBase = null;      // 戻ったときの傾き基準を取り直す
    btn.disabled = false;
    btn.classList.add("on");
    btn.textContent = "🎥 顔で覗くのをやめる";
    $("hint").textContent = orientationEnabled
      ? "傾けて覗く+顔を近づけると窓に近づきます"
      : "顔を左右に動かすと覗け、近づくと窓に近づきます";
    faceLoop();
  } catch (e) {
    stopFaceLook();
    showError("顔検出の準備に失敗しました: " + (e?.message || e));
  }
}

function faceLoop() {
  if (!faceActive) return;
  faceRafId = requestAnimationFrame(faceLoop);
  if (!faceVideo || faceVideo.readyState < 2) return;

  const result = faceDetector.detectForVideo(faceVideo, performance.now());
  const det = result?.detections?.[0];
  if (!det) return;              // 顔が見えない間は直前の視点を保つ

  const box = det.boundingBox;
  const cx = (box.originX + box.width / 2) / faceVideo.videoWidth;
  const cy = (box.originY + box.height / 2) / faceVideo.videoHeight;
  // ウェブカメラは鏡像でないため、頭を右へ動かすと画像上では左(cxが減る)
  // スマホでジャイロが生きている間は、視差は傾きに任せて顔は「距離」専用にする
  // (傾け＋近づきの合わせ技。PCや、ジャイロ未許可のときは顔が視差も担当)
  if (!orientationEnabled) {
    const fx = (0.5 - cx) * 2 * FACE_GAIN;
    const fy = (cy - 0.5) * 2 * FACE_GAIN;
    targetX = clamp(fx, -1, 1);
    targetY = clamp(fy, -1, 1);
  }

  // 顔の大きさ=距離。近づくと窓に近づく(ズーム)。開始時の顔サイズを基準にする
  const bw = box.width / faceVideo.videoWidth;
  if (!faceBaseW) faceBaseW = bw;
  zoomTarget = clamp(faceBaseW / Math.max(bw, 0.02), 0.55, 1.8);
}

function stopFaceLook() {
  faceActive = false;
  if (faceRafId) { cancelAnimationFrame(faceRafId); faceRafId = 0; }
  if (faceStream) {
    for (const t of faceStream.getTracks()) t.stop();
    faceStream = null;
  }
  if (faceVideo) { faceVideo.srcObject = null; faceVideo = null; }
  const btn = $("faceBtn");
  btn.disabled = false;
  btn.classList.remove("on");
  btn.textContent = "🎥 顔で覗く";
  $("hint").textContent = "端末を傾ける／マウスを動かすと、窓の中を覗けます";
  targetX = 0; targetY = 0;
  faceBaseW = null;
  zoomTarget = 1;
}

$("shelfNav").addEventListener("click", () => {
  showShelfView().catch(error => {
    showError(
      "標本の棚を表示できませんでした: " +
      (error?.message || error)
    );
  });
});

$("saveShelf").addEventListener("click", () => {
  saveToShelf().catch(() => {});
});

$("toMitate").addEventListener("click", () => {
  stopFaceLook();
  location.href = "mitate.html";
});

$("shelfAdd").addEventListener("click", showManualPicker);

$("shelfGrid").addEventListener("click", event => {
  const deleteButton = event.target.closest(".shelf-delete");
  if (deleteButton) {
    deleteFromShelf(deleteButton.dataset.id).catch(error => {
      showError(
        "標本を削除できませんでした: " +
        (error?.message || error)
      );
    });
    return;
  }

  const openButton = event.target.closest(".shelf-open");
  if (openButton) {
    openFromShelf(openButton.dataset.id).catch(error => {
      showError(
        "標本を開けませんでした: " +
        (error?.message || error)
      );
    });
  }
});

$("faceBtn").addEventListener("click", () => {
  if (faceActive) stopFaceLook(); else startFaceLook();
});
window.addEventListener("pagehide", stopFaceLook);

window.__dbg = {
  setParallax(x, y) {
    debugOverride = true;
    setParallax(x, y);
    smoothX = targetX;
    smoothY = targetY;
    renderFrame();
  },

  state() {
    return {
      loaded,
      camX:camera ? camera.position.x : 0,
      camY:camera ? camera.position.y : 0,
      meshVerts,
      faceActive,
      view:currentView,
      shelfSaved,
      err:errorText
    };
  },

  snap() {
    if (!renderer) return "";
    if (!canvas.width || !canvas.height) {
      // 裏タブでサイズ0のときの検証用フォールバック
      renderer.setSize(960, 720, false);
      frameCamera();
    }
    renderFrame();
    return canvas.toDataURL("image/jpeg", 0.8);
  },

  step() {
    renderFrame();
    return this.state();
  },

  saveToShelf,

  async shelfList() {
    const items = await shelfGetAll();
    return items
      .sort((a, b) => b.ts - a.ts)
      .map(item => ({
        id:item.id,
        name:item.name,
        ts:item.ts,
        thumbBytes:item.thumb?.size || 0
      }));
  },

  openFromShelf,

  deleteFromShelf
};

initThree();
animate();
startStage2().catch(e => {
  hideNotice();
  showManualPicker();
  showError("開始処理に失敗しました: " + (e?.message || e) +
    " / 下の画像選択からなら、そのまま覗けます");
});

2. 開発者ツールで __dbg.setParallax(-1, 0)、__dbg.state()、
   __dbg.setParallax(1, 0)、__dbg.step() の順に実行し、camXの符号が変わることを確認する。
3. __dbg.snap() を実行し、返されたdata:image/jpeg URLを開いて標本表示を確認する。
