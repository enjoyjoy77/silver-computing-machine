<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深度レリーフ工房 v1 — Depth Relief Studio</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.160.0/"
  }
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0d0e12; --panel:#15171e; --panel2:#1c1f29; --line:#2a2e3a;
    --ink:#e7e9ef; --dim:#8b90a0; --amber:#ff9f43; --amber2:#ffb86b;
    --hot:#e8602c; --ok:#5fd38a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'SF Mono',ui-monospace,'Roboto Mono',Menlo,Consolas,monospace;
    overflow:hidden;}
  canvas#view{position:fixed;inset:0;display:block;}

  /* ヘッダ */
  #top{position:fixed;top:0;left:0;right:0;height:48px;z-index:20;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:linear-gradient(180deg,rgba(13,14,18,.92),rgba(13,14,18,.0));
    pointer-events:none;}
  #top h1{margin:0;font-size:13px;letter-spacing:.06em;font-weight:700;
    text-transform:uppercase;color:var(--ink);}
  #top h1 b{color:var(--amber);font-weight:700;}
  #rev{font-size:10px;color:var(--dim);letter-spacing:.1em;}

  /* ドロップ画面 */
  #drop{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;background:var(--bg);padding:24px;}
  #drop .mark{font-size:12px;letter-spacing:.4em;color:var(--amber);text-transform:uppercase;}
  #drop h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;text-align:center;line-height:1.3;}
  #drop p{margin:0;color:var(--dim);font-size:12.5px;text-align:center;max-width:440px;line-height:1.7;}
  #zone{width:min(92vw,460px);aspect-ratio:4/3;border:1.5px dashed var(--line);
    border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;cursor:pointer;transition:border-color .2s,background .2s;background:var(--panel);}
  #zone.over{border-color:var(--amber);background:var(--panel2);}
  #zone .ico{width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,var(--hot),var(--amber));
    display:flex;align-items:center;justify-content:center;font-size:30px;}
  #zone .t{font-size:15px;font-weight:700;}
  #zone .s{font-size:11.5px;color:var(--dim);}

  /* 下部コントロール */
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
    flex-direction:column;gap:9px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(13,14,18,.96),rgba(13,14,18,.0));}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:8px 12px;display:flex;align-items:center;gap:10px;}
  label.k{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;
    background:var(--line);outline:none;width:140px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--amber);cursor:pointer;border:2px solid var(--bg);}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--amber);
    cursor:pointer;border:2px solid var(--bg);}
  .val{font-size:12px;font-weight:700;color:var(--amber2);min-width:46px;text-align:right;}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    border-radius:11px;padding:10px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:background .15s,border-color .15s;}
  .btn:hover{border-color:var(--amber);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn.hot{background:linear-gradient(135deg,var(--hot),var(--amber));border:none;color:#1a1003;}
  .btn.on{background:var(--amber);color:#1a1003;border-color:transparent;}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .seg button{border:none;background:transparent;color:var(--dim);padding:10px 14px;
    font:inherit;font-size:12px;font-weight:700;cursor:pointer;}
  .seg button.on{background:var(--panel2);color:var(--amber);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  input[type=checkbox]{accent-color:var(--amber);}

  /* 進捗オーバーレイ */
  #prog{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:rgba(13,14,18,.86);backdrop-filter:blur(4px);}
  #prog .ring{width:54px;height:54px;border:4px solid var(--line);border-top-color:var(--amber);
    border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #prog .msg{font-size:13px;color:var(--ink);letter-spacing:.04em;}
  #prog .sub{font-size:11px;color:var(--dim);max-width:320px;text-align:center;line-height:1.6;}

  #toast{position:fixed;left:50%;bottom:calc(100% - 96px);transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    padding:10px 16px;border-radius:11px;font-size:12px;z-index:50;display:none;
    bottom:auto;top:60px;white-space:nowrap;max-width:90vw;}
  #err{position:fixed;left:50%;top:60px;transform:translateX(-50%);
    background:#3a1414;border:1px solid #7a2a2a;color:#ffd9d9;
    padding:11px 16px;border-radius:11px;font-size:12px;z-index:50;display:none;max-width:90vw;text-align:center;}
  .hint{font-size:10.5px;color:var(--dim);text-align:center;letter-spacing:.04em;}
  a.hidden-link{display:none;}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="top">
  <h1>深度レリーフ<b>工房</b></h1>
  <span id="rev">v1 rev1</span>
</div>

<!-- ドロップ -->
<div id="drop">
  <div class="mark">Depth Relief Studio</div>
  <h2>画像から立体レリーフを作る</h2>
  <div id="zone">
    <div class="ico">⛰️</div>
    <div class="t">画像をドロップ / タップで選択</div>
    <div class="s">人物・風景なんでも。背景透過PNGなら輪郭が抜けます</div>
  </div>
  <p>読み込んだあと「深度を生成」を押すと、ブラウザ内のAIが奥行きを推定して立体化します。生成した深度マップはPNGで保存でき、別の端末で読み込めます。</p>
  <input type="file" id="fileIn" accept="image/*" style="display:none">
</div>

<!-- コントロール -->
<div id="ui">
  <div class="row">
    <button class="btn hot" id="genBtn">✨ 深度を生成</button>
    <button class="btn" id="loadDepthBtn"><span class="dot" id="depthDot"></span> 深度を読込</button>
    <button class="btn" id="saveDepthBtn">💾 深度を保存</button>
    <input type="file" id="depthIn" accept="image/*" style="display:none">
  </div>
  <div class="row">
    <div class="card">
      <label class="k">立体の強さ</label>
      <input type="range" id="depthRange" min="0" max="120" value="35" step="1">
      <span class="val" id="depthVal">35</span>
    </div>
    <div class="card">
      <label class="k" style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="invChk"> 奥行き反転
      </label>
    </div>
    <div class="seg" id="resSeg">
      <button data-r="180">粗い</button>
      <button data-r="300" class="on">標準</button>
      <button data-r="460">精細</button>
    </div>
  </div>
  <div class="row">
    <button class="btn" id="arBtn" disabled>🥽 AR</button>
    <button class="btn" id="vrBtn" disabled>🌐 VR</button>
    <button class="btn" id="resetBtn">↩ 視点</button>
    <button class="btn" id="newBtn">📂 別画像</button>
  </div>
  <div class="hint" id="hint">ドラッグで回転・二本指でズーム / 正面±40°で立体感が映えます</div>
</div>

<!-- 進捗 -->
<div id="prog">
  <div class="ring"></div>
  <div class="msg" id="progMsg">深度を推定中…</div>
  <div class="sub" id="progSub">初回はAIモデルの読み込みに時間がかかります（数十〜数百MB）。次回からは速くなります。</div>
</div>

<div id="toast"></div>
<div id="err"></div>
<a id="arLink" rel="ar" class="hidden-link"></a>

<script>
"use strict";
const APP_REV='rev1';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200);}
function showErr(m){const e=$('err');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',5000);}
function showProg(msg){$('progMsg').textContent=msg||'処理中…';$('prog').style.display='flex';}
function hideProg(){$('prog').style.display='none';}

/* ============ 状態 ============ */
const S={
  img:null,            // 元画像(Image)
  tex:null,            // THREE.Texture
  aspect:1,
  depth:null,          // {data,w,h} 深度マップ(R=近いほど大)
  alpha:null,          // {data,w,h} αチャンネル
  depthCm:35,          // 立体の強さ(cm)
  invert:false,
  res:300,             // メッシュ分割
};

/* ============ three 基本 ============ */
const canvas=$('view');
// WebGLレンダラは画像を読み込むまで作らない（iOSが写真ピッカー中にページを破棄するのを防ぐ）
let renderer=null;
function init3D(){
  if(renderer)return;
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.xr.enabled=true;
  renderer.setAnimationLoop(renderLoop);
}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.01,100);

// 背景グラデ
const bgCv=document.createElement('canvas');bgCv.width=8;bgCv.height=256;
(()=>{const g=bgCv.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#14151c');gr.addColorStop(1,'#0b0c10');g.fillStyle=gr;g.fillRect(0,0,8,256);})();
let bgTex=new THREE.CanvasTexture(bgCv);scene.background=bgTex;

scene.add(new THREE.HemisphereLight(0xfff0e0,0x202028,0.9));
const key=new THREE.DirectionalLight(0xffffff,1.0);key.position.set(1.2,2,3);scene.add(key);
const rim=new THREE.DirectionalLight(0xffd9a8,0.5);rim.position.set(-2,1,-1);scene.add(rim);

const root=new THREE.Group();scene.add(root);   // レリーフを載せる（AR/VRで動かす単位）
let reliefMesh=null, reliefGeo=null;

/* ============ 画像/深度 → マップ ============ */
function imageToMap(img,maxW){
  const w=Math.min(img.naturalWidth||img.width,maxW);
  const h=Math.round(w*(img.naturalHeight||img.height)/(img.naturalWidth||img.width));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
  return {data:ctx.getImageData(0,0,w,h).data,w,h};
}
function sampleBilinear(map,u,v,ch){
  const fx=clamp(u*(map.w-1),0,map.w-1), fy=clamp((1-v)*(map.h-1),0,map.h-1);
  const x0=Math.floor(fx),y0=Math.floor(fy),x1=Math.min(x0+1,map.w-1),y1=Math.min(y0+1,map.h-1);
  const tx=fx-x0,ty=fy-y0,g=(x,y)=>map.data[(y*map.w+x)*4+ch];
  return (g(x0,y0)*(1-tx)+g(x1,y0)*tx)*(1-ty)+(g(x0,y1)*(1-tx)+g(x1,y1)*tx)*ty;
}

/* ============ レリーフ構築 ============ */
function fileToImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>res({img:im,url});im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読めませんでした'));};
    im.src=url;
  });
}
function buildRelief(){
  if(reliefMesh){root.remove(reliefMesh);reliefMesh.geometry.dispose();
    (Array.isArray(reliefMesh.material)?reliefMesh.material:[reliefMesh.material]).forEach(m=>m.dispose&&m.dispose());reliefMesh=null;}
  if(!S.tex)return;
  const baseH=1.0;                          // 高さ1m基準
  const w=baseH*S.aspect, h=baseH;
  const RES=S.res;
  let sx,sy;
  if(S.aspect>=1){sx=RES;sy=Math.max(Math.round(RES/S.aspect),8);}
  else{sy=RES;sx=Math.max(Math.round(RES*S.aspect),8);}
  reliefGeo=new THREE.PlaneGeometry(w,h,sx,sy);
  const mat=new THREE.MeshStandardMaterial({map:S.tex,transparent:true,alphaTest:.06,
    side:THREE.DoubleSide,roughness:.96,metalness:0});
  reliefMesh=new THREE.Mesh(reliefGeo,mat);
  reliefMesh.position.y=h/2;
  root.add(reliefMesh);
  displace();
  frameCamera();
}
function displace(){
  if(!reliefGeo)return;
  const pos=reliefGeo.attributes.position, uv=reliefGeo.attributes.uv;
  const scaleM=S.depthCm/100;
  for(let i=0;i<pos.count;i++){
    const u=uv.getX(i),v=uv.getY(i);
    let d=0;
    if(S.depth){d=sampleBilinear(S.depth,u,v,0)/255;if(S.invert)d=1-d;}
    if(S.alpha&&sampleBilinear(S.alpha,u,v,3)<20)d=0;   // 透明部は奥へ
    pos.setZ(i,d*scaleM);
  }
  pos.needsUpdate=true;
  reliefGeo.computeVertexNormals();
}

/* ============ カメラ（軌道） ============ */
const ctl={r:1.7,th:0,ph:Math.PI/2,tx:0,ty:0.5,tz:0,vth:0,vph:0};
function applyCam(){
  const s=Math.sin(ctl.ph);
  camera.position.set(ctl.tx+ctl.r*s*Math.sin(ctl.th),ctl.ty+ctl.r*Math.cos(ctl.ph),ctl.tz+ctl.r*s*Math.cos(ctl.th));
  camera.lookAt(ctl.tx,ctl.ty,ctl.tz);
}
function frameCamera(){ ctl.r=1.6;ctl.th=0;ctl.ph=Math.PI/2;ctl.ty=0.5;ctl.vth=0;ctl.vph=0; applyCam(); }

let dragging=false;const ptrs=new Map();let pinchD=0;
canvas.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=true;ctl.vth=ctl.vph=0;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){ctl.th-=dx*.006;ctl.ph=clamp(ctl.ph-dy*.006,.05,Math.PI-.05);ctl.vth=-dx*.0015;ctl.vph=-dy*.0015;}
  else if(ptrs.size===2){const a=[...ptrs.values()];const nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD)ctl.r=clamp(ctl.r*(pinchD/nd),0.5,6);pinchD=nd;}
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=0;if(ptrs.size===0)dragging=false;}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();ctl.r=clamp(ctl.r*(1+Math.sign(e.deltaY)*.08),0.5,6);},{passive:false});
$('resetBtn').onclick=frameCamera;

/* ============ 画像読み込み ============ */
async function loadImage(file){
  if(!file){showErr('画像ファイルを選んでください');return;}
  if(file.type && !file.type.startsWith('image/')){showErr('画像ファイルを選んでください');return;}
  try{
    init3D();
    const {img,url}=await fileToImage(file);
    S.img=img;S.aspect=img.naturalWidth/img.naturalHeight;
    const tex=new THREE.Texture(img);tex.encoding=THREE.sRGBEncoding;tex.needsUpdate=true;
    S.tex=tex;
    S.alpha=imageToMap(img,512);
    S.depth=null;$('depthDot').classList.remove('ok');
    buildRelief();
    $('drop').style.display='none';$('ui').style.display='flex';
    URL.revokeObjectURL(url);
    toast('読み込み完了。「深度を生成」で立体化');
  }catch(e){showErr(e.message);}
}
$('fileIn').addEventListener('change',e=>{if(e.target.files[0])loadImage(e.target.files[0]);e.target.value='';});
$('newBtn').onclick=()=>$('fileIn').click();
const zone=$('zone');
zone.onclick=()=>$('fileIn').click();
zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');if(e.dataTransfer.files[0])loadImage(e.dataTransfer.files[0]);});
document.body.addEventListener('dragover',e=>e.preventDefault());
document.body.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;
  if($('drop').style.display!=='none')loadImage(f);});

/* ============ 深度の自動生成（Transformers.js / Depth Anything V2） ============ */
let pipePromise=null;
function getPipe(){
  if(pipePromise)return pipePromise;
  pipePromise=(async()=>{
    const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2');
    T.env.allowLocalModels=false;
    let device='wasm';
    try{ if(navigator.gpu&&await navigator.gpu.requestAdapter())device='webgpu'; }catch(_){}
    try{
      return {pipe:await T.pipeline('depth-estimation','onnx-community/depth-anything-v2-base',{device,dtype:'fp32'}),T,model:'base'};
    }catch(e){
      return {pipe:await T.pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{device,dtype:'fp32'}),T,model:'small'};
    }
  })();
  return pipePromise;
}
async function generateDepth(){
  if(!S.img){showErr('先に画像を読み込んでください');return;}
  showProg('AIモデルを準備中…');
  try{
    const {pipe,model}=await getPipe();
    $('progMsg').textContent='深度を推定中…（'+model+'）';
    // 入力（最大768px）
    const mw=Math.min(S.img.naturalWidth||768,768);
    const mh=Math.round(mw*(S.img.naturalHeight||S.img.height)/(S.img.naturalWidth||S.img.width));
    const cv=document.createElement('canvas');cv.width=mw;cv.height=mh;
    cv.getContext('2d').drawImage(S.img,0,0,mw,mh);
    const out=await pipe(cv.toDataURL('image/png'));
    const depthImg=out.depth.toCanvas?out.depth.toCanvas():out.depth;  // ImageData or canvas-able
    // depthをcanvasに描いて取り出す
    const dcv=document.createElement('canvas');
    const dw=out.depth.width, dh=out.depth.height;
    dcv.width=dw;dcv.height=dh;
    const dctx=dcv.getContext('2d');
    if(out.depth.data){ // RawImage: data(Uint8 grayscale)
      const id=dctx.createImageData(dw,dh);const ch=out.depth.channels||1;
      for(let i=0;i<dw*dh;i++){const g=out.depth.data[i*ch];id.data[i*4]=g;id.data[i*4+1]=g;id.data[i*4+2]=g;id.data[i*4+3]=255;}
      dctx.putImageData(id,0,0);
    }else{ dctx.drawImage(depthImg,0,0); }
    // 640px幅に正規化して保持
    const sw=Math.min(dw,640),sh=Math.round(dh*sw/dw);
    const sm=document.createElement('canvas');sm.width=sw;sm.height=sh;
    sm.getContext('2d').drawImage(dcv,0,0,sw,sh);
    S.depth={data:sm.getContext('2d').getImageData(0,0,sw,sh).data,w:sw,h:sh};
    S.invert=false;$('invChk').checked=false;
    $('depthDot').classList.add('ok');
    displace();
    hideProg();
    toast('深度を生成しました ✅ 強さスライダーで調整');
  }catch(e){hideProg();showErr('深度生成に失敗: '+(e&&e.message||e));pipePromise=null;}
}
$('genBtn').onclick=generateDepth;

/* ============ 深度の手動読み込み・保存 ============ */
async function loadDepthMap(file){
  if(!file){showErr('深度マップは画像で指定してください');return;}
  if(file.type && !file.type.startsWith('image/')){showErr('深度マップは画像で指定してください');return;}
  try{
    const {img,url}=await fileToImage(file);
    S.depth=imageToMap(img,640);
    $('depthDot').classList.add('ok');
    displace();
    URL.revokeObjectURL(url);
    toast('深度マップを適用しました');
  }catch(e){showErr(e.message);}
}
$('depthIn').addEventListener('change',e=>{if(e.target.files[0])loadDepthMap(e.target.files[0]);e.target.value='';});
$('loadDepthBtn').onclick=()=>$('depthIn').click();
$('saveDepthBtn').onclick=()=>{
  if(!S.depth){showErr('先に深度を生成/読み込みしてください');return;}
  const d=S.depth;const cv=document.createElement('canvas');cv.width=d.w;cv.height=d.h;
  const ctx=cv.getContext('2d');const id=ctx.createImageData(d.w,d.h);id.data.set(d.data);ctx.putImageData(id,0,0);
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='depth.png';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);},'image/png');
  toast('深度マップPNGを保存しました');
};

/* ============ コントロール配線 ============ */
$('depthRange').addEventListener('input',()=>{S.depthCm=parseInt($('depthRange').value);$('depthVal').textContent=S.depthCm;displace();});
$('invChk').addEventListener('change',()=>{S.invert=$('invChk').checked;displace();});
$('resSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  [...$('resSeg').children].forEach(x=>x.classList.toggle('on',x===b));
  S.res=parseInt(b.dataset.r);buildRelief();});

/* ============ WebXR (Quest AR/VR) ============ */
let xrSession=null,xrMode=null,hitSource=null,hitReq=false,placed=false;
const reticle=new THREE.Mesh(new THREE.RingGeometry(0.07,0.09,28).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0xff9f43}));
reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);

// コントローラ（掴んで動かす）
const raycaster=new THREE.Raycaster();const tmpV=new THREE.Vector3();
const controllers=[];const grab=[null,null];let pinch=null;
function setupControllers(){
  if(controllers.length)return;
  for(let i=0;i<2;i++){
    const c=renderer.xr.getController(i);scene.add(c);
    const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-3)]);
    c.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xff9f43})));
    c.userData.i=i;
    c.addEventListener('connected',e=>c.userData.src=e.data);
    c.addEventListener('disconnected',()=>c.userData.src=null);
    c.addEventListener('selectstart',()=>onGrab(i));
    c.addEventListener('selectend',()=>onRelease(i));
    controllers.push(c);
  }
}
function ctrlPos(k){return new THREE.Vector3().setFromMatrixPosition(controllers[k].matrixWorld);}
function onGrab(i){
  if(xrMode==='ar'&&!placed)return;
  if(!reliefMesh)return;
  const c=controllers[i];tmpV.setFromMatrixPosition(c.matrixWorld);
  const dir=new THREE.Vector3(0,0,-1).transformDirection(c.matrixWorld).normalize();
  raycaster.set(tmpV,dir);
  const hit=raycaster.intersectObject(reliefMesh,true);
  if(hit.length){
    grab[i]=true;const other=i^1;
    if(grab[other]){beginPinch();}else{c.attach(root);}
  }
}
function onRelease(i){
  if(!grab[i])return;grab[i]=false;const other=i^1;
  if(pinch){endPinch();if(grab[other])controllers[other].attach(root);else scene.attach(root);}
  else if(!grab[other])scene.attach(root);
}
function beginPinch(){
  scene.attach(root);
  const p0=ctrlPos(0),p1=ctrlPos(1);
  pinch={d0:Math.max(p0.distanceTo(p1),1e-4),s0:root.scale.x,
    a0:Math.atan2(p1.x-p0.x,p1.z-p0.z),r0:root.rotation.y};
}
function endPinch(){pinch=null;}
function updatePinch(){
  if(!pinch)return;const p0=ctrlPos(0),p1=ctrlPos(1);
  const d=Math.max(p0.distanceTo(p1),1e-4);
  root.scale.setScalar(clamp(pinch.s0*(d/pinch.d0),0.2,8));
  const mid=p0.clone().add(p1).multiplyScalar(0.5);
  root.position.x=mid.x;root.position.z=mid.z;
  root.rotation.y=pinch.r0+(Math.atan2(p1.x-p0.x,p1.z-p0.z)-pinch.a0);
}

async function startAR(){
  if(xrSession){xrSession.end();return;}
  try{
    const s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['local-floor']});
    xrSession=s;xrMode='ar';
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(s);
    $('arBtn').textContent='🛑 終了';scene.background=null;
    root.position.set(0,0,-1.6);placed=false;hitReq=false;
    setupControllers();
    s.addEventListener('end',()=>{xrSession=null;xrMode=null;hitSource=null;hitReq=false;
      $('arBtn').textContent='🥽 AR';scene.background=bgTex;reticle.visible=false;
      root.position.set(0,0,0);root.quaternion.identity();root.scale.setScalar(1);});
    s.addEventListener('select',()=>{if(reticle.visible&&!placed){
      reticle.matrix.decompose(root.position,root.quaternion,root.scale);root.scale.setScalar(1);
      placed=true;reticle.visible=false;toast('配置完了。トリガーで掴む／両手で拡縮');}});
  }catch(e){showErr('AR開始失敗: '+e.message);}
}
async function startVR(){
  if(xrSession){xrSession.end();return;}
  try{
    const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
    xrSession=s;xrMode='vr';
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(s);
    $('vrBtn').textContent='🛑 終了';scene.background=new THREE.Color(0x0b0c10);
    root.position.set(0,0,-1.8);setupControllers();
    s.addEventListener('end',()=>{xrSession=null;xrMode=null;$('vrBtn').textContent='🌐 VR';
      scene.background=bgTex;root.position.set(0,0,0);grab[0]=grab[1]=null;pinch=null;root.scale.setScalar(1);});
  }catch(e){showErr('VR開始失敗: '+e.message);}
}
$('arBtn').onclick=startAR;
$('vrBtn').onclick=startVR;
if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-ar').then(ok=>{if(ok)$('arBtn').disabled=false;}).catch(()=>{});
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok)$('vrBtn').disabled=false;}).catch(()=>{});
}

/* ============ ループ ============ */
const tmpM=new THREE.Matrix4();let lastErr=false;
function renderLoop(t,frame){
 try{
  if(frame&&renderer.xr.isPresenting&&xrSession){
    if(xrMode==='vr'){ if(controllers.length)updatePinch(); }
    else if(xrMode==='ar'){
      const ref=renderer.xr.getReferenceSpace(),sess=renderer.xr.getSession();
      if(!hitReq){hitReq=true;if(sess.requestHitTestSource)sess.requestReferenceSpace('viewer').then(vs=>{sess.requestHitTestSource({space:vs}).then(src=>hitSource=src).catch(()=>{});}).catch(()=>{});}
      if(hitSource&&!placed){const res=frame.getHitTestResults(hitSource);
        if(res.length){const pose=res[0].getPose(ref);reticle.visible=true;tmpM.fromArray(pose.transform.matrix);reticle.matrix.copy(tmpM);}else reticle.visible=false;}
      if(placed&&controllers.length)updatePinch();
    }
  }
  if(!renderer.xr.isPresenting){
    if(!dragging){ctl.th+=ctl.vth;ctl.ph=clamp(ctl.ph+ctl.vph,.05,Math.PI-.05);ctl.vth*=.9;ctl.vph*=.9;}
    applyCam();
  }
  renderer.render(scene,camera);
 }catch(err){if(!lastErr){lastErr=true;showErr('描画エラー: '+(err&&err.message||err));}}
}
applyCam();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(renderer)renderer.setSize(innerWidth,innerHeight);});

// 版表示
$('rev').textContent='v1 '+APP_REV;
</script>
