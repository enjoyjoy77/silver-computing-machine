<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>現代化カメラ</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  font-family: system-ui, sans-serif; line-height: 1.6;
}
#app { max-width: 800px; margin: auto; }
.head { display: flex; justify-content: space-between; align-items: baseline; }
h1 { font-size: 24px; margin: 0; }
.rev { font-size: 12px; opacity: .6; }
.hint { font-size: 12px; opacity: .7; }
.panel {
  border: 1px solid #8885; border-radius: 12px;
  padding: 14px; margin: 12px 0;
}
button, .pick {
  font: inherit; padding: 10px 16px;
  border: 1px solid #8887; border-radius: 8px;
  cursor: pointer; background: transparent; color: inherit;
}
.primary { background: #17664d; border-color: #17664d; color: white; }
button:disabled { opacity: .4; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.preview {
  background: #191c1e; border-radius: 10px; min-height: 200px;
  display: grid; place-items: center; overflow: hidden;
}
canvas {
  display: block; width: 100%; height: auto;
  max-height: 70vh; object-fit: contain;
}
.empty { color: #ccc; padding: 32px; text-align: center; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px; margin: 14px 0; }
input[type="range"] { grid-column: 1 / 3; width: 100%; accent-color: #238366; }
.active { box-shadow: inset 0 0 0 2px #238366; }
[hidden] { display: none !important; }
summary { cursor: pointer; }
</style>
</head>

<body>
<div id="app">
  <div class="head">
    <h1>現代化カメラ</h1>
    <span class="rev">rev6 (2026-11-28)</span>
  </div>
  <div class="hint">生成AI不使用・端末内画像処理</div>

  <div class="panel toolbar">
    <label class="pick primary" for="file">写真を選ぶ</label>
    <input id="file" type="file" accept="image/*,.heic,.heif,.tif,.tiff" hidden>
    <span id="filename" class="hint">読み込むと自動補正します</span>
  </div>

  <div class="preview">
    <div id="empty" class="empty">古い写真を選択してください</div>
    <canvas id="canvas" hidden></canvas>
  </div>

  <div class="toolbar" style="margin-top:12px">
    <button id="before" disabled>元の写真</button>
    <button id="after" class="active" disabled>現代化</button>
  </div>

  <div class="panel">
    <label class="slider">
      現代化の強さ
      <output id="strengthVal">70%</output>
      <input id="strength" type="range" min="0" max="100" value="70">
    </label>

    <details>
      <summary>細かい調整</summary>

      <label class="slider">
        色かぶり・退色
        <output id="colorVal">80%</output>
        <input id="color" type="range" min="0" max="100" value="80">
      </label>

      <label class="slider">
        明暗・発色
        <output id="toneVal">65%</output>
        <input id="tone" type="range" min="0" max="100" value="65">
      </label>

      <label class="slider">
        粒子・鮮明さ
        <output id="detailVal">45%</output>
        <input id="detail" type="range" min="0" max="100" value="45">
      </label>

      <label class="slider">
        周辺の暗さ(四隅を明るく)
        <output id="vignetteVal">80%</output>
        <input id="vignette" type="range" min="0" max="100" value="80">
      </label>

      <label class="slider">
        もや取り(白っぽいかすみを取る)
        <output id="dehazeVal">60%</output>
        <input id="dehaze" type="range" min="0" max="100" value="60">
      </label>

      <label class="slider">
        メリハリ(輪郭のまわりの明暗差)
        <output id="clarityVal">60%</output>
        <input id="clarity" type="range" min="0" max="100" value="60">
      </label>
    </details>

    <div class="toolbar">
      <button id="reset">標準に戻す</button>
      <button id="save" class="primary" disabled>補正画像を保存</button>
    </div>
  </div>

  <p id="status" class="hint" role="status"></p>
  <p class="hint">
    写真は外部サーバーに送信されません。
    顔や物体の再生成は行いません。
    元の写真は上書きされません。
  </p>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const clamp = (v, min = 0, max = 255) => Math.max(min, Math.min(max, v));
  const lum = (r, g, b) => .2126 * r + .7152 * g + .0722 * b;

  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");

  const controls = ["strength", "color", "tone", "detail", "vignette", "dehaze", "clarity"];
  const defaults = [70, 80, 65, 45, 80, 60, 60];

  // 画面の処理はこの大きさに縮めて行う。保存はもっと大きいので、
  // 「鮮明さ」の近所の距離をこの比で広げて、画面と同じ効き方にする
  const PREVIEW_MAX = 1100;

  let source = null;
  let preview = null;
  let corrected = null;
  let showBefore = false;
  let filename = "photo";
  let raf = 0;
  let token = 0;

  // 色かぶりの推定
  function estimateColor(data) {
    let r = 0, g = 0, b = 0, n = 0;
    const step = Math.max(1, Math.floor(data.length / 4 / 50000));

    for (let i = 0; i < data.length; i += 4 * step) {
      if (data[i + 3] < 128) continue;
      const R = data[i], G = data[i + 1], B = data[i + 2];
      const y = lum(R, G, B);
      const sat = (Math.max(R, G, B) - Math.min(R, G, B)) / (y + 20);

      if (y > 65 && y < 240 && sat < .38) {
        const weight = 1 - sat / .42;
        r += R * weight; g += G * weight; b += B * weight;
        n += weight;
      }
    }

    if (n < 20) return [1, 1, 1];
    const avg = (r + g + b) / 3;
    return [r, g, b].map(v => clamp(avg / (v || avg || 1), .72, 1.38));
  }

  // 周辺の暗さの推定: 真ん中と四隅の明るさの比(1 = 差なし)
  function estimateVignette(data, w, h) {
    let cs = 0, cn = 0, os = 0, on = 0;
    const step = Math.max(1, Math.floor(w * h / 60000));

    for (let k = 0; k < w * h; k += step) {
      const i = k * 4;
      if (data[i + 3] < 128) continue;
      const x = k % w, y = (k / w) | 0;
      const dx = (x - w / 2) / (w / 2), dy = (y - h / 2) / (h / 2);
      const d2 = (dx * dx + dy * dy) / 2;
      const l = lum(data[i], data[i + 1], data[i + 2]);
      if (d2 < .12) { cs += l; cn++; }
      else if (d2 > .6) { os += l; on++; }
    }

    if (cn < 50 || on < 50 || os < 1) return 1;
    // 写っている物で端が暗いだけのこともあるので、上限を低めに抑える
    return clamp((cs / cn) / (os / on), 1, 1.5);
  }

  // 1チャンネルの浮動小数の画像を四角い範囲の平均でならす(横→縦。端は内側で埋める)
  function blurF(src, w, h, r) {
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    const size = 2 * r + 1;
    for (let y = 0; y < h; y++) {
      const o = y * w;
      let sum = 0;
      for (let x = -r; x <= r; x++) sum += src[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        tmp[o + x] = sum / size;
        sum += src[o + Math.min(x + r + 1, w - 1)] - src[o + Math.max(x - r, 0)];
      }
    }
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let y = -r; y <= r; y++) sum += tmp[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = sum / size;
        sum += tmp[Math.min(y + r + 1, h - 1) * w + x] - tmp[Math.max(y - r, 0) * w + x];
      }
    }
    return out;
  }

  // もや取り(ダークチャネル法を軽くしたもの)。
  // かすんだ所は「どの色もいちばん暗い値が浮いている」ので、その浮きを差し引いて色と濃さを戻す。
  // 計算は約240マスの粗い格子で行い(画面と保存で同じ見た目の範囲になる)、なめらかにつないで使う
  function removeHaze(buf, w, h, omega) {
    const cell = Math.max(1, Math.ceil(Math.max(w, h) / 240));
    const gw = Math.ceil(w / cell), gh = Math.ceil(h / cell), gn = gw * gh;
    const mins = [new Float32Array(gn).fill(255), new Float32Array(gn).fill(255), new Float32Array(gn).fill(255)];
    const avg = [new Float32Array(gn), new Float32Array(gn), new Float32Array(gn)];
    const cnt = new Float32Array(gn);

    for (let y = 0; y < h; y++) {
      const gy = (y / cell) | 0;
      for (let x = 0; x < w; x++) {
        const g = gy * gw + ((x / cell) | 0), i = (y * w + x) * 4;
        for (let c = 0; c < 3; c++) {
          if (buf[i + c] < mins[c][g]) mins[c][g] = buf[i + c];
          avg[c][g] += buf[i + c];
        }
        cnt[g]++;
      }
    }

    // 空気の色 A: いちばんかすんでいる(暗い値が高い)マス上位1%の平均の色
    const raw = new Float32Array(gn);
    for (let g = 0; g < gn; g++) raw[g] = Math.min(mins[0][g], mins[1][g], mins[2][g]);
    const order = Array.from(raw.keys()).sort((p, q) => raw[q] - raw[p]);
    const top = Math.max(1, Math.round(gn * .01));
    const A = [0, 0, 0];
    for (let k = 0; k < top; k++) {
      const g = order[k];
      for (let c = 0; c < 3; c++) A[c] += avg[c][g] / cnt[g] / top;
    }
    // 色のついた背景(青い壁など)をかすみの色と取り違えると、差し引いたとき肌がオレンジに転ぶ。
    // 色の補正は「色かぶり」の担当なので、かすみは灰色とみなす
    const gray = Math.max((A[0] + A[1] + A[2]) / 3, 120);
    A[0] = A[1] = A[2] = gray;

    // 透過率 t = 1 - omega × (Aで割った暗い値を、周り3×3マスで最小にしたもの)
    const t = new Float32Array(gn);
    for (let gy = 0; gy < gh; gy++) {
      for (let gx = 0; gx < gw; gx++) {
        let m = 1;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const yy = clamp(gy + dy, 0, gh - 1), xx = clamp(gx + dx, 0, gw - 1), g = yy * gw + xx;
            for (let c = 0; c < 3; c++) m = Math.min(m, mins[c][g] / A[c]);
          }
        }
        t[gy * gw + gx] = 1 - omega * m;
      }
    }
    // マスの境目が出ないように2回ならす
    const ts = blurF(blurF(t, gw, gh, 2), gw, gh, 2);

    // 1画素ずつ: 粗い格子の t をなめらかに読み、浮きを差し引く(t は0.4より下げない=ざらつき対策)
    for (let y = 0; y < h; y++) {
      const fy = clamp((y + .5) / cell - .5, 0, gh - 1), y0 = fy | 0, y1 = Math.min(y0 + 1, gh - 1), wy = fy - y0;
      for (let x = 0; x < w; x++) {
        const fx = clamp((x + .5) / cell - .5, 0, gw - 1), x0 = fx | 0, x1 = Math.min(x0 + 1, gw - 1), wx = fx - x0;
        const tv = (ts[y0 * gw + x0] * (1 - wx) + ts[y0 * gw + x1] * wx) * (1 - wy)
                 + (ts[y1 * gw + x0] * (1 - wx) + ts[y1 * gw + x1] * wx) * wy;
        // 明るさは 1/t 倍に戻すが、色の濃さまで同じだけ上げると肌が赤く焼けるので、色は3割だけ
        const tt = Math.max(tv, .4), i = (y * w + x) * 4;
        const Y = lum(buf[i], buf[i + 1], buf[i + 2]);
        const Y2 = (Y - A[0]) / tt + A[0];
        const k = 1 + (1 / tt - 1) * .3;
        for (let c = 0; c < 3; c++) buf[i + c] = Y2 + (buf[i + c] - Y) * k;
      }
    }
  }

  // メリハリ(クラリティ): 明るさを広い範囲でならした版との差を足す。
  // 範囲は画像の長い辺の1/80(画面と保存で同じ見た目)。真っ白・真っ黒の近くは弱める
  function addClarity(p, w, h, amt) {
    const n = w * h, L = new Float32Array(n);
    for (let k = 0; k < n; k++) L[k] = lum(p[k * 4], p[k * 4 + 1], p[k * 4 + 2]);
    const r = Math.max(2, Math.round(Math.max(w, h) / 80));
    const Lb = blurF(blurF(L, w, h, r), w, h, r);
    for (let k = 0; k < n; k++) {
      const m = 1 - Math.pow(2 * L[k] / 255 - 1, 2);
      const d = clamp((L[k] - Lb[k]) * amt * 1.1 * m, -45, 45);
      const i = k * 4;
      p[i] = clamp(p[i] + d);
      p[i + 1] = clamp(p[i + 1] + d);
      p[i + 2] = clamp(p[i + 2] + d);
    }
  }

  // 現代化画像処理
  function process(image, strength, color, tone, detail, vignette, dehaze, clarity) {
    const w = image.width, h = image.height;
    const a = image.data;
    const output = new ImageData(w, h);
    const p = output.data;

    if (strength === 0) { p.set(a); return output; }

    // ホワイトバランス補正
    const gains = estimateColor(a).map(v => 1 + (v - 1) * strength * color);

    // 周辺の暗さ: 四隅で (1 + vk) 倍、真ん中は1倍
    const ratio = estimateVignette(a, w, h);
    // 四隅の平均(半径の2乗≒0.75)で元の明るさに戻る係数が 1/0.75。
    // 「現代化の強さ」70%(標準)で、このつまみの割合どおりに効く
    const vk = (ratio - 1) / .75 * vignette * Math.min(1, strength / .7);
    const cx = w / 2, cy = h / 2;
    const vgain = (x, y) => {
      if (vk <= 0) return 1;
      const dx = (x - cx) / cx, dy = (y - cy) / cy;
      return 1 + vk * (dx * dx + dy * dy) / 2;
    };

    // 色かぶり・周辺の補正を先に済ませた版 b0 を作り、そこから もやを取る
    const b0 = new Uint8ClampedArray(a.length);
    for (let y0 = 0; y0 < h; y0++) {
      for (let x0 = 0; x0 < w; x0++) {
        const i = (y0 * w + x0) * 4;
        const vg = vgain(x0, y0);
        b0[i] = a[i] * gains[0] * vg;
        b0[i + 1] = a[i + 1] * gains[1] * vg;
        b0[i + 2] = a[i + 2] * gains[2] * vg;
        b0[i + 3] = a[i + 3];
      }
    }
    const s7 = strength / .7;  // 「現代化の強さ」標準(70%)で1倍
    if (dehaze * s7 > .001) removeHaze(b0, w, h, Math.min(1, .85 * dehaze * s7));

    // 明暗の分布を調べる
    const hist = new Uint32Array(256);
    let count = 0;
    const step = Math.max(1, Math.floor(w * h / 70000));

    for (let k = 0; k < w * h; k += step) {
      const i = k * 4;
      if (b0[i + 3] < 128) continue;
      hist[Math.round(lum(b0[i], b0[i + 1], b0[i + 2]))]++;
      count++;
    }

    function quantile(f) {
      let n = 0;
      for (let j = 0; j < 256; j++) {
        n += hist[j];
        if (n >= count * f) return j;
      }
      return 255;
    }

    const lo = count ? Math.min(quantile(.025), 65) : 0;
    const hi = count ? Math.max(quantile(.975), 170) : 255;
    const amount = strength * tone * .75;
    const sat = 1 + strength * tone * .16;

    // 明暗・彩度の補正
    for (let i = 0; i < a.length; i += 4) {
      const r = b0[i], g = b0[i + 1], b = b0[i + 2];
      const y = lum(r, g, b);
      const z = y + (clamp((y - lo) * 255 / Math.max(hi - lo, 1)) - y) * amount;
      p[i] = clamp(z + (r - y) * sat);
      p[i + 1] = clamp(z + (g - y) * sat);
      p[i + 2] = clamp(z + (b - y) * sat);
      p[i + 3] = a[i + 3];
    }

    // メリハリ: 広い範囲の平均より明るい所はより明るく、暗い所はより暗く(中間の明るさほど強く)
    if (clarity * s7 > .001) addClarity(p, w, h, clarity * s7);

    // 粒子軽減・輪郭補正(元の近傍画素のみを利用する)
    // 近所の距離 rr は画像の大きさに比例させる(画面と保存で効き方をそろえる)
    const rr = Math.max(1, Math.round(Math.max(w, h) / PREVIEW_MAX));

    if (detail * strength > .001 && w > 2 * rr && h > 2 * rr) {
      const base = new Uint8ClampedArray(p);
      const power = strength * detail;
      const offs = [-4 * rr, 4 * rr, -w * 4 * rr, w * 4 * rr];

      // 1画素ごとのざらつきで「輪郭」と誤判定して粒子を強めてしまうので、
      // 比べる相手は少しならした版 s にする(ならす幅も画像の大きさに比例)
      const s = boxBlur(base, w, h, Math.max(1, rr >> 1));

      for (let y = rr; y < h - rr; y++) {
        for (let x = rr; x < w - rr; x++) {
          const i = (y * w + x) * 4;
          if (base[i + 3] !== 255) continue;

          // 輪郭かどうかは、ならした版 s で「周りとの差」を見て決める
          let ar = 0, ag = 0, ab = 0;
          for (const o of offs) {
            ar += s[i + o]; ag += s[i + o + 1]; ab += s[i + o + 2];
          }
          const dr = s[i] - ar / 4, dg = s[i + 1] - ag / 4, db = s[i + 2] - ab / 4;

          if (Math.abs(lum(dr, dg, db)) >= 5) {
            // 輪郭: ならした版の差だけ強める(1画素のざらつきは強めない)
            const k = .4 * power * 2;
            p[i] = clamp(base[i] + dr * k);
            p[i + 1] = clamp(base[i + 1] + dg * k);
            p[i + 2] = clamp(base[i + 2] + db * k);
            continue;
          }

          // 平らな所: 明るさの近い近所(元の画素)へ寄せて粒子を減らす。
          // 明るさが大きく違う近所は混ぜないので、境目はにじまない
          const l = lum(base[i], base[i + 1], base[i + 2]);
          let sr = 0, sg = 0, sb = 0, n = 0;

          for (const o of offs) {
            const j = i + o;
            if (base[j + 3] !== 255) continue;
            const diff = Math.abs(l - lum(base[j], base[j + 1], base[j + 2]));
            const weight = Math.max(0, 1 - diff / 28);
            sr += base[j] * weight;
            sg += base[j + 1] * weight;
            sb += base[j + 2] * weight;
            n += weight;
          }

          if (n > .1) {
            const k = .45 * power;
            p[i] = clamp(base[i] + (sr / n - base[i]) * k);
            p[i + 1] = clamp(base[i + 1] + (sg / n - base[i + 1]) * k);
            p[i + 2] = clamp(base[i + 2] + (sb / n - base[i + 2]) * k);
          }
        }
      }
    }

    return output;
  }

  // 四角い範囲の平均でならす(横→縦の2回。端は内側の画素で埋める)
  function boxBlur(src, w, h, br) {
    const tmp = new Float32Array(w * h * 3);
    const out = new Uint8ClampedArray(src.length);
    const size = 2 * br + 1;

    for (let y = 0; y < h; y++) {
      for (let c = 0; c < 3; c++) {
        let sum = 0;
        for (let x = -br; x <= br; x++) {
          sum += src[(y * w + clamp(x, 0, w - 1)) * 4 + c];
        }
        for (let x = 0; x < w; x++) {
          tmp[(y * w + x) * 3 + c] = sum / size;
          sum += src[(y * w + Math.min(x + br + 1, w - 1)) * 4 + c]
               - src[(y * w + Math.max(x - br, 0)) * 4 + c];
        }
      }
    }

    for (let x = 0; x < w; x++) {
      for (let c = 0; c < 3; c++) {
        let sum = 0;
        for (let y = -br; y <= br; y++) {
          sum += tmp[(clamp(y, 0, h - 1) * w + x) * 3 + c];
        }
        for (let y = 0; y < h; y++) {
          out[(y * w + x) * 4 + c] = sum / size;
          sum += tmp[(Math.min(y + br + 1, h - 1) * w + x) * 3 + c]
               - tmp[(Math.max(y - br, 0) * w + x) * 3 + c];
        }
      }
    }

    for (let i = 3; i < src.length; i += 4) out[i] = src[i];
    return out;
  }

  // 設定値の取得
  function values() {
    return controls.map(id => Number($(id).value) / 100);
  }

  // 画像の読み取り
  function raster(img, max) {
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width * scale));
    c.height = Math.max(1, Math.round(img.height * scale));
    const context = c.getContext("2d");
    context.drawImage(img, 0, 0, c.width, c.height);
    return context.getImageData(0, 0, c.width, c.height);
  }

  // プレビュー表示
  function display() {
    if (!preview) return;
    const image = showBefore ? preview : corrected || preview;
    canvas.width = image.width;
    canvas.height = image.height;
    ctx.putImageData(image, 0, 0);
    $("before").classList.toggle("active", showBefore);
    $("after").classList.toggle("active", !showBefore);
  }

  function update() {
    for (const id of controls) {
      $(id + "Val").textContent = $(id).value + "%";
    }
    if (!preview) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      corrected = process(preview, ...values());
      display();
    });
  }

  // 画像ファイルを開く(ブラウザが読める形式だけ)
  async function decodeBlob(blob) {
    const url = URL.createObjectURL(blob);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      return img;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  // iPhoneの写真(HEIC)を読む部品 heic2any。重いので、HEICを選んだときだけ読み込む。
  // 部品は ツールボックス\libs\heic2any.min.js に置く(無ければ null)
  let heicLib = null;
  function loadHeicLib() {
    if (window.heic2any) return Promise.resolve(window.heic2any);
    if (!heicLib) {
      heicLib = new Promise(resolve => {
        const s = document.createElement("script");
        s.src = "../../libs/heic2any.min.js";
        s.onload = () => resolve(window.heic2any || null);
        s.onerror = () => { heicLib = null; resolve(null); };
        document.head.appendChild(s);
      });
    }
    return heicLib;
  }

  // ---- TIFF(スキャナの取り込みでよく使う形式)を自前で読む ----
  // 対応: 無圧縮 / LZW / PackBits / Deflate、8・16ビット、白黒2値・グレー・RGB(+透明)・パレット・CMYK、
  //       ストリップとタイル、予測子2。1ページ目だけ読む。JPEG圧縮のTIFFは非対応(理由つきで止まる)
  class TiffError extends Error {}

  function lzwDecode(src, outLen) {
    const out = new Uint8Array(outLen);
    let op = 0, bitPos = 0;
    const nbits = src.length * 8;
    const read = len => {
      if (bitPos + len > nbits) return 257;
      let v = 0;
      for (let k = 0; k < len; k++, bitPos++) {
        v = (v << 1) | ((src[bitPos >> 3] >> (7 - (bitPos & 7))) & 1);
      }
      return v;
    };
    let dict = [], codeLen = 9, prev = null;
    const reset = () => {
      dict = [];
      for (let k = 0; k < 256; k++) dict.push(Uint8Array.of(k));
      dict.push(null, null);
      codeLen = 9;
      prev = null;
    };
    reset();
    while (op < outLen) {
      const code = read(codeLen);
      if (code === 257) break;
      if (code === 256) { reset(); continue; }
      let entry;
      if (code < dict.length) entry = dict[code];
      else if (prev) { entry = new Uint8Array(prev.length + 1); entry.set(prev); entry[prev.length] = prev[0]; }
      else break;
      const n = Math.min(entry.length, outLen - op);
      out.set(n === entry.length ? entry : entry.subarray(0, n), op);
      op += n;
      if (prev) {
        const e = new Uint8Array(prev.length + 1);
        e.set(prev); e[prev.length] = entry[0];
        dict.push(e);
      }
      prev = entry;
      if (dict.length + 1 >= (1 << codeLen) && codeLen < 12) codeLen++;
    }
    return out;
  }

  function packBitsDecode(src, outLen) {
    const out = new Uint8Array(outLen);
    let ip = 0, op = 0;
    while (ip < src.length && op < outLen) {
      const n = (src[ip++] << 24) >> 24;
      if (n >= 0) {
        for (let k = 0; k <= n && op < outLen; k++) out[op++] = src[ip++];
      } else if (n !== -128) {
        const v = src[ip++];
        for (let k = 0; k < 1 - n && op < outLen; k++) out[op++] = v;
      }
    }
    return out;
  }

  async function inflate(src) {
    const stream = new Blob([src]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function decodeTiff(buf) {
    const dv = new DataView(buf);
    const bytes = new Uint8Array(buf);
    const le = dv.getUint16(0) === 0x4949;
    const u16 = o => dv.getUint16(o, le);
    const u32 = o => dv.getUint32(o, le);
    if (u16(2) === 43) throw new TiffError("BigTIFFという大きな形式のTIFFには対応していません。");

    // 1ページ目の項目表を読む
    const SIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 6: 1, 7: 1, 8: 2, 9: 4, 10: 8, 11: 4, 12: 8, 16: 8 };
    const tags = {};
    const ifd = u32(4);
    const count = u16(ifd);
    for (let k = 0; k < count; k++) {
      const e = ifd + 2 + k * 12;
      const tag = u16(e), type = u16(e + 2), n = u32(e + 4);
      const size = (SIZE[type] || 1) * n;
      const at = size <= 4 ? e + 8 : u32(e + 8);
      const vals = [];
      for (let j = 0; j < n; j++) {
        if (type === 3 || type === 8) vals.push(u16(at + j * 2));
        else if (type === 4 || type === 9) vals.push(u32(at + j * 4));
        else vals.push(bytes[at + j]);
      }
      tags[tag] = vals;
    }
    const get = (t, d) => tags[t] ? tags[t][0] : d;

    const w = get(256), h = get(257);
    if (!w || !h) throw new TiffError("画像の大きさが読み取れませんでした。");
    const bps = get(258, 1);
    const comp = get(259, 1);
    const photo = get(262, 1);
    const spp = get(277, 1);
    const planar = get(284, 1);
    const predictor = get(317, 1);
    if (comp === 6 || comp === 7) throw new TiffError("中身がJPEG圧縮のTIFFには対応していません。");
    if (![1, 5, 8, 32946, 32773].includes(comp)) throw new TiffError("この圧縮方式(" + comp + ")のTIFFには対応していません。");
    if (![1, 8, 16].includes(bps)) throw new TiffError(bps + "ビットのTIFFには対応していません。");
    if (planar !== 1 && spp > 1) throw new TiffError("色ごとに分かれて保存されたTIFFには対応していません。");

    const rowBytes = Math.ceil(w * spp * bps / 8);
    const raw = new Uint8Array(rowBytes * h);

    async function unpack(off, len, outLen) {
      const src = bytes.subarray(off, off + len);
      if (comp === 1) return src;
      if (comp === 5) return lzwDecode(src, outLen);
      if (comp === 32773) return packBitsDecode(src, outLen);
      return inflate(src);
    }

    // 予測子2: 左隣との差で保存されているのを元に戻す
    function unpredict(data, rb, rows, pxPerRow) {
      if (predictor !== 2) return;
      for (let r = 0; r < rows; r++) {
        const o = r * rb;
        if (bps === 8) {
          for (let k = spp; k < pxPerRow * spp; k++) data[o + k] = (data[o + k] + data[o + k - spp]) & 255;
        } else if (bps === 16) {
          const v = new DataView(data.buffer, data.byteOffset + o, rb);
          for (let k = spp; k < pxPerRow * spp; k++) {
            v.setUint16(k * 2, (v.getUint16(k * 2, le) + v.getUint16((k - spp) * 2, le)) & 65535, le);
          }
        }
      }
    }

    if (tags[324]) {
      // タイル
      const tw = get(322), th = get(323);
      const offs = tags[324], lens = tags[325];
      const tRow = Math.ceil(tw * spp * bps / 8);
      const across = Math.ceil(w / tw);
      for (let t = 0; t < offs.length; t++) {
        const data = new Uint8Array(await unpack(offs[t], lens[t], tRow * th));
        unpredict(data, tRow, th, tw);
        const tx = (t % across) * tw, ty = Math.floor(t / across) * th;
        const xb = Math.floor(tx * spp * bps / 8);
        const copy = Math.min(tRow, rowBytes - xb);
        for (let r = 0; r < th && ty + r < h; r++) {
          raw.set(data.subarray(r * tRow, r * tRow + copy), (ty + r) * rowBytes + xb);
        }
      }
    } else {
      // ストリップ
      const offs = tags[273], lens = tags[279];
      if (!offs) throw new TiffError("画像のデータの場所が読み取れませんでした。");
      const rps = Math.min(get(278, h), h);
      for (let s = 0; s < offs.length; s++) {
        const rows = Math.min(rps, h - s * rps);
        if (rows <= 0) break;
        const len = lens ? lens[s] : rowBytes * rows;
        const data = new Uint8Array(await unpack(offs[s], len, rowBytes * rows));
        unpredict(data, rowBytes, rows, w);
        raw.set(data.subarray(0, Math.min(data.length, rowBytes * rows)), s * rps * rowBytes);
      }
    }

    // RGBAに直す
    const img = new ImageData(w, h);
    const p = img.data;
    const rv = new DataView(raw.buffer);
    const sample = (y, x, c) => {
      const k = x * spp + c;
      if (bps === 8) return raw[y * rowBytes + k];
      if (bps === 16) return rv.getUint16(y * rowBytes + k * 2, le) >> 8;
      return ((raw[y * rowBytes + (k >> 3)] >> (7 - (k & 7))) & 1) * 255;
    };
    const map = tags[320];
    const hasAlpha = photo === 2 && spp >= 4;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        let r, g, b, a = 255;
        if (photo === 2) {
          r = sample(y, x, 0); g = sample(y, x, 1); b = sample(y, x, 2);
          if (hasAlpha) a = sample(y, x, 3);
        } else if (photo === 3 && map) {
          const k = x * spp;
          const idx = bps === 8 ? raw[y * rowBytes + k]
                    : bps === 16 ? rv.getUint16(y * rowBytes + k * 2, le)
                    : (raw[y * rowBytes + (k >> 3)] >> (7 - (k & 7))) & 1;
          const n = map.length / 3;
          r = map[idx] >> 8; g = map[n + idx] >> 8; b = map[2 * n + idx] >> 8;
        } else if (photo === 5 && spp >= 4) {
          const c = sample(y, x, 0), m = sample(y, x, 1), ye = sample(y, x, 2), kk = sample(y, x, 3);
          r = (255 - c) * (255 - kk) / 255;
          g = (255 - m) * (255 - kk) / 255;
          b = (255 - ye) * (255 - kk) / 255;
        } else if (photo === 0 || photo === 1) {
          let v = sample(y, x, 0);
          if (photo === 0) v = 255 - v;
          r = g = b = v;
          if (spp >= 2) a = sample(y, x, 1);
        } else {
          throw new TiffError("この色の持ち方(" + photo + ")のTIFFには対応していません。");
        }
        p[i] = r; p[i + 1] = g; p[i + 2] = b; p[i + 3] = a;
      }
    }

    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").putImageData(img, 0, 0);
    return c;
  }

  // 読めなかった理由(画面に出す文)
  let failReason = "";
  let heicState = "";  // "nolib" = 部品が無い / "failed" = 部品はあるが変換できなかった
  const RAW_EXT = ["dng", "cr2", "cr3", "nef", "arw", "orf", "rw2", "raf", "pef", "srw"];

  async function openPhoto(file, ext) {
    heicState = "";
    failReason = "";
    try {
      return await decodeBlob(file);
    } catch (error) {
      // ブラウザが読めない形式。下で中身の先頭を見て判断する
    }

    if (RAW_EXT.includes(ext)) {
      failReason = "カメラの生データ(RAW)の形式は読めません。カメラ付属のソフトや「フォト」で JPEG に書き出してから入れてください。";
      throw new Error("raw");
    }

    const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const isTiff = (head[0] === 0x49 && head[1] === 0x49 && head[2] === 42) ||
                   (head[0] === 0x4d && head[1] === 0x4d && head[3] === 42);
    if (isTiff) {
      $("status").textContent = "TIFFを読み込み中…(大きい画像は数秒かかります)";
      try {
        return await decodeTiff(await file.arrayBuffer());
      } catch (error) {
        failReason = "TIFFの画像ですが、" + (error instanceof TiffError
          ? error.message : "読み込みの途中で失敗しました(壊れているか、特殊な形式の可能性があります)。");
        throw error;
      }
    }

    const brand = String.fromCharCode(...head.subarray(4, 12));
    const isHeic = ext === "heic" || ext === "heif" || /^ftyp(heic|heix|hevc|mif1|msf1)/.test(brand);
    if (!isHeic) throw new Error("unknown");

    $("status").textContent = "iPhoneの写真(HEIC)を変換中…(数秒かかります)";
    const lib = await loadHeicLib();
    if (!lib) { heicState = "nolib"; throw new Error("no heic2any"); }
    try {
      let jpeg = await lib({ blob: file, toType: "image/jpeg", quality: .95 });
      if (Array.isArray(jpeg)) jpeg = jpeg[0];  // 連写などで複数入っていたら1枚目
      return await decodeBlob(jpeg);
    } catch (error) {
      heicState = "failed";
      throw error;
    }
  }

  // 写真の選択
  $("file").onchange = async () => {
    const file = $("file").files[0];
    if (!file) return;

    const current = ++token;
    const ext = (file.name.match(/\.([^.]+)$/) || ["", "?"])[1].toLowerCase();
    $("status").textContent = "読み込み中";

    try {
      const img = await openPhoto(file, ext);
      if (current !== token) return;

      source = img;
      filename = file.name.replace(/\.[^.]+$/, "");
      preview = raster(img, PREVIEW_MAX);
      corrected = null;
      showBefore = false;

      $("filename").textContent = file.name;
      $("empty").hidden = true;
      canvas.hidden = false;
      for (const id of ["before", "after", "save"]) $(id).disabled = false;

      $("status").textContent = img.width + " × " + img.height + " px";
      update();
    } catch (error) {
      if (current !== token) return;
      // 小さい文字だけだと「何も起きない」に見えるので、黒い枠の中に大きく出す
      let msg = "「" + file.name + "」を開けませんでした。";
      const paint = "\nパソコンの「ペイント」で開いて「名前を付けて保存」→「JPEG画像」で保存してから入れてください。";
      if (heicState === "nolib") {
        msg += "\n\nこれはiPhoneの写真の形式(HEIC)です。HEICを読む部品(heic2any.min.js)が"
             + "ツールボックスの libs フォルダに入っていないため開けません。" + paint
             + "\n(iPhoneのSafariで開けば、そのまま使えます)";
      } else if (heicState === "failed") {
        msg += "\n\niPhoneの写真の形式(HEIC)を変換しようとしましたが、失敗しました。"
             + "写真が壊れているか、特殊な形式の可能性があります。" + paint;
      } else if (failReason) {
        // RAWはペイントでも開けないことが多いので、ペイントの案内は付けない
        msg += "\n\n" + failReason + (RAW_EXT.includes(ext) ? "" : paint);
      } else {
        msg += "\n\nこの形式(." + ext + ")は読めません。"
             + "\n読める形式: JPG・PNG・WebP・GIF・BMP・AVIF・HEIC(iPhone)・TIFF(スキャナ)" + paint;
      }
      $("empty").textContent = msg;
      $("empty").style.whiteSpace = "pre-line";
      $("empty").hidden = false;
      canvas.hidden = true;
      $("filename").textContent = file.name;
      $("status").textContent = "開けませんでした(." + ext + ")";
    } finally {
      // 同じ写真を選び直しても反応するように
      $("file").value = "";
    }
  };

  // 操作ボタン
  for (const id of controls) {
    $(id).oninput = () => { showBefore = false; update(); };
  }

  $("before").onclick = () => { showBefore = true; display(); };
  $("after").onclick = () => { showBefore = false; display(); };

  $("reset").onclick = () => {
    defaults.forEach((v, i) => { $(controls[i]).value = v; });
    showBefore = false;
    update();
  };

  // PNG画像として保存
  $("save").onclick = async () => {
    if (!source) return;
    const img = source;
    const settings = values();
    const name = filename;

    $("save").disabled = true;
    $("status").textContent = "保存用画像を処理中(大きい写真は10秒ほどかかります)";

    try {
      await new Promise(resolve =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));

      const original = raster(img, 4096);
      const result = process(original, ...settings);

      const c = document.createElement("canvas");
      c.width = result.width;
      c.height = result.height;
      c.getContext("2d").putImageData(result, 0, 0);

      const blob = await new Promise(resolve => c.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("Save failed");

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name + "_modern.png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);

      $("status").textContent = "保存画像:" + result.width + " × " + result.height + " px";
    } catch (error) {
      $("status").textContent =
        "保存できませんでした。写真が大きすぎる可能性があります。ほかのタブを閉じてもう一度お試しください。";
    } finally {
      $("save").disabled = false;
    }
  };
})();
</script>
</body>
</html>
