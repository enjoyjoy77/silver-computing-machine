<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ねんど（さわる回）</title>
<style>
  :root{ --bg:#12100e; --panel:#241d16; --line:#3a2e22; --ink:#f6efe6; --dim:#b6a48f; --accent:#d98b5f; --accent2:#f0c19a; --danger:#ff8f8f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;overflow:hidden;}
  canvas#view{position:fixed;inset:0;display:block;touch-action:none;}
  #rev{position:fixed;top:8px;right:12px;z-index:40;font-size:11px;letter-spacing:.1em;color:var(--dim);pointer-events:none;}
  #start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);padding:28px 22px;overflow-y:auto;text-align:center;}
  #start .mark{font-size:12px;letter-spacing:.35em;color:var(--accent);}
  #start h1{margin:0;font-size:25px;font-weight:900;line-height:1.4;}
  #start p{margin:0;color:var(--dim);font-size:13px;line-height:1.9;max-width:470px;}
  #goBtn{border:none;border-radius:16px;padding:20px 44px;font:inherit;font-size:19px;font-weight:900;letter-spacing:.06em;cursor:pointer;background:var(--accent);color:#2a1206;box-shadow:0 6px 22px rgba(217,139,95,.35);transition:opacity .2s,transform .1s;}
  #goBtn:active{transform:translateY(1px);} #goBtn:disabled{opacity:.4;cursor:default;box-shadow:none;}
  #note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:12.5px;line-height:1.85;color:var(--ink);max-width:470px;}
  #note b{color:var(--accent2);}
  #stats{position:fixed;top:8px;left:12px;z-index:40;font-size:11px;line-height:1.6;color:var(--dim);pointer-events:none;font-family:"Consolas","Courier New",monospace;background:rgba(6,10,14,.5);padding:5px 8px;border-radius:8px;display:none;white-space:pre;}
  #pchint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:35;display:none;background:rgba(36,29,22,.9);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:12.5px;line-height:1.7;color:var(--ink);text-align:center;max-width:92vw;}
  #pchint b{color:var(--accent2);}
  #logWrap{position:fixed;left:10px;bottom:10px;z-index:40;width:min(88vw,420px);}
  #logTitle{font-size:10px;letter-spacing:.15em;color:var(--dim);margin-bottom:4px;}
  #log{background:rgba(6,10,14,.82);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px;line-height:1.65;color:var(--ink);height:108px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-family:"Consolas","Courier New",monospace;}
  #log .e{color:var(--danger);}
  #err{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:50;display:none;background:#3a1414;border:1px solid #8a2e2e;color:#ffdada;padding:12px 18px;border-radius:12px;font-size:13px;line-height:1.7;max-width:92vw;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.4);}
</style>
</head>
<body>
<canvas id="view"></canvas>
<span id="rev"></span>
<div id="stats"></div>
<div id="start">
  <div class="mark">ねんど（彫刻版）</div>
  <h1>ねんどを手で押して<br>掘ったり盛ったりする回です</h1>
  <p>目の前のねんどを手やコントローラで押すと、そこがへこんで<b>クレーターになり、押しのけた分が縁に盛り上がります。</b><br>掘った跡はそのまま残ります。「丸める」で玉に戻せます。</p>
  <button id="goBtn" disabled>じゅんび中…</button>
  <div id="note">
    <b>英語の画面が出たら</b><br>ボタンを押すと英語の確認が出ることがあります。<br>「<b>Allow</b>（許可）」または「<b>Enter VR / OK</b>」を押してください。<br>うまくいかない時は、下の黒い枠（記録）の文をそのまま教えてください。
  </div>
</div>
<div id="pchint"><b>PC確認モード</b>　ドラッグ＝見る／クリック＝押す（掘る）／ホイール＝寄引／R＝丸める</div>
<div id="logWrap"><div id="logTitle">記録（うまくいかない時はこの文を教えてください）</div><div id="log"></div></div>
<div id="err"></div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";
import { MarchingCubes } from "./lib/MarchingCubes.js";

const REV = "v3 rev1";
document.getElementById("rev").textContent = REV;

/* 0. 画面内ログ */
const $ = id => document.getElementById(id);
const logEl = $("log"); const logLines = [];
function log(msg,isErr){ logLines.push({t:msg,e:!!isErr}); if(logLines.length>40) logLines.shift();
  const div=document.createElement("div"); if(isErr)div.className="e"; div.textContent="・"+msg; logEl.appendChild(div); logEl.scrollTop=logEl.scrollHeight; drawPanel(); }
function showErr(msg){ const e=$("err"); e.textContent=msg; e.style.display="block"; log(msg,true); }
addEventListener("error",ev=>{ log("エラー: "+(ev.message||ev.error||"不明"),true); });
addEventListener("unhandledrejection",ev=>{ log("エラー(非同期): "+(ev.reason&&ev.reason.message||ev.reason||"不明"),true); });
const cp={}; function checkpoint(k,m){ if(cp[k])return; cp[k]=true; log("✔ "+m); }

/* 1. 調整パラメータ */
const TUNE = {
  R0: 0.10,            // ねんどの半径(m)
  size: 32,            // 密度グリッドの解像度（32³。大きいほど滑らか＆重い）
  fieldHalf: 0.19,     // グリッドが覆う範囲の半分(m)。R0＋盛り上がりが収まる大きさ
  iso: 0.5,            // 表面のしきい値（密度がこれを超える所が粘土）
  maxField: 2.2,       // 密度の上限（盛り上がりの高さの上限）
  wallVox: 1.6,        // 表面のなめらかさ（何ボクセルで密度が変わるか）
  digStrength: 0.5,    // 1フレームで掘れる量。大きいほど速く掘れる
  pileRatio: 0.9,      // 掘った分の何割を縁に盛るか（1=全部盛る＝材料保存）
  brushK: 1.0,         // 筆の太さ＝指の半径×これ
  pileOuterK: 1.9,     // 盛る縁の外側どこまで（筆半径×これ）
  fingerR: 0.024,      // 指先の当たり半径(m)
  ctrlR: 0.03,         // コントローラ先端の当たり半径(m)
  digGap: 16,          // 掘る音の最短間隔(ms相当のフレーム換算に使用)
  hapPoke: 0.4,
};

/* 2. Three.js 基本 */
const canvas=$("view"); let renderer=null;
function init3D(){ if(renderer)return;
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.xr.enabled=true; renderer.setAnimationLoop(renderLoop); }
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.01,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x30241a,1.0));
const dir1=new THREE.DirectionalLight(0xfff2e2,1.2); dir1.position.set(0.6,1.6,0.8); scene.add(dir1);
const dir2=new THREE.DirectionalLight(0xffe6cc,0.35); dir2.position.set(-0.8,-0.4,-0.6); scene.add(dir2);
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_q1=new THREE.Quaternion();

const clayMat=new THREE.MeshStandardMaterial({ color:0xc07a4e, roughness:1.0, metalness:0.0, emissive:0x281008, emissiveIntensity:0.22 });

/* 3. ねんど本体（密度の塊＝SDF/ボクセル。MarchingCubesで表面を作る） */
const SIZE=TUNE.size, SIZE2=SIZE*SIZE;
let mc=null;                         // MarchingCubes（表面メッシュ）
const anchor=new THREE.Vector3(0,0,0);
let clayReady=false, dirty=false, updMs=0;
const voxM = 2*TUNE.fieldHalf/SIZE;  // 1ボクセルの一辺(m)

function makeClay(){
  if(mc) return;
  mc=new MarchingCubes(SIZE, clayMat, false, false, 90000);
  mc.isolation=TUNE.iso; mc.frustumCulled=false; mc.scale.setScalar(TUNE.fieldHalf);
  scene.add(mc);
}
// 密度場を「半径R0の球」に初期化（丸める＝これ）
function fillSphere(){
  const f=mc.field, iso=TUNE.iso, wall=TUNE.wallVox*voxM, mx=TUNE.maxField, R0=TUNE.R0, h=TUNE.fieldHalf;
  for(let z=0;z<SIZE;z++){ const lz=((z+0.5)/SIZE*2-1)*h;
    for(let y=0;y<SIZE;y++){ const ly=((y+0.5)/SIZE*2-1)*h;
      for(let x=0;x<SIZE;x++){ const lx=((x+0.5)/SIZE*2-1)*h;
        const d=Math.sqrt(lx*lx+ly*ly+lz*lz);
        let v=iso+(R0-d)/wall*0.5;          // 表面(d=R0)でiso、内側ほど濃い
        if(v<0)v=0; else if(v>mx)v=mx;
        f[x+y*SIZE+z*SIZE2]=v;
      }
    }
  }
}
function roundUp(){ if(!mc) makeClay(); fillSphere(); dirty=true; clayReady=true; if(mc) mc.update(); checkpoint("spawn","ねんどを出した"); }
function respawnInFront(){
  const camN=(renderer&&renderer.xr.isPresenting)?renderer.xr.getCamera():camera;
  camN.getWorldPosition(_v1); camN.getWorldQuaternion(_q1);
  _v2.set(0,0,-1).applyQuaternion(_q1); _v2.y=0; if(_v2.lengthSq()<1e-6)_v2.set(0,0,-1); else _v2.normalize();
  anchor.set(_v1.x+_v2.x*0.5, _v1.y-0.05, _v1.z+_v2.z*0.5);
  mc.position.copy(anchor); roundUp(); positionButton();
}

// ワールド座標→ボクセル座標（実数）
function worldToVox(wx,wy,wz,out){ const inv=1/TUNE.fieldHalf;
  out.x=((wx-anchor.x)*inv*0.5+0.5)*SIZE; out.y=((wy-anchor.y)*inv*0.5+0.5)*SIZE; out.z=((wz-anchor.z)*inv*0.5+0.5)*SIZE; return out; }
// その場の密度（表面の内外判定に使う）
function sampleField(wx,wy,wz){ worldToVox(wx,wy,wz,_v2);
  const ix=Math.round(_v2.x),iy=Math.round(_v2.y),iz=Math.round(_v2.z);
  if(ix<1||ix>=SIZE-1||iy<1||iy>=SIZE-1||iz<1||iz>=SIZE-1) return 0;
  return mc.field[ix+iy*SIZE+iz*SIZE2]; }

const _vc=new THREE.Vector3();
// 掘る：指の位置で密度を減らし（クレーター）、その分を縁に足す（盛り上がり）＝材料保存
function digAt(wx,wy,wz, brushRm, strength){
  if(!clayReady) return 0;
  worldToVox(wx,wy,wz,_vc); const cx=_vc.x,cy=_vc.y,cz=_vc.z;
  const bvr=Math.max(1.0, brushRm/TUNE.fieldHalf*0.5*SIZE);   // 筆半径(ボクセル)
  const f=mc.field;
  const lo=(v)=>Math.max(1,Math.floor(v)), hi=(v)=>Math.min(SIZE-2,Math.ceil(v));
  const rOut=bvr*TUNE.pileOuterK;
  // (1) 掘る：筆の中の密度を削る
  let removed=0;
  const x0=lo(cx-bvr),x1=hi(cx+bvr),y0=lo(cy-bvr),y1=hi(cy+bvr),z0=lo(cz-bvr),z1=hi(cz+bvr);
  for(let z=z0;z<=z1;z++)for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x-cx,dy=y-cy,dz=z-cz,d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d>bvr) continue;
    const i=x+y*SIZE+z*SIZE2; const w=1-d/bvr; const take=Math.min(f[i], strength*w);
    if(take>0){ f[i]-=take; removed+=take; }
  }
  if(removed<=0) return 0;
  // (2) 盛る：削った分を筆の外の縁(シェル)へ配る＝縁が盛り上がる
  const give=removed*TUNE.pileRatio, mx=TUNE.maxField;
  const sx0=lo(cx-rOut),sx1=hi(cx+rOut),sy0=lo(cy-rOut),sy1=hi(cy+rOut),sz0=lo(cz-rOut),sz1=hi(cz+rOut);
  let wsum=0;
  for(let z=sz0;z<=sz1;z++)for(let y=sy0;y<=sy1;y++)for(let x=sx0;x<=sx1;x++){
    const dx=x-cx,dy=y-cy,dz=z-cz,d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d<=bvr||d>rOut) continue;
    wsum += (d-bvr)/(rOut-bvr)*(1-(d-bvr)/(rOut-bvr));   // 縁で最大の山形
  }
  if(wsum>1e-9){ const k=give/wsum;
    for(let z=sz0;z<=sz1;z++)for(let y=sy0;y<=sy1;y++)for(let x=sx0;x<=sx1;x++){
      const dx=x-cx,dy=y-cy,dz=z-cz,d=Math.sqrt(dx*dx+dy*dy+dz*dz); if(d<=bvr||d>rOut) continue;
      const i=x+y*SIZE+z*SIZE2; const w=(d-bvr)/(rOut-bvr)*(1-(d-bvr)/(rOut-bvr));
      f[i]=Math.min(mx, f[i]+w*k);
    }
  }
  dirty=true; return removed;
}

/* 当たり判定＝指の位置（掘る筆） */
const MAXCOL=24;
const colX=new Float32Array(MAXCOL),colY=new Float32Array(MAXCOL),colZ=new Float32Array(MAXCOL),colR=new Float32Array(MAXCOL);
let colN=0, dugThisFrame=0;
function addCol(x,y,z,r){ if(colN>=MAXCOL)return; colX[colN]=x;colY[colN]=y;colZ[colN]=z;colR[colN]=r;colN++; }
// 各指について、粘土の中に入っていたら掘る。深く入っているほど強く掘る＝腰（軽く触れると跡が付かない）
function applyFingers(){
  dugThisFrame=0; const iso=TUNE.iso, mx=TUNE.maxField;
  for(let k=0;k<colN;k++){
    const fv=sampleField(colX[k],colY[k],colZ[k]);
    if(fv>iso){
      const pen=Math.min(1,(fv-iso)/(mx-iso));   // 表面=0（掘らない）→ 深いほど1（腰）
      dugThisFrame += digAt(colX[k],colY[k],colZ[k], colR[k]*TUNE.brushK, TUNE.digStrength*pen);
    }
  }
}

/* 4. 音 */
let actx=null,voices=0;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } } if(actx&&actx.state==="suspended") actx.resume(); }
function playDig(strength){ if(!actx||voices>=5) return; const now=actx.currentTime,dur=0.10+strength*0.05, f0=140*(0.9+strength*0.4);
  const o=actx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f0,now); o.frequency.exponentialRampToValueAtTime(f0*0.6,now+dur);
  const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=480+strength*300; lp.Q.value=0.5;
  const g=actx.createGain(); const vol=Math.min(0.14,0.02+strength*0.14);
  g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(vol,now+0.012); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(lp).connect(g).connect(actx.destination); voices++; o.onended=()=>{voices--;}; o.start(now); o.stop(now+dur); }
function playRound(){ if(!actx)return; const now=actx.currentTime,dur=0.18;
  const o=actx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(240,now); o.frequency.exponentialRampToValueAtTime(120,now+dur);
  const lp=actx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=700;
  const g=actx.createGain(); g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(0.15,now+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(lp).connect(g).connect(actx.destination); o.start(now); o.stop(now+dur); }

/* 5. 振動（コントローラのみ） */
const gamepads=[null,null];
function pulse(i,inten,ms){ try{ const gp=gamepads[i]; const a=gp&&gp.hapticActuators&&gp.hapticActuators[0]; if(a&&a.pulse) a.pulse(Math.max(0,Math.min(1,inten)),ms); }catch(_){} }
function pulseAll(i,ms){ pulse(0,i,ms); pulse(1,i,ms); }

/* 6. AR */
const controllers=[]; const ctrlOn=[false,false];
const TIP_JOINTS=["thumb-tip","index-finger-tip","middle-finger-tip","ring-finger-tip","pinky-finger-tip","index-finger-metacarpal","middle-finger-metacarpal"];
const markerMat=new THREE.MeshBasicMaterial({color:0xf0c19a,transparent:true,opacity:0.5,depthWrite:false});
const markerGeo=new THREE.SphereGeometry(1,10,8); const markers=[];
for(let i=0;i<MAXCOL;i++){ const m=new THREE.Mesh(markerGeo,markerMat); m.visible=false; m.renderOrder=5; scene.add(m); markers.push(m); }
const btnGroup=new THREE.Group(); btnGroup.visible=false; scene.add(btnGroup);
{ const bg=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.05,0.014),new THREE.MeshStandardMaterial({color:0x3a2e22,roughness:0.7})); bg.position.set(0,0,-0.008); btnGroup.add(bg);
  const cv=document.createElement("canvas"); cv.width=320; cv.height=112; const c=cv.getContext("2d");
  c.clearRect(0,0,320,112); c.textAlign="center"; c.textBaseline="middle"; c.font="bold 52px sans-serif"; c.fillStyle="#f0c19a"; c.fillText("丸める",160,60);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; tex.needsUpdate=true;
  const lm=new THREE.Mesh(new THREE.PlaneGeometry(0.125,0.044),new THREE.MeshBasicMaterial({map:tex,transparent:true})); lm.position.set(0,0,0.001); btnGroup.add(lm); }
function positionButton(){ const camN=(renderer&&renderer.xr.isPresenting)?renderer.xr.getCamera():camera;
  camN.getWorldPosition(_v1); camN.getWorldQuaternion(_q1); _v2.set(0,0,-1).applyQuaternion(_q1); _v2.y=0; if(_v2.lengthSq()<1e-6)_v2.set(0,0,-1); else _v2.normalize();
  btnGroup.position.set(anchor.x+_v2.x*0.02, anchor.y-0.24, anchor.z+_v2.z*0.02); btnGroup.lookAt(_v1.x,btnGroup.position.y,_v1.z); btnGroup.updateMatrixWorld(true); btnGroup.visible=true; }
function onSelectStart(i){ ensureAudio(); if(!controllers[i])return; controllers[i].getWorldPosition(_v1);
  if(btnGroup.visible){ btnGroup.getWorldPosition(_v2); if(_v1.distanceTo(_v2)<0.09){ roundUp(); playRound(); pulse(i,0.5,40); } } }
function setupControllers(){ if(controllers.length)return;
  for(let i=0;i<2;i++){ const c=renderer.xr.getController(i); c.userData.index=i;
    c.addEventListener("connected",e=>{ ctrlOn[i]=true; if(e.data&&e.data.gamepad) gamepads[i]=e.data.gamepad; });
    c.addEventListener("disconnected",()=>{ ctrlOn[i]=false; gamepads[i]=null; });
    c.addEventListener("squeezestart",()=>respawnInFront());
    c.addEventListener("selectstart",()=>onSelectStart(i));
    scene.add(c); controllers.push(c); } }
function collectXRColliders(frame,ref){ colN=0;
  for(let i=0;i<2;i++){ if(controllers[i]&&ctrlOn[i]){ controllers[i].getWorldPosition(_v1); addCol(_v1.x,_v1.y,_v1.z,TUNE.ctrlR); } }
  const session=renderer.xr.getSession();
  if(session&&frame&&ref){ for(const src of session.inputSources){ if(!src.hand)continue;
    for(const jn of TIP_JOINTS){ const j=src.hand.get(jn); if(!j)continue; const p=frame.getJointPose(j,ref); if(!p)continue;
      const r=(p.radius&&p.radius>0)?p.radius:TUNE.fingerR; addCol(p.transform.position.x,p.transform.position.y,p.transform.position.z,r); } } }
  for(let i=0;i<MAXCOL;i++){ if(i<colN){ markers[i].visible=true; markers[i].position.set(colX[i],colY[i],colZ[i]); markers[i].scale.setScalar(colR[i]); } else markers[i].visible=false; } }

let xrSession=null,arStarting=false,pendingSpawn=false;
async function startAR(){ if(xrSession){ xrSession.end(); return; } if(arStarting)return;
  if(!navigator.xr){ showErr("このブラウザはMR（AR）に対応していません。Quest 3のブラウザで開いてください。"); return; }
  init3D(); ensureAudio(); makeClay(); arStarting=true; $("goBtn").disabled=true; let session=null;
  try{ log("ARを開始します…");
    session=await navigator.xr.requestSession("immersive-ar",{optionalFeatures:["hand-tracking","local-floor"]});
    xrSession=session; renderer.xr.setReferenceSpaceType("local"); await renderer.xr.setSession(session);
    scene.background=null; setupControllers(); clayReady=false;
    $("start").style.display="none"; $("goBtn").textContent="AR中…"; $("stats").style.display="block";
    checkpoint("ar","AR開始OK（土台の起動に成功）"); log("目の前にねんどを出します。手やコントローラで押してみてください"); pendingSpawn=true;
    session.addEventListener("end",()=>{ xrSession=null; if(mc) mc.visible=false; clayReady=false; panel.visible=false;
      for(const m of markers) m.visible=false; btnGroup.visible=false; scene.background=null;
      $("start").style.display="flex"; $("goBtn").textContent="もう一度ためす"; $("goBtn").disabled=false; log("ARを終了しました"); });
  }catch(e){ showErr("AR開始に失敗しました："+(e&&e.message?e.message:e)); log("ヒント：Quest 3のブラウザでURLを開いてから「はじめる」を押してください");
    try{ session&&session.end(); }catch(_){}
    if(xrSession===session) xrSession=null; $("goBtn").disabled=false; $("goBtn").textContent="もう一度ためす"; }
  finally{ arStarting=false; } }

/* AR中の3Dパネル */
const panelCanvas=document.createElement("canvas"); panelCanvas.width=640; panelCanvas.height=360;
const pctx=panelCanvas.getContext("2d"); const panelTex=new THREE.CanvasTexture(panelCanvas); panelTex.colorSpace=THREE.SRGBColorSpace;
const panel=new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.28),new THREE.MeshBasicMaterial({map:panelTex,transparent:true})); panel.visible=false; scene.add(panel);
let panelStatus="";
function drawPanel(){ const c=pctx,W=panelCanvas.width,H=panelCanvas.height;
  c.clearRect(0,0,W,H); c.fillStyle="rgba(12,9,6,0.9)"; c.fillRect(0,0,W,H); c.strokeStyle="#3a2e22"; c.lineWidth=4; c.strokeRect(2,2,W-4,H-4); c.textBaseline="top";
  c.font="bold 20px 'Consolas','Courier New',monospace"; c.fillStyle="#f0c19a"; c.fillText(panelStatus,12,10);
  c.font="17px 'Consolas','Courier New',monospace"; const last=logLines.slice(-11); let y=42;
  for(const ln of last){ c.fillStyle=ln.e?"#ff9a9a":"#f0e2d2"; let t=ln.t; if(t.length>44)t=t.slice(0,43)+"…"; c.fillText(t,12,y); y+=27; } panelTex.needsUpdate=true; }
function placePanelInFront(){ const camN=renderer.xr.getCamera(); camN.getWorldPosition(_v1); camN.getWorldQuaternion(_q1);
  _v2.set(0,0,-1).applyQuaternion(_q1); _v2.y=0; if(_v2.lengthSq()<1e-6)_v2.set(0,0,-1); else _v2.normalize();
  panel.position.set(_v1.x+_v2.x*1.4,_v1.y-0.55,_v1.z+_v2.z*1.4); panel.lookAt(_v1.x,_v1.y-0.55,_v1.z); panel.visible=true; drawPanel(); }

/* 7. PC確認モード */
let pcMode=false,pcYaw=0.0,pcPitch=0.15,pcRadius=0.55; const pcTarget=new THREE.Vector3(0,0,0.5); let pokeAnim=null;
function startPC(){ init3D(); ensureAudio(); makeClay(); pcMode=true;
  $("start").style.display="none"; $("stats").style.display="block"; $("pchint").style.display="block";
  anchor.set(0,0,0.5); mc.position.copy(anchor); updatePCCamera(); roundUp(); positionButton(); setupPCInput(); }
function updatePCCamera(){ const cpp=Math.cos(pcPitch),spp=Math.sin(pcPitch);
  camera.position.set(pcTarget.x+pcRadius*cpp*Math.sin(pcYaw),pcTarget.y+pcRadius*spp,pcTarget.z-pcRadius*cpp*Math.cos(pcYaw)); camera.lookAt(pcTarget); }
let pcInputReady=false;
function setupPCInput(){ if(pcInputReady)return; pcInputReady=true; let dragging=false,moved=0,lx=0,ly=0;
  canvas.addEventListener("pointerdown",e=>{ dragging=true; moved=0; lx=e.clientX; ly=e.clientY; });
  addEventListener("pointermove",e=>{ if(!dragging)return; const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    pcYaw+=dx*0.008; pcPitch=Math.max(-1.2,Math.min(1.2,pcPitch+dy*0.006)); updatePCCamera(); });
  addEventListener("pointerup",e=>{ if(dragging&&moved<6) pcPokeFrom(e.clientX,e.clientY); dragging=false; });
  canvas.addEventListener("wheel",e=>{ e.preventDefault(); pcRadius=Math.max(0.3,Math.min(2.0,pcRadius+(e.deltaY>0?0.06:-0.06))); updatePCCamera(); },{passive:false});
  addEventListener("keydown",e=>{ if(e.key==="r"||e.key==="R"){ roundUp(); playRound(); } }); }
function pcPokeFrom(sx,sy){ ensureAudio();
  const nx=(sx/innerWidth)*2-1,ny=-(sy/innerHeight)*2+1; _v1.set(nx,ny,0.5).unproject(camera); _v1.sub(camera.position).normalize();
  _v2.copy(anchor).sub(camera.position); const tt=_v2.dot(_v1); _v2.copy(camera.position).addScaledVector(_v1,tt).sub(anchor);
  if(_v2.lengthSq()<1e-6)_v2.set(0,0,-1); _v2.normalize(); pokeAnim={t:0,dur:0.7,dx:_v2.x,dy:_v2.y,dz:_v2.z}; }

/* 8. ボタン有効化 */
let arSupported=false;
$("goBtn").addEventListener("click",()=>{ if(arSupported) startAR(); else startPC(); });
function enableButton(){ $("goBtn").disabled=false; $("goBtn").textContent=arSupported?"はじめる":"PCでためす（マウス）";
  log(arSupported?"準備OK。「はじめる」を押せます":"この端末はMR非対応。PC確認モードで動きだけ試せます（手ざわり・見え方はQuestで確認）"); }
if(navigator.xr&&navigator.xr.isSessionSupported){ navigator.xr.isSessionSupported("immersive-ar").then(ok=>{arSupported=!!ok;enableButton();}).catch(()=>{arSupported=false;enableButton();}); }
else{ arSupported=false; enableButton(); }

/* 9. 毎フレーム */
let lastMs=performance.now(),fpsSmooth=0,loopErr=false,digFrames=0;
function simulate(dt){
  // PCのつつき：中心から dir 方向の表面へ指を押し込みながら掘る
  if(pokeAnim){ pokeAnim.t+=dt; const f=pokeAnim.t/pokeAnim.dur;
    if(f>=1){ pokeAnim=null; colN=0; }
    else{ const depth=Math.sin(f*Math.PI)*(TUNE.R0*0.5); const d=TUNE.R0+TUNE.fingerR*0.5-depth;
      colN=0; addCol(anchor.x+pokeAnim.dx*d,anchor.y+pokeAnim.dy*d,anchor.z+pokeAnim.dz*d,TUNE.fingerR); } }
  if(clayReady) applyFingers();
  if(dirty){ const t0=performance.now(); mc.update(); updMs=updMs*0.8+(performance.now()-t0)*0.2; dirty=false;
    if(dugThisFrame>0.02){ digFrames++; if(digFrames%2===0){ playDig(Math.min(1,dugThisFrame*3)); pulseAll(TUNE.hapPoke,18); } } }
  const statLine="fps "+Math.round(fpsSmooth)+" / mesh "+updMs.toFixed(1)+"ms / tris "+(mc?mc.count/3|0:0);
  $("stats").textContent=statLine; if(statLine!==panelStatus){ panelStatus=statLine; if(panel.visible) drawPanel(); }
}
function renderLoop(t,frame){ try{
  const nowMs=performance.now(); const dt=Math.min((nowMs-lastMs)/1000,0.05); lastMs=nowMs;
  fpsSmooth=fpsSmooth?fpsSmooth*0.9+(1/Math.max(dt,1e-4))*0.1:1/Math.max(dt,1e-4);
  if(frame&&renderer.xr.isPresenting){ const ref=renderer.xr.getReferenceSpace();
    if(pendingSpawn){ pendingSpawn=false; respawnInFront(); placePanelInFront(); } collectXRColliders(frame,ref); }
  simulate(dt); renderer.render(scene,camera);
 }catch(err){ if(!loopErr){ loopErr=true; showErr("描画エラー："+(err&&err.message||err)); } } }
addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); if(renderer) renderer.setSize(innerWidth,innerHeight); });

/* 10. 自動テスト（__dbg） */
// 中心から dir 方向へ密度場をたどり、表面（iso交差）までの距離＝その向きの半径(m)
function surfaceRadius(dx,dy,dz){ const st=voxM*0.4; let prev=TUNE.maxField;
  for(let r=0;r<TUNE.fieldHalf;r+=st){ const v=sampleField(anchor.x+dx*r,anchor.y+dy*r,anchor.z+dz*r);
    if(v<TUNE.iso){ return r; } }
  return TUNE.fieldHalf; }
function fieldSum(){ let s=0; const f=mc.field; for(let i=0;i<f.length;i++) s+=f[i]; return s; }
function anyNaN(){ const f=mc.field; for(let i=0;i<f.length;i++){ if(Number.isNaN(f[i])) return true; } return false; }

window.__dbg={
  state(){ return { clayReady, size:SIZE, iso:TUNE.iso, tris:mc?mc.count/3|0:0, meshMs:+updMs.toFixed(2),
    fieldSum:+fieldSum().toFixed(1), rTop:+surfaceRadius(1,0,0).toFixed(4), nan:anyNaN() }; },
  spawn(){ anchor.set(0,0,0.5); if(mc)mc.position.copy(anchor); makeClay(); roundUp(); return this.state(); },
  round(){ roundUp(); return this.state(); },
  // 指を +x から depth(m) 押し込みながら sec 秒掘り、クレーターの深さ＋縁の盛り上がりを測る
  digTest(depth,sec){ this.spawn(); depth=depth||0.05; sec=sec||0.6;
    const rBefore=surfaceRadius(1,0,0); const x0=anchor.x+TUNE.R0+TUNE.fingerR*0.5;
    const steps=Math.max(1,Math.round(sec/(1/60))), inS=Math.round(steps*0.4); const sumBefore=fieldSum();
    for(let s=0;s<steps;s++){ const f=s<inS?(s+1)/inS:1; colN=0; addCol(x0-depth*f,anchor.y,anchor.z,TUNE.fingerR); applyFingers(); if(dirty){mc.update();dirty=false;} }
    // クレーター＝+x方向の表面が引っ込んだ量、リム＝斜め45度の表面がどれだけ外へ出たか
    const rTop=surfaceRadius(1,0,0), craterDepth=rBefore-rTop;
    let rimMax=0; for(let a=0;a<8;a++){ const th=a/8*Math.PI*2; const ry=Math.cos(th),rz=Math.sin(th);
      const dxx=0.72,dd=Math.hypot(dxx,ry*0.69,rz*0.69); const rr=surfaceRadius(dxx/dd,ry*0.69/dd,rz*0.69/dd); if(rr-TUNE.R0>rimMax) rimMax=rr-TUNE.R0; }
    return { rBefore:+rBefore.toFixed(4), rTopAfter:+rTop.toFixed(4), craterDepth:+craterDepth.toFixed(4), rimBulge:+rimMax.toFixed(4),
      materialKept:+(fieldSum()/Math.max(sumBefore,1e-6)).toFixed(3), tris:mc.count/3|0, meshMs:+updMs.toFixed(2), nan:anyNaN() }; },
  // 掘った跡が残るか（掘る→何もせず時間を進める→クレーターが変わらない）
  staysTest(){ this.digTest(0.06,0.6); const r1=surfaceRadius(1,0,0);
    for(let s=0;s<60;s++){ colN=0; /* 何もしない */ } const r2=surfaceRadius(1,0,0);
    return { craterAfterDig:+(TUNE.R0-r1).toFixed(4), craterAfterWait:+(TUNE.R0-r2).toFixed(4), note:"SDFは編集が永続＝ほぼ同じはず" }; },
  perfTest(){ this.spawn(); // 掘りながらのmesh再生成コストを測る
    const x0=anchor.x+TUNE.R0; let mmax=0;
    for(let s=0;s<30;s++){ colN=0; addCol(x0-0.05,anchor.y,anchor.z,TUNE.fingerR); applyFingers(); const t0=performance.now(); if(dirty){mc.update();dirty=false;} const m=performance.now()-t0; if(m>mmax)mmax=m; }
    return { size:SIZE, tris:mc.count/3|0, meshMsMax:+mmax.toFixed(2), budget90:11.1, budget72:13.7, note:"掘っている間だけmesh再生成。触っていない間は0" }; },
  render(){ if(renderer) renderer.render(scene,camera); return "ok"; },
  tune:TUNE,
};

log("読み込みOK（版：" + REV + "）");
</script>
