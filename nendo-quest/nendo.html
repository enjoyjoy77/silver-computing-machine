<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ねんど（さわる回・MPM）</title>
<style>
  :root{ --bg:#12100e; --panel:#241d16; --line:#3a2e22; --ink:#f6efe6; --dim:#b6a48f; --accent:#d98b5f; --accent2:#f0c19a; --danger:#ff8f8f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;overflow:hidden;}
  canvas#view{position:fixed;inset:0;display:block;touch-action:none;}
  #rev{position:fixed;top:8px;right:12px;z-index:40;font-size:11px;letter-spacing:.1em;color:var(--dim);pointer-events:none;}
  #start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);padding:28px 22px;overflow-y:auto;text-align:center;}
  #start .mark{font-size:12px;letter-spacing:.35em;color:var(--accent);}
  #start h1{margin:0;font-size:24px;font-weight:900;line-height:1.4;}
  #start p{margin:0;color:var(--dim);font-size:13px;line-height:1.9;max-width:470px;}
  #goBtn{border:none;border-radius:16px;padding:20px 44px;font:inherit;font-size:19px;font-weight:900;letter-spacing:.06em;cursor:pointer;background:var(--accent);color:#2a1206;box-shadow:0 6px 22px rgba(217,139,95,.35);}
  #goBtn:disabled{opacity:.4;cursor:default;box-shadow:none;}
  #note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:12.5px;line-height:1.85;color:var(--ink);max-width:470px;} #note b{color:var(--accent2);}
  #stats{position:fixed;top:8px;left:12px;z-index:40;font-size:11px;line-height:1.6;color:var(--dim);pointer-events:none;font-family:"Consolas","Courier New",monospace;background:rgba(6,10,14,.5);padding:5px 8px;border-radius:8px;display:none;white-space:pre;}
  #pchint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:35;display:none;background:rgba(36,29,22,.9);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:12.5px;line-height:1.7;color:var(--ink);text-align:center;max-width:92vw;} #pchint b{color:var(--accent2);}
  #logWrap{position:fixed;left:10px;bottom:10px;z-index:40;width:min(88vw,420px);}
  #logTitle{font-size:10px;letter-spacing:.15em;color:var(--dim);margin-bottom:4px;}
  #log{background:rgba(6,10,14,.82);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11px;line-height:1.65;color:var(--ink);height:108px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-family:"Consolas","Courier New",monospace;} #log .e{color:var(--danger);}
  #err{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:50;display:none;background:#3a1414;border:1px solid #8a2e2e;color:#ffdada;padding:12px 18px;border-radius:12px;font-size:13px;line-height:1.7;max-width:92vw;text-align:center;}
</style>
</head>
<body>
<canvas id="view"></canvas>
<span id="rev"></span>
<div id="stats"></div>
<div id="start">
  <div class="mark">ねんど（MPM・動きの試作）</div>
  <h1>粘土の"動き"を物理で<br>作れるか試す回です</h1>
  <p>映画の粘土と同じ弾塑性シミュ（MPM）の試作。押すと材料が動いて流れ、離しても形が残るかを確かめます。まずは動きと速さの実験です。</p>
  <button id="goBtn" disabled>じゅんび中…</button>
  <div id="note"><b>この回はまず点（粒）で表示します</b><br>見た目より「押した時に材料が粘土っぽく動くか・重いか」を見る回です。なめらかな見た目は動きが合格してから作ります。</div>
</div>
<div id="pchint"><b>PC確認モード</b>　ドラッグ＝見る／クリック＝押す／ホイール＝寄引／R＝丸める</div>
<div id="logWrap"><div id="logTitle">記録</div><div id="log"></div></div>
<div id="err"></div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";
const REV="v4 rev1"; document.getElementById("rev").textContent=REV;
const $=id=>document.getElementById(id); const logEl=$("log"); const logLines=[];
function log(m,e){ logLines.push({t:m,e:!!e}); if(logLines.length>40)logLines.shift(); const d=document.createElement("div"); if(e)d.className="e"; d.textContent="・"+m; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
function showErr(m){ const e=$("err"); e.textContent=m; e.style.display="block"; log(m,true); }
addEventListener("error",ev=>log("エラー: "+(ev.message||ev.error||"不明"),true));
addEventListener("unhandledrejection",ev=>log("エラー(非同期): "+(ev.reason&&ev.reason.message||ev.reason||"不明"),true));

/* ============================================================
   MLS-MPM（3D・弾塑性＝粘土）。sim空間[0,1]³で計算し worldへ写す
   ============================================================ */
const MPM={
  n: 20,                 // グリッド解像度（1辺のセル数）
  substeps: 15,          // 1/60秒あたりのサブステップ
  dt: 1/60/15,           // サブステップの時間
  E: 800.0,              // 硬さ（ヤング率。小さいほど柔らかい＝dt大きくできる）
  nu: 0.2,               // ポアソン比
  rho: 1.0,              // 密度
  gravity: 0.0,          // sim重力（0＝浮く。とりあえず0で動きを見る）
  yield: 8.0,            // 降伏応力（腰＝これを超えると塑性で流れて残る）。大=固い/よく残る
  pspacing: 0.042,       // 粒の間隔（sim単位）。小さいほど粒増＆重い
  blobR: 0.30,           // 塊の半径（sim単位）。worldSize×これが実寸半径
  worldSize: 0.34,       // sim[0,1]をworld何mに写すか（blobR×これ＝実半径）
};
let n, ng, dx, inv_dx, mu0, lambda0, pmass, pvol, stressCoeff;
let P=0, px, pv, pF, pC;         // 粒: 位置/速度/変形勾配F/アフィンC（sim単位）
let gvx, gvy, gvz, gm;           // グリッド: 速度3成分/質量
const anchor=new THREE.Vector3(0,0,0.5);
let ready=false, physMs=0;

function recalc(){
  n=MPM.n; ng=(n+1)*(n+1)*(n+1); dx=1/n; inv_dx=n;
  mu0=MPM.E/(2*(1+MPM.nu)); lambda0=MPM.E*MPM.nu/((1+MPM.nu)*(1-2*MPM.nu));
  pvol=(dx*0.5)*(dx*0.5)*(dx*0.5); pmass=pvol*MPM.rho;
  MPM.dt=1/60/MPM.substeps;
  stressCoeff=-MPM.dt*pvol*4*inv_dx*inv_dx;
  gvx=new Float32Array(ng); gvy=new Float32Array(ng); gvz=new Float32Array(ng); gm=new Float32Array(ng);
}
function buildParticles(){
  recalc();
  const s=MPM.pspacing, R=MPM.blobR, R2=R*R, c=0.5; const pts=[];
  let seed=7; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff-0.5; };
  for(let x=c-R;x<=c+R;x+=s)for(let y=c-R;y<=c+R;y+=s)for(let z=c-R;z<=c+R;z+=s){
    const jx=x+rnd()*s*0.4, jy=y+rnd()*s*0.4, jz=z+rnd()*s*0.4;
    const ddx=jx-c,ddy=jy-c,ddz=jz-c; if(ddx*ddx+ddy*ddy+ddz*ddz<=R2) pts.push(jx,jy,jz);
  }
  P=pts.length/3;
  px=new Float32Array(pts); pv=new Float32Array(P*3); pF=new Float32Array(P*9); pC=new Float32Array(P*9);
  for(let p=0;p<P;p++){ pF[p*9]=1; pF[p*9+4]=1; pF[p*9+8]=1; }   // F=I
}
function resetClay(){ buildParticles(); ready=true; syncPoints(); }

/* --- 3x3 対称行列のJacobi固有分解 → SVD --- */
const _V=new Float64Array(9), _eig=new Float64Array(3);
function jacobiEigen(a00,a01,a02,a11,a12,a22, V, eig){
  let v00=1,v01=0,v02=0,v10=0,v11=1,v12=0,v20=0,v21=0,v22=1;
  for(let sweep=0;sweep<6;sweep++){
    if(Math.abs(a01)+Math.abs(a02)+Math.abs(a12)<1e-13) break;
    if(Math.abs(a01)>1e-14){ const tau=(a11-a00)/(2*a01); const sg=tau>=0?1:-1; const t=sg/(Math.abs(tau)+Math.sqrt(1+tau*tau)); const c=1/Math.sqrt(1+t*t), s=t*c;
      const na00=a00-t*a01, na11=a11+t*a01, na02=c*a02-s*a12, na12=s*a02+c*a12; a00=na00;a11=na11;a01=0;a02=na02;a12=na12;
      let x,y; x=v00;y=v01; v00=c*x-s*y; v01=s*x+c*y; x=v10;y=v11; v10=c*x-s*y; v11=s*x+c*y; x=v20;y=v21; v20=c*x-s*y; v21=s*x+c*y; }
    if(Math.abs(a02)>1e-14){ const tau=(a22-a00)/(2*a02); const sg=tau>=0?1:-1; const t=sg/(Math.abs(tau)+Math.sqrt(1+tau*tau)); const c=1/Math.sqrt(1+t*t), s=t*c;
      const na00=a00-t*a02, na22=a22+t*a02, na01=c*a01-s*a12, na12=s*a01+c*a12; a00=na00;a22=na22;a02=0;a01=na01;a12=na12;
      let x,y; x=v00;y=v02; v00=c*x-s*y; v02=s*x+c*y; x=v10;y=v12; v10=c*x-s*y; v12=s*x+c*y; x=v20;y=v22; v20=c*x-s*y; v22=s*x+c*y; }
    if(Math.abs(a12)>1e-14){ const tau=(a22-a11)/(2*a12); const sg=tau>=0?1:-1; const t=sg/(Math.abs(tau)+Math.sqrt(1+tau*tau)); const c=1/Math.sqrt(1+t*t), s=t*c;
      const na11=a11-t*a12, na22=a22+t*a12, na01=c*a01-s*a02, na02=s*a01+c*a02; a11=na11;a22=na22;a12=0;a01=na01;a02=na02;
      let x,y; x=v01;y=v02; v01=c*x-s*y; v02=s*x+c*y; x=v11;y=v12; v11=c*x-s*y; v12=s*x+c*y; x=v21;y=v22; v21=c*x-s*y; v22=s*x+c*y; }
  }
  V[0]=v00;V[1]=v01;V[2]=v02;V[3]=v10;V[4]=v11;V[5]=v12;V[6]=v20;V[7]=v21;V[8]=v22;
  eig[0]=a00; eig[1]=a11; eig[2]=a22;
}
// F(9,row-major) → U(9),S(3),Vt不要（U,S,Vを返す。V列＝固有ベクトル）
const _U=new Float64Array(9), _S=new Float64Array(3), _Vs=new Float64Array(9);
function svd3(F){
  // A = F^T F （対称）
  const f0=F[0],f1=F[1],f2=F[2],f3=F[3],f4=F[4],f5=F[5],f6=F[6],f7=F[7],f8=F[8];
  const a00=f0*f0+f3*f3+f6*f6, a01=f0*f1+f3*f4+f6*f7, a02=f0*f2+f3*f5+f6*f8,
        a11=f1*f1+f4*f4+f7*f7, a12=f1*f2+f4*f5+f7*f8, a22=f2*f2+f5*f5+f8*f8;
  jacobiEigen(a00,a01,a02,a11,a12,a22,_Vs,_eig);
  for(let j=0;j<3;j++){ _S[j]=Math.sqrt(Math.max(_eig[j],0)); }
  // U列 = F * V列 / S
  for(let j=0;j<3;j++){ const vx=_Vs[j],vy=_Vs[3+j],vz=_Vs[6+j];   // V列j
    let ux=f0*vx+f1*vy+f2*vz, uy=f3*vx+f4*vy+f5*vz, uz=f6*vx+f7*vy+f8*vz;
    const s=_S[j]; if(s>1e-9){ ux/=s;uy/=s;uz/=s; } else { ux=0;uy=0;uz=0; }
    _U[j]=ux;_U[3+j]=uy;_U[6+j]=uz;
  }
  // S~0の列は他2列の外積で補完（U直交化）
  for(let j=0;j<3;j++){ if(_S[j]<=1e-9){ const a=(j+1)%3,b=(j+2)%3;
    const ux=_U[3+a]*_U[6+b]-_U[6+a]*_U[3+b], uy=_U[6+a]*_U[b]-_U[a]*_U[6+b], uz=_U[a]*_U[3+b]-_U[3+a]*_U[b];
    _U[j]=ux;_U[3+j]=uy;_U[6+j]=uz; } }
}

/* --- 指（押す）＝sim空間の球。グリッドで速度を与える --- */
let fingerOn=false; const fingerP=new THREE.Vector3(), fingerPprev=new THREE.Vector3(); const fingerV=new THREE.Vector3(); let fingerR=0.09;
function setFinger(on, sx,sy,sz, vr){ // sim座標
  fingerOn=on; if(on){ fingerPprev.copy(fingerP); fingerP.set(sx,sy,sz); fingerR=vr||0.09; fingerV.copy(fingerP).sub(fingerPprev).multiplyScalar(1/MPM.dt); } }

function substep(){
  gvx.fill(0); gvy.fill(0); gvz.fill(0); gm.fill(0);
  const N1=n+1, dt=MPM.dt;
  // ---- P2G ----
  for(let p=0;p<P;p++){
    const x=px[p*3]*inv_dx, y=px[p*3+1]*inv_dx, z=px[p*3+2]*inv_dx;
    const bx=Math.floor(x-0.5), by=Math.floor(y-0.5), bz=Math.floor(z-0.5);
    const fx=x-bx, fy=y-by, fz=z-bz;
    const wx0=0.5*(1.5-fx)*(1.5-fx), wx1=0.75-(fx-1)*(fx-1), wx2=0.5*(fx-0.5)*(fx-0.5);
    const wy0=0.5*(1.5-fy)*(1.5-fy), wy1=0.75-(fy-1)*(fy-1), wy2=0.5*(fy-0.5)*(fy-0.5);
    const wz0=0.5*(1.5-fz)*(1.5-fz), wz1=0.75-(fz-1)*(fz-1), wz2=0.5*(fz-0.5)*(fz-0.5);
    _wx[0]=wx0;_wx[1]=wx1;_wx[2]=wx2; _wy[0]=wy0;_wy[1]=wy1;_wy[2]=wy2; _wz[0]=wz0;_wz[1]=wz1;_wz[2]=wz2;
    const wx=_wx, wy=_wy, wz=_wz;
    // Neo-Hookean Kirchhoff応力 τ = mu*(F F^T - I) + lambda*lnJ*I （SVD不要）
    const F0=pF[p*9],F1=pF[p*9+1],F2=pF[p*9+2],F3=pF[p*9+3],F4=pF[p*9+4],F5=pF[p*9+5],F6=pF[p*9+6],F7=pF[p*9+7],F8=pF[p*9+8];
    const J=F0*(F4*F8-F5*F7)-F1*(F3*F8-F5*F6)+F2*(F3*F7-F4*F6);
    const lnJ=Math.log(Math.max(J,1e-4));
    // FFt
    const ff0=F0*F0+F1*F1+F2*F2, ff1=F0*F3+F1*F4+F2*F5, ff2=F0*F6+F1*F7+F2*F8,
          ff4=F3*F3+F4*F4+F5*F5, ff5=F3*F6+F4*F7+F5*F8, ff8=F6*F6+F7*F7+F8*F8;
    const ll=lambda0*lnJ;
    // τ (対称)
    const t0=mu0*(ff0-1)+ll, t1=mu0*ff1, t2=mu0*ff2, t4=mu0*(ff4-1)+ll, t5=mu0*ff5, t8=mu0*(ff8-1)+ll;
    // affine = stressCoeff*τ + pmass*C
    const c=pC.subarray?null:null;
    const a0=stressCoeff*t0+pmass*pC[p*9],   a1=stressCoeff*t1+pmass*pC[p*9+1], a2=stressCoeff*t2+pmass*pC[p*9+2],
          a3=stressCoeff*t1+pmass*pC[p*9+3], a4=stressCoeff*t4+pmass*pC[p*9+4], a5=stressCoeff*t5+pmass*pC[p*9+5],
          a6=stressCoeff*t2+pmass*pC[p*9+6], a7=stressCoeff*t5+pmass*pC[p*9+7], a8=stressCoeff*t8+pmass*pC[p*9+8];
    const vx=pv[p*3],vy=pv[p*3+1],vz=pv[p*3+2];
    for(let i=0;i<3;i++){ const gx=bx+i; const wgx=wx[i]; const dpx=(i-fx)*dx;
      for(let j=0;j<3;j++){ const gy=by+j; const wgy=wgx*wy[j]; const dpy=(j-fy)*dx;
        for(let k=0;k<3;k++){ const gz=bz+k; const w=wgy*wz[k]; const dpz=(k-fz)*dx;
          const node=gx+gy*N1+gz*N1*N1;
          gm[node]+=w*pmass;
          gvx[node]+=w*(pmass*vx + a0*dpx+a1*dpy+a2*dpz);
          gvy[node]+=w*(pmass*vy + a3*dpx+a4*dpy+a5*dpz);
          gvz[node]+=w*(pmass*vz + a6*dpx+a7*dpy+a8*dpz);
        }}}
  }
  // ---- grid ----
  const bnd=2;
  for(let gz=0;gz<N1;gz++)for(let gy=0;gy<N1;gy++)for(let gx=0;gx<N1;gx++){
    const node=gx+gy*N1+gz*N1*N1; const m=gm[node]; if(m<=0) continue;
    let vx=gvx[node]/m, vy=gvy[node]/m, vz=gvz[node]/m;
    vy+=dt*MPM.gravity;
    // 指の押し：ノードのworld位置が指球内なら、指の速度側へ寄せる（押し出す）
    if(fingerOn){ const wxp=(gx*dx-0.5)*MPM.worldSize+anchor.x, wyp=(gy*dx-0.5)*MPM.worldSize+anchor.y, wzp=(gz*dx-0.5)*MPM.worldSize+anchor.z;
      // 指のsim位置→world
      const fwx=(fingerP.x-0.5)*MPM.worldSize+anchor.x, fwy=(fingerP.y-0.5)*MPM.worldSize+anchor.y, fwz=(fingerP.z-0.5)*MPM.worldSize+anchor.z;
      const dxw=wxp-fwx,dyw=wyp-fwy,dzw=wzp-fwz; const dd=Math.sqrt(dxw*dxw+dyw*dyw+dzw*dzw); const fRw=fingerR*MPM.worldSize;
      if(dd<fRw){ // 指の速度(sim)を与える＋外向きに押す
        const fvx=fingerV.x, fvy=fingerV.y, fvz=fingerV.z;
        // 法線方向に押し出す（めり込み解消）
        const nx=dd>1e-6?dxw/dd:0, ny=dd>1e-6?dyw/dd:0, nz=dd>1e-6?dzw/dd:0;
        const vn=vx*nx+vy*ny+vz*nz; if(vn<0){ vx-=vn*nx; vy-=vn*ny; vz-=vn*nz; }  // 内向き速度を除去
        vx+=fvx; vy+=fvy; vz+=fvz;
      }
    }
    // 壁（境界のノードは外向き速度を止める）
    if(gx<bnd&&vx<0)vx=0; if(gx>n-bnd&&vx>0)vx=0;
    if(gy<bnd&&vy<0)vy=0; if(gy>n-bnd&&vy>0)vy=0;
    if(gz<bnd&&vz<0)vz=0; if(gz>n-bnd&&vz>0)vz=0;
    gvx[node]=vx; gvy[node]=vy; gvz[node]=vz;
  }
  // ---- G2P ----
  const yldThresh=MPM.yield/(2*mu0);
  for(let p=0;p<P;p++){
    const x=px[p*3]*inv_dx, y=px[p*3+1]*inv_dx, z=px[p*3+2]*inv_dx;
    const bx=Math.floor(x-0.5), by=Math.floor(y-0.5), bz=Math.floor(z-0.5);
    const fx=x-bx, fy=y-by, fz=z-bz;
    _wx[0]=0.5*(1.5-fx)*(1.5-fx);_wx[1]=0.75-(fx-1)*(fx-1);_wx[2]=0.5*(fx-0.5)*(fx-0.5);
    _wy[0]=0.5*(1.5-fy)*(1.5-fy);_wy[1]=0.75-(fy-1)*(fy-1);_wy[2]=0.5*(fy-0.5)*(fy-0.5);
    _wz[0]=0.5*(1.5-fz)*(1.5-fz);_wz[1]=0.75-(fz-1)*(fz-1);_wz[2]=0.5*(fz-0.5)*(fz-0.5);
    const wx=_wx, wy=_wy, wz=_wz;
    let nvx=0,nvy=0,nvz=0, c0=0,c1=0,c2=0,c3=0,c4=0,c5=0,c6=0,c7=0,c8=0;
    for(let i=0;i<3;i++){ const gx=bx+i, wgx=wx[i], dpx=(i-fx);
      for(let j=0;j<3;j++){ const gy=by+j, wgy=wgx*wy[j], dpy=(j-fy);
        for(let k=0;k<3;k++){ const gz=bz+k, w=wgy*wz[k], dpz=(k-fz);
          const node=gx+gy*N1+gz*N1*N1; const gx2=gvx[node],gy2=gvy[node],gz2=gvz[node];
          nvx+=w*gx2; nvy+=w*gy2; nvz+=w*gz2;
          const f=4*inv_dx*w;
          c0+=f*gx2*dpx; c1+=f*gx2*dpy; c2+=f*gx2*dpz;
          c3+=f*gy2*dpx; c4+=f*gy2*dpy; c5+=f*gy2*dpz;
          c6+=f*gz2*dpx; c7+=f*gz2*dpy; c8+=f*gz2*dpz;
        }}}
    pv[p*3]=nvx; pv[p*3+1]=nvy; pv[p*3+2]=nvz;
    pC[p*9]=c0;pC[p*9+1]=c1;pC[p*9+2]=c2;pC[p*9+3]=c3;pC[p*9+4]=c4;pC[p*9+5]=c5;pC[p*9+6]=c6;pC[p*9+7]=c7;pC[p*9+8]=c8;
    px[p*3]+=dt*nvx; px[p*3+1]+=dt*nvy; px[p*3+2]+=dt*nvz;
    // F = (I+dt*C) F
    const F0=pF[p*9],F1=pF[p*9+1],F2=pF[p*9+2],F3=pF[p*9+3],F4=pF[p*9+4],F5=pF[p*9+5],F6=pF[p*9+6],F7=pF[p*9+7],F8=pF[p*9+8];
    const m0=1+dt*c0, m1=dt*c1, m2=dt*c2, m3=dt*c3, m4=1+dt*c4, m5=dt*c5, m6=dt*c6, m7=dt*c7, m8=1+dt*c8;
    let nF0=m0*F0+m1*F3+m2*F6, nF1=m0*F1+m1*F4+m2*F7, nF2=m0*F2+m1*F5+m2*F8;
    let nF3=m3*F0+m4*F3+m5*F6, nF4=m3*F1+m4*F4+m5*F7, nF5=m3*F2+m4*F5+m5*F8;
    let nF6=m6*F0+m7*F3+m8*F6, nF7=m6*F1+m7*F4+m8*F7, nF8=m6*F2+m7*F5+m8*F8;
    // 塑性（von Mises 降伏へのreturn mapping）：SVD→Hencky歪みの偏差成分を降伏面へ射影
    _svdF[0]=nF0;_svdF[1]=nF1;_svdF[2]=nF2;_svdF[3]=nF3;_svdF[4]=nF4;_svdF[5]=nF5;_svdF[6]=nF6;_svdF[7]=nF7;_svdF[8]=nF8;
    svd3(_svdF);
    let e0=Math.log(Math.max(_S[0],1e-4)), e1=Math.log(Math.max(_S[1],1e-4)), e2=Math.log(Math.max(_S[2],1e-4));
    const tr=(e0+e1+e2)/3; const d0=e0-tr,d1=e1-tr,d2=e2-tr; const dn=Math.sqrt(d0*d0+d1*d1+d2*d2);
    if(dn>yldThresh && dn>1e-8){ const sc=yldThresh/dn;
      e0=tr+d0*sc; e1=tr+d1*sc; e2=tr+d2*sc;
      const s0=Math.exp(e0),s1=Math.exp(e1),s2=Math.exp(e2);
      // F = U diag(s) V^T
      const u0=_U[0],u1=_U[1],u2=_U[2],u3=_U[3],u4=_U[4],u5=_U[5],u6=_U[6],u7=_U[7],u8=_U[8];
      const v0=_Vs[0],v1=_Vs[1],v2=_Vs[2],v3=_Vs[3],v4=_Vs[4],v5=_Vs[5],v6=_Vs[6],v7=_Vs[7],v8=_Vs[8];
      // US = U*diag(s)
      const us0=u0*s0,us1=u1*s1,us2=u2*s2, us3=u3*s0,us4=u4*s1,us5=u5*s2, us6=u6*s0,us7=u7*s1,us8=u8*s2;
      // F = US * V^T  (V^T row i = V col ... V is _Vs with columns=eigvecs → V^T[i][j]=_Vs[j*3+i])
      nF0=us0*v0+us1*v1+us2*v2; nF1=us0*v3+us1*v4+us2*v5; nF2=us0*v6+us1*v7+us2*v8;
      nF3=us3*v0+us4*v1+us5*v2; nF4=us3*v3+us4*v4+us5*v5; nF5=us3*v6+us4*v7+us5*v8;
      nF6=us6*v0+us7*v1+us8*v2; nF7=us6*v3+us7*v4+us8*v5; nF8=us6*v6+us7*v7+us8*v8;
    }
    pF[p*9]=nF0;pF[p*9+1]=nF1;pF[p*9+2]=nF2;pF[p*9+3]=nF3;pF[p*9+4]=nF4;pF[p*9+5]=nF5;pF[p*9+6]=nF6;pF[p*9+7]=nF7;pF[p*9+8]=nF8;
    // 場外に出さない
    const pad=(bnd+0.5)*dx;
    if(px[p*3]<pad)px[p*3]=pad; else if(px[p*3]>1-pad)px[p*3]=1-pad;
    if(px[p*3+1]<pad)px[p*3+1]=pad; else if(px[p*3+1]>1-pad)px[p*3+1]=1-pad;
    if(px[p*3+2]<pad)px[p*3+2]=pad; else if(px[p*3+2]>1-pad)px[p*3+2]=1-pad;
  }
}
const _svdF=new Float64Array(9);
const _wx=new Float64Array(3),_wy=new Float64Array(3),_wz=new Float64Array(3);
function stepFrame(){ if(!ready)return; const t0=performance.now(); for(let s=0;s<MPM.substeps;s++) substep(); physMs=physMs*0.8+(performance.now()-t0)*0.2; syncPoints(); }

/* ============================================================
   Three.js（点群で表示。動きが合格したら表面に）
   ============================================================ */
const canvas=$("view"); let renderer=null;
function init3D(){ if(renderer)return; renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.xr.enabled=true; renderer.setAnimationLoop(renderLoop); }
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.01,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x30241a,1.0));
const dir1=new THREE.DirectionalLight(0xfff2e2,1.2); dir1.position.set(0.6,1.6,0.8); scene.add(dir1);
let points=null, pointGeo=null, pointPos=null;
function makePoints(){ if(points){ scene.remove(points); pointGeo.dispose(); }
  pointGeo=new THREE.BufferGeometry(); pointPos=new Float32Array(P*3); pointGeo.setAttribute("position",new THREE.BufferAttribute(pointPos,3));
  const mat=new THREE.PointsMaterial({ color:0xc07a4e, size:MPM.worldSize*MPM.pspacing*0.9, sizeAttenuation:true });
  points=new THREE.Points(pointGeo,mat); points.frustumCulled=false; scene.add(points); }
function syncPoints(){ if(!points||pointPos.length!==P*3) makePoints();
  for(let p=0;p<P;p++){ pointPos[p*3]=(px[p*3]-0.5)*MPM.worldSize+anchor.x; pointPos[p*3+1]=(px[p*3+1]-0.5)*MPM.worldSize+anchor.y; pointPos[p*3+2]=(px[p*3+2]-0.5)*MPM.worldSize+anchor.z; }
  pointGeo.attributes.position.needsUpdate=true; }

/* PC確認モード */
let pcMode=false,pcYaw=0.3,pcPitch=0.15,pcRadius=0.6; const pcTarget=new THREE.Vector3(0,0,0.5); let pokeAnim=null;
function startPC(){ init3D(); pcMode=true; $("start").style.display="none"; $("stats").style.display="block"; $("pchint").style.display="block";
  anchor.set(0,0,0.5); resetClay(); updatePCCamera(); setupPCInput(); }
function updatePCCamera(){ const cp=Math.cos(pcPitch),sp=Math.sin(pcPitch); camera.position.set(pcTarget.x+pcRadius*cp*Math.sin(pcYaw),pcTarget.y+pcRadius*sp,pcTarget.z-pcRadius*cp*Math.cos(pcYaw)); camera.lookAt(pcTarget); }
let pcInputReady=false;
function setupPCInput(){ if(pcInputReady)return; pcInputReady=true; let drag=false,moved=0,lx=0,ly=0;
  canvas.addEventListener("pointerdown",e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;});
  addEventListener("pointermove",e=>{ if(!drag)return; const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy); pcYaw+=dx*0.008; pcPitch=Math.max(-1.2,Math.min(1.2,pcPitch+dy*0.006)); updatePCCamera(); });
  addEventListener("pointerup",e=>{ if(drag&&moved<6) pcPokeFrom(e.clientX,e.clientY); drag=false; });
  canvas.addEventListener("wheel",e=>{ e.preventDefault(); pcRadius=Math.max(0.3,Math.min(2.0,pcRadius+(e.deltaY>0?0.06:-0.06))); updatePCCamera(); },{passive:false});
  addEventListener("keydown",e=>{ if(e.key==="r"||e.key==="R"){ resetClay(); } }); }
function pcPokeFrom(sx,sy){ // 画面クリック→中心へ押し込むアニメ
  const nx=(sx/innerWidth)*2-1,ny=-(sy/innerHeight)*2+1; const v=new THREE.Vector3(nx,ny,0.5).unproject(camera).sub(camera.position).normalize();
  const toC=new THREE.Vector3().copy(anchor).sub(camera.position); const tt=toC.dot(v); const near=new THREE.Vector3().copy(camera.position).addScaledVector(v,tt).sub(anchor);
  if(near.lengthSq()<1e-6)near.set(0,0,-1); near.normalize(); pokeAnim={t:0,dur:0.7,dx:near.x,dy:near.y,dz:near.z}; }

let arSupported=false;
$("goBtn").addEventListener("click",()=>{ startPC(); });   // この試作はPC/点群のみ。実機は動き合格後
function enableButton(){ $("goBtn").disabled=false; $("goBtn").textContent="PCでためす（動きを見る）"; log("準備OK。押した時に材料が粘土っぽく動くかを見てください"); }
enableButton();

let lastMs=performance.now(),fpsSmooth=0,loopErr=false;
function simulate(dt){
  if(pokeAnim){ pokeAnim.t+=dt; const f=pokeAnim.t/pokeAnim.dur;
    if(f>=1){ pokeAnim=null; setFinger(false); }
    else{ const depth=Math.sin(f*Math.PI)*0.42; const r=MPM.blobR+0.06-depth;   // sim半径方向
      setFinger(true, 0.5+pokeAnim.dx*r, 0.5+pokeAnim.dy*r, 0.5+pokeAnim.dz*r, 0.10); } }
  stepFrame();
  const st="fps "+Math.round(fpsSmooth)+" / phys "+physMs.toFixed(1)+"ms / 粒"+P+" 格子"+MPM.n+" 副"+MPM.substeps;
  $("stats").textContent=st;
}
function renderLoop(t,frame){ try{ const now=performance.now(); const dt=Math.min((now-lastMs)/1000,0.05); lastMs=now;
  fpsSmooth=fpsSmooth?fpsSmooth*0.9+(1/Math.max(dt,1e-4))*0.1:1/Math.max(dt,1e-4);
  simulate(dt); renderer.render(scene,camera);
 }catch(err){ if(!loopErr){ loopErr=true; showErr("エラー："+(err&&err.message||err)); } } }
addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); if(renderer) renderer.setSize(innerWidth,innerHeight); });

/* ============================================================
   自動テスト（__dbg）：動き・残り・体積・速さ
   ============================================================ */
function com(){ let cx=0,cy=0,cz=0; for(let p=0;p<P;p++){cx+=px[p*3];cy+=px[p*3+1];cz+=px[p*3+2];} return [cx/P,cy/P,cz/P]; }
function rog(){ const [cx,cy,cz]=com(); let s=0; for(let p=0;p<P;p++){ s+=(px[p*3]-cx)**2+(px[p*3+1]-cy)**2+(px[p*3+2]-cz)**2; } return Math.sqrt(s/P); }
let rog0=0;
function maxSpeed(){ let m=0; for(let p=0;p<P;p++){ const s=px[p*3]; const v=Math.hypot(pv[p*3],pv[p*3+1],pv[p*3+2]); if(v>m)m=v; } return m; }
function anyNaN(){ for(let p=0;p<P*3;p++){ if(Number.isNaN(px[p])) return true; } return false; }
// +x方向の表面半径（sim）＝一番外の粒の半径
function surfR(dx,dy,dz){ const [cx,cy,cz]=com(); let mx=0; for(let p=0;p<P;p++){ const ex=px[p*3]-cx,ey=px[p*3+1]-cy,ez=px[p*3+2]-cz; const proj=ex*dx+ey*dy+ez*dz; const perp=Math.hypot(ex-proj*dx,ey-proj*dy,ez-proj*dz); if(perp<0.05 && proj>mx) mx=proj; } return mx; }
window.__dbg={
  state(){ return { ready, P, n:MPM.n, substeps:MPM.substeps, physMsPerFrame:+physMs.toFixed(2),
    rogRatio:+(rog0>0?rog()/rog0:1).toFixed(3), maxSpeed:+maxSpeed().toFixed(3), nan:anyNaN() }; },
  spawn(){ anchor.set(0,0,0.5); resetClay(); rog0=rog(); makePoints&&makePoints(); return this.state(); },
  // +xから指を押し込みながら掘り、動き→離した後に残るか、体積・暴走を測る
  digTest(depth,sec){ this.spawn(); depth=depth||0.35; sec=sec||0.6;
    const rBefore=surfR(1,0,0); const steps=Math.round(sec/(1/60)), inS=Math.round(steps*0.5);
    for(let s=0;s<steps;s++){ const f=s<inS?(s+1)/inS:1; const r=MPM.blobR+0.06-depth*f; setFinger(true,0.5+r,0.5,0.5,0.10); stepFrame(); }
    setFinger(false); const rDuring=surfR(1,0,0);
    for(let s=0;s<60;s++){ stepFrame(); }               // 離して1秒
    const rAfter=surfR(1,0,0);
    return { rBefore:+rBefore.toFixed(3), rDuring:+rDuring.toFixed(3), rAfter:+rAfter.toFixed(3),
      craterDuring:+(rBefore-rDuring).toFixed(3), craterKept:+(rBefore-rAfter).toFixed(3),
      rimBulge:+(surfR(0,1,0)-rBefore).toFixed(3), rogRatio:+(rog()/rog0).toFixed(3), maxSpeed:+maxSpeed().toFixed(3), nan:anyNaN() }; },
  perf(){ this.spawn(); const t0=performance.now(); for(let s=0;s<MPM.substeps;s++) substep(); const perStep=(performance.now()-t0)/MPM.substeps;
    return { P, n:MPM.n, substeps:MPM.substeps, msPerSubstep:+perStep.toFixed(3), msPerFrame:+(perStep*MPM.substeps).toFixed(2), budget90:11.1, budget72:13.7 }; },
  tick(sec){ const n=Math.round((sec||1)*60); for(let i=0;i<n;i++) stepFrame(); return this.state(); },
  tune:MPM, recalc:()=>{ resetClay(); rog0=rog(); },
};
log("読み込みOK（版："+REV+"）");
</script>
