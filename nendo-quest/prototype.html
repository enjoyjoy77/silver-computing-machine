<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#252321" />
  <title>ねんど — こねる試作</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./clay/style.css" />
  <body>
    <canvas id="view" aria-label="ねんどの作業台"></canvas>
    <main id="welcome">
      <span class="eyebrow">NENDO QUEST · 試作 0.1</span>
      <h1>手で、かたちに。</h1>
      <p class="intro">
        押す。つまんで伸ばす。ちぎった塊を、またくっつける。<br />両手で粘土の動きを試すための、新しい試作です。
      </p>
      <div class="steps">
        <p><b>01</b>指や手のひらで押す</p>
        <p><b>02</b>両手でつまんで、ゆっくり離す</p>
        <p><b>03</b>断面を押し合わせて、少し待つ</p>
      </div>
      <button id="enter" disabled>準備しています…</button>
      <button id="compat" class="quiet" hidden>
        別の表示方法で始める（試験用）
      </button>
      <button id="desktop" class="quiet" disabled>画面で試す</button>
      <p id="availability" role="status">動作環境を確認しています。</p>
      <p class="small">
        Quest 3のブラウザで開き、手の追跡を許可してください。<br />実機での動きと速度を評価する試作です。
      </p>
    </main>
    <div id="toolbar" hidden>
      <button id="reset">丸め直す</button><button id="mode">台に置く</button>
      <button id="two">2つの塊</button><button id="exit">終わる</button>
    </div>
    <aside id="guide" hidden>
      <b>指先でつまんで、ゆっくり。</b
      ><span
        >画面：ドラッグで押す／Shift＋ドラッグでつまむ／右ドラッグで反対側をつまむ。<br />Quest：作業台の手前にあるボタンを指で押せます。</span
      >
    </aside>
    <div id="message" role="status"></div>
    <details id="record">
      <summary>動作の記録</summary>
      <pre id="stats">準備中</pre>
      <button id="download">記録を保存</button>
      <pre id="log"></pre>
    </details>
    <script type="module" src="./clay/app.js"></script>
  </body>
</html>
