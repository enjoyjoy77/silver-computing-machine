<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>高知旅程 2026年8月</title>
<style>
  :root{
    --bg:#faf8f5; --fg:#2b2724; --sub:#6b625b; --line:#e2dad0;
    --card:#ffffff; --accent:#2f6f4e; --warn:#b3341f; --hi:#fff3d6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17150f; --fg:#ece6dd; --sub:#a89e93; --line:#3a342b;
           --card:#201d16; --accent:#7fc39a; --warn:#ff8f76; --hi:#3a3216; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
       line-height:1.75;font-size:16px;-webkit-text-size-adjust:100%}
  #gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  #gate .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
             border-radius:14px;padding:28px 24px;text-align:center}
  #gate h1{font-size:19px;margin:0 0 6px}
  #gate p{font-size:13px;color:var(--sub);margin:0 0 20px}
  #pw{width:100%;padding:13px;font-size:17px;border:1px solid var(--line);border-radius:9px;
      background:var(--bg);color:var(--fg);text-align:center}
  #go{width:100%;margin-top:12px;padding:13px;font-size:16px;border:0;border-radius:9px;
      background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
  #go:disabled{opacity:.5;cursor:default}
  #err{color:var(--warn);font-size:13px;min-height:1.4em;margin-top:10px}
  label.rm{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;
           font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
  #app{display:none;max-width:820px;margin:0 auto;padding:16px 18px 80px}
  h1,h2,h3{line-height:1.4}
  h1{font-size:23px;border-bottom:3px solid var(--accent);padding-bottom:8px;margin:8px 0 20px}
  h2{font-size:20px;margin:38px 0 12px;padding:8px 12px;background:var(--accent);color:#fff;border-radius:7px}
  h3{font-size:17px;margin:26px 0 8px;border-left:5px solid var(--accent);padding-left:10px}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14.5px;display:block;overflow-x:auto}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--hi);white-space:nowrap}
  code{background:var(--hi);padding:2px 6px;border-radius:4px;font-size:14px}
  a{color:var(--accent)}
  ul,ol{padding-left:1.4em}
  li{margin:5px 0}
  blockquote{margin:14px 0;padding:12px 14px;background:var(--hi);border-left:5px solid var(--warn);border-radius:0 7px 7px 0}
  .warn{color:var(--warn);font-weight:700}
  hr{border:0;border-top:1px solid var(--line);margin:32px 0}
  #toc{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
       padding:8px 0;margin-bottom:14px;z-index:9}
  #toc select{width:100%;padding:10px;font-size:15px;border:1px solid var(--line);
              border-radius:8px;background:var(--card);color:var(--fg)}
  #lock{position:fixed;right:10px;bottom:10px;font-size:12px;opacity:.55;background:var(--card);
        border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:none}
  @media print{ #toc,#lock{display:none} body{background:#fff;color:#000} }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h1>🔒 合言葉を入れてください</h1>
    <p>この中身は暗号化されています<br><span style="opacity:.6">rev2 2026-08-05</span></p>
    <form id="loginform" method="post" action="">
      <input type="text" name="username" autocomplete="username" value="shiori" readonly
             tabindex="-1" aria-hidden="true"

      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="合言葉">
      <button id="go" type="submit">ひらく</button>
    </form>
    <label class="rm"><input id="remember" type="checkbox" checked>この端末では次から自動で開く</label>
    <div id="err"></div>
  </div>
</div>
<div id="app"></div>

const LS_KEY = "kochi_shiori_pw";

const dec = new TextDecoder();
const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const kb = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
              "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:bin(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    kb, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:bin(PAYLOAD.iv)}, key, bin(PAYLOAD.ct));
  return dec.decode(plain);
}

function buildToc(){
  const hs = [...document.querySelectorAll("#app h2")];
  if(!hs.length) return;
  const bar = document.createElement("div");
  bar.id = "toc";
  const sel = document.createElement("select");
  sel.innerHTML = '<option value="">— 見出しへ移動 —</option>';
  hs.forEach((h,i)=>{
    h.id = "h"+i;
    const o = document.createElement("option");
    o.value = "h"+i; o.textContent = h.textContent;
    sel.appendChild(o);
  });
  sel.onchange = () => {
    const t = document.getElementById(sel.value);
    if(t) t.scrollIntoView({behavior:"smooth"});
  };
  bar.appendChild(sel);
  document.getElementById("app").prepend(bar);
}

const $pw = document.getElementById("pw");
const $go = document.getElementById("go");
const $err = document.getElementById("err");
const $rm = document.getElementById("remember");
const $form = document.getElementById("loginform");

function showApp(html){
  document.getElementById("gate").style.display = "none";
  const app = document.getElementById("app");
  app.innerHTML = html;
  app.style.display = "block";
  document.getElementById("lock").style.display = "block";
  buildToc();
}

async function saveCredential(pw){
  // 1) この端末で自動で開く(チェック時)
  try{ if($rm.checked) localStorage.setItem(LS_KEY, pw); }catch(e){}
  try{ sessionStorage.setItem(LS_KEY, pw); }catch(e){}
  // 2) ブラウザのパスワード管理(Chrome/Android等)。対応していない端末では静かに何もしない
  try{
    if(window.PasswordCredential){
      const cred = new PasswordCredential({id:"shiori", password:pw, name:"旅のしおり"});
      await navigator.credentials.store(cred);
    }
  }catch(e){}
}

async function tryOpen(pw, fromAuto){
  if(!pw){ if(!fromAuto) $err.textContent = "合言葉を入れてください"; return false; }
  $go.disabled = true;
  $err.textContent = fromAuto ? "保存した合言葉で開いています…" : "確認しています…";
  try{
    const html = await unlock(pw);
    await saveCredential(pw);
    showApp(html);
    return true;
  }catch(e){
    if(fromAuto){
      // 保存されていた合言葉が古い(作り直し後など) → 消して手入力へ
      try{ localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY); }catch(_){}
      $err.textContent = "";
    }else{
      $err.textContent = "合言葉が違います";
      $pw.select();
    }
    $go.disabled = false;
    return false;
  }
}

$form.addEventListener("submit", e => { e.preventDefault(); tryOpen($pw.value, false); });

document.getElementById("lock").onclick = () => {
  try{ localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY); }catch(e){}
  location.reload();
};

window.addEventListener("load", async ()=>{
  // 自動で開く: ①この端末の保存 → ②タブ内の記憶 → ③ブラウザのパスワード管理
  let pw = null;
  try{ pw = localStorage.getItem(LS_KEY) || sessionStorage.getItem(LS_KEY); }catch(e){}
  if(pw && await tryOpen(pw, true)) return;
  try{
    if(window.PasswordCredential && navigator.credentials && navigator.credentials.get){
      const cred = await navigator.credentials.get({password:true, mediation:"optional"});
      if(cred && cred.password && await tryOpen(cred.password, true)) return;
    }
  }catch(e){}
  $pw.focus();
});
</script>
