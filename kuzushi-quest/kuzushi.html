<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ねんりき崩し（脳汁テスト版）</title>
<style>
  :root{
    --bg:#140f0a; --panel:#211812; --line:#3a2c20; --ink:#f5efe6;
    --dim:#b39c86; --accent:#ffb454; --accent2:#ffd79a; --danger:#ff8f8f; --ok:#7fe0a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    overflow:hidden;}
  canvas#view{position:fixed;inset:0;display:block;touch-action:none;}

  #rev{position:fixed;top:8px;right:12px;z-index:40;font-size:11px;letter-spacing:.1em;
    color:var(--dim);pointer-events:none;}

  /* 開始画面 */
  #start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:var(--bg);
    padding:28px 22px;overflow-y:auto;text-align:center;}
  #start .mark{font-size:12px;letter-spacing:.35em;color:var(--accent);}
  #start h1{margin:0;font-size:25px;font-weight:900;line-height:1.4;}
  #start p{margin:0;color:var(--dim);font-size:13px;line-height:1.9;max-width:460px;}
  #goBtn{border:none;border-radius:16px;padding:20px 44px;font:inherit;font-size:19px;
    font-weight:900;letter-spacing:.06em;cursor:pointer;background:var(--accent);
    color:#2a1602;box-shadow:0 6px 22px rgba(255,180,84,.35);transition:opacity .2s,transform .1s;}
  #goBtn:active{transform:translateY(1px);}
  #goBtn:disabled{opacity:.4;cursor:default;box-shadow:none;}
  #best{font-size:12px;color:var(--accent2);line-height:1.8;min-height:1em;}
  #best .lbl{color:var(--dim);}
  #note{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 18px;font-size:12.5px;line-height:1.85;color:var(--ink);max-width:460px;}
  #note b{color:var(--accent2);}

  /* 常時ステータス */
  #stats{position:fixed;top:8px;left:12px;z-index:40;font-size:11px;line-height:1.6;
    color:var(--dim);pointer-events:none;font-family:"Consolas","Courier New",monospace;
    background:rgba(10,7,4,.5);padding:5px 8px;border-radius:8px;display:none;white-space:pre;}

  /* まん中の大きな演出テキスト（会心・れんさ・記録更新など） */
  #banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:45;
    font-size:46px;font-weight:900;color:#ffd24a;text-shadow:0 3px 14px rgba(0,0,0,.65);
    opacity:0;pointer-events:none;transition:opacity .1s;text-align:center;white-space:nowrap;
    letter-spacing:.04em;}

  /* PC操作ヒント */
  #pchint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:35;
    display:none;background:rgba(33,24,18,.9);border:1px solid var(--line);border-radius:12px;
    padding:10px 16px;font-size:12.5px;line-height:1.7;color:var(--ink);text-align:center;max-width:92vw;}
  #pchint b{color:var(--accent2);}

  /* 画面内ログ */
  #logWrap{position:fixed;left:10px;bottom:10px;z-index:40;width:min(88vw,420px);}
  #logTitle{font-size:10px;letter-spacing:.15em;color:var(--dim);margin-bottom:4px;}
  #log{background:rgba(10,7,4,.82);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;font-size:11px;line-height:1.65;color:var(--ink);
    height:104px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
    font-family:"Consolas","Courier New",monospace;}
  #log .e{color:var(--danger);}

  /* 赤いエラー帯 */
  #err{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:50;
    display:none;background:#3a1414;border:1px solid #8a2e2e;color:#ffdada;
    padding:12px 18px;border-radius:12px;font-size:13px;line-height:1.7;
    max-width:92vw;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.4);}
</style>
</head>
<body>
<canvas id="view"></canvas>
<span id="rev"></span>
<div id="stats"></div>
<div id="banner"></div>

<div id="start">
  <div class="mark">ねんりき崩し</div>
  <h1>塔を、玉を投げて<br>崩すゲームです</h1>
  <p>机か床に塔が生えます。玉を投げて崩してください。<br>崩すほど音が上がり、たまに会心の一撃が出ます。</p>
  <button id="goBtn" disabled>じゅんび中…</button>
  <div id="best"></div>
  <div id="note">
    <b>英語の画面が出たら</b><br>
    ボタンを押すと英語の確認が出ることがあります。<br>
    「<b>Allow</b>（許可）」または「<b>Enter VR / OK</b>」を押してください。<br>
    うまくいかない時は、下の黒い枠（記録）の文をそのまま教えてください。
  </div>
</div>

<div id="pchint">
  <b>PC確認モード</b>　ドラッグ＝視点／クリック＝玉を投げる／ホイール＝寄る引く／R＝次の塔
</div>

<div id="logWrap">
  <div id="logTitle">記録（うまくいかない時はこの文を教えてください）</div>
  <div id="log"></div>
</div>

<div id="err"></div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";
import RAPIER from "./lib/rapier.mjs";

const REV = "v2 rev7";
document.getElementById("rev").textContent = REV;

/* ============================================================
   0. 画面内ログ（DOM＋AR中の3Dパネル。無言で失敗する経路を作らない）
   ============================================================ */
const $ = id => document.getElementById(id);
const logEl = $("log");
const logLines = [];
function log(msg, isErr){
  logLines.push({ t: msg, e: !!isErr });
  if(logLines.length > 40) logLines.shift();
  const div = document.createElement("div");
  if(isErr) div.className = "e";
  div.textContent = "・" + msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  drawPanel();
}
function showErr(msg){
  const e = $("err"); e.textContent = msg; e.style.display = "block"; log(msg, true);
}
addEventListener("error", ev => { log("エラー: " + (ev.message || ev.error || "不明"), true); });
addEventListener("unhandledrejection", ev => { log("エラー(非同期): " + (ev.reason && ev.reason.message || ev.reason || "不明"), true); });

const cp = {};
function checkpoint(key, msg){ if(cp[key]) return; cp[key] = true; log("✔ " + msg); }

/* ============================================================
   1. 調整パラメータ（実機の往復はこの数値を回す。__dbg.tune で生変更可）
   ============================================================ */
const TUNE = {
  throwMul: 1.4, throwMax: 7.0,
  blockDensity: 550, ballDensity: 1900,
  restitution: 0.12, friction: 0.9,     // 反発低め＝生えた時に跳ねて自壊しにくい
  forceThreshold: 1.0, forceRef: 220,
  collapseDist: 0.12, towerLayers: 12,   // 塔を高く（見上げる高さ）。InstancedMeshで軽いので大きくできる
  settleGrace: 1.8,     // 生えてから落ち着くまで(s)は崩れ判定をしない。大きい塔は落ち着くのが遅いので長め
  hapHit: 0.5, hapThrow: 0.25, hapSpawn: 0.2, hapClear: 0.9,
  // --- 段階2（脳汁）---
  critChance: 0.08,     // 会心の一撃の確率
  critScale: 2.2,       // 会心の玉の大きさ倍率
  chargeDelay: 0.4,     // 溜め開始までの保持時間(s)
  chargeTime: 1.8,      // 最大まで溜まる時間(s)。溜め＝主役なので長めに
  chargeMax: 5.0,       // 溜め玉の最大倍率（直径約40cmの破壊鉄球）
  hitstop: 0.07,        // ヒットストップ(s)
  hitstopCrit: 0.13,
  slowThreshold: 5,     // 一度にこれだけ崩れたらスローモ
  slowDur: 0.7, slowScale: 0.25,
  lastMax: 1.6, lastSlow: 0.4,   // ラストワン演出の長さと遅さ
  comboWindow: 4.0,     // 連鎖が続く時間(s)
  pullRange: 0.8,       // 引き寄せが届く距離(m)。これより遠い玉は引けない
  hitstopMinSpeed: 0.8, // ヒットストップを出す玉の最低速度(m/s)。静止接触では出さない
  impactMinSpeed: 1.0,  // 音・コンボを出す最低速度(m/s)。落ち着き際のゆっくりした揺れは無視（本当の衝突は数m/s）
};

/* ============================================================
   2. Three.js 基本
   ============================================================ */
const canvas = $("view");
let renderer = null;
function init3D(){
  if(renderer) return;
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:"high-performance" });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.xr.enabled = true;
  // XRの描画解像度を少し下げて軽くする（塊を投げて崩すゲームなので鮮明さより滑らかさ優先。ボケたら上げる）
  if(renderer.xr.setFramebufferScaleFactor) renderer.xr.setFramebufferScaleFactor(0.85);
  renderer.setAnimationLoop(renderLoop);
}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x483828, 1.0));
const dirLight = new THREE.DirectionalLight(0xfff0dc, 1.1); dirLight.position.set(1, 2.2, 1.2); scene.add(dirLight);

// 使い回すスクラッチ（毎フレーム new しない）
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _m1 = new THREE.Matrix4();

// 素材（1回だけ作って共有）。Lambert=モバイルGPUで軽い（PBRのStandardより安い）。見た目はほぼ同じ
const woodMat = new THREE.MeshLambertMaterial({ color:0xd8a25a });
const lastMat = new THREE.MeshLambertMaterial({ color:0xffe08a, emissive:0xff8a00, emissiveIntensity:0.9 });
const ballMat = new THREE.MeshLambertMaterial({ color:0xffb454, emissive:0x6a3a00, emissiveIntensity:0.55 });
const ballMatCrit = new THREE.MeshLambertMaterial({ color:0xffe08a, emissive:0xffb020, emissiveIntensity:1.1 });
const ballGeo = new THREE.SphereGeometry(0.04, 16, 12);   // 玉のポリゴンを控えめに

// ブロックは全部まとめて1回で描く（InstancedMesh）＝何個でもドローコール1。
// 単位立方体を各インスタンスの行列で「位置×回転×寸法」に変形（向きの違いも寸法scaleで吸収）
const MAX_BLOCKS = 120;
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const blockInst = new THREE.InstancedMesh(boxGeo, woodMat, MAX_BLOCKS);
blockInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
blockInst.count = 0;
blockInst.frustumCulled = false;
scene.add(blockInst);
blockInst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX_BLOCKS*3).fill(1), 3);
const _col0 = new THREE.Color(1, 1, 1);              // 通常（＝woodの素の色）
const _colHi = new THREE.Color(1.6, 1.2, 0.45);      // ラストワン強調（>1で明るく光る）
const _sclV = new THREE.Vector3();

/* ============================================================
   3. 物理（Rapier）
   ============================================================ */
let world = null, eventQueue = null, rapierReady = false;
const FIXED = 1/60;
let physAcc = 0, timeScale = 1;
const handleToObj = new Map();
const blocks = [];
const balls = [];

// --- 時間演出（ヒットストップ・スローモ・ラストワンを1本化。互いに喧嘩しない） ---
let hitstopT = 0, bigSlowT = 0, lastOneActive = false, lastOneT = 0;
function updateTimeEffects(dt){
  if(hitstopT > 0) hitstopT -= dt;
  if(bigSlowT > 0) bigSlowT -= dt;
  if(lastOneActive){ lastOneT -= dt; if(lastOneT <= 0) endLastOne(); }
  timeScale = (hitstopT > 0) ? 0
    : Math.min(bigSlowT > 0 ? TUNE.slowScale : 1, lastOneActive ? TUNE.lastSlow : 1);
}

async function initRapier(){
  try{
    log("物理エンジンを読み込み中…（数MBあります）");
    await RAPIER.init();
    world = new RAPIER.World({ x:0, y:-9.81, z:0 });
    world.timestep = FIXED;
    eventQueue = new RAPIER.EventQueue(true);
    rapierReady = true;
    checkpoint("rapier", "物理エンジンOK");
    tryEnableButton();
  }catch(e){
    showErr("物理エンジンの読み込みに失敗しました：" + (e && e.message ? e.message : e));
  }
}

/* --- 見えない舞台＋塔 --- */
let stagePlaced = false, stageTopY = 0, stageCx = 0, stageCz = 0;
let tableBody = null, towerStartT = 0;

function setupStage(cx, topY, cz){
  clearAll();
  stageCx = cx; stageCz = cz; stageTopY = topY; stagePlaced = true;
  const tDesc = RAPIER.RigidBodyDesc.fixed().setTranslation(cx, topY - 0.02, cz);
  tableBody = world.createRigidBody(tDesc);
  const tc = RAPIER.ColliderDesc.cylinder(0.02, 0.75).setFriction(0.95).setRestitution(0.1);
  world.createCollider(tc, tableBody);
  spawnTower(cx, topY, cz);
}

// 塔の形を3種類つくる（毎回ランダム）。{x,y,z,ax=長辺がX向きか}
function buildLayout(kind, cx, topY, cz){
  const out = [];
  if(kind === "pyramid"){
    for(let layer=0; layer<8; layer++){           // 大きいピラミッド（8+7+…+1=36本）
      const n = 8 - layer, y = topY + 0.025 + layer*0.05;
      for(let k=0;k<n;k++){ out.push({ x:cx, y, z: cz + (k-(n-1)/2)*0.052, ax:true }); }
    }
  } else if(kind === "wall"){
    for(let layer=0; layer<8; layer++){           // 高い壁（8段×6本=48本）
      const y = topY + 0.025 + layer*0.05, shift = (layer%2)?0.026:0;
      for(let k=0;k<6;k++){ out.push({ x:cx, y, z: cz + (k-2.5)*0.052 + shift, ax:true }); }
    }
  } else { // jenga（既定）
    const off = [-0.05, 0, 0.05];
    for(let layer=0; layer<TUNE.towerLayers; layer++){
      const y = topY + 0.025 + layer*0.05, ax = (layer % 2 === 0);
      for(let k=0;k<3;k++){ out.push({ x: ax?cx:cx+off[k], y, z: ax?cz+off[k]:cz, ax }); }
    }
  }
  return out;
}

function spawnTower(cx, topY, cz){
  const kinds = ["jenga","pyramid","wall"];
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  const layout = buildLayout(kind, cx, topY, cz);
  layout.forEach((p, idx) => {
    // 減衰を入れて、生えた直後の微振動をすぐ落ち着かせる（高い塔の自壊防止）。当てられた時は普通に飛ぶ
    const rb = RAPIER.RigidBodyDesc.dynamic().setTranslation(p.x, p.y, p.z)
      .setLinearDamping(0.2).setAngularDamping(0.4);
    const body = world.createRigidBody(rb);
    const hx = p.ax ? 0.075 : 0.025, hz = p.ax ? 0.025 : 0.075;
    const cd = RAPIER.ColliderDesc.cuboid(hx, 0.025, hz)
      .setDensity(TUNE.blockDensity).setRestitution(TUNE.restitution).setFriction(TUNE.friction)
      .setActiveEvents(RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS)
      .setContactForceEventThreshold(TUNE.forceThreshold);
    const col = world.createCollider(cd, body);
    // mesh は持たず InstancedMesh の idx 番を使う。dimX/Y/Z は箱の実寸（＝当たり判定の2倍）
    const b = { body, colHandle: col.handle, idx, dimX: hx*2, dimY: 0.05, dimZ: hz*2,
                ox:p.x, oy:p.y, oz:p.z, down:false, lastSnd:0, growDelay: idx*0.018 };
    handleToObj.set(col.handle, { kind:"block", ref:b });
    blocks.push(b);
    blockInst.setColorAt(idx, _col0);   // 前の塔の強調色が残らないよう白に戻す
  });
  blockInst.count = blocks.length;
  if(blockInst.instanceColor) blockInst.instanceColor.needsUpdate = true;
  standing = blocks.length;
  growT = 0; towerAge = 0; settled = false; lastOneDone = false; towerStartT = performance.now()/1000;
  checkpoint("tower", "塔が生えた（" + kind + " / " + blocks.length + "本）");
}

/* --- 玉：dynamic な玉の物理ボディを作る共通部品 --- */
function makeDynamicBallBody(px, py, pz, vx, vy, vz, radius){
  const rb = RAPIER.RigidBodyDesc.dynamic().setTranslation(px, py, pz).setCcdEnabled(true)
    .setLinvel(vx, vy, vz);
  const body = world.createRigidBody(rb);
  const cd = RAPIER.ColliderDesc.ball(radius).setDensity(TUNE.ballDensity)
    .setRestitution(0.35).setFriction(0.6)
    .setActiveEvents(RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS)
    .setContactForceEventThreshold(TUNE.forceThreshold);
  const col = world.createCollider(cd, body);
  return { body, col };
}
function makeBallMesh(){ const m = new THREE.Mesh(ballGeo, ballMat); scene.add(m); return m; }
function rollCrit(){ return critForce || Math.random() < TUNE.critChance; }

// 握ると手に湧く（kinematic）
function spawnHeldBall(owner, pos){
  if(heldByController[owner]) removeBall(heldByController[owner]);
  while(balls.length >= 3){
    const victim = balls.find(x => !x.held);
    if(!victim) break;
    removeBall(victim);
  }
  const mesh = makeBallMesh();
  mesh.position.copy(pos);
  const rb = RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(pos.x, pos.y, pos.z);
  const body = world.createRigidBody(rb);
  const cd = RAPIER.ColliderDesc.ball(0.04).setFriction(0.6)
    .setActiveEvents(RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS)
    .setContactForceEventThreshold(TUNE.forceThreshold);
  const col = world.createCollider(cd, body);
  const hist = []; for(let i=0;i<10;i++) hist.push({t:0,x:0,y:0,z:0});
  const b = { mesh, body, colHandle: col.handle, held:true, owner, kinematic:true, crit:false,
              charge:1, heldSince: performance.now()/1000, lastChargePulse:0, hist, hlen:0, hi:0 };
  handleToObj.set(col.handle, { kind:"ball", ref:b });
  balls.push(b);
  playPop();
  pulse(owner, TUNE.hapSpawn, 30);
  return b;
}

function pushHist(b, x, y, z, now){
  const s = b.hist[b.hi]; s.t=now; s.x=x; s.y=y; s.z=z;
  b.hi = (b.hi+1) % b.hist.length;
  if(b.hlen < b.hist.length) b.hlen++;
}

function throwBall(b, now){
  if(!b || !b.held || balls.indexOf(b) < 0) return;
  const px = b.mesh.position.x, py = b.mesh.position.y, pz = b.mesh.position.z;
  let best = null, bestDt = 0;
  for(let i=0;i<b.hlen;i++){
    const s = b.hist[i]; const dt = now - s.t;
    if(dt > 0.02 && dt < 0.25){ if(!best || Math.abs(dt-0.1) < Math.abs(bestDt-0.1)){ best=s; bestDt=dt; } }
  }
  let vx=0, vy=0, vz=0;
  if(best && bestDt > 0.001){
    vx = (px-best.x)/bestDt * TUNE.throwMul;
    vy = (py-best.y)/bestDt * TUNE.throwMul;
    vz = (pz-best.z)/bestDt * TUNE.throwMul;
    const sp = Math.hypot(vx,vy,vz);
    if(sp > TUNE.throwMax){ const s = TUNE.throwMax/sp; vx*=s; vy*=s; vz*=s; }
  }
  const crit = rollCrit();
  const scaleMul = (b.charge || 1) * (crit ? TUNE.critScale : 1);
  // kinematic を消して dynamic を作り直す（型変換に頼らない安全策）
  handleToObj.delete(b.colHandle);
  world.removeRigidBody(b.body);
  const { body, col } = makeDynamicBallBody(px, py, pz, vx, vy, vz, 0.04*scaleMul);
  b.body = body; b.colHandle = col.handle; b.held = false; b.kinematic = false; b.crit = crit;
  b.mesh.scale.setScalar(scaleMul);
  b.mesh.material = crit ? ballMatCrit : ballMat;
  handleToObj.set(col.handle, { kind:"ball", ref:b });
  onThrown(b, crit);
}
function onThrown(b, crit){
  if(crit){ playCrit(); pulse(b.owner, 0.95, 90); flashBanner("会心！", "#ffd24a"); }
  else { playThrow(); pulse(b.owner, TUNE.hapThrow, 40); }
  checkpoint("throw", "玉を投げた");
}

function removeBall(b){
  // 握っている手の参照を必ず先に切る（消した玉を次フレームの手追従が触るとworldが壊れる）
  for(let i=0;i<heldByController.length;i++){ if(heldByController[i] === b) heldByController[i] = null; }
  b.held = false;
  handleToObj.delete(b.colHandle);
  if(b.body){ try{ world.removeRigidBody(b.body); }catch(_){} b.body = null; }
  scene.remove(b.mesh);
  const i = balls.indexOf(b); if(i>=0) balls.splice(i,1);
}

function clearBlocks(){
  for(const b of blocks){ handleToObj.delete(b.colHandle); try{ world.removeRigidBody(b.body); }catch(_){} }
  blocks.length = 0;
  blockInst.count = 0;              // インスタンスは描かなくなる（mesh削除は不要）
  while(balls.length) removeBall(balls[0]);
  standing = 0; lastOneActive = false; lastBlock = null;
}
function clearAll(){
  clearBlocks();
  if(tableBody){ try{ world.removeRigidBody(tableBody); }catch(_){} tableBody = null; }
}

/* --- 引き寄せ：空いた手のグリップで、一番近い転がった玉を手に呼ぶ --- */
function pullNearest(i){
  if(!controllers[i]) return false;
  controllers[i].getWorldPosition(_v1);
  let best=null, bd=TUNE.pullRange*TUNE.pullRange;   // 届く距離に上限。無ければ引けない（＝次の塔へ落ちる）
  for(const b of balls){
    if(b.held || !b.body) continue;
    const t = b.body.translation();
    const d = (t.x-_v1.x)**2 + (t.y-_v1.y)**2 + (t.z-_v1.z)**2;
    if(d < bd){ bd = d; best = b; }
  }
  if(!best) return false;
  const t = best.body.translation();
  handleToObj.delete(best.colHandle);
  world.removeRigidBody(best.body);
  const rb = RAPIER.RigidBodyDesc.kinematicPositionBased().setTranslation(t.x, t.y, t.z);
  const body = world.createRigidBody(rb);
  const cd = RAPIER.ColliderDesc.ball(0.04).setFriction(0.6)
    .setActiveEvents(RAPIER.ActiveEvents.CONTACT_FORCE_EVENTS)
    .setContactForceEventThreshold(TUNE.forceThreshold);
  const col = world.createCollider(cd, body);
  best.body = body; best.colHandle = col.handle; best.held = true; best.kinematic = true;
  best.owner = i; best.crit = false; best.charge = 1; best.heldSince = performance.now()/1000;
  best.lastChargePulse = 0; best.mesh.scale.setScalar(1); best.mesh.material = ballMat;
  if(!best.hist){ best.hist = []; for(let k=0;k<10;k++) best.hist.push({t:0,x:0,y:0,z:0}); }
  best.hlen = 0; best.hi = 0;
  handleToObj.set(col.handle, { kind:"ball", ref:best });
  heldByController[i] = best;
  playPop(); pulse(i, 0.3, 40);
  checkpoint("pull", "玉を引き寄せた");
  return true;
}

/* --- ゲーム進行 --- */
let standing = 0, growT = 0, towerAge = 0, settled = false, lastBlock = null, lastOneDone = false;
let phase = "idle", phaseT = 0;
// 連鎖・記録
let comboCount = 0, comboLast = 0, maxCombo = 0, totalDown = 0, bestClear = Infinity;
const penta = [261.63, 293.66, 329.63, 392.00, 440.00];

function stepPhysics(dtReal){
  if(!world || !stagePlaced) return;
  physAcc += Math.min(dtReal, 0.05) * timeScale;
  let n = 0;
  while(physAcc >= FIXED && n < 3){ world.step(eventQueue); physAcc -= FIXED; n++; }
  if(n === 3) physAcc = 0;
  if(n > 0) drainEvents();
}

let drainErrLogged = false;
// 剛体の速さ(m/s)。handleToObj に無いもの(台など)や body 無しは 0
function bodySpeed(o){
  if(o && o.ref && o.ref.body){ const lv = o.ref.body.linvel(); return Math.hypot(lv.x, lv.y, lv.z); }
  return 0;
}
function drainEvents(){
  try{
    eventQueue.drainContactForceEvents(ev => {
      const mag = ev.maxForceMagnitude ? ev.maxForceMagnitude() : 0;
      const strength = Math.min(1, mag / TUNE.forceRef);
      const o1 = handleToObj.get(ev.collider1());
      const o2 = handleToObj.get(ev.collider2());
      const nowMs = performance.now(), nowS = nowMs/1000;
      const blk = (o1 && o1.kind==="block") ? o1.ref : (o2 && o2.kind==="block") ? o2.ref : null;
      const ball = (o1 && o1.kind==="ball") ? o1.ref : (o2 && o2.kind==="ball") ? o2.ref : null;
      // 「実際に動いているもの」が絡んだ接触だけを叩きとして扱う。
      // 立っているだけの塔が自分の重みで出す接触（＝何もしないのにコンボが上がる・鳴る）を無視する
      const moving = Math.max(bodySpeed(o1), bodySpeed(o2)) > TUNE.impactMinSpeed;
      // 生え始めの落ち着くまでは、玉が絡まない自然な揺れ(自壊)では鳴らさない
      const settling = towerAge < TUNE.settleGrace;
      if(blk && moving && !(settling && !ball) && nowMs - blk.lastSnd > 70){
        blk.lastSnd = nowMs;
        playImpact(strength);
        // 音階コンボは「崩れる音」の飾り（おまけ）。目立つ表示はしない。
        // 叩くたび音が上がるのは残す＝崩壊の手ざわり。4秒空くとリセット
        if(nowS - comboLast > TUNE.comboWindow) comboCount = 0;
        comboCount++; comboLast = nowS;
        playComboNote(comboCount);
        if(comboCount > maxCombo){ maxCombo = comboCount; }
      }
      // 自分の投げた玉がブロックに当たった：振動＋ヒットストップ
      if(ball && blk && !ball.held && strength > 0.15){
        pulse(ball.owner, TUNE.hapHit * (0.4+0.6*strength), 60);
        // ヒットストップは「動いている玉が当たった瞬間」だけ。瓦礫の上で静止した重い玉が
        // 毎ステップ接触力を出して時間が止まりっぱなしになるのを防ぐ
        if(strength > 0.3 && ball.body){
          const lv = ball.body.linvel();
          if(lv.x*lv.x + lv.y*lv.y + lv.z*lv.z > TUNE.hitstopMinSpeed*TUNE.hitstopMinSpeed)
            hitstopT = Math.max(hitstopT, ball.crit ? TUNE.hitstopCrit : TUNE.hitstop);
        }
        checkpoint("hit", "玉が塔に当たった");
      }
    });
  }catch(e){
    if(!drainErrLogged){ drainErrLogged = true; showErr("衝突イベントの読み取りに失敗：" + (e && e.message || e)); }
  }
}

function syncMeshes(){
  const sinking = (phase === "sinking");
  const sinkK = sinking ? Math.min(1, phaseT/0.6) : 0;
  for(const b of blocks){
    const t = b.body.translation(), r = b.body.rotation();
    _q1.set(r.x, r.y, r.z, r.w);
    if(sinking){
      _v1.set(t.x, t.y - phaseT*0.5, t.z);           // 沈める
      const s = Math.max(0.001, 1 - sinkK);          // 縮めて消す
      _sclV.set(b.dimX*s, b.dimY*s, b.dimZ*s);
    }else{
      _v1.set(t.x, t.y, t.z);
      let gy = 1;                                     // にょき演出：下から伸びる
      if(growT < 1.2 && !b.down) gy = Math.max(0.001, Math.min(1, (growT - b.growDelay)/0.3));
      _sclV.set(b.dimX, b.dimY*gy, b.dimZ);
    }
    _m1.compose(_v1, _q1, _sclV);
    blockInst.setMatrixAt(b.idx, _m1);
  }
  if(blocks.length) blockInst.instanceMatrix.needsUpdate = true;
  for(const b of balls){
    if(b.held || !b.body) continue;
    const t = b.body.translation(), r = b.body.rotation();
    b.mesh.position.set(t.x, t.y, t.z);
    b.mesh.quaternion.set(r.x, r.y, r.z, r.w);
  }
}

function startLastOne(){
  lastOneActive = true; lastOneDone = true; lastOneT = TUNE.lastMax;
  lastBlock = blocks.find(b => !b.down) || null;
  if(lastBlock){ blockInst.setColorAt(lastBlock.idx, _colHi); blockInst.instanceColor.needsUpdate = true; }
}
function endLastOne(){
  lastOneActive = false;
  if(lastBlock){ blockInst.setColorAt(lastBlock.idx, _col0); blockInst.instanceColor.needsUpdate = true; }
  lastBlock = null;
}

function checkCollapse(){
  if(phase !== "playing") return;
  if(towerAge < TUNE.settleGrace) return;   // 生えて落ち着くまでは崩れ判定しない
  // 落ち着いた瞬間、各ブロックの「今の位置」を基準に取り直す。
  // これで生えるときに少しズレたブロックも「立っている」扱いになり、投げて動かした時だけ崩れとみなす
  if(!settled){
    settled = true;
    for(const b of blocks){ if(!b.down){ const t=b.body.translation(); b.ox=t.x; b.oy=t.y; b.oz=t.z; } }
  }
  const prevStanding = standing;
  let fell = 0;
  for(const b of blocks){
    if(b.down) continue;
    const t = b.body.translation();
    const dx=t.x-b.ox, dy=t.y-b.oy, dz=t.z-b.oz;
    if(dx*dx+dy*dy+dz*dz > TUNE.collapseDist*TUNE.collapseDist || t.y < stageTopY - 0.05){
      b.down = true; standing--; fell++; totalDown++;
    }
  }
  if(fell >= TUNE.slowThreshold) bigSlowT = Math.max(bigSlowT, TUNE.slowDur);
  if(!lastOneDone && prevStanding >= 2 && standing === 1) startLastOne();
  if(standing <= 0 && blocks.length){
    if(lastOneActive) endLastOne();
    phase = "cleared"; phaseT = 0;
    onCleared(true);              // 本当に崩し切った＝記録対象
  }
}

function onCleared(isRealClear){
  playClear();
  pulseAll(TUNE.hapClear, 150);
  // 「最速クリア」記録は、実際に崩し切った時だけ更新する。
  // グリップ等での塔スキップ(isRealClear=false)では記録も演出も出さない（記録汚染防止）。
  if(isRealClear){
    const clearTime = performance.now()/1000 - towerStartT;
    if(clearTime < bestClear && clearTime > 0.05){
      bestClear = clearTime;
      flashBanner("きろく更新！", "#ffd24a");
      playFanfare();
    }
    checkpoint("clear", "塔を全部崩した（全壊）");
  }
  saveRecords();   // 最高れんさ・崩した数は常に保存
}

function advancePhase(dt){
  if(phase === "cleared"){
    phaseT += dt;
    if(phaseT >= 2.0){ phase = "sinking"; phaseT = 0; }
  }else if(phase === "sinking"){
    phaseT += dt;
    const k = Math.min(1, phaseT/0.6);
    for(const b of balls){ b.mesh.visible = (k < 1); }   // 玉を消す（ブロックは syncMeshes で沈めて縮める）
    if(phaseT >= 0.6 + 0.5){
      clearBlocks();
      spawnTower(stageCx, stageTopY, stageCz);
      phase = "playing"; phaseT = 0;
    }
  }
}

function forceNextTower(){
  if(!stagePlaced) return;
  if(phase === "playing"){
    for(const b of blocks){ b.down = true; } standing = 0;
    if(lastOneActive) endLastOne();
    phase = "cleared"; phaseT = 0; onCleared(false);   // スキップ＝記録には残さない
  }
}

/* ============================================================
   4. 音（ブラウザ内合成。しょぼければ段階3で素材へ差し替え）
   ============================================================ */
let actx = null, noiseBuf = null, voices = 0;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    const n = actx.sampleRate * 0.3; noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  }
  if(actx && actx.state === "suspended") actx.resume();
}
function playImpact(strength){
  if(!actx || !noiseBuf || voices >= 8) return;
  const now = actx.currentTime, vol = Math.min(0.5, 0.05 + strength*0.5), dur = 0.09;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 900*(0.9+Math.random()*0.2); bp.Q.value = 0.9;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  src.connect(bp).connect(g).connect(actx.destination);
  voices++; src.onended = ()=>{ voices--; };
  src.start(now); src.stop(now+dur);
  const o = actx.createOscillator(); o.type="sine"; o.frequency.value = 150*(0.9+Math.random()*0.2);
  const g2 = actx.createGain(); g2.gain.setValueAtTime(vol*0.7, now); g2.gain.exponentialRampToValueAtTime(0.0001, now+0.12);
  o.connect(g2).connect(actx.destination); o.start(now); o.stop(now+0.12);
}
function playComboNote(combo){
  if(!actx) return;
  const idx = (combo-1) % penta.length, oct = Math.min(2, Math.floor((combo-1)/penta.length));
  const f = penta[idx] * Math.pow(2, oct), now = actx.currentTime;
  const o = actx.createOscillator(); o.type="triangle"; o.frequency.value = f;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(0.15, now+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now+0.18);
  o.connect(g).connect(actx.destination); o.start(now); o.stop(now+0.2);
}
function playPop(){
  if(!actx) return; const now = actx.currentTime;
  const o = actx.createOscillator(); o.type="triangle";
  o.frequency.setValueAtTime(500, now); o.frequency.exponentialRampToValueAtTime(900, now+0.08);
  const g = actx.createGain(); g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.0001, now+0.1);
  o.connect(g).connect(actx.destination); o.start(now); o.stop(now+0.1);
}
function playThrow(){
  if(!actx || !noiseBuf) return; const now = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type="highpass"; bp.frequency.value=1400;
  const g = actx.createGain(); g.gain.setValueAtTime(0.14, now); g.gain.exponentialRampToValueAtTime(0.0001, now+0.14);
  src.connect(bp).connect(g).connect(actx.destination); src.start(now); src.stop(now+0.14);
}
function playCrit(){
  if(!actx) return; const now = actx.currentTime;
  const o = actx.createOscillator(); o.type="sawtooth";
  o.frequency.setValueAtTime(220, now); o.frequency.exponentialRampToValueAtTime(1300, now+0.13);
  const g = actx.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.0001, now+0.2);
  o.connect(g).connect(actx.destination); o.start(now); o.stop(now+0.22);
  const o2 = actx.createOscillator(); o2.type="sine"; o2.frequency.value=80;
  const g2 = actx.createGain(); g2.gain.setValueAtTime(0.4, now); g2.gain.exponentialRampToValueAtTime(0.0001, now+0.25);
  o2.connect(g2).connect(actx.destination); o2.start(now); o2.stop(now+0.25);
}
function playClear(){
  if(!actx) return; const now = actx.currentTime;
  const o = actx.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(90, now); o.frequency.exponentialRampToValueAtTime(45, now+0.5);
  const g = actx.createGain(); g.gain.setValueAtTime(0.5, now); g.gain.exponentialRampToValueAtTime(0.0001, now+0.6);
  o.connect(g).connect(actx.destination); o.start(now); o.stop(now+0.6);
  [523,659,784].forEach((f,i)=>{
    const t = now + 0.05 + i*0.09;
    const oo = actx.createOscillator(); oo.type="triangle"; oo.frequency.value=f;
    const gg = actx.createGain(); gg.gain.setValueAtTime(0.0001,t); gg.gain.linearRampToValueAtTime(0.22,t+0.02); gg.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    oo.connect(gg).connect(actx.destination); oo.start(t); oo.stop(t+0.24);
  });
}
function playFanfare(){
  if(!actx) return; const now = actx.currentTime;
  [523,659,784,1046].forEach((f,i)=>{
    const t = now + i*0.08;
    const o = actx.createOscillator(); o.type="square"; o.frequency.value=f;
    const g = actx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.28);
  });
}

   5. 振動

const gamepads = [null, null];
function pulse(i, intensity, ms){
  try{
    const gp = gamepads[i];
    const a = gp && gp.hapticActuators && gp.hapticActuators[0];
    if(a && a.pulse) a.pulse(Math.max(0, Math.min(1,intensity)), ms);
  }catch(_){}
}
function pulseAll(intensity, ms){ pulse(0,intensity,ms); pulse(1,intensity,ms); }

/* ============================================================
   記録（localStorage。消える可能性は開始画面に明記）
   ============================================================ */
function loadRecords(){
  try{
    const r = JSON.parse(localStorage.getItem("kuzushi.v2") || "{}");
    maxCombo = r.maxCombo || 0; totalDown = r.totalDown || 0;
    bestClear = (r.bestClear && r.bestClear > 0) ? r.bestClear : Infinity;
  }catch(_){}
  updateBestText();
}
function saveRecords(){
  try{
    localStorage.setItem("kuzushi.v2", JSON.stringify({
      maxCombo, totalDown, bestClear: isFinite(bestClear) ? +bestClear.toFixed(2) : 0
    }));
  }catch(_){}
  updateBestText();
}
function updateBestText(){
  const bc = isFinite(bestClear) ? bestClear.toFixed(1) + "秒" : "—";
  $("best").innerHTML = '<span class="lbl">これまで</span> 最高れんさ ' + maxCombo +
    ' ／ 最速クリア ' + bc + ' ／ 崩した数 ' + totalDown +
    '<br><span class="lbl" style="font-size:11px">（記録はこの端末に保存。ブラウザのデータ削除で消えます）</span>';
}

/* ============================================================
   6. AR：セッション・hit-test・コントローラ
   ============================================================ */
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.07, 0.11, 40).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.95 })
);
reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

const controllers = [];
const heldByController = [null, null];
function setupControllers(){
  if(controllers.length) return;
  for(let i=0;i<2;i++){
    const c = renderer.xr.getController(i);
    c.userData.index = i;
    c.addEventListener("connected", e => { if(e.data && e.data.gamepad) gamepads[i] = e.data.gamepad; });
    c.addEventListener("disconnected", () => { gamepads[i] = null; if(heldByController[i]) removeBall(heldByController[i]); heldByController[i] = null; });
    c.addEventListener("selectstart", () => onSelectStart(i));
    c.addEventListener("selectend", () => onSelectEnd(i));
    c.addEventListener("squeezestart", () => onSqueezeStart(i));
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 10),
      new THREE.MeshBasicMaterial({ color:0xffd79a }));
    c.add(tip);
    scene.add(c);
    controllers.push(c);
  }
}
function onSelectStart(i){
  ensureAudio();
  if(!stagePlaced){
    if(!reticle.visible){ log("床か机の白い輪がまだ出ていません。少し見回してください"); return; }
    reticle.matrix.decompose(_v1, _q1, _v2);
    setupStage(_v1.x, _v1.y, _v1.z);
    phase = "playing";
    checkpoint("stage", "舞台を置いた（土台OK）");
    return;
  }
  // 既に玉を持っている（引き寄せた玉など）なら差し替えず、その玉をそのまま投げられるようにする
  if(heldByController[i] && heldByController[i].held) return;
  controllers[i].getWorldPosition(_v3);
  heldByController[i] = spawnHeldBall(i, _v3);
}
function onSelectEnd(i){
  const b = heldByController[i];
  if(b && b.held){ throwBall(b, performance.now()/1000); }
  heldByController[i] = null;
}
function onSqueezeStart(i){
  ensureAudio();
  if(!stagePlaced) return;
  if(heldByController[i]) return;   // 玉を持っている手のグリップは何もしない（投げ構え中の誤爆で塔が消えるのを防ぐ）
  if(pullNearest(i)) return;        // 近く（pullRange以内）に玉があれば引き寄せ
  forceNextTower();                 // 引き寄せる玉が無ければ次の塔へ
}

let xrSession = null, hitSource = null, hitReq = false, hitTries = 0, pendingPanel = false, arStarting = false;
async function startAR(){
  if(xrSession){ xrSession.end(); return; }
  if(arStarting) return;
  if(!navigator.xr){ showErr("このブラウザはMR（AR）に対応していません。Quest 3のブラウザで開いてください。"); return; }
  if(!rapierReady){ showErr("物理エンジンの準備がまだです。数秒待って、もう一度押してください。"); return; }
  init3D(); ensureAudio();
  arStarting = true;
  $("goBtn").disabled = true;
  let session = null;
  try{
    log("ARを開始します…");
    session = await navigator.xr.requestSession("immersive-ar", {
      requiredFeatures: ["hit-test"], optionalFeatures: ["local-floor"],
    });
    xrSession = session;
    renderer.xr.setReferenceSpaceType("local");
    await renderer.xr.setSession(session);
    scene.background = null;
    setupControllers();
    hitSource = null; hitReq = false; hitTries = 0; stagePlaced = false; phase = "idle"; clearAll();
    heldByController[0] = heldByController[1] = null;
    $("start").style.display = "none"; $("goBtn").textContent = "AR中…";
    $("stats").style.display = "block";
    checkpoint("ar", "AR開始OK（土台の起動に成功）");
    log("白い輪が出たら、机か床でトリガーを引いて塔を出してください");
    pendingPanel = true;
    session.addEventListener("end", ()=>{
      saveRecords();                 // 終了時に記録を確実に保存
      xrSession = null; hitSource = null; hitReq = false;
      heldByController[0] = heldByController[1] = null;
      scene.background = null; reticle.visible = false; panel.visible = false; banner3D.visible = false;
      $("start").style.display = "flex"; $("goBtn").textContent = "もう一度ためす"; $("goBtn").disabled = false;
      log("ARを終了しました");
    });
  }catch(e){
    showErr("AR開始に失敗しました：" + (e && e.message ? e.message : e));
    log("ヒント：Quest 3のブラウザでURLを開いてから「はじめる」を押してください");
    try{ session && session.end(); }catch(_){}
    if(xrSession === session) xrSession = null;
    $("goBtn").disabled = false; $("goBtn").textContent = "もう一度ためす";
  }finally{
    arStarting = false;
  }
}

/* --- AR中に読める3Dパネル（fps・物理時間・記録） --- */
const panelCanvas = document.createElement("canvas");
panelCanvas.width = 640; panelCanvas.height = 360;
const pctx = panelCanvas.getContext("2d");
const panelTex = new THREE.CanvasTexture(panelCanvas); panelTex.colorSpace = THREE.SRGBColorSpace;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.28),
  new THREE.MeshBasicMaterial({ map: panelTex, transparent:true }));
panel.visible = false; scene.add(panel);
let panelStatus = "";
function drawPanel(){
  const c = pctx, W = panelCanvas.width, H = panelCanvas.height;
  c.clearRect(0,0,W,H); c.fillStyle = "rgba(12,8,5,0.9)"; c.fillRect(0,0,W,H);
  c.strokeStyle = "#3a2c20"; c.lineWidth = 4; c.strokeRect(2,2,W-4,H-4);
  c.textBaseline = "top";
  c.font = "bold 20px 'Consolas','Courier New',monospace"; c.fillStyle = "#ffd79a";
  c.fillText(panelStatus, 12, 10);
  c.font = "17px 'Consolas','Courier New',monospace";
  const last = logLines.slice(-11); let y = 42;
  for(const ln of last){
    c.fillStyle = ln.e ? "#ff9a9a" : "#dff5e8";
    let t = ln.t; if(t.length > 44) t = t.slice(0,43)+"…";
    c.fillText(t, 12, y); y += 27;
  }
  panelTex.needsUpdate = true;
}
function placeInFront(mesh, dist, dy){
  const camN = renderer.xr.getCamera();
  camN.getWorldPosition(_v1); camN.getWorldQuaternion(_q1);
  _v2.set(0,0,-1).applyQuaternion(_q1); _v2.y = 0;
  if(_v2.lengthSq() < 1e-6) _v2.set(0,0,-1); else _v2.normalize();
  mesh.position.set(_v1.x + _v2.x*dist, _v1.y + dy, _v1.z + _v2.z*dist);
  mesh.lookAt(_v1.x, _v1.y + dy, _v1.z);
}

/* --- まん中の大きな演出テキスト（DOM＋AR中は3Dバナー） --- */
let bannerT = 0;
const bannerCanvas = document.createElement("canvas");
bannerCanvas.width = 512; bannerCanvas.height = 160;
const bctx = bannerCanvas.getContext("2d");
const bannerTex = new THREE.CanvasTexture(bannerCanvas); bannerTex.colorSpace = THREE.SRGBColorSpace;
const banner3D = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.156),
  new THREE.MeshBasicMaterial({ map: bannerTex, transparent:true }));
banner3D.visible = false; banner3D.renderOrder = 10; scene.add(banner3D);
function flashBanner(text, color){
  bannerT = 1.2;
  const el = $("banner"); el.textContent = text; el.style.color = color || "#ffd24a"; el.style.opacity = "1";
  // 3D
  const c = bctx, W = bannerCanvas.width, H = bannerCanvas.height;
  c.clearRect(0,0,W,H);
  c.font = "900 88px 'Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif";
  c.textAlign = "center"; c.textBaseline = "middle";
  c.lineWidth = 10; c.strokeStyle = "rgba(0,0,0,0.7)"; c.strokeText(text, W/2, H/2);
  c.fillStyle = color || "#ffd24a"; c.fillText(text, W/2, H/2);
  bannerTex.needsUpdate = true;
  if(renderer && renderer.xr.isPresenting){ placeInFront(banner3D, 1.6, 0.15); banner3D.visible = true; }
}
function updateBanner(dt){
  if(bannerT > 0){
    bannerT -= dt;
    const op = Math.max(0, Math.min(1, bannerT/0.3));
    $("banner").style.opacity = String(op);
    banner3D.material.opacity = op;
    if(bannerT <= 0){ $("banner").style.opacity = "0"; banner3D.visible = false; }
  }
}

/* ============================================================
   7. PC確認モード
   ============================================================ */
let pcMode = false, pcYaw = 0.5, pcPitch = 0.5, pcRadius = 1.3;
const pcTarget = new THREE.Vector3(0, 0.15, 0);
function startPC(){
  if(!rapierReady){ showErr("物理エンジンの準備がまだです。数秒待ってください。"); return; }
  init3D(); ensureAudio();
  pcMode = true;
  $("start").style.display = "none"; $("stats").style.display = "block"; $("pchint").style.display = "block";
  setupStage(0, 0, 0); phase = "playing";
  checkpoint("stage", "舞台を置いた（PC確認モード）");
  updatePCCamera();
  setupPCInput();
}
function updatePCCamera(){
  const cp2 = Math.cos(pcPitch), sp2 = Math.sin(pcPitch);
  camera.position.set(
    pcTarget.x + pcRadius*cp2*Math.sin(pcYaw),
    pcTarget.y + pcRadius*sp2,
    pcTarget.z + pcRadius*cp2*Math.cos(pcYaw)
  );
  camera.lookAt(pcTarget);
}
let pcInputReady = false;
function setupPCInput(){
  if(pcInputReady) return; pcInputReady = true;
  let dragging = false, moved = 0, lx = 0, ly = 0;
  canvas.addEventListener("pointerdown", e => { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; });
  addEventListener("pointermove", e => {
    if(!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    pcYaw -= dx*0.008; pcPitch = Math.max(-0.2, Math.min(1.3, pcPitch + dy*0.006));
    updatePCCamera();
  });
  addEventListener("pointerup", e => {
    if(dragging && moved < 6) pcShootAt(e.clientX, e.clientY);
    dragging = false;
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    pcRadius = Math.max(0.5, Math.min(3, pcRadius + (e.deltaY>0?0.1:-0.1)));
    updatePCCamera();
  }, { passive:false });
  addEventListener("keydown", e => { if(e.key==="r" || e.key==="R") forceNextTower(); });
}
const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
function pcShootAt(sx, sy){
  ensureAudio();
  _ndc.set((sx/innerWidth)*2-1, -(sy/innerHeight)*2+1);
  _ray.setFromCamera(_ndc, camera);
  _plane.set(new THREE.Vector3(0,0,1), -pcTarget.z);
  const hit = _ray.ray.intersectPlane(_plane, _v1);
  const aim = hit ? _v1 : _v2.copy(pcTarget);
  _v2.copy(aim).sub(camera.position).normalize().multiplyScalar(6.0);
  pcSpawnThrown(camera.position, _v2);
}
function pcSpawnThrown(pos, vel){
  while(balls.length >= 3){ const v = balls.find(x=>!x.held); if(!v) break; removeBall(v); }
  const crit = rollCrit();
  const scaleMul = crit ? TUNE.critScale : 1;
  const mesh = makeBallMesh(); mesh.position.copy(pos); mesh.scale.setScalar(scaleMul);
  mesh.material = crit ? ballMatCrit : ballMat;
  const { body, col } = makeDynamicBallBody(pos.x,pos.y,pos.z, vel.x,vel.y,vel.z, 0.04*scaleMul);
  const b = { mesh, body, colHandle: col.handle, held:false, owner:0, kinematic:false, crit };
  handleToObj.set(col.handle, { kind:"ball", ref:b });
  balls.push(b);
  onThrown(b, crit);
}

/* ============================================================
   8. ボタン有効化
   ============================================================ */
let arSupported = false;
$("goBtn").addEventListener("click", () => { if(arSupported) startAR(); else startPC(); });
function tryEnableButton(){
  if(!rapierReady) return;
  if(arSupported){ $("goBtn").disabled = false; $("goBtn").textContent = "はじめる"; log("準備OK。「はじめる」を押せます"); }
  else { $("goBtn").disabled = false; $("goBtn").textContent = "PCでためす（マウス）"; }
}
if(navigator.xr && navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported("immersive-ar").then(ok=>{
    arSupported = !!ok;
    if(!ok) log("この端末はMR非対応です。PC確認モードで動きだけ試せます（手応え・見え方はQuestで確認）");
    tryEnableButton();
  }).catch(()=>{ arSupported = false; tryEnableButton(); });
}else{
  log("このブラウザはWebXR非対応。PC確認モードで動きだけ試せます");
  tryEnableButton();
}

/* ============================================================
   9. 毎フレーム
   ============================================================ */
let lastMs = performance.now(), fpsSmooth = 0, physMs = 0, loopErr = false, critForce = false, hudTick = 0;

function simulate(dt){
  updateTimeEffects(dt);
  // 塔が生えてからの経過と、にょき演出の進行（syncMeshesが行列に反映するので先に進める）
  if(stagePlaced && blocks.length){ towerAge += dt; if(growT < 1.2) growT += dt; }
  const p0 = performance.now();
  stepPhysics(dt);
  physMs = physMs*0.9 + (performance.now()-p0)*0.1;
  syncMeshes();
  checkCollapse();
  advancePhase(dt);
  updateBanner(dt);
  // 連鎖が途切れたら（4秒以上叩いていない）カウントを戻す
  if(comboCount > 0 && performance.now()/1000 - comboLast > TUNE.comboWindow) comboCount = 0;
  // ステータス表示は毎フレームでなく数フレームおきに更新（文字列生成とDOM書き込みを減らす）
  if((hudTick = (hudTick + 1) % 12) === 0){
    $("stats").textContent = "fps " + Math.round(fpsSmooth) + " / 物理 " + physMs.toFixed(1)
      + "ms / 立 " + Math.max(0,standing) + " / 玉 " + balls.length + " / れんさ " + comboCount;
    // 3Dパネルは「意味が変わったときだけ」再描画（fps/物理msを含めない＝毎フレームのテクスチャ再アップロードを避ける）
    const panelLine = "立 " + Math.max(0,standing) + " / 玉 " + balls.length + " / れんさ " + comboCount
      + " / fps " + (Math.round(fpsSmooth/5)*5);
    if(panelLine !== panelStatus){ panelStatus = panelLine; if(panel.visible) drawPanel(); }
  }
}

function renderLoop(t, frame){
 try{
  const nowMs = performance.now();
  const dt = Math.min((nowMs - lastMs)/1000, 0.05); lastMs = nowMs;
  fpsSmooth = fpsSmooth ? fpsSmooth*0.9 + (1/Math.max(dt,1e-4))*0.1 : 1/Math.max(dt,1e-4);

  if(frame && renderer.xr.isPresenting){
    const ref = renderer.xr.getReferenceSpace();
    const sess = renderer.xr.getSession();
    if(pendingPanel){ pendingPanel = false; placeInFront(panel, 1.4, -0.5); panel.visible = true; drawPanel(); }
    if(!hitSource && !hitReq && hitTries < 5){
      hitReq = true; hitTries++;
      if(sess.requestHitTestSource){
        sess.requestReferenceSpace("viewer")
          .then(vs => sess.requestHitTestSource({ space: vs })
            .then(src => { hitSource = src; })
            .catch(err => { hitReq = false; if(hitTries >= 5) showErr("床の検出を開始できません：" + (err && err.message || err)); }))
          .catch(err => { hitReq = false; if(hitTries >= 5) showErr("基準空間の取得に失敗：" + (err && err.message || err)); });
      }else{
        showErr("このブラウザは床の検出（hit-test）に対応していません。ブラウザを最新にしてください。");
      }
    }
    if(hitSource && !stagePlaced){
      const res = frame.getHitTestResults(hitSource);
      const pose = res.length ? res[0].getPose(ref) : null;
      if(pose){ reticle.visible = true; _m1.fromArray(pose.transform.matrix); reticle.matrix.copy(_m1); }
      else reticle.visible = false;
    }else reticle.visible = false;

    // 持っている玉を手に追従＋溜め
    for(let i=0;i<2;i++){
      const b = heldByController[i];
      if(b && b.held && b.body){
        controllers[i].getWorldPosition(_v1);
        b.mesh.position.copy(_v1);
        b.body.setNextKinematicTranslation(_v1);   // _v1(Vector3)を直接渡す＝毎フレームnewしない
        pushHist(b, _v1.x, _v1.y, _v1.z, nowMs/1000);
        // 溜め撃ち：長く握るほど玉が育ち、振動が強くなる
        const hold = nowMs/1000 - b.heldSince;
        if(hold > TUNE.chargeDelay){
          b.charge = Math.min(TUNE.chargeMax, 1 + (hold-TUNE.chargeDelay)/TUNE.chargeTime*(TUNE.chargeMax-1));
          b.mesh.scale.setScalar(b.charge);
          if(nowMs - b.lastChargePulse > 130){ b.lastChargePulse = nowMs; pulse(i, 0.12*b.charge, 20); }
        }
      }
    }
  }

  simulate(dt);
  renderer.render(scene, camera);
 }catch(err){
  if(!loopErr){ loopErr = true; showErr("描画エラー：" + (err && err.message || err)); }
 }
}

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  if(renderer) renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   10. 自動テスト用の窓口（PCで preview から叩ける）
   ============================================================ */
window.__dbg = {
  state(){ return { rapierReady, stagePlaced, phase, standing, blocks: blocks.length, balls: balls.length,
    combo: comboCount, maxCombo, totalDown, bestClear: isFinite(bestClear)?+bestClear.toFixed(2):null,
    timeScale: +timeScale.toFixed(3), fps: Math.round(fpsSmooth), physMs: +physMs.toFixed(2), cp: {...cp} }; },
  shoot(vx, vy, vz){ if(!stagePlaced) return "no-stage"; pcSpawnThrown(camera.position, new THREE.Vector3(vx||0, vy||0, vz||-6)); return "ok"; },
  blast(){
    if(!stagePlaced) return "no-stage";
    const from = new THREE.Vector3(stageCx, stageTopY+0.15, stageCz+1.0);
    pcSpawnThrown(from, new THREE.Vector3(0, 0, -9)); return "ok";
  },
  crit(on){ critForce = (on !== false); return "critForce=" + critForce; },
  nextTower(){ forceNextTower(); return "ok"; },
  tick(seconds){ const n = Math.round((seconds||1)/FIXED); for(let i=0;i<n;i++) simulate(FIXED); return this.state(); },
  render(){ if(renderer) renderer.render(scene, camera); return "ok"; },
  // 描画(InstancedMesh)の行列が物理ボディと一致しているか確認（見た目のズレ検出）
  blockCheck(){
    if(!blocks.length) return "no-blocks";
    const b = blocks[Math.floor(blocks.length/2)];
    const m = new THREE.Matrix4(); blockInst.getMatrixAt(b.idx, m);
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
    m.decompose(p, q, sc);
    const t = b.body.translation();
    return { count: blockInst.count, colorBufOK: !!blockInst.instanceColor,
      instPos:[+p.x.toFixed(3),+p.y.toFixed(3),+p.z.toFixed(3)], bodyPos:[+t.x.toFixed(3),+t.y.toFixed(3),+t.z.toFixed(3)],
      instScale:[+sc.x.toFixed(3),+sc.y.toFixed(3),+sc.z.toFixed(3)], dims:[b.dimX,b.dimY,b.dimZ] };
  },
  tune: TUNE,
};

loadRecords();
addEventListener("pagehide", saveRecords);        // タブを閉じる/リロード時にも記録を保存
initRapier();
log("読み込みOK（版：" + REV + "）");
</script>
