<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10万分の1秒タイマー</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="細かタイマー">
<style>
:root{
  --bg:#f2f2f7; --ink:#1d1d1f; --muted:rgba(29,29,31,.55); --card:#ffffff;
  --line:rgba(29,29,31,.10); --accent:#155bd0; --onaccent:#ffffff; --over:#c42b23;
  --btn:#1d1d1f; --btnink:#ffffff;
  --face:#ffffff; --tick:rgba(29,29,31,.5); --disk:#e0261c; --knob:#f2f2f7; --flash:#fde2df;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#f5f5f7; --muted:rgba(245,245,247,.55); --card:#1c1c1e;
    --line:rgba(245,245,247,.12); --accent:#4d94ff; --onaccent:#000000; --over:#ff5a4f;
    --btn:#f5f5f7; --btnink:#000000;
    --face:#1c1c1e; --tick:rgba(245,245,247,.55); --disk:#ff3b30; --knob:#3a3a3c; --flash:#4a1512;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#f5f5f7; --muted:rgba(245,245,247,.55); --card:#1c1c1e;
  --line:rgba(245,245,247,.12); --accent:#4d94ff; --onaccent:#000000; --over:#ff5a4f;
  --btn:#f5f5f7; --btnink:#000000;
  --face:#1c1c1e; --tick:rgba(245,245,247,.55); --disk:#ff3b30; --knob:#3a3a3c; --flash:#4a1512;
}
/* ドパガキモード。.dopa を2回重ねているのは、上の暗い画面用の指定より強くするため */
:root.dopa.dopa{
  --bg:#0b0016; --ink:#fff7d6; --muted:rgba(255,236,170,.7); --card:rgba(255,255,255,.10);
  --line:rgba(255,214,10,.4); --accent:#ffd60a; --onaccent:#3a1300; --over:#ff4f9a;
  --face:#170029; --tick:rgba(255,214,10,.8); --knob:#ffd60a; --flash:#5a0a3a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.dopa body{background:radial-gradient(120% 80% at 50% 35%, #3d0b63 0%, #14001f 55%, #05000a 100%) fixed, var(--bg)}
main{
  min-height:100%; max-width:760px; margin:0 auto;
  display:flex; flex-direction:column;
  padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
header{display:flex; align-items:center; gap:8px; min-height:32px; flex-wrap:wrap}
.pill{border-radius:999px; background:var(--card); color:var(--ink); font-size:.78rem; padding:7px 12px; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pill[aria-pressed="true"]{background:var(--accent); color:var(--onaccent); font-weight:600}
#dopa[aria-pressed="true"]{
  background:linear-gradient(90deg,#ff2d55,#ff9f0a,#ffd60a,#34c759,#0a84ff,#bf5af2,#ff2d55);
  background-size:200% 100%; animation:rb 1.2s linear infinite;
  color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7); font-weight:800;
}
@keyframes rb{to{background-position:200% 0}}

/* 円盤 */
.dialwrap{flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; padding:8px 0}
.dial{
  position:relative; display:block; aspect-ratio:1; height:auto; touch-action:none; outline:none;
  width:min(calc(100vw - 32px), calc(100vh - 400px), 520px);
  width:min(calc(100vw - 32px), calc(100dvh - 400px), 520px);
  min-width:180px;
}
.dial:focus-visible .rim{stroke:var(--accent); stroke-width:3}
.rim{fill:var(--face); stroke:var(--line); stroke-width:1}
.tk{stroke:var(--tick); stroke-linecap:round; stroke-width:1.2}
.tk.major{stroke-width:2.4}
.lb{fill:var(--ink); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums}
.disk{fill:var(--disk)}
.knob{fill:var(--knob); stroke:var(--line); stroke-width:1}
.cdbg{fill:var(--face); display:none}
.cd{
  fill:var(--ink); font-size:76px; font-weight:600; font-variant-numeric:tabular-nums;
  paint-order:stroke; stroke:var(--face); stroke-width:8px; stroke-linejoin:round;
}
[data-phase="idle"] .dial, [data-phase="done"] .dial{cursor:grab}
[data-phase="pause"] .disk{opacity:.45}
.counting .knob{display:none}
.counting .cdbg{display:block}
[data-phase="over"] .rim{animation:flash 1s steps(1, end) infinite}
@keyframes flash{50%{fill:var(--flash)}}
.rays{
  display:none; position:absolute; left:50%; top:50%; width:150vmax; height:150vmax; margin:-75vmax 0 0 -75vmax; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,214,10,.24) 0deg 7deg, rgba(255,214,10,0) 7deg 18deg);
  -webkit-mask-image:radial-gradient(circle, #000 0, #000 16%, transparent 42%);
  mask-image:radial-gradient(circle, #000 0, #000 16%, transparent 42%);
}
.dopa .rays{display:block}
.dopa .rim{stroke:#ffd60a; stroke-width:3}
.dopa .lb{fill:#ffe9a8; font-weight:700}
.dopa .cd{fill:url(#gGold); stroke:#4a0000; stroke-width:7px; font-weight:900}

/* 数字 */
.readout{display:flex; flex-direction:column; align-items:center; margin-top:4px}
.label{font-size:.85rem; color:var(--muted); min-height:1.4em; letter-spacing:.06em}
.time{
  font-weight:300; font-variant-numeric:tabular-nums; line-height:1.05; white-space:nowrap;
  letter-spacing:-.01em; font-size:min(10.5vw, 52px);
}
.time.long{font-size:min(8.6vw, 44px)}
.frac{font-size:.62em}
.dim{opacity:.22}
.coarse .frac, .coarse .note{display:none}
.coarse .time{font-size:min(15vw, 68px)}
.coarse .time.long{font-size:min(12vw, 56px)}
[data-phase="over"] .time, [data-phase="over"] .label,
[data-phase="done"] .time, [data-phase="done"] .label{color:var(--over)}
.dopa .time{font-weight:800; color:#ffd84a; text-shadow:0 0 14px rgba(255,170,0,.85), 0 2px 0 #7a2b00}
.dopa .label{color:#ffd84a; font-weight:700}
.dopa [data-phase="over"] .time, .dopa [data-phase="done"] .time{color:#ff6fb0; text-shadow:0 0 14px rgba(255,60,160,.9), 0 2px 0 #5a0030}
.note{font-size:.72rem; color:var(--muted); text-align:center; margin:6px 0 0; min-height:1.2em; line-height:1.5}

/* ボタン */
.set{display:grid; gap:8px; margin:16px 0 12px}
.row{display:grid; grid-template-columns:repeat(6, 1fr); gap:8px}
.row.adj{grid-template-columns:repeat(4, 1fr)}
button{appearance:none; -webkit-appearance:none; border:0; font:inherit; cursor:pointer}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.32; cursor:default}
.chip{border-radius:12px; background:var(--card); color:var(--ink); font-size:.88rem; padding:12px 0; box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ctrl{display:grid; grid-template-columns:1fr 2fr; gap:10px}
.ctrl button{border-radius:16px; font-size:1.05rem; font-weight:600; padding:18px 0}
#sub{background:var(--card); color:var(--ink)}
#main{background:var(--btn); color:var(--btnink)}
[data-phase="over"] #main{background:var(--over); color:#fff}
.dopa #main{
  background:linear-gradient(180deg,#fff2a8,#ffd60a 45%,#ff9500 55%,#ffcc00); color:#3a1300; font-weight:900;
  box-shadow:0 0 18px rgba(255,190,0,.7); animation:glow 1.2s ease-in-out infinite alternate;
}
@keyframes glow{to{box-shadow:0 0 34px rgba(255,120,0,.95)}}

/* 演出の部品（ドパガキモード） */
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40}
#flashLayer{position:fixed; inset:0; pointer-events:none; z-index:42; opacity:0; background:#fff}
.cutin{
  position:fixed; left:0; right:0; top:50%; height:128px; margin-top:-64px; z-index:50; pointer-events:none;
  display:none; align-items:center; justify-content:center; overflow:hidden;
  background:repeating-linear-gradient(-45deg, #1d0000 0 14px, #420000 14px 28px);
  border-top:4px solid #ffd60a; border-bottom:4px solid #ffd60a;
  box-shadow:0 0 40px rgba(255,180,0,.75);
}
.ptext{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Arial Black",ui-sans-serif,system-ui,sans-serif;
  font-weight:900; font-style:italic; white-space:nowrap; letter-spacing:.02em; line-height:1.1;
  background:linear-gradient(180deg,#fffbe0 0%,#ffe14a 40%,#ff9d00 52%,#ffe14a 64%,#fff6c0 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  /* 縁取りは影を4方向に重ねて作る。-webkit-text-stroke は日本語フォントによって文字の中が塗られなくなる */
  --ol:#5a0000; --gl:rgba(255,200,0,.9);
  filter:drop-shadow(1.5px 0 0 var(--ol)) drop-shadow(-1.5px 0 0 var(--ol)) drop-shadow(0 1.5px 0 var(--ol)) drop-shadow(0 -1.5px 0 var(--ol))
         drop-shadow(0 0 8px var(--gl)) drop-shadow(0 3px 0 #000);
}
.ptext.red{background-image:linear-gradient(180deg,#ffffff 0%,#ff8a8a 35%,#e00000 55%,#ff4d4d 100%); --ol:#fff3a0; --gl:rgba(255,0,0,.95)}
.ptext.green{background-image:linear-gradient(180deg,#f0fff0 0%,#7dff9a 40%,#00b640 55%,#7dffa0 100%); --ol:#003a10; --gl:rgba(0,255,90,.9)}
.ptext.blue{background-image:linear-gradient(180deg,#f0f8ff 0%,#7cc4ff 40%,#0062ff 55%,#7cc4ff 100%); --ol:#001a4a; --gl:rgba(0,140,255,.9)}
.ptext.rainbow{
  background-image:linear-gradient(90deg,#ff2d55,#ff9f0a,#ffd60a,#34c759,#5ac8fa,#0a84ff,#bf5af2,#ff2d55);
  background-size:200% 100%; animation:rb .8s linear infinite; --ol:#ffffff; --gl:rgba(255,255,255,.9);
}
.cutin .ptext{font-size:min(15vw, 92px); padding:0 .2em}
.pop{position:fixed; z-index:45; pointer-events:none; transform:translate(-50%,-50%)}

/* 横画面: 円盤を左、数字とボタンを右 */
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  main{
    max-width:none; display:grid; column-gap:32px; row-gap:8px;
    grid-template-columns:auto minmax(280px, 380px);
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"head head" "dial readout" "dial panel";
    justify-content:center;
  }
  header{grid-area:head}
  .dialwrap{grid-area:dial; padding:0}
  .readout{grid-area:readout; align-self:end; margin:0}
  .panel{grid-area:panel; align-self:start}
  .set{margin-top:12px}
  .dial{
    width:min(calc(100vh - 80px), calc(100vw - 32px - 380px - 32px), 680px);
    width:min(calc(100dvh - 80px), calc(100vw - 32px - 380px - 32px), 680px);
    min-width:160px;
  }
  .time{font-size:min(4.6vw, 52px)}
  .time.long{font-size:min(3.8vw, 44px)}
  .coarse .time{font-size:min(6.4vw, 68px)}
  .coarse .time.long{font-size:min(5.2vw, 56px)}
}
@media (prefers-reduced-motion:reduce){
  [data-phase="over"] .rim{animation:none; fill:var(--flash)}
}
</style>
</head>
<body>
<main id="app" data-phase="idle" class="coarse">
  <header>
    <button class="pill" id="scale">目盛り 60分</button>
    <button class="pill" id="fine" aria-pressed="false">細かい数字</button>
    <button class="pill" id="dopa" aria-pressed="false">ドパガキ</button>
  </header>
  <div class="dialwrap">
    <div class="rays" id="rays"></div>
    <svg class="dial" id="dial" viewBox="-120 -120 240 240" role="slider" tabindex="0"
         aria-label="時間を合わせる（円盤を反時計回りに引く）" aria-valuemin="0">
      <defs>
        <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff7c2"/><stop offset=".35" stop-color="#ffd23a"/>
          <stop offset=".5" stop-color="#ff9a00"/><stop offset=".65" stop-color="#ffd23a"/>
          <stop offset="1" stop-color="#fff2a8"/>
        </linearGradient>
        <linearGradient id="gRainbow" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="90" y2="0">
          <stop offset="0" stop-color="#ff2d55"/><stop offset=".17" stop-color="#ff9f0a"/>
          <stop offset=".33" stop-color="#ffd60a"/><stop offset=".5" stop-color="#34c759"/>
          <stop offset=".67" stop-color="#0a84ff"/><stop offset=".83" stop-color="#bf5af2"/>
          <stop offset="1" stop-color="#ff2d55"/>
          <animateTransform attributeName="gradientTransform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        </linearGradient>
      </defs>
      <circle class="rim" r="118"/>
      <g id="ticks"></g>
      <g id="labels"></g>
      <path class="disk" id="disk"/>
      <circle class="knob" r="10"/>
      <circle class="cdbg" r="46"/>
      <text class="cd" id="cd" x="0" y="0" text-anchor="middle" dominant-baseline="central"></text>
    </svg>
  </div>
  <section class="readout">
    <div class="label" id="label">セット</div>
    <div class="time" id="time"><span id="hms">05:00</span><span class="frac">.<span id="d1">0</span><span id="d2">0</span><span id="d3">0</span><span id="d4">0</span><span id="d5">0</span></span></div>
    <p class="note" id="note"></p>
  </section>
  <section class="panel">
    <div class="set">
      <div class="row">
        <button class="chip" data-ms="60000">1分</button>
        <button class="chip" data-ms="180000">3分</button>
        <button class="chip" data-ms="300000">5分</button>
        <button class="chip" data-ms="600000">10分</button>
        <button class="chip" data-ms="1800000">30分</button>
        <button class="chip" data-ms="3600000">60分</button>
      </div>
      <div class="row adj">
        <button class="chip" data-add="60000">＋1分</button>
        <button class="chip" data-add="10000">＋10秒</button>
        <button class="chip" data-add="1000">＋1秒</button>
        <button class="chip" data-ms="0">0</button>
      </div>
    </div>
    <div class="ctrl">
      <button id="sub">リセット</button>
      <button id="main">スタート</button>
    </div>
  </section>
</main>
<canvas id="fx"></canvas>
<div id="flashLayer"></div>
<div class="cutin" id="cutin"><span class="ptext" id="cutinText"></span></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'komakai-timer';
const MAX = (10 * 3600 - 1) * 1000;   // 9:59:59 まで

// ---------- 時計 ----------
// 中身は performance.now()（ミリ秒、小数つき）。
// Mac などでは端末が眠っている間これが止まるので、Date.now() と比べて1秒以上ずれたら、そのぶん足して戻す。
let skew = 0;
const pBase = performance.now(), dBase = Date.now();
function now() {
  const p = performance.now();
  const drift = (Date.now() - dBase) - (p + skew - pBase);
  if (Math.abs(drift) > 1000) skew += drift;
  return p + skew;
}
// 指が触れた瞬間の時刻。押してから処理が走るまでの遅れを含めない
function eventTime(e) {
  const t = now();
  const ts = e && e.timeStamp;
  if (typeof ts === 'number' && ts > 0 && Math.abs(ts + skew - t) < 1000) return ts + skew;
  return t;
}

// この端末の時計が何ミリ秒きざみかを測る。
// ブラウザは安全のため時計を丸めている: Safari 1ms、Chrome 0.1ms（隔離されたページなら 0.005ms）、Firefox 1ms（同 0.02ms）
function measureStep() {
  let min = Infinity, last = performance.now();
  const end = last + 25;
  for (let i = 0; i < 2e6; i++) {
    const t = performance.now();
    if (t !== last) { if (t - last < min) min = t - last; last = t; }
    if (t > end) break;
  }
  return min === Infinity ? 1 : Math.round(min * 1e4) / 1e4;
}
const step = measureStep();
// 測れている桁数（小数点以下）。1ms きざみなら3桁、0.1ms なら4桁、0.005ms なら5桁
const sure = Math.max(0, Math.min(5, Math.floor(-Math.log10(step / 1000) + 1e-9)));
{
  const s = (step / 1000).toFixed(7).replace(/0+$/, '');
  $('note').textContent = sure >= 5
    ? `この端末の時計は${s}秒きざみ。5桁とも測れている`
    : `この端末の時計は${s}秒きざみ。薄い桁は測れていない`;
}

// ---------- 状態 ----------
// idle: セット中 / run: 動いている / pause: 一時停止 / over: ゼロを過ぎて鳴っている / done: 鳴っているのを止めた
// fine: 小数点以下5桁を出すか / dopa: ドパガキモード
const st = {
  set: 300000, phase: 'idle', total: 300000, endAt: 0, left: 0, frozen: 0, silent: false,
  scale: 5, fine: false, dopa: false,
};

// 円盤の目盛り（分）。短い時間は短い目盛りにしないと、赤い部分が細すぎて見えない
const SCALES = [5, 20, 60, 120];
const DIAL = {           // tick: 目盛りの間隔（分） / label: 数字の間隔（分） / snap: 円盤を引いたときの刻み（ミリ秒）
  5:   { tick: 0.25, label: 1,  snap: 10000 },
  20:  { tick: 1,    label: 5,  snap: 30000 },
  60:  { tick: 1,    label: 5,  snap: 60000 },
  120: { tick: 2,    label: 10, snap: 60000 },
};
const fitScale = ms => SCALES.find(s => ms <= s * 60000) || 120;

function save() {
  try {
    const o = { set: st.set, total: st.total, phase: st.phase, scale: st.scale, fine: st.fine, dopa: st.dopa };
    if (st.phase === 'run' || st.phase === 'over') o.endEpoch = Date.now() + (st.endAt - now());
    if (st.phase === 'pause') o.left = st.left;
    if (st.phase === 'done') o.frozen = st.frozen;
    localStorage.setItem(KEY, JSON.stringify(o));
  } catch (_) {}
}
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!o) return;
    if (o.set >= 0 && o.set <= MAX) st.set = o.set;
    st.total = o.total > 0 ? o.total : st.set;
    st.scale = SCALES.includes(o.scale) ? o.scale : fitScale(st.set);
    st.fine = o.fine === true;
    st.dopa = o.dopa === true;
    if ((o.phase === 'run' || o.phase === 'over') && typeof o.endEpoch === 'number') {
      const t = now();
      st.endAt = t + (o.endEpoch - Date.now());
      st.phase = st.endAt > t ? 'run' : 'over';
      st.silent = st.phase === 'over';   // 読み直したあとは、画面に触るまで音を出せない
    } else if (o.phase === 'pause' && o.left >= 0) {
      st.phase = 'pause'; st.left = o.left;
    } else if (o.phase === 'done' && o.frozen >= 0) {
      st.phase = 'done'; st.frozen = o.frozen;
    }
  } catch (_) {}
}

// ---------- 操作 ----------
function start(t) {
  if (st.set <= 0) return;
  st.total = st.set; st.endAt = t + st.set; st.phase = 'run'; st.silent = false;
  fx.stage = stageOf(st.set);
  fx.nextYokoku = t + rnd(4000, 8000);
  changed();
  if (st.dopa) fxStart();
}
function pause(t) { st.left = Math.max(0, st.endAt - t); st.phase = 'pause'; changed(); }
function resume(t) {
  st.endAt = t + st.left; st.phase = 'run'; st.silent = false;
  fx.nextYokoku = t + rnd(3000, 6000);
  changed();
}
function stop(t) {
  const wasOver = st.phase === 'over';
  st.frozen = Math.max(0, t - st.endAt); st.phase = 'done';
  changed();
  if (st.dopa && wasOver) fxBye();
}
function reset() { st.phase = 'idle'; fx.stage = -1; changed(); }
function setTo(ms, rescale) {
  st.set = Math.max(0, Math.min(MAX, ms));
  if (rescale) st.scale = fitScale(st.set);
  st.phase = 'idle'; fx.stage = -1;
  changed();
}
const editable = () => st.phase === 'idle' || st.phase === 'done';

function onMain(t) {
  unlockAudio();
  switch (st.phase) {
    case 'idle': case 'done': start(t); break;
    case 'run': if (t >= st.endAt) stop(t); else pause(t); break;
    case 'pause': resume(t); break;
    case 'over': stop(t); break;
  }
}

function changed() {
  if (st.phase !== 'over') stopAlarm();
  awake(st.phase === 'run' || st.phase === 'over');
  schedule();
  save();
  controls();
  render(now());   // 押した瞬間に表示を合わせる（次のフレームを待たない）
  loop();
}

  g2.beginPath();
  for (const [a, w, off] of fx.lineSeed) {
    g2.moveTo(cx + Math.cos(a) * (R0 + off), cy + Math.sin(a) * (R0 + off));
    g2.lineTo(cx + Math.cos(a - w) * R1, cy + Math.sin(a - w) * R1);
    g2.lineTo(cx + Math.cos(a + w) * R1, cy + Math.sin(a + w) * R1);
    g2.closePath();
  }
  g2.fill();
}
function fxDraw() {
  const t = performance.now();
  const dt = fx.lastT ? Math.min(3, (t - fx.lastT) / 16.67) : 1;   // 120Hz の画面でも同じ速さで動かす
  fx.lastT = t;
  const raining = fx.rainUntil > t;
  if (!fx.parts.length && !fx.lines && !raining) {
    if (fx.dirty) { g2.clearRect(0, 0, W, H); fx.dirty = false; }
    return;
  }
  fx.dirty = true;
  g2.clearRect(0, 0, W, H);
  if (raining && Math.random() < 0.7 * dt) {
    fx.parts.push({ kind: 'coin', x: rnd(0, W), y: -20, vx: rnd(-1, 1), vy: rnd(2, 5), g: 0.25, drag: 0.99, life: 400, max: 400, size: rnd(7, 11), color: '#ffcc00', rot: 0, vr: 0, flip: rnd(0, 6.28) });
  }
  if (fx.lines) speedLines();
  const ps = fx.parts;
  let j = 0;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    const k = Math.pow(p.drag, dt);
    p.vx *= k; p.vy = p.vy * k + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt; p.flip += 0.18 * dt; p.life -= dt;
    if (p.life <= 0 || p.y > H + 40) continue;
    drawPart(p);
    ps[j++] = p;
  }
  ps.length = j;
}
function fxClear() {
  fx.parts.length = 0; fx.lines = false; fx.rainUntil = 0;
  g2.clearRect(0, 0, W, H); fx.dirty = false;
  elCut.style.display = 'none';
  document.querySelectorAll('.pop').forEach(el => el.remove());
}

let cutAnim = null;
function cutin(text, cls, ms) {
  elCutText.textContent = text;
  elCutText.className = 'ptext ' + (cls || '');
  if (cutAnim) cutAnim.cancel();
  elCut.style.display = 'flex';
  const sk = 'skewY(-6deg)';
  cutAnim = elCut.animate([
    { transform: `translateX(110%) ${sk}` },
    { transform: `translateX(0%) ${sk}`, offset: 0.14 },
    { transform: `translateX(-4%) ${sk}`, offset: 0.82 },
    { transform: `translateX(-110%) ${sk}` },
  ], { duration: ms || 1400, fill: 'forwards' });
  cutAnim.onfinish = () => { elCut.style.display = 'none'; };
  try { elCutText.animate([{ transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' }); } catch (_) {}
  fx.lastBig = performance.now();
}
function popText(text, cls, x, y, size) {
  const el = document.createElement('div');
  el.className = 'ptext pop ' + (cls || '');
  el.textContent = text;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.fontSize = size + 'px';
  document.body.appendChild(el);
  const r = rnd(-14, 14), tf = s => `translate(-50%,-50%) rotate(${r}deg) scale(${s})`;
  const a = el.animate([
    { transform: tf(0), opacity: 1 },
    { transform: tf(1.35), opacity: 1, offset: 0.18 },
    { transform: tf(1), opacity: 1, offset: 0.32 },
    { transform: tf(1.05), opacity: 1, offset: 0.8 },
    { transform: tf(1.2), opacity: 0 },
  ], { duration: 1300, easing: 'ease-out' });
  a.onfinish = () => el.remove();
}
function flash(color, peak, ms) {
  elFlash.style.background = color || '#fff';
  elFlash.animate([{ opacity: 0 }, { opacity: peak || 0.8, offset: 0.3 }, { opacity: 0 }], { duration: ms || 180 });
}
// 揺らすのは円盤と数字だけ。画面全体を揺らすと、はみ出してページが横に動いてしまう
const shaken = [document.querySelector('.dialwrap'), document.querySelector('.readout')];
function shake(power, ms) {
  power = Math.min(power, 12);
  const k = [];
  for (let i = 0; i < 8; i++) k.push({ transform: `translate(${rnd(-power, power)}px, ${rnd(-power, power)}px)` });
  k.push({ transform: 'translate(0, 0)' });
  shaken.forEach(el => el.animate(k, { duration: ms || 380 }));
}

const STAGE_TXT = [null, ['保留変化!!', 'green'], ['激アツ!!!', 'red'], ['金保留!!!!', ''], ['リーチ!!!!!', 'rainbow']];
const YOKOKU = [
  ['!?', ''], ['熱', 'red'], ['激熱', 'red'], ['チャンス!', ''], ['SP', 'blue'], ['キュイン!!', 'rainbow'],
  ['期待度★★★', ''], ['まだまだ!!', 'green'], ['集中!!', ''], ['FEVER', 'rainbow'], ['いけるぞ!!', 'blue'], ['ここが勝負!!', 'red'],
];
function fxHello() {
  cutin('ドパガキモード!!', 'rainbow', 1600);
  sfx.kyuin(); sfx.whoosh();
  const [x, y] = dialCenter();
  burst(x, y, 70, 'confetti'); burst(x, y, 40, 'spark');
  flash('#fff', 0.5); shake(8);
}
function fxStart() {
  cutin('スタート!!', '', 1200);
  sfx.kyuin(); sfx.whoosh();
  const [x, y] = dialCenter();
  burst(x, y, 50, 'spark');
  flash('#fff', 0.45); vib(60);
}
function fxStage(s) {
  const [t, c] = STAGE_TXT[s];
  cutin(t, c, 1500);
  sfx.kyuin(); sfx.whoosh();
  shake(s * 3 + 4);
  flash(s >= 3 ? '#ffd84a' : '#fff', 0.55);
  const [x, y] = dialCenter();
  burst(x, y, 30 + s * 20, s >= 3 ? 'confetti' : 'spark');
  vib(80);
}
function fxYokoku() {
  const [t, c] = pick(YOKOKU);
  const [cx, cy, r] = dialCenter();
  const x = cx + rnd(-r * 0.55, r * 0.55), y = cy + rnd(-r * 0.55, r * 0.55);
  popText(t, c, x, y, rnd(44, 76));
  pick([sfx.chime, sfx.kyuin, sfx.coin])();
  burst(x, y, 24, 'spark');
  if (Math.random() < 0.35) shake(5);
  if (Math.random() < 0.25) flash(pick(['#fff', '#ffd84a', '#ff4fa0']), 0.4);
}
function fxCount(n) {
  sfx.don();
  shake(n <= 3 ? 12 : 6, 260);
  const [x, y] = dialCenter();
  burst(x, y, n <= 3 ? 30 : 14, 'spark');
  if (n <= 3) flash('#ffd84a', 0.35, 140);
  vib(n <= 3 ? 90 : 40);
}
function fxJackpot() {
  fx.lines = false;
  flash('#fff', 0.95, 260);
  shake(16, 600);
  cutin('大当たり!!!', 'rainbow', 2200);
  burst(0, H, 90, 'confetti', -Math.PI / 3);
  burst(W, H, 90, 'confetti', -Math.PI * 2 / 3);
  fx.rainUntil = performance.now() + 3500;
  // 虹色の点滅は 0.4 秒おき（1秒に2.5回）
  for (let i = 0; i < 6; i++) setTimeout(() => { if (st.dopa) flash(`hsl(${i * 60},100%,60%)`, 0.4, 220); }, 300 + i * 400);
  setTimeout(() => {
    if (!st.dopa || st.phase !== 'over') return;
    const [x, y, r] = dialCenter();
    popText('確変突入!!', '', x, y - r * 0.2, Math.min(W * 0.14, 84));
    sfx.chime();
  }, 1800);
  loop();
}
function fxBye() {
  const [x, y] = dialCenter();
  popText('おつかれ!!', '', x, y, 64);
  sfx.chime();
  burst(x, y, 30, 'spark');
}

// ---------- 画面を消さない ----------
let wl = null;
async function awake(on) {
  try {
    if (on && !wl && 'wakeLock' in navigator && !document.hidden) {
      wl = await navigator.wakeLock.request('screen');
      wl.addEventListener('release', () => { wl = null; });
    } else if (!on && wl) {
      const w = wl; wl = null; await w.release();
    }
  } catch (_) { wl = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  tick(); loop(); schedule();
  if (st.phase === 'run' || st.phase === 'over') awake(true);
});

// ---------- ボタン ----------
// メインボタンは指が触れた瞬間に反応させ、その瞬間の時刻で止める
mainBtn.addEventListener('pointerdown', e => {
  if (e.button !== 0 || mainBtn.disabled) return;
  e.preventDefault();
  onMain(eventTime(e));
});
mainBtn.addEventListener('click', e => { if (e.detail === 0) onMain(eventTime(e)); });   // キーボードから
subBtn.addEventListener('click', reset);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); onMain(eventTime(e)); }
  if (e.key === 'Escape' && st.phase !== 'idle') reset();
});
// 時間ボタンは目盛りも合わせて選び直す（1分なら5分の目盛り、10分なら20分の目盛り）
chips.forEach(c => c.addEventListener('click', () => {
  if (c.dataset.ms !== undefined) setTo(+c.dataset.ms, true);
  else setTo(st.set + +c.dataset.add, true);
}));
// 目盛りボタンは 5 → 20 → 60 → 120 → 5 と順に回す
$('scale').addEventListener('click', () => {
  st.scale = SCALES[(SCALES.indexOf(st.scale) + 1) % SCALES.length];
  save(); buildDial(); render(now());
});
$('fine').addEventListener('click', () => {
  st.fine = !st.fine;
  save(); applyModes(); render(now());
});
$('dopa').addEventListener('click', () => {
  unlockAudio();
  st.dopa = !st.dopa;
  save(); applyModes(); controls(); render(now());
  if (st.dopa) fxHello();
});

load();
applyModes();
controls();
schedule();
if (st.phase === 'run' || st.phase === 'over') awake(true);
loop();

// ---------- service worker ----------
// sw.js がこのページに COOP/COEP ヘッダーを付けると「隔離されたページ」になり、Chrome の時計が 0.1ms → 0.005ms きざみになる。
// 初回はまだ sw.js がページを握っていないので、一度だけ読み直す。
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(() => {
    if (window.crossOriginIsolated || navigator.serviceWorker.controller) return;
    try { if (sessionStorage.getItem(KEY + '-reloaded')) return; sessionStorage.setItem(KEY + '-reloaded', '1'); } catch (_) { return; }
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), { once: true });
  }).catch(() => {});
}
